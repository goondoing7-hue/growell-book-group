/* ---------------- crypto ---------------- */
function randomSaltHex(){ return bytesToHex(crypto.getRandomValues(new Uint8Array(16))); }
function deriveKey(password, saltHex){
  var enc=new TextEncoder();
  var salt=hexToBytes(saltHex);
  return crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
  });
}
function keyVerifier(key){
  return crypto.subtle.exportKey('raw', key).then(function(raw){
    return crypto.subtle.digest('SHA-256', raw);
  }).then(function(d){ return bytesToHex(new Uint8Array(d)); });
}
function keyToB64(key){ return crypto.subtle.exportKey('raw', key).then(function(raw){ return bytesToB64(new Uint8Array(raw)); }); }
function keyFromB64(b64){ return crypto.subtle.importKey('raw', b64ToBytes(b64), {name:'AES-GCM'}, true, ['encrypt','decrypt']); }
function encryptText(key, text){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var enc=new TextEncoder();
  return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, enc.encode(text)).then(function(cipher){
    return {iv:bytesToB64(iv), data:bytesToB64(new Uint8Array(cipher))};
  });
}
function decryptText(key, ivB64, dataB64){
  var iv=b64ToBytes(ivB64); var data=b64ToBytes(dataB64);
  return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, data).then(function(buf){
    return new TextDecoder().decode(buf);
  });
}

   RLS가 본인 것만 돌려주므로 로그인 상태일 때만 함께 불러온다. */
function bootApp(){
  return sb.auth.getSession().then(function(sessRes){
    var authSession = sessRes && sessRes.data && sessRes.data.session;
    var restored = null;
    try{ var raw = localStorage.getItem('growell_session'); if(raw) restored = JSON.parse(raw); }catch(e){}
    return Promise.all([
      sb.from('profiles').select('*'),
      sb.from('posts').select('*'),
      sb.from('comments').select('*'),
      sb.from('material_notes').select('*'),
      sb.from('worksheets').select('*'),
      sb.from('reading_meta').select('*'),
      sb.from('reading_logs').select('*'),
      sb.from('book_locks').select('*'),
      sb.from('announcement').select('*').eq('book_id','global').maybeSingle()
    ]).then(function(results){
      var profilesRes=results[0], postsRes=results[1], commentsRes=results[2], matRes=results[3],
          wsRes=results[4], rmRes=results[5], rlRes=results[6], blRes=results[7], annRes=results[8];
      sharedPostsLoadState = postsRes.error ? 'error' : 'ready';
      [profilesRes,postsRes,commentsRes,matRes,wsRes,rmRes,rlRes,blRes].forEach(function(r){
        if(r && r.error) console.error('growell: load failed', r.error);
      });
      var profilesById = {};
      (profilesRes.data||[]).forEach(function(r){ var u=mapProfileRow(r); STATE.users[u.id]=u; profilesById[r.id]=u; });
      (postsRes.data||[]).forEach(function(r){ var p=mapPostRow(r, profilesById); STATE.posts[p.id]=p; });
      (commentsRes.data||[]).forEach(function(r){ var c=mapCommentRow(r, profilesById); STATE.comments[c.id]=c; });
      (matRes.data||[]).forEach(function(r){ var m=mapMaterialNoteRow(r, profilesById); STATE.materialNotes[m.id]=m; });
      (wsRes.data||[]).forEach(function(r){ var w=mapWorksheetRow(r, profilesById); STATE.worksheets[w.id]=w; });
      (rmRes.data||[]).forEach(function(r){ var m=mapReadingMetaRow(r, profilesById); STATE.readingMeta[readingMetaKey(r.book_id,r.user_id)]=m; });
      (rlRes.data||[]).forEach(function(r){ var l=mapReadingLogRow(r); STATE.readingLogs[l.id]=l; });
      (blRes.data||[]).forEach(function(r){ STATE.bookLocks[r.book_id]=mapBookLockRow(r); });
      if(annRes && annRes.data){
        var a=annRes.data;
        STATE.announcement = {
          next:{date:a.next_date||'', time:a.next_time||'', place:a.next_place||'', note:a.next_note||''},
          reading:{bookId:a.reading_book_id||'emotion', meetingNo:a.reading_meeting_no||'', chapter:a.reading_chapter||'', range:a.reading_range||'', concept:a.reading_concept||'', note:a.reading_note||''}
        };
      }
      if(authSession && restored && STATE.users[restored.userId] && STATE.users[restored.userId].authUserId===authSession.user.id){
        SESSION = restored;
        return loadMemberData();
      } else if(restored){
        /* 저장된 로그인 정보가 있는데 실제 인증 세션이 없거나(토큰 만료) 계정을 못 찾으면 정리한다. */
        try{ localStorage.removeItem('growell_session'); }catch(e){}
        SESSION = null;
      }
    });
  }).catch(function(err){
    console.error('growell: boot failed', err);
    BOOT_FAILED = true;
  }).then(function(){
    BOOTING = false;
  });
}

function bookLockInfo(book){

}

/* Draft content stays encrypted on this device. Different users, books, edit targets,
   and standard/insight forms never share a draft. Memory is updated before rendering. */
var composerDrafts = Object.create(null);
var composerDraftWrites = Object.create(null);
var composerDraftPending = 0;
function composerDraftKey(type, bookId, editId, userId){
  return 'growell_draft_v33:'+JSON.stringify([userId, bookId, type, editId||'new']);
}
function composerEditId(type){ return type==='mine' ? mineEditingId : type==='materials' ? materialsEditingId : shareEditingId; }
function composerDraftStatus(key, message){
  var el = document.querySelector('[data-draft-key]');
  if(el && el.getAttribute('data-draft-key')===key){
    var status = el.querySelector('[data-draft-status]');
    if(status) status.textContent = message;
  }
}
function persistComposerDraft(key, draft){
  var version = (composerDraftWrites[key]||0)+1;
  composerDraftWrites[key] = version;
  var session = SESSION;
  if(!session || session.userId!==draft.userId || !session.keyB64){
    draft.status = '기록 잠금을 해제하면 이 기기에 임시 저장돼요.';
    draft.unsaved = true;
    composerDraftStatus(key, draft.status);
    return;
  }
  var json = JSON.stringify(draft);
  draft.status = '임시 저장 중…'; draft.unsaved = true;
  composerDraftStatus(key, draft.status);
  composerDraftPending++;
  keyFromB64(session.keyB64).then(function(k){ return encryptText(k, json); }).then(function(encrypted){
    if(composerDraftWrites[key]!==version) return;
    localStorage.setItem(key, JSON.stringify({v:1, iv:encrypted.iv, data:encrypted.data}));
    draft.status = '이 기기에 임시 저장됨'; draft.unsaved = false;
    composerDraftStatus(key, draft.status);
  }).catch(function(){
    if(composerDraftWrites[key]!==version) return;
    draft.status = '임시 저장 실패 · 화면을 닫기 전에 다시 저장해주세요.';
    draft.unsaved = true;
    composerDraftStatus(key, draft.status);
  }).then(function(){ composerDraftPending--; });
}
function captureComposerDraft(){
  var el = document.querySelector('[data-draft-key]');
  if(!el || el._draftCommitted || !SESSION || el.getAttribute('data-draft-user')!==SESSION.userId) return null;
  var key = el.getAttribute('data-draft-key');
  var type = el.getAttribute('data-draft-type');
  var mode = el.getAttribute('data-draft-mode');
  var field = function(id){ var n=el.querySelector('#'+id); return n ? n.value : ''; };
  var selected = function(selector, attr){ var n=el.querySelector(selector); return n ? n.getAttribute(attr) : ''; };
  var photo = el.querySelector('#photo-preview img');
  var gauge = el.querySelector('#gauge-range');
  var editor = el.querySelector('#note-editor');
  var fields = {noteType:selected('.nt-pill.is-sel','data-nt')||null,
    title:field('note-title'), page:field('note-page'), html:editor ? editor.innerHTML : '',
    photo:photo ? {dataUrl:photo.getAttribute('src'), mimeType:'image/jpeg'} : null,
    checkin:gauge ? Number(gauge.value) : (selected('[data-checkin-val].is-sel','data-checkin-val')||null),
    bgColor:selected('.bg-swatch.is-sel','data-bg-color'), fontSize:selected('.font-size-btn.is-sel','data-font-size'),
    meetingNo:field(mode==='insight'?'insight-meeting-no':'mat-meeting-no'),
    q1:field('insight-q1'), q2:field('insight-q2'), q3:field('insight-q3'),
    driveLinks:Array.prototype.map.call(el.querySelectorAll('[data-mat-link-row]'),function(row){
      return {title:row.querySelector('[data-mat-row-title]').value, driveUrl:row.querySelector('[data-mat-row-url]').value};
    })};
  var draft = composerDrafts[key] || {userId:SESSION.userId, bookId:el.getAttribute('data-book'), type:type,
    editId:el.getAttribute('data-draft-edit')||null, variants:{}, revision:0};
  if(draft.activeMode===mode && JSON.stringify(draft.variants[mode])===JSON.stringify(fields)) return {key:key, revision:draft.revision, mode:mode};
  draft.variants[mode] = fields; draft.activeMode = mode; draft.revision++; draft.updatedAt=Date.now();
  composerDrafts[key] = draft;
  persistComposerDraft(key, draft);
  return {key:key, revision:draft.revision, mode:mode};
}
function loadComposerDraft(type, bookId, editId){
  var session=SESSION;
  if(!session) return Promise.resolve(null);
  var key=composerDraftKey(type,bookId,editId,session.userId);
  if(composerDrafts[key]) return Promise.resolve(composerDrafts[key]);
  var raw;
  try{ raw=localStorage.getItem(key); }catch(e){}
  if(!raw) return Promise.resolve(null);
  if(!session.keyB64) return Promise.reject(new Error('draft-locked'));
  return keyFromB64(session.keyB64).then(function(k){
    var encrypted=JSON.parse(raw);
    return decryptText(k,encrypted.iv,encrypted.data);
  }).then(function(text){
    var draft=JSON.parse(text);
    if(!SESSION || SESSION.userId!==session.userId || draft.userId!==session.userId || draft.bookId!==bookId || draft.type!==type || (draft.editId||null)!==(editId||null) || !draft.variants) return null;
    draft.status='임시 저장한 글을 불러왔어요'; draft.unsaved=false;
    composerDrafts[key]=draft;
    return draft;
  });
}
function openComposerWithDraft(type, bookId, editId, open){
  var userId=SESSION && SESSION.userId;
  captureComposerDraft();
  return loadComposerDraft(type,bookId,editId).then(function(draft){
    if(!SESSION || SESSION.userId!==userId) return;
    open(draft);
  }).catch(function(){ showToast('임시 저장한 글을 열지 못했어요. 기존 글은 보존했어요. 기록 잠금을 해제한 뒤 다시 열어주세요.', true); });
}
/* Recovery also rewraps this member's local drafts; unreadable drafts remain intact. */
async function migratePrivateDraftKeys(legacyKeyB64s){
  var session=SESSION;
  if(!session || !session.keyB64) return {migrated:0,unreadable:0};
  var userId=session.userId, material=session.keyB64, prefix='growell_draft_v33:';
  captureComposerDraft();
  var draftKeys=Object.keys(composerDrafts), result={migrated:0,unreadable:0};
  try{ for(var i=0;i<localStorage.length;i++){ var stored=localStorage.key(i); if(stored && stored.indexOf(prefix)===0 && draftKeys.indexOf(stored)<0) draftKeys.push(stored); } }catch(e){ return {migrated:0,unreadable:1}; }
  var passwordKey=await keyFromB64(material), decryptKeys=[passwordKey];
  for(var oldMaterial of (legacyKeyB64s||[])){
    if(oldMaterial===material) continue;
    try{ decryptKeys.push(await keyFromB64(oldMaterial)); }catch(e){}
  }
  for(var key of draftKeys){
    var identity;
    try{ identity=JSON.parse(key.slice(prefix.length)); }catch(e){continue;}
    if(key.indexOf(prefix)!==0 || !Array.isArray(identity) || identity[0]!==userId) continue;
    if(!SESSION || SESSION.userId!==userId || SESSION.keyB64!==material) break;
    var raw, memory=composerDrafts[key], decoded=null, alreadyCurrent=false;
    var version=composerDraftWrites[key]||0;
    try{
      raw=localStorage.getItem(key);
      if(raw){
        var box=JSON.parse(raw);
        for(var candidate=0;candidate<decryptKeys.length;candidate++){
          try{ decoded=JSON.parse(await decryptText(decryptKeys[candidate],box.iv,box.data)); alreadyCurrent=candidate===0; break; }catch(e){}
        }
        if(!decoded || decoded.userId!==userId || decoded.bookId!==identity[1] || decoded.type!==identity[2] || (decoded.editId||'new')!==identity[3] || !decoded.variants){result.unreadable++;continue;}
      }
      var draft=memory && (!decoded || (memory.updatedAt||0)>=(decoded.updatedAt||0)) ? memory : decoded;
      if(!draft) continue;
      if((composerDraftWrites[key]||0)!==version) continue;
      if(alreadyCurrent && (!memory || (memory.revision===decoded.revision && JSON.stringify(memory.variants)===JSON.stringify(decoded.variants)))){
        if(memory){memory.unsaved=false;memory.status='이 기기에 임시 저장됨';composerDraftStatus(key,memory.status);}
        continue;
      }
      version++;composerDraftWrites[key]=version;
      var encrypted=await encryptText(passwordKey,JSON.stringify(draft));
      if(!SESSION || SESSION.userId!==userId || SESSION.keyB64!==material) break;
      if(composerDraftWrites[key]!==version) continue;
      if(localStorage.getItem(key)!==raw){result.unreadable++;continue;}
      localStorage.setItem(key,JSON.stringify({v:1,iv:encrypted.iv,data:encrypted.data}));
      draft.unsaved=false;draft.status='이 기기에 임시 저장됨';composerDrafts[key]=draft;
      composerDraftStatus(key,draft.status);result.migrated++;
    }catch(e){ result.unreadable++; }
  }
  return result;
}
/* Call only after a successful server save. A newer draft is kept if typing continued. */
function finishComposerDraft(type, bookId, editId, userId, token){
  var key=composerDraftKey(type,bookId,editId,userId || (SESSION && SESSION.userId));
  var el=document.querySelector('[data-draft-key]');
  if(el && el.getAttribute('data-draft-key')===key) captureComposerDraft();
  var draft=composerDrafts[key];
  if(token && draft && token.revision!==draft.revision) return false;
  composerDraftWrites[key]=(composerDraftWrites[key]||0)+1;
  var otherMode=token && token.mode==='insight' ? 'standard' : 'insight';
  var other=draft && draft.variants[otherMode];
  if(other && (other.title || stripHtml(other.html||'').trim() || other.photo || other.meetingNo || other.q1 || other.q2 || other.q3)){
    delete draft.variants[token ? token.mode : draft.activeMode];
    draft.activeMode=otherMode; draft.revision++;
    persistComposerDraft(key,draft);
    if(el && el.getAttribute('data-draft-key')===key) el._draftCommitted=true;
    return !el || el.getAttribute('data-draft-key')===key;
  }
  delete composerDrafts[key];
  try{ localStorage.removeItem(key); sessionStorage.removeItem('growell_draft'); }catch(e){}
  if(el && el.getAttribute('data-draft-key')===key) el._draftCommitted=true;
  return !el || el.getAttribute('data-draft-key')===key;
}
/* 컴포저(작성/수정 창)가 하나라도 열려 있으면 "작성 중"으로 본다 — 새 글쓰기든 수정이든
   똑같이 취급해달라는 요청 반영. 라우트가 바뀔 때(다른 탭/다른 책/다른 글 상세 등으로
   이동) 이 함수로 열려 있는 컴포저가 있는지 확인해 (1) 링크를 누르는 시점엔 정말 나갈지
   한 번 물어보고, (2) 실제로 이동해버린 뒤에는(뒤로가기 등, 물어볼 기회가 없던 경우) 남아
   있던 컴포저 상태를 조용히 닫아 다음에 그 화면으로 돌아왔을 때 항상 닫힌 채로 보이게 한다. */
function anyComposerOpen(){
  return !!(shareComposerOpenFor || mineComposerOpenFor || materialsComposerOpenFor);
}
function resetShareComposer(){ shareComposerOpenFor=null; shareEditingId=null; shareComposerNoteType=null; shareComposerInsightMode=false; }
function resetMineComposer(){ mineComposerOpenFor=null; mineEditingId=null; mineEditingPayload=null; }
function resetMaterialsComposer(){ materialsComposerOpenFor=null; materialsEditingId=null; }
/* 라우트가 바뀐 뒤(hashchange 시점)에 호출한다 — 새 라우트가 그 컴포저가 원래 있던
   "그 책의 그 탭, 글 상세가 아닌 목록 화면"이 아니면 더 이상 유효하지 않은 것으로 보고
   조용히 닫는다(사용자가 이미 이동을 마친 뒤라 다시 물어볼 수 없음 — 뒤로가기 등). */
function closeStaleComposersForRoute(r){
  if(shareComposerOpenFor!=null){
    var stillShare = (r.view==='book' && r.bookId===shareComposerOpenFor && (!r.tab || r.tab==='share') && !r.postId);
    if(!stillShare) resetShareComposer();
  }
  if(mineComposerOpenFor!=null){
    var stillMine = (r.view==='book' && r.bookId===mineComposerOpenFor && r.tab==='mine' && !r.postId);
    if(!stillMine) resetMineComposer();
  }
  if(materialsComposerOpenFor!=null){
    var stillMat = (r.view==='book' && r.bookId===materialsComposerOpenFor && r.tab==='materials' && !r.postId);
    if(!stillMat) resetMaterialsComposer();
  }
  if(habitFormOpenFor!=null){
    var stillHabit = (r.view==='book' && r.bookId===habitFormOpenFor && r.tab==='habit' && !r.postId);
    if(!stillHabit){ habitFormOpenFor=null; habitEditingId=null; }
  }
  if(habitHistoryOpenFor!=null){
    var stillHabitTab = (r.view==='book' && r.tab==='habit' && !r.postId);
    if(!stillHabitTab){ habitHistoryOpenFor=null; habitHistoryMonth=null; }
  }
}
/* 나의 공간 독서 타이머 — render()가 매번 #app을 통째로 새로 그리기 때문에, 타이머가
   실행 중이라는 사실 자체는 DOM이 아니라 이 모듈 변수들에 살아있어야 렌더를 다시 해도
   끊기지 않는다. readingTimer가 있으면 mineTabHtml이 실행/일시정지 화면을 그리고,
   bindEvents가 매 렌더마다 표시용 setInterval을 다시 건다(이전 것은 그때그때 정리). */
var readingTimer = null; // {bookId, startedAt(ms epoch, null=paused), elapsedMs(누적), running}

var readingHistoryOpenFor = null; // bookId whose "읽은 기록" 목록이 펼쳐져 있는지
var worksheetOpenFor = {}; // activity key -> boolean, 활동지 각 항목이 펼쳐져 있는지 (키가 책마다 고유해서 flat object로 충분)
var shareFeedFilter = {}; // bookId -> note type key ('all' or one of NOTE_TYPES)
var matFeedFilter = {}; // bookId -> 자료실 카테고리 key ('all' or one of MATERIAL_CATS)

var pendingDraft = null;
try{
  /* every save() publishes a brand new document and the runtime reloads every open
     view (this tab included) to it — which resets location.hash to the artifact's
     base URL. growell_route was stashed right before that reload so we can put the
     visitor back on the page they were on, instead of always landing on 홈. */
  var savedRoute = sessionStorage.getItem('growell_route');
  if(savedRoute){ sessionStorage.removeItem('growell_route'); }
  var rd = sessionStorage.getItem('growell_draft');
  if(rd){
    var legacyDraft = JSON.parse(rd);
    pendingDraft = legacyDraft.openComment ? {route:legacyDraft.route, openComment:legacyDraft.openComment} : null;
    sessionStorage.removeItem('growell_draft');
  }
  if(savedRoute && (!location.hash || location.hash==='#' || location.hash==='#/')){
    location.hash = savedRoute;
  }
  if(pendingDraft && pendingDraft.openComment){ openComments[pendingDraft.openComment] = true; }
}catch(e){}

/* ---------------- routing ---------------- */
function currentRoute(){
  var h = location.hash.replace(/^#\/?/,'');
  if(!h) return {view:'home'};
  var parts = h.split('/');
  if(parts[0]==='book' && parts[1]){
    var br = {view:'book', bookId:parts[1], tab:parts[2]||'share'};
    if(parts[3]==='post' && parts[4]){ br.postId = parts[4]; }
    return br;
  }
  if(parts[0]==='login'){ return {view:'login'}; }
  if(parts[0]==='about'){ return {view:'about'}; }
  if(parts[0]==='community'){
    return {view:'community', postId:parts[1]==='post' ? parts[2] : null, page:Math.max(1, parseInt(parts[1],10)||1)};
  }
  if(parts[0]==='admin' && parts[1]==='users'){ return {view:'admin-users'}; }
  if(parts[0]==='profile' && parts[1]==='edit'){ return {view:'profile-edit'}; }
  return {view:'home'};
}

   골라 Supabase에 insert/update/delete한다. 호출부(수십 곳의 saveState(mutateFn, opts) 호출)는

function loadMemberData(){
  if(!SESSION) return Promise.resolve(false);
  var expected = {userId:SESSION.userId, epoch:saveSessionEpoch};
  memberLoadState = {privateEntries:'loading', habits:'loading'};
  var specs = [{key:'privateEntries', table:'private_entries', map:mapPrivateEntryRow}, {key:'habits', table:'habits', map:mapHabitRow}];
  return Promise.all(specs.map(function(spec){
    return Promise.resolve().then(function(){ return sb.from(spec.table).select('*').eq('user_id', expected.userId); }).then(function(res){
      if(!saveSessionMatches(expected)) return false;
      if(!res || res.error || !Array.isArray(res.data)) throw new Error('member-data-load-failed');
      var next = {};
      res.data.forEach(function(row){ var item=spec.map(row); if(item.userId===expected.userId) next[item.id]=item; });
      STATE[spec.key] = next;
      memberLoadState[spec.key] = 'ready';
      return true;
    }).catch(function(){
      if(saveSessionMatches(expected)) memberLoadState[spec.key] = 'error';
      return false;
    });
  })).then(function(results){ return results.every(function(ok){ return ok; }); });
}

function diffDict(prevDict, nextDict){
  var added=[], changed=[], removed=[], k;
  for(k in nextDict){ if(!(k in prevDict)) added.push(k); else if(JSON.stringify(nextDict[k])!==JSON.stringify(prevDict[k])) changed.push(k); }
  for(k in prevDict){ if(!(k in nextDict)) removed.push(k); }
  return {added:added, changed:changed, removed:removed};
}

/* payload.photo.dataUrl이 아직 base64(data:...)면 Storage에 올리고 공개 URL로 바꿔치기한다.
   이미 URL(수정 화면에서 사진을 안 바꾼 경우)이면 그대로 둔다 — 렌더 코드는 이 자리가
   base64든 URL이든 <img src="...">로 똑같이 쓰므로 신경 쓸 필요가 없다. */
function uploadPhotoIfNeeded(bucket, ownerId, id, photo){
  if(!photo || !photo.dataUrl || !/^data:/.test(photo.dataUrl)) return Promise.resolve(photo);
  var commaIdx = photo.dataUrl.indexOf(',');
  var meta = photo.dataUrl.slice(0, commaIdx);
  var b64 = photo.dataUrl.slice(commaIdx+1);
  var mimeMatch = /data:(.*?);base64/.exec(meta);
  var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  var ext = (mime.split('/')[1]||'jpg').replace(/[^a-z0-9]/gi,'') || 'jpg';
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var path = ownerId+'/'+id+'-'+Date.now()+'.'+ext;
  return sb.storage.from(bucket).upload(path, bytes, {contentType:mime, upsert:true}).then(function(res){
    if(res.error) throw res.error;
    var pub = sb.storage.from(bucket).getPublicUrl(path);
    return {dataUrl: pub.data.publicUrl, mimeType: mime};
  });
}

function saveState(mutateFn, opts){
  opts = opts || {};
  if(!SESSION){ showToast('로그인이 필요해요.', true); return Promise.resolve(false); }
  if(opts.button){ opts.button.disabled = true; opts.button.textContent = opts.savingLabel || '저장 중…'; }
  return new Promise(function(resolve){
    saveQueue.push({mutateFn:mutateFn, opts:opts, userId:SESSION.userId, epoch:saveSessionEpoch, resolve:resolve});
    drainSaveQueue();
  });
}
function drainSaveQueue(){
  if(activeSave || !saveQueue.length) return;
  var job = saveQueue.shift();
  if(!saveSessionMatches(job)){ finishSaveButton(job.opts); job.resolve(false); drainSaveQueue(); return; }
  saving = true;
  activeSave = job;
  job.done = Promise.resolve().then(function(){ return performSave(job); }).then(function(ok){
    finishSaveButton(job.opts);
    job.resolve(ok);
  }).catch(function(){
    finishSaveButton(job.opts);
    if(saveSessionMatches(job)){
      showToast('저장에 실패했어요. 다시 시도해주세요.', true);
      if(job.opts.onFailure) job.opts.onFailure();
    }
    job.resolve(false);
  }).then(function(){
    activeSave = null;
    saving = false;
    drainSaveQueue();
  });
}
function performSave(job){
  var opts = job.opts;
  function guard(){ if(!saveSessionMatches(job)) throw new Error('save-session-changed'); }
  guard();
  var previous = JSON.parse(JSON.stringify(STATE));
  var next = JSON.parse(JSON.stringify(previous));
  Object.keys(opts.expectedPrivateEntries||{}).forEach(function(id){
    var current=previous.privateEntries[id];
    if(opts.expectedPrivateLocalData){
      var hadLocal=Object.prototype.hasOwnProperty.call(opts.expectedPrivateLocalData,id);
      if(hadLocal ? (!current || current.data!==opts.expectedPrivateLocalData[id]) : !!current) throw new Error('private-record-conflict');
    } else if(current && current.data!==opts.expectedPrivateEntries[id]) throw new Error('private-record-conflict');
  });
  job.mutateFn(next);
  try{
    sessionStorage.setItem('growell_route', location.hash);
    if(SESSION) localStorage.setItem('growell_session', JSON.stringify(SESSION));
    if(opts.draft) sessionStorage.setItem('growell_draft', JSON.stringify(opts.draft));
  }catch(e){}

  var work = Promise.resolve();

  Object.keys(GENERIC_COLLECTIONS).forEach(function(key){
    var spec = GENERIC_COLLECTIONS[key];
    var d = diffDict(STATE[key], next[key]);
    d.added.concat(d.changed).forEach(function(id){
      var row = next[key][id];
      var isNew = d.added.indexOf(id)>=0;
      var comparePrivate = key==='privateEntries' && opts.expectedPrivateEntries && Object.prototype.hasOwnProperty.call(opts.expectedPrivateEntries,id);
      if(comparePrivate) isNew=false;
      work = work.then(function(){
        guard();
        if(spec.photoField && row[spec.photoField]){
          /* Storage 버킷 정책은 "폴더 이름[1] = auth.uid()"만 허용한다(프로필의 자체 id인
             row.userId, 예:"u_xxx"가 아니라 Supabase Auth의 실제 사용자 UUID). 그래서 업로드
             경로의 소유자 폴더는 반드시 글쓴이의 authUserId여야 한다 — 예전엔 row.userId를
             그대로 써서 모든 사진 첨부가 RLS에 막혀 조용히 실패했었다(사진 없이도 글쓰기 자체는
             되니 눈치채기 어려웠음). */
          var ownerAuthId = (STATE.users[row.userId] && STATE.users[row.userId].authUserId) || row.userId;
          return uploadPhotoIfNeeded(spec.bucket, ownerAuthId, id, row[spec.photoField]).then(function(photo){
            row[spec.photoField] = photo;
          });
        }
      }).then(function(){
        guard();
        if(isNew){
          if(spec.noInsert) return;
          return sb.from(spec.table).insert(spec.toRow(row)).then(function(res){ if(res.error) throw res.error; });
        }
        if(spec.noUpdate) return;
        var patch = spec.toRow(row);
        delete patch.id;
        if(comparePrivate){
          var expectedIV = (opts.expectedPrivateIVs||{})[id] || (previous.privateEntries[id]||{}).iv;
          if(!expectedIV) throw new Error('private-record-conflict');
          return sb.from(spec.table).update(patch).eq('id',id).eq('iv',expectedIV).select('id').maybeSingle().then(function(res){
            if(res.error) throw res.error;
            if(!res.data || res.data.id!==id) throw new Error('private-record-conflict');
          });
        }
        return sb.from(spec.table).update(patch).eq('id', id).then(function(res){ if(res.error) throw res.error; });
      });
    });
    d.removed.forEach(function(id){
      if(spec.noDelete) return;
      work = work.then(function(){
        guard();
        return sb.from(spec.table).delete().eq('id', id).then(function(res){ if(res.error) throw res.error; });
      });
    });
  });

  // readingMeta: 합성 키(bookId_userId) — (book_id,user_id) 유니크 기준 upsert
  (function(){
    var d = diffDict(STATE.readingMeta, next.readingMeta);
    d.added.concat(d.changed).forEach(function(key){
      var m = next.readingMeta[key];
      work = work.then(function(){
        guard();
        return sb.from('reading_meta').upsert(
          {book_id:m.bookId, user_id:m.userId, current_page:m.currentPage||0, updated_at:m.updatedAt},
          {onConflict:'book_id,user_id'}
        ).then(function(res){ if(res.error) throw res.error; });
      });
    });
  })();

  // bookLocks: 딕셔너리 키가 곧 book_id
  (function(){
    var d = diffDict(STATE.bookLocks, next.bookLocks);
    d.added.concat(d.changed).forEach(function(bookId){
      var bl = next.bookLocks[bookId];
      work = work.then(function(){
        guard();
        return sb.from('book_locks').upsert(
          {book_id:bookId, locked:!!bl.locked, note:bl.note||''},
          {onConflict:'book_id'}
        ).then(function(res){ if(res.error) throw res.error; });
      });
    });
  })();

  // announcement: 사이트 전체에 하나뿐인 싱글턴(book_id='global')
  (function(){
    if(JSON.stringify(STATE.announcement)===JSON.stringify(next.announcement)) return;
    var a = next.announcement;
    work = work.then(function(){
      guard();
      return sb.from('announcement').upsert({
        book_id:'global',
        next_date:a.next.date||'', next_time:a.next.time||'', next_place:a.next.place||'', next_note:a.next.note||'',
        reading_book_id:a.reading.bookId||'emotion', reading_meeting_no:a.reading.meetingNo||'',
        reading_chapter:a.reading.chapter||'', reading_range:a.reading.range||'', reading_concept:a.reading.concept||'', reading_note:a.reading.note||''
      }, {onConflict:'book_id'}).then(function(res){ if(res.error) throw res.error; });
    });
  })();

  return work.then(function(){
    guard();
    // 저장 중 완료된 기록 조회를 덮어쓰지 않고 이번 작업이 바꾼 항목만 합친다.
    Object.keys(next).forEach(function(key){
      if(key==='announcement'){
        if(JSON.stringify(previous[key])!==JSON.stringify(next[key])) STATE[key]=next[key];
        return;
      }
      var d=diffDict(previous[key], next[key]);
      d.added.concat(d.changed).forEach(function(id){ STATE[key][id]=next[key][id]; });
      d.removed.forEach(function(id){ delete STATE[key][id]; });
    });
    if(opts.render!==false) render();
    if(opts.onSuccess){ try{ opts.onSuccess(); }catch(e){ showToast('저장은 완료됐어요. 화면을 다시 열어 확인해주세요.', true); } }
    return true;
  }).catch(function(err){
    if(saveSessionMatches(job)){
      showToast('저장에 실패했어요. 다시 시도해주세요.', true);
      if(opts.onFailure) opts.onFailure();
    }
    return false;
  });
}

/* ---------------- toast ---------------- */
function showToast(msg, isErr){
  var stack = document.getElementById('toast-stack');
  if(!stack){ stack = document.createElement('div'); stack.id='toast-stack'; stack.className='toast-stack'; document.body.appendChild(stack); }
  var t = document.createElement('div'); t.className = 'toast'+(isErr?' err':''); t.textContent = msg;
  stack.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3600);
}

/* ---------------- auth actions (Supabase Auth) ----------------
   로그인 검증 자체는 더 이상 클라이언트가 하지 않는다 — Supabase Auth가 비밀번호를 서버에서만
   비교한다(signInWithPassword). 아이디(loginId)는 실제 이메일이 없으니 "아이디@growell.internal"
   더미 이메일로 매핑해서 쓴다. deriveKey(PBKDF2)는 이제 로그인 검증용이 아니라 오직 나의 공간
   (privateEntries) 암호화 키를 만드는 데만 쓰인다 — 그 키는 절대 서버로 전송되지 않는다. */
function loginEmailFor(loginId){ return loginId + '@growell.internal'; }

function callEdgeFunction(name, body, accessToken){
  var headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (accessToken || SUPABASE_ANON_KEY)
  };
  return fetch(SUPABASE_URL + '/functions/v1/' + name, {method:'POST', headers:headers, body:JSON.stringify(body||{})})
    .then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(json){
        json.__status = res.status;
        return json;
      });
    });
}

function doSignup(name, id, pw, pw2, hint, adminCode, avatar, btn){
  id = id.trim().toLowerCase();
  name = name.trim();
  hint = (hint||'').trim();
  if(!name || !id || !pw){ showToast('별명, 아이디, 비밀번호를 모두 입력해주세요.', true); return; }
  /* 아이디는 내부적으로 "아이디@growell.internal" 이메일로 바뀌어 Supabase Auth에 등록되는데,
     이메일 로컬 파트에 한글 등 비ASCII 문자가 들어가면 "invalid format"으로 매번 거절당한다 —
     그래서 영문/숫자/밑줄/하이픈만 허용하도록 미리 걸러서 안내한다. */
  if(!/^[a-z0-9_-]+$/i.test(id)){ showToast('아이디는 영문, 숫자, -, _ 만 사용할 수 있어요.', true); return; }
  /* Supabase Auth 프로젝트 기본 정책이 비밀번호 최소 길이를 요구해서(보통 6자 이상), 예전 기준인
     4자로는 서버(auth.admin.createUser)에서 거절당해 가입 자체가 항상 실패했었다 — 여유 있게
     8자 이상으로 올려서 이 문제를 막는다. */
  if(pw.length<8){ showToast('비밀번호는 8자 이상으로 만들어주세요.', true); return; }
  if(pw!==pw2){ showToast('비밀번호가 서로 달라요. 다시 확인해주세요.', true); return; }

    if(!await savePrivateConversion(entries,converted,userId,keyB64)) throw new Error('복구 저장을 마치지 못했어요. 같은 복구 파일로 다시 시도해주세요.');
    privateSessionGuard(userId,keyB64);
    var draftRecovery=await migratePrivateDraftKeys(kit.legacyKeys);
    privateSessionGuard(userId,keyB64);
    privateDataKeyPromise=Promise.resolve(master);pendingPrivateRecovery=null;selectedResetRecovery=null;
    recoveryStatus('개인 기록을 복구했어요.');showToast('개인 기록을 복구했어요.');
    if(draftRecovery.unreadable)showToast('일부 임시 글은 이전 복구 파일이 필요해요. 해당 초안은 삭제하지 않고 보관했어요.',true);
    return true;
  }catch(err){recoveryStatus(err.message||'복구하지 못했어요. 파일을 확인해주세요.',true);showToast(err.message||'복구하지 못했어요. 파일을 확인해주세요.',true);return false;}
  finally{if(generation===privateRecoveryGeneration)privateRecoveryBusy=false;}
}

/* 비밀번호 힌트 새로 등록/변경 — 프로필 수정 화면에서. 힌트는 절대 클라이언트로 다시

function doUpdateHint(hint, btn){

/* 비밀번호 찾기 — 아이디 + 가입 때 등록한 힌트가 일치하면 새 비밀번호로 바꿔준다.
   실제 이메일이 없는 앱이라 Supabase의 표준 "이메일로 재설정" 흐름을 쓸 수 없어서
   만든 대체 경로(reset-password Edge Function, 서버에서 힌트를 대조). */
function doForgotPassword(id, hint, pw, pw2, btn){
  id = (id||'').trim().toLowerCase();
  hint = (hint||'').trim();
  if(!id || !hint){ showToast('아이디와 힌트를 모두 입력해주세요.', true); return; }
  if(pw.length<8){ showToast('새 비밀번호는 8자 이상으로 만들어주세요.', true); return; }
  if(pw!==pw2){ showToast('비밀번호가 서로 달라요. 다시 확인해주세요.', true); return; }
  if(!selectedResetRecovery){showToast('개인 기록을 보호하려면 먼저 복구 파일을 선택해주세요. 기존 로그인 기기의 프로필에서 저장할 수 있어요.',true);return;}
  if(selectedResetRecovery.loginId!==id){showToast('입력한 아이디의 복구 파일이 아니에요.',true);return;}
  var resetKit=selectedResetRecovery;
  var knownProfile=Object.values(STATE.users).find(function(u){return u.loginId===id;});
  if(!knownProfile){showToast('회원 정보를 확인하지 못했어요. 아이디를 확인하고 새로고침 후 다시 시도해주세요.',true);return;}
  try{GrowellPrivateCrypto.assertOwner(resetKit,knownProfile);}catch(err){showToast(err.message,true);return;}
  if(btn){ btn.disabled=true; btn.textContent='확인 중…'; }
  callEdgeFunction('reset-password', {loginId:id, hint:hint, newPassword:pw})
    .then(function(res){
      if(btn){ btn.disabled=false; btn.textContent='비밀번호 바꾸기'; }
      if(!res || res.__status!==200 || !res.ok){
        /* 아이디가 없든, 힌트가 틀렸든 항상 같은 문구 — 계정 존재 여부가 밖으로 새지 않게. */
        showToast('아이디 또는 힌트가 일치하지 않아요.', true);
        return;
      }
      pendingPrivateRecovery=resetKit;
      showToast('비밀번호를 바꿨어요. 개인 기록을 복구하고 있어요.');
      authMode = 'login';
      return doLogin(id,pw,btn);
    }).catch(function(){
      if(btn){ btn.disabled=false; btn.textContent='비밀번호 바꾸기'; }
      showToast('비밀번호 재설정에 실패했어요. 다시 시도해주세요.', true);
    });
}

/* 생각 나눔(나눔 공간) 글의 필드 검증 + 정리 — 새 글/수정 양쪽에서 함께 쓴다.
   통찰 정리 타입은 체크인 없이 몇 번째 모임 + 질문 3개로 구성이 완전히 다르다. */
function buildShareFields(checkinVal, payload){
  if(payload.noteType==='insight'){
    var meetingNoRaw = (payload.meetingNo||'').trim();
    if(!meetingNoRaw) return {ok:false, msg:'몇 번째 모임인지 먼저 적어주세요.'};
    /* 적어준 값을 숫자로 정리해서("네 번째"→"4") meetingNo 자체도 이 숫자로 통일하고,
       그 숫자로 "N번째 통찰 노트" 제목을 자동으로 만든다(38번 라운드 요청) — 별도 제목
       입력칸 없이도 제목이 늘 채워지므로 posts.title 컬럼을 그대로 재사용한다. */
    var meetingNo = parseMeetingNumber(meetingNoRaw);
    var hasAnswer = INSIGHT_QUESTIONS.some(function(q){ return (payload[q.key]||'').trim(); });
    if(!hasAnswer) return {ok:false, msg:'질문에 하나 이상 답해주세요.'};
    return {ok:true, fields:{checkin:null, noteType:'insight', meetingNo:meetingNo,
      q1:(payload.q1||'').trim(), q2:(payload.q2||'').trim(), q3:(payload.q3||'').trim(),
      page:'', html:'', photo:null, bgColor:payload.bgColor||'', fontSize:'', title:meetingNo+'번째 통찰 노트'}};
  }
  if(checkinVal==null || checkinVal===''){ return {ok:false, msg:'오늘의 체크인을 먼저 골라주세요.'}; }
  var cleanHtml = sanitizeHtml(payload.html);
  var plain = (function(){ var d=document.createElement('div'); d.innerHTML=cleanHtml; return d.textContent.trim(); })();
  if(!plain && !payload.photo) return {ok:false, msg:'나눌 이야기를 적어주세요.'};
  if(!payload.noteType) return {ok:false, msg:'노트 타입을 먼저 골라주세요.'};
  var title = (payload.title||'').trim();
  if(!title) return {ok:false, msg:'제목을 적어주세요.'};
  return {ok:true, fields:{checkin:checkinVal, noteType:payload.noteType, page:(payload.page||'').trim(), html:cleanHtml,
    photo:payload.photo||null, bgColor:payload.bgColor||'', fontSize:payload.fontSize||'', title:title, meetingNo:'', q1:'', q2:'', q3:''}};
}

/* 체크는 즉시 표시하고 입력한 순서대로 저장한다. 날짜별 마지막 의도를 보존하므로 실패 후

function habitWithPendingChecks(habit){
  var copy = Object.assign({}, habit);
  var checked = {};
  (habit.checkedDates||[]).forEach(function(date){ checked[date]=true; });
  var pending = habitSaveIntents[habit.id] || {};
  Object.keys(pending).forEach(function(date){ if(pending[date].checked) checked[date]=true; else delete checked[date]; });
  copy.checkedDates = Object.keys(checked).sort();
  return copy;
}
function habitSaveStatusHtml(habitId){
  var intents = Object.values(habitSaveIntents[habitId]||{});
  var failed = intents.some(function(intent){ return intent.status==='error'; });
  var pending = intents.some(function(intent){ return intent.status==='saving'; });
  return failed ? '저장하지 못한 체크가 있어요. <button type="button" class="btn btn-secondary" data-retry-habit-save="'+esc(habitId)+'">다시 저장</button>'
    : pending ? '체크 저장 중…' : '모든 체크가 저장됐어요.';
}
function refreshHabitSaveUI(habitId){
  var raw = STATE.habits[habitId];
  if(!raw) return;
  var habit = habitWithPendingChecks(raw);
  document.querySelectorAll('[data-habit-card]').forEach(function(card){
    if(card.getAttribute('data-habit-card')!==habitId) return;
    card.querySelectorAll('[data-habit-day]').forEach(function(button){
      var date = button.getAttribute('data-habit-day').split('|')[1];
      var checked = habit.checkedDates.indexOf(date)>=0;
      button.textContent = checked ? '✓' : '';
      button.setAttribute('aria-pressed', checked ? 'true' : 'false');
      button.parentElement.classList.toggle('is-checked', checked);
    });
    var progress = habitWeekProgress(habit, weekDatesOf(mondayOf(new Date())));
    var progressEl = card.querySelector('.habit-progress');
    if(progressEl){
      progressEl.classList.toggle('is-done', progress.done>=progress.total);
      progressEl.textContent = progress.done>=progress.total ? '이번 주 완료 🎉' : progress.done+'/'+progress.total+'일 완료 · '+(progress.total-progress.done)+'일 남음';
    }
    var status = card.querySelector('[data-habit-save-status]');
    if(status) status.innerHTML = habitSaveStatusHtml(habitId);
  });
  if(typeof refreshHomeHabits==='function') refreshHomeHabits();
}
function queueHabitCheck(habitId, dateStr, checked){
  var version = ++habitSaveVersion;
  var owner = SESSION.userId;
  var epoch = saveSessionEpoch;
  if(!habitSaveIntents[habitId]) habitSaveIntents[habitId]={};
  habitSaveIntents[habitId][dateStr]={checked:checked, version:version, status:'saving'};
  refreshHabitSaveUI(habitId);
  function finish(ok){
    if(epoch!==saveSessionEpoch || !SESSION || SESSION.userId!==owner) return;
    var latest = (habitSaveIntents[habitId]||{})[dateStr];
    if(latest && latest.version===version){
      if(ok) delete habitSaveIntents[habitId][dateStr];
      else latest.status='error';
    }
    refreshHabitSaveUI(habitId);
  }
  return saveState(function(next){
    var habit = next.habits[habitId];
    if(!habit || habit.userId!==owner) throw new Error('habit-not-found');
    var dates = (habit.checkedDates||[]).filter(function(date){ return date!==dateStr; });
    if(checked) dates.push(dateStr);
    habit.checkedDates=dates.sort();
    habit.updatedAt=Date.now();
  }, {render:false, onSuccess:function(){ finish(true); }, onFailure:function(){ finish(false); }});
}
function retryHabitChecks(habitId){
  if(!SESSION || !STATE.habits[habitId] || STATE.habits[habitId].userId!==SESSION.userId) return Promise.resolve(false);
  var failed = habitSaveIntents[habitId]||{};
  return Promise.all(Object.keys(failed).filter(function(date){ return failed[date].status==='error'; }).map(function(date){
    return queueHabitCheck(habitId, date, failed[date].checked);
  }));
}
function toggleHabitDate(habitId, dateStr){
  if(!SESSION) return;
  var h = STATE.habits[habitId];
  if(!h || h.userId!==SESSION.userId) return;
  return queueHabitCheck(habitId, dateStr, habitWithPendingChecks(h).checkedDates.indexOf(dateStr)<0);
}
/* ---------------- 나의 공간: 독서 진행률 · 타이머 기록 ---------------- */
function readingMetaKey(bookId, userId){ return bookId+'_'+userId; }
function myReadingMeta(bookId){
  if(!SESSION) return null;
  return STATE.readingMeta[readingMetaKey(bookId, SESSION.userId)] || null;
}
/* 총 페이지는 더 이상 사용자가 입력하는 값이 아니라 책마다 고정된 값(book.totalPages) —
   나의 공간에서는 이 값과 현재 페이지(사용자별 readingMeta)로 진행률(%)을 계산한다. */
function myCurrentPage(bookId){
  var m = myReadingMeta(bookId);
  return m ? (m.currentPage||0) : 0;
}
/* 읽는 중/완독은 더 이상 사용자가 직접 고르는 값이 아니라 현재 페이지 vs 고정된 총 페이지로
   자동 계산되는 "상태 표시"일 뿐이다 — 총 페이지를 다 읽었다고 기록하면 자동으로 완독. */
function readingStatusKey(book){
  var current = myCurrentPage(book.id);
  return (book.totalPages>0 && current>=book.totalPages) ? 'done' : 'reading';
}
function myReadingLogs(bookId){
  if(!SESSION) return [];
  return Object.values(STATE.readingLogs).filter(function(l){ return l.bookId===bookId && l.userId===SESSION.userId; })
    .sort(function(a,b){ return b.createdAt-a.createdAt; });
}
/* 그 책을 읽느라 쓴 총 시간 — 지금까지 저장된 모든 독서 세션(readingLogs)의 시간을 더한 값 */
function totalReadSeconds(bookId){
  return myReadingLogs(bookId).reduce(function(sum, l){ return sum + (l.seconds||0); }, 0);
}
/* 각 독서 기록을 "이전에 읽은 위치 ~ 이번에 읽은 위치" 범위로 보여주기 위해 시작 페이지를
   계산한다. 이번 라운드부터 저장되는 기록은 submitReadingLog에서 startPage를 함께 저장하지만,
   그 전에 이미 쌓인 기록은 startPage가 없으므로 시간순으로 정렬해 바로 앞 기록의 도착 페이지를
   시작 페이지로 대신 추정한다(맨 처음 기록은 0페이지부터 시작한 것으로 간주). */
function myReadingLogsWithRange(bookId){
  var logsDesc = myReadingLogs(bookId); // 최신순
  var logsAsc = logsDesc.slice().sort(function(a,b){ return a.createdAt-b.createdAt; });
  var startById = {};
  var prevPage = 0;
  logsAsc.forEach(function(l){
    startById[l.id] = (typeof l.startPage==='number') ? l.startPage : prevPage;
    prevPage = l.page;
  });
  return logsDesc.map(function(l){ return {log:l, startPage:startById[l.id]}; });
}
function saveCurrentPage(bookId, currentPage, btn){
  if(!SESSION) return;
  saveState(function(next){
    next.readingMeta[readingMetaKey(bookId, SESSION.userId)] = {bookId:bookId, userId:SESSION.userId, userName:SESSION.name,
      currentPage:currentPage, updatedAt:Date.now()};
  }, {button:btn, originalLabel:'저장', savingLabel:'저장 중…'});
}
/* 완료 버튼으로 저장하는 독서 세션 — 기록을 남기는 동시에 "현재 페이지"를 갱신한다.
   읽는 중/완독 표시와 총 읽은 시간은 저장된 기록으로부터 매번 자동으로 다시 계산된다. */
function submitReadingLog(bookId, seconds, page, btn){
  if(!SESSION) return;
  if(!(seconds>0)){ showToast('타이머를 먼저 실행해주세요.', true); return; }
  if(!page){ showToast('읽은 페이지를 입력해주세요.', true); return; }
  var key = readingMetaKey(bookId, SESSION.userId);
  var logId = uid('rl');
  var startPage = myCurrentPage(bookId); // 저장 직전까지의 현재 페이지 — 이번 기록의 시작 지점
  saveState(function(next){
    next.readingLogs[logId] = {id:logId, bookId:bookId, userId:SESSION.userId, seconds:seconds, page:page, startPage:startPage, createdAt:Date.now()};
    next.readingMeta[key] = {bookId:bookId, userId:SESSION.userId, userName:SESSION.name, currentPage:page, updatedAt:Date.now()};
  }, {button:btn, originalLabel:'저장', savingLabel:'저장 중…'});
}
function deleteReadingLog(logId, btn){
  if(!SESSION) return;
  var l = STATE.readingLogs[logId];
  if(!l || l.userId!==SESSION.userId) return;
  if(!confirm('이 독서 기록을 삭제할까요?')) return;
  saveState(function(next){ delete next.readingLogs[logId]; }, {button:btn});
}
function readingTimerElapsedMs(){
  if(!readingTimer) return 0;
  return readingTimer.elapsedMs + (readingTimer.running && readingTimer.startedAt ? (Date.now()-readingTimer.startedAt) : 0);
}
function fmtElapsed(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  var mm = String(m).padStart(2,'0'), ss = String(sec).padStart(2,'0');
  return h>0 ? (h+':'+mm+':'+ss) : ('00:'+mm+':'+ss);
}
/* "총 읽은 시간"을 사람이 읽기 편한 형태로 — 예) 2시간 14분 / 14분 / 36초 */
function fmtDurationHuman(totalSeconds){
  var s = Math.max(0, Math.floor(totalSeconds||0));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  if(h>0) return m>0 ? (h+'시간 '+m+'분') : (h+'시간');
  if(m>0) return m+'분';
  return s+'초';
}
function submitWorksheet(bookId, activityKey, data, btn, originalLabel){
  if(!SESSION){ showToast('먼저 로그인해주세요.', true); return; }
  var existingId = null;
  for(var k in STATE.worksheets){
    var w = STATE.worksheets[k];
    if(w.bookId===bookId && w.activityKey===activityKey && w.userId===SESSION.userId){ existingId=k; break; }
  }
  var id = existingId || uid('w');
  saveState(function(next){
    next.worksheets[id] = {id:id, bookId:bookId, activityKey:activityKey, userId:SESSION.userId, userName:SESSION.name, data:data, createdAt: (existingId?next.worksheets[id].createdAt:Date.now()), updatedAt:Date.now()};
  }, {button:btn, originalLabel:originalLabel||'저장', savingLabel:'저장 중…'});
}

function homePostExcerpt(post){
  if(post.noteType==='insight') return INSIGHT_QUESTIONS.map(function(q){ return post[q.key]||''; }).join(' ').replace(/\s+/g,' ').trim();
  // Template content remains inert: previewing text never loads embedded media.
  var template = document.createElement('template');
  template.innerHTML = String(post.html||'');
  template.content.querySelectorAll('script,style,noscript,iframe,object,embed,template,svg,math').forEach(function(node){node.remove();});
  return (template.content.textContent||'').replace(/\s+/g,' ').trim();
}

function tempoBarsHtml(bars, colorVar){

function checkinPickerHtml(book, selected){
  var c = book.checkin;
  var html = '<div class="checkin-q">'+esc(c.question)+'</div>';
  if(c.type==='weather'){
    html += '<div class="checkin-grid" id="checkin-grid">' + c.options.map(function(o){
      var sel = selected===o.key;
      return '<button type="button" class="checkin-opt'+(sel?' is-sel':'')+'" data-checkin-val="'+o.key+'" title="'+esc(o.hint)+'">'+weatherIcon(o.key)+'<span>'+esc(o.label)+'</span></button>';
    }).join('') + '</div>';
  } else if(c.type==='tempo'){
    html += '<div class="checkin-grid" id="checkin-grid">' + c.options.map(function(o){
      var sel = selected===o.key;
      return '<button type="button" class="checkin-opt'+(sel?' is-sel':'')+'" data-checkin-val="'+o.key+'">'+tempoBarsHtml(o.bars, sel?'--accent-ink':'--ink-faint')+'<span>'+esc(o.label)+'</span></button>';
    }).join('') + '</div>';
  } else if(c.type==='gauge'){
    var v = (selected==null || selected==='') ? 50 : selected;
    html += '<div class="gauge-wrap"><div class="gauge-quick" id="gauge-quick">' + c.quick.map(function(q){
      return '<button type="button" data-gauge-val="'+q.v+'" class="'+(Number(v)===q.v?'is-sel':'')+'">'+esc(q.label)+'</button>';
    }).join('') + '</div>' +
    '<div class="gauge-val mono" id="gauge-val">'+v+'%</div>' +
    '<input type="range" min="0" max="100" value="'+v+'" id="gauge-range">' +
    '</div>';
  } else if(c.type==='body'){
    html += '<div class="bodypick" id="bodypick">' + c.options.map(function(part){
      var sel = selected===part;
      return '<button type="button" class="'+(sel?'is-sel':'')+'" data-checkin-val="'+esc(part)+'">'+esc(part)+'</button>';
    }).join('') + '</div>';
  }
  return html;
}

/* 통찰 정리를 고르면 서식 편집기 대신 나오는 칸 — 몇 번째 모임인지 + 정해진 질문 3개.
   글만 작성하는 형태라 서식 툴바나 사진 첨부는 두지 않는다. */
function insightFieldsHtml(prefill){

        '<textarea class="insight-input" id="insight-'+q.key+'" data-insight-field="'+q.key+'" placeholder="자유롭게 적어주세요">'+esc(prefill[q.key]||'')+'</textarea>';
    }).join('');
}
/* opts.editingPost: 수정 중인 기존 글(payload)을 넘기면 그 내용으로 미리 채운다.
   opts.extraNoteTypes: 노트 타입 목록 끝에 추가로 붙는 타입(생각 나눔에서만 '통찰 정리').
   opts.selectedNoteType: 현재 선택된 노트 타입 키(다시 그릴 때 어떤 pill이 선택돼 있었는지).
   opts.insightMode: true면 체크인/서식 편집기 대신 몇 번째 모임 + 질문 3개 칸을 보여준다.
   opts.withBgColor: true면 사진이 없을 때 쓰이는 텍스트 박스의 배경색을 고를 수 있다. */
function noteComposerHtml(book, opts){
  var editing = opts.editingPost || null;
  var draftType = opts.containerId.replace('-composer','');
  var draftEditId = composerEditId(draftType);
  var draftKey = composerDraftKey(draftType,book.id,draftEditId,SESSION && SESSION.userId);
  var draft = composerDrafts[draftKey];
  var draftMode = opts.insightMode ? 'insight' : 'standard';
  if(draft && draft.variants[draftMode]){
    editing = draft.variants[draftMode];
    if(draftType!=='share') opts.selectedNoteType = editing.noteType;
    if(draftType==='materials') opts.extraHtml = matComposerExtraHtml(editing);
  } else if(editing && (editing.noteType==='insight')!==(draftMode==='insight')){
    editing = null;
  }
  var types = opts.noteTypes || NOTE_TYPES.concat(opts.extraNoteTypes||[]);
  var ntSetHtml = '<div class="nt-set" id="nt-set">' + types.map(function(t){
    var sel = opts.selectedNoteType===t.key;
    /* 글쓰기 화면에서 종류를 고르는 이 pill은 (통찰 정리처럼 아이콘이 있는 타입도 포함해)
       항상 자료실 카테고리처럼 글자만으로 표시한다 — 아이콘만 있고 모바일에서 글자가
       숨겨지면 뭘 고르는 건지 알 수 없다는 지적(35번 라운드 다음 요청)에 따라, 아이콘은
       그리지 않고 라벨만 그린다. nt-pill-text는 "모바일에서도 글자를 숨기지 않는다"는
       뜻으로 항상 붙인다(이미 쓰던 클래스를 그대로 재사용). 다 쓴 글(피드)의 아이콘 전용
       배지(note-badge, noteBodyHtml 쪽)는 이 함수와 완전히 별개라 영향 없음 — 그대로 유지. */
    return '<button type="button" class="nt-pill nt-pill-text'+(sel?' is-sel':'')+'" data-nt="'+t.key+'"><span>'+esc(t.label)+'</span></button>';
  }).join('') + '</div>';
  var pageFieldHtml = (opts.insightMode || opts.withPageField===false) ? '' :
    '<div class="page-field"><label for="note-page">페이지</label><input type="text" id="note-page" inputmode="numeric" placeholder="-" value="'+esc(editing?(editing.page||''):'')+'"></div>';
  /* 제목(선택) — 통찰 정리는 이미 정해진 질문 3개 구조라 제목이 따로 필요 없어 제외한다.
     제목을 적으면 사진이 없는 글의 3열 그리드 표지에는 본문 미리보기 대신 제목만 깔끔하게
     보이고(누르면 상세보기에서 전체 글을 볼 수 있음), 사진이 있는 글은 표지에서 계속 사진
     그대로 보인다(요청 반영) — 실제 표시 로직은 noteBodyHtml()/CSS(.post-title-cover)에 있다. */
  var titleFieldHtml = opts.insightMode ? '' :
    '<div class="title-field"><input type="text" id="note-title" placeholder="제목" maxlength="80" value="'+esc(editing?(editing.title||''):'')+'"></div>';

  var bodyHtml;
  if(opts.insightMode){
    bodyHtml = insightFieldsHtml(editing||{}) + insightBgPickerHtml(editing?editing.bgColor:'');
  } else {
    var photoPreviewInner = (editing && editing.photo) ? ('<div class="thumb"><img src="'+editing.photo.dataUrl+'"><button type="button" id="btn-photo-remove">&times;</button></div>') : '';
    bodyHtml =
      (opts.withCheckin ? checkinPickerHtml(book, editing?editing.checkin:null) : '') +
      (opts.editorLabel ? '<label class="field-label" for="note-editor">'+esc(opts.editorLabel)+'</label>' : '') +
      rtToolbarHtml() +
      '<div class="note-editor" id="note-editor" contenteditable="true" data-placeholder="'+esc(opts.placeholder)+'">'+(editing?(editing.html||''):'')+'</div>' +
      '<div class="photo-attach" id="photo-attach">' +
        '<button type="button" class="btn btn-sm" id="btn-photo-pick">'+svgIcon(I_IMG)+' 사진 첨부</button>' +
        '<input type="file" id="note-photo-input" accept="image/*" style="display:none">' +
        '<div id="photo-preview">'+photoPreviewInner+'</div>' +
      '</div>' +
      (opts.withBgColor ? bgColorPickerHtml(editing?editing.bgColor:'') : '') +
      (opts.withFontSize ? fontSizePickerHtml(editing?editing.fontSize:'') : '');
  }

  return '<div class="card composer" id="'+opts.containerId+'" data-book="'+book.id+'" data-draft-key="'+esc(draftKey)+'" data-draft-type="'+draftType+'" data-draft-edit="'+esc(draftEditId||'')+'" data-draft-user="'+esc(SESSION && SESSION.userId||'')+'" data-draft-mode="'+draftMode+'" style="--accent-c:var(--'+book.accent+'); --accent-soft:var(--'+book.accent+'-soft); --accent-ink:var(--'+book.accent+'-ink)">' +
    '<div class="composer-head"><h3>'+esc(opts.heading)+'</h3><button type="button" class="composer-close" id="'+opts.closeId+'" title="닫기" aria-label="닫기">'+svgIcon(I_CLOSE)+'</button></div>' +
    titleFieldHtml +
    '<div class="note-meta">' + ntSetHtml + pageFieldHtml + '</div>' +
    bodyHtml +
    (opts.extraHtml || '') +
    '<p class="hint" data-draft-status role="status" style="display:block;margin:12px 0 0">'+esc(draft && draft.status || '작성한 내용은 이 기기에 암호화해 임시 저장해요.')+'</p>' +
    '<div class="composer-foot"><span class="hint">'+esc(opts.hint)+'</span><button class="btn btn-primary" id="'+opts.submitId+'" type="button">'+esc(opts.submitLabel)+'</button></div>' +
  '</div>';
}
function noteCtaHtml(book, opts){

}
/* 통찰 정리(생각 나눔 전용 특수 노트 타입) 글은 자유 서식이 아니라 정해진 질문 3개에 대한
   답이라 일반 글과 렌더 구조가 다르다 — 피드에는 질문 대신 짧은 단어(느낀 점/통찰/적용)로
   표시하고, 몇 번째 모임인지는 카드 맨 아래 오른쪽에 배지로 보여준다(요청하신 배치). */
function insightBodyOf(payload){
  var meetingBadge = payload.meetingNo ? '<span class="page-badge insight-meeting-badge">'+esc(payload.meetingNo)+'번째 모임</span>' : '';
  /* 제목은 이제 "몇 번째 모임인가요?" 값으로 자동으로 만들어진다("N번째 통찰 노트", 38번
     라운드 요청) — buildShareFields에서 이미 채워서 저장하지만, 그 이전에 저장된 예전
     글(title이 없는 경우)도 어색하지 않게 meetingNo로 즉석에서 만들어 보여준다. */
  var titleText = payload.title || (payload.meetingNo ? payload.meetingNo+'번째 통찰 노트' : '통찰 노트');
  var bg = insightBgOf(payload.bgColor);
  var qHtml = INSIGHT_QUESTIONS.map(function(q){
    var val = (payload[q.key]||'').trim();
    if(!val) return '';
    return '<div class="insight-qa"><span class="insight-qa-label">'+esc(q.label)+'</span><p class="insight-qa-text">'+nlToBr(esc(val))+'</p></div>';
  }).join('');
  /* 배경을 그라데이션으로 고를 수 있게 되면서(38번 라운드), 카드 자체를 그 배경으로 감싸고
     제목을 세리프 글꼴로 "세련되게" 얹은 형태로 바꿨다 — 어두운 그라데이션(is-dark)을 고르면
     글자색도 함께 밝은 색으로 바뀐다. */
  var bgStyle = bg.key ? ' style="background:'+esc(bg.key)+'"' : '';
  var insightBody = '<div class="insight-body'+(bg.dark?' is-dark':'')+'"'+bgStyle+'>' +
      '<h4 class="insight-title">'+esc(titleText)+'</h4>' +
      (qHtml||'<p class="insight-qa-text" style="color:var(--ink-faint)">아직 작성된 내용이 없어요.</p>') +
    '</div>';
  /* 피드(3열 그리드 타일)에는 이제 제목만 보여주고, 질문 3개 내용은 눌러서 상세보기로
     들어가야만 볼 수 있다(요청 반영 — "타이틀만 나오게, 내용은 클릭해서 볼 수 있게") — 사진
     없는 일반 글이 표지에서 제목만 가운데 정렬로 보여주는 것(.post-media-text.has-title)과
     같은 패턴을 그대로 재사용. 타일 맨 아래의 "N번째 모임" 배지도 이제 제목과 중복이라 함께
     없앤다(sharePostTileHtml 참고 — meetingBadgeHtml을 타일 쪽엔 더 이상 넘기지 않음). */
  var ntBadge = '<span class="note-badge nt-insight">'+svgIcon(I_SPARK)+'<span class="note-badge-label">통찰 정리</span></span>';
  var tileBgStyle = bg.key ? ' style="background:'+esc(bg.key)+'"' : '';
  /* 타일 제목은 "N번째"를 한 줄, "통찰노트"를 그 아래 줄로 나눠서 보여준다(요청 반영) — 몇
     번째 모임인지 적었을 때만 두 줄로 나뉘고, 적지 않은 예전 글은 그냥 "통찰 노트" 한 줄 그대로. */
  var tileTitleHtml = payload.meetingNo
    ? '<span class="insight-tile-title-num">'+esc(payload.meetingNo)+'번째</span><br>통찰노트'
    : esc(titleText);
  return {
    ntKey: 'insight',
    isInsight: true,
    hasPhoto: false,
    mediaHtml: '<div class="post-media post-media-text has-title insight-tile-media'+(bg.dark?' is-dark':'')+'"'+tileBgStyle+'>' +
      '<div class="post-title-cover insight-tile-title">'+tileTitleHtml+'</div></div>',
    badgesHtml: '<div class="post-badges">'+ntBadge+'</div>',
    badgesCompactHtml: '<div class="post-badges post-badges-compact">'+ntBadge+'</div>',
    bodyHtml: insightBody,
    meetingBadgeHtml: meetingBadge
  };
}
function noteBodyHtml(payload){
  if(payload.noteType==='insight') return insightBodyOf(payload);
  var nt = noteTypeOf(payload.noteType);
  var ntBadge = nt ? '<span class="note-badge nt-'+nt.key+'">'+svgIcon(nt.icon)+'<span class="note-badge-label">'+esc(nt.label)+'</span></span>' : '';
  var pageBadge = payload.page ? '<span class="page-badge">p. '+esc(payload.page)+'</span>' : '';
  var bodyHtml = payload.html!=null ? sanitizeHtml(payload.html) : nlToBr(payload.text||'');
  var badgesHtml = (ntBadge||pageBadge) ? '<div class="post-badges">'+ntBadge+pageBadge+'</div>' : '';
  /* narrow 3-up grid tiles don't have room for both badges next to the name, so tiles use
     this icon-only, note-type-only variant (no page badge) — the full badgesHtml (with the
     page badge) is reserved for the roomier detail view. */
  var badgesCompactHtml = ntBadge ? '<div class="post-badges post-badges-compact">'+ntBadge+'</div>' : '';
  var hasPhoto = !!payload.photo;
  /* 나눔공간/나의 공간 글은 배경색을 직접 고를 수 있다(payload.bgColor) — 사진이 없을 때만
     보이는 이 텍스트 박스에 적용되고, 고르지 않았으면 예전처럼 기본 배경(--surface-2)을 쓴다.
     임의의 색 위에서도 글자가 항상 읽히도록 배경을 지정했을 때는 글자색을 고정 잉크색으로 둔다. */
  var bgStyle = (!hasPhoto && payload.bgColor) ? ' style="background:'+esc(payload.bgColor)+';color:#262319"' : '';
  /* 글자 크기(payload.fontSize)는 fs-* 클래스로 적용한다(인라인 style이 아님) — 3열 그리드
     타일에서는 CSS 우선순위 때문에 이 클래스가 자동으로 무시되고 타일 고정 크기가 유지되며,
     상세보기에서만 실제로 커지거나 작아진다(사진 크롭과 같은 방식, FONT_SIZES 참고). */
  var fsCls = fontSizeOf(payload.fontSize).cls;
  var textClass = 'post-text rich-content'+(fsCls?' '+fsCls:'');
  /* 제목(선택) — 사진이 없는 글은 표지(3열 그리드 타일)에서 본문 미리보기 대신 제목만
     보이게 하고(CSS: .feed-tile .post-media-text.has-title), 사진이 있는 글은 표지에서
     계속 사진 그대로 보이게 그림 쪽(mediaHtml)엔 아예 제목을 넣지 않고 상세보기 전용
     bodyHtml 쪽에만 넣는다(요청: "그림일 경우는 그림으로 놔두고"). */
  var titleText = (payload.title||'').trim();
  var titleHtml = titleText ? '<div class="post-title-cover">'+esc(titleText)+'</div>' : '';
  /* every post keeps the SAME fixed-height box regardless of content: a photo fills it,
     and when there's no photo, the text goes into that same space instead — so card
     size never depends on how much (or how little) someone wrote. the note-type/page
     badges are rendered separately (badgesHtml) so callers can place them in the header
     row next to the name, instead of inside this media box. */
  var mediaHtml = hasPhoto
    ? '<div class="post-media"><img src="'+payload.photo.dataUrl+'" alt="첨부 사진" loading="lazy"></div>'
    : '<div class="post-media post-media-text'+(titleText?' has-title':'')+'"'+bgStyle+'>'+titleHtml+'<div class="'+textClass+'">'+bodyHtml+'</div></div>';
  return {
    ntKey: nt ? nt.key : '',
    isInsight: false,
    hasPhoto: hasPhoto,
    mediaHtml: mediaHtml,
    badgesHtml: badgesHtml,
    badgesCompactHtml: badgesCompactHtml,
    bodyHtml: hasPhoto ? (titleHtml+'<div class="'+textClass+'">'+bodyHtml+'</div>') : '',
    meetingBadgeHtml: ''
  };
}
function commentsForPost(postId){
  return Object.values(STATE.comments).filter(function(c){ return c.postId===postId; }).sort(function(a,b){ return a.createdAt-b.createdAt; });
}
function commentThreadHtml(postId, list){

    return '<div class="comment-item"><div class="comment-row"><span class="comment-name">'+esc(c.userName)+'</span><span class="comment-time mono">'+fmtDate(c.createdAt)+'</span>'+
      (mineC?'<button class="comment-del" data-del-comment="'+c.id+'" type="button" title="삭제">'+svgIcon(I_TRASH)+'</button>':'')+'</div>' +
      '<div class="comment-text">'+nlToBr(c.text)+'</div></div>';
  }).join('');
  var input = SESSION ?
    '<div class="comment-input-row"><input type="text" class="comment-input" data-comment-input="'+postId+'" placeholder="댓글을 남겨보세요" maxlength="400">' +
    '<button type="button" class="btn btn-sm btn-primary" data-comment-submit="'+postId+'">등록</button></div>' :
    '<div class="hint" style="display:block;padding:8px 0">댓글을 남기려면 로그인해주세요.</div>';
  return '<div class="comment-thread">' + (items || '<div class="comment-empty">아직 댓글이 없어요.</div>') + input + '</div>';

function postActionsHtml(postId, extraLeftHtml){
  var count = commentsForPost(postId).length;
  var open = !!openComments[postId];
  return '<div class="post-actions">'+(extraLeftHtml||'')+'<button type="button" class="post-comment-toggle'+(open?' is-open':'')+'" data-comment-toggle="'+postId+'">'+svgIcon(I_COMMENT)+'<span>댓글'+(count?' '+count+'개':'')+'</span></button></div>' +
    (open ? commentThreadHtml(postId, commentsForPost(postId)) : '');
}
function feedSearchHtml(gridId, placeholder){
  var val = feedSearchQuery[gridId] || '';
  return '<div class="feed-search">'+svgIcon(I_SEARCH)+'<input type="search" class="feed-search-input" data-feed-search-target="'+gridId+'" placeholder="'+esc(placeholder)+'" value="'+esc(val)+'"></div>';
}
function applyFeedSearch(gridId){
  var grid = document.getElementById(gridId);
  if(!grid) return;
  var input = document.querySelector('[data-feed-search-target="'+gridId+'"]');
  var emptyEl = document.getElementById('empty-'+gridId);
  var q = input ? input.value.trim().toLowerCase() : '';
  var visible = 0;
  grid.querySelectorAll('.feed-tile').forEach(function(t){
    var text = (t.getAttribute('data-search-text')||'').toLowerCase();
    var match = !q || text.indexOf(q) >= 0;
    t.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  grid.style.display = (visible===0 && q) ? 'none' : '';
  if(emptyEl) emptyEl.style.display = (visible===0 && q) ? '' : 'none';
}
function feedToolbarHtml(book, filterKey, count){
  var chips = [{key:'all', label:'전체'}].concat(NOTE_TYPES.concat([NOTE_TYPE_INSIGHT]).map(function(t){ return {key:t.key, label:t.label}; }));
  return '<div class="feed-toolbar">' +
    '<span class="feed-count"><strong>'+count+'</strong>개의 나눔</span>' +
    '<div class="feed-filters" id="feed-filters" data-book="'+book.id+'">' + chips.map(function(c){
      return '<button type="button" class="feed-filter'+(filterKey===c.key?' is-sel':'')+'" data-filter="'+c.key+'">'+esc(c.label)+'</button>';
    }).join('') + '</div>' +
  '</div>';
}
function checkinBadgeHtml(book, p){
  var opt = checkinOptFor(book, p.checkin);
  if(book.checkin.type==='weather'){ return '<span class="post-checkin" style="--accent-soft:var(--'+book.accent+'-soft); --accent-ink:var(--'+book.accent+'-ink)">'+weatherIcon(p.checkin)+(opt?esc(opt.label):'')+'</span>'; }
  if(book.checkin.type==='tempo'){ return '<span class="post-checkin" style="--accent-soft:var(--'+book.accent+'-soft); --accent-ink:var(--'+book.accent+'-ink)">'+(opt?esc(opt.label):'')+'</span>'; }
  if(book.checkin.type==='gauge'){ return '<span class="post-checkin" style="--accent-soft:var(--'+book.accent+'-soft); --accent-ink:var(--'+book.accent+'-ink)">머릿속 '+esc(String(p.checkin))+'%</span>'; }
  if(book.checkin.type==='body'){ return '<span class="post-checkin" style="--accent-soft:var(--'+book.accent+'-soft); --accent-ink:var(--'+book.accent+'-ink)">'+esc(p.checkin)+'</span>'; }
  return '';
}
/* 수정은 본인 글만, 삭제는 본인 또는 운영자가 할 수 있다. */
function postEditDelHtml(canEdit, canDelete, editAttr, delAttr){

function sharePostCardHtml(book, p){
  var nb = noteBodyHtml(p);

  var mine = SESSION && SESSION.userId===p.userId;
  /* 통찰 정리 글은 고정 크기 미리보기 박스(mediaHtml) 대신 상세보기에서 질문 3개를 그대로
     보여준다(bodyHtml) — 몇 번째 모임인지는 카드 맨 아래 오른쪽에 배지로 표시(요청하신 배치). */
  return '<div class="card post'+(nb.ntKey?' nt-'+nb.ntKey:'')+'">' +
    '<div class="post-head"><div class="post-who">'+avatarHtml(p.userId, p.userName, book.accent)+'<div class="post-who-text"><span class="post-name">'+esc(p.userName)+'</span><span class="post-time mono">'+fmtDate(p.createdAt)+'</span></div></div>' +
    '<div class="post-head-side">'+nb.badgesHtml+checkinBadge+postEditDelHtml(mine, mine||isAdmin(), 'edit-post="'+p.id+'"', 'del-post="'+p.id+'"')+'</div></div>' +
    (nb.isInsight ? '<div class="post-body">'+nb.bodyHtml+'</div>' : (nb.mediaHtml + (nb.bodyHtml ? '<div class="post-body">'+nb.bodyHtml+'</div>' : ''))) +

function sharePostTileHtml(book, p){
  var nb = noteBodyHtml(p);
  var plain = p.noteType==='insight' ? INSIGHT_QUESTIONS.map(function(q){ return p[q.key]||''; }).join(' ') : (p.html!=null ? stripHtml(p.html) : '');
  var searchText = (plain+' '+p.userName).toLowerCase();
  var commentCount = commentsForPost(p.id).length;
  /* 타일 맨 아래의 "N번째 모임" 배지는 제거(요청 반영) — 이제 타일엔 제목만 보이고, 몇 번째
     모임인지는 상세보기로 들어가면 제목/본문에서 확인할 수 있다. meetingBadgeHtml은 상세보기
     쪽(sharePostCardHtml → postActionsHtml)에서는 그대로 쓰인다. */
  var footItems = (commentCount ? '<span class="feed-tile-count">'+svgIcon(I_COMMENT)+commentCount+'</span>' : '');
  return '<a class="card feed-tile'+(nb.ntKey?' nt-'+nb.ntKey:'')+'" href="#/book/'+book.id+'/share/post/'+p.id+'" data-search-text="'+esc(searchText)+'">' +
    '<div class="feed-tile-head">'+avatarHtml(p.userId, p.userName, book.accent)+'<span class="feed-tile-name">'+esc(p.userName)+'</span>'+nb.badgesCompactHtml+'</div>' +
    nb.mediaHtml +
    (commentCount ? '<div class="feed-tile-foot">'+footItems+'</div>' : '') +
  '</a>';
}
function shareTabHtml(book, postId){
  if(postId){
    var post = STATE.posts[postId];
    var back = '<a class="post-detail-back" href="#/book/'+book.id+'/share">'+svgIcon(I_BACK)+'목록으로</a>';
    if(!post || post.bookId!==book.id){ return back+'<div class="empty">글을 찾을 수 없어요.</div>'; }
    return back + '<div class="feed">'+sharePostCardHtml(book, post)+'</div>';
  }
  var composer = '';
  if(SESSION){
    var shareEditingPost = shareEditingId ? STATE.posts[shareEditingId] : null;
    composer = (shareComposerOpenFor===book.id)
      ? noteComposerHtml(book, {containerId:'share-composer', closeId:'btn-close-share-composer', submitId:'btn-share-submit',
          heading: shareEditingPost?'나눔 글 수정':'생각 나눔', withCheckin:true, editorLabel:'느낀 점, 깨달은 점을 나눠주세요',
          placeholder:'', hint:'이름과 시간이 함께 표시돼요',
          submitLabel: shareEditingPost?'수정하기':'나누기', withBgColor:true, withFontSize:true,
          extraNoteTypes:[NOTE_TYPE_INSIGHT], selectedNoteType:shareComposerNoteType, insightMode:shareComposerInsightMode,
          editingPost:shareEditingPost})
      : noteCtaHtml(book, {openId:'btn-open-share-composer', icon:I_BULB, label:'생각 나눔', sub:'오늘 읽으며 느낀 점을 나눠보세요'});
  } else {
    composer = loginGateHtml('나눔 공간에 글을 쓰려면 로그인해주세요.');
  }
  var allPosts = Object.values(STATE.posts).filter(function(p){ return p.bookId===book.id; }).sort(function(a,b){ return b.createdAt-a.createdAt; });
  var filterKey = shareFeedFilter[book.id] || 'all';
  var posts = filterKey==='all' ? allPosts : allPosts.filter(function(p){ return p.noteType===filterKey; });
  var toolbar = allPosts.length ? feedToolbarHtml(book, filterKey, posts.length) : '';
  var gridId = 'share-grid-'+book.id;
  var searchRow = allPosts.length ? feedSearchHtml(gridId, '나눔 글 검색') : '';
  var grid = posts.length
    ? '<div class="feed-grid" id="'+gridId+'">'+posts.map(function(p){ return sharePostTileHtml(book, p); }).join('')+'</div>' +
      '<div class="empty feed-empty-search" id="empty-'+gridId+'" style="display:none">검색 결과가 없어요.</div>'
    : (allPosts.length ? '<div class="empty">이 타입의 나눔이 아직 없어요.</div>' : '<div class="empty">아직 나눈 이야기가 없어요. 첫 번째 나눔을 남겨보세요.</div>');
  return composer + toolbar + searchRow + grid;
}
