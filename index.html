function readingHistoryHtml(book){
  var items = myReadingLogsWithRange(book.id);
  if(!items.length) return '<div class="empty" style="padding:14px 0">아직 읽은 기록이 없어요.</div>';
  /* 이전에 읽은 위치부터 이번에 읽은 위치까지 범위 + 그 사이 읽은 페이지 수를 함께 보여준다.
     예) p50-p100 (50페이지 읽음). 시작=도착이면(변화 없음) 범위 없이 페이지만 표시. */
  var rows = items.map(function(item){
    var l = item.log, sp = item.startPage;
    var delta = Math.abs(l.page - sp);
    var rangeText = sp===l.page
      ? ('p.'+esc(String(l.page)))
      : ('p'+esc(String(sp))+'-p'+esc(String(l.page))+' <span class="reading-log-delta">('+delta+'페이지 읽음)</span>');
    return '<div class="reading-log-row">' +
      '<div class="reading-log-main"><span class="reading-log-date mono">'+fmtDate(l.createdAt)+'</span><span class="reading-log-page">'+rangeText+'</span></div>' +
      '<div class="reading-log-side"><span class="reading-log-dur mono">'+fmtElapsed(l.seconds*1000)+'</span>' +
        '<button type="button" class="post-del" data-del-reading-log="'+l.id+'" title="삭제">'+svgIcon(I_TRASH)+'</button></div>' +
    '</div>';
  }).join('');
  return '<div class="reading-log-list">'+rows+'</div>';
}
/* 읽는 중/완독 상태 배지(현재 페이지로 자동 계산되는 값 — 클릭 불가) + 총 읽은 시간 +
   읽은 기록 버튼 — 대기 카드의 오른쪽 절반에 들어감. 버튼만 노출되고, 누르면 그 내용은
   카드 아래로(전체 너비) 펼쳐진다. */
function readingStatusPanelHtml(book){
  var status = readingStatusKey(book);
  var statusHtml = status==='done'
    ? '<span class="status-pill reading-status-pill is-done" style="background:var(--'+book.accent+');color:var(--surface)">'+svgIcon(I_CHECK)+'<span>완독</span></span>'
    : '<span class="status-pill reading-status-pill is-reading"><span class="reading-status-dot" style="background:var(--'+book.accent+')"></span><span>읽는 중</span></span>';

  var totalSec = totalReadSeconds(book.id);
  var timeHtml = '<div class="reading-total-time">총 읽은 시간 <strong>'+fmtDurationHuman(totalSec)+'</strong></div>';

  var logs = myReadingLogs(book.id);
  var historyOpen = readingHistoryOpenFor===book.id;
  var historyToggle = '<button type="button" class="reading-toggle-row" id="btn-reading-history-toggle" data-book="'+book.id+'">' +
    '<span>읽은 기록 보기'+(logs.length?' ('+logs.length+')':'')+'</span>' + readingChevronHtml(historyOpen) +
  '</button>';

  return '<div class="reading-status-top">'+statusHtml+timeHtml+'</div>' +
    '<div class="reading-toggle-list">' + historyToggle + '</div>';
}
/* 읽은 기록 버튼을 눌렀을 때 카드 아래로(좌우 구분 없이 전체 너비) 펼쳐지는 내용 */
function readingStatusBodyHtml(book){
  if(readingHistoryOpenFor===book.id){ return '<div class="reading-split-body">'+readingHistoryHtml(book)+'</div>'; }
  return '';
}
function readingCardHtml(book){
  if(!SESSION) return '';
  var total = book.totalPages || 0;
  var current = myCurrentPage(book.id);

  /* 완료 → 저장 화면: 경과 시간은 자동, 페이지만 확인/수정하고 저장 (총 페이지는 책마다 고정값) */
  if(readingSavePanelOpen && readingTimer && readingTimer.bookId===book.id){
    var elapsedSave = readingTimerElapsedMs();
    return '<div class="card reading-card reading-save-card">' +
      '<div class="composer-head"><h3>읽은 기록 저장</h3><button type="button" class="composer-close" id="btn-reading-save-back" title="닫기">'+svgIcon(I_CLOSE)+'</button></div>' +
      '<div class="reading-save-time mono">'+fmtElapsed(elapsedSave)+'</div>' +
      '<label class="field-label" for="reading-log-page-input">어디까지 읽으셨나요? <span class="hint">(총 '+total+'페이지)</span></label>' +
      '<input type="text" inputmode="numeric" id="reading-log-page-input" placeholder="예) 56" value="'+(current?esc(String(current)):'')+'">' +
      '<div class="composer-foot"><span class="hint">읽은 시간이 자동으로 함께 저장돼요</span><button type="button" class="btn btn-primary" id="btn-reading-log-save" data-book="'+book.id+'">저장</button></div>' +
    '</div>';
  }
  /* 실행/일시정지 중인 타이머 */
  if(readingTimer && readingTimer.bookId===book.id){
    var elapsedRun = readingTimerElapsedMs();
    var running = !!readingTimer.running;
    return '<div class="card reading-card reading-timer-card">' +
      '<div class="reading-timer-head">' +
        '<button type="button" class="icon-btn" id="btn-reading-cancel" title="취소">'+svgIcon(I_CLOSE)+'</button>' +
        '<span class="reading-timer-status">'+(running?'읽고 있는 중…':'일시정지')+'</span>' +
        '<button type="button" class="btn btn-primary btn-sm" id="btn-reading-done">'+svgIcon(I_CHECK)+' 완료</button>' +
      '</div>' +
      '<div class="reading-timer-display mono" id="reading-timer-display">'+fmtElapsed(elapsedRun)+'</div>' +
      '<button type="button" class="btn reading-timer-toggle" id="btn-reading-toggle-pause">'+(running?(svgIcon(I_PAUSE)+' 일시정지'):(svgIcon(I_PLAY)+' 계속'))+'</button>' +
      '<div class="reading-timer-book"><div class="reading-cover reading-cover-sm"><img src="'+book.cover+'" alt=""></div><span>'+esc(book.title)+'</span></div>' +
    '</div>';
  }
  /* 현재 페이지 수정 폼 (총 페이지는 책마다 고정이라 더 이상 입력받지 않음) */
  if(readingEditOpenFor===book.id){
    return '<div class="card reading-card reading-edit-card">' +
      '<div class="composer-head"><h3>현재 페이지 수정</h3><button type="button" class="composer-close" id="btn-reading-edit-close" title="닫기">'+svgIcon(I_CLOSE)+'</button></div>' +
      '<label class="field-label" for="reading-current-input">현재 페이지 <span class="hint">(총 '+total+'페이지)</span></label>' +
      '<input type="text" inputmode="numeric" id="reading-current-input" placeholder="예) 42" value="'+(current?esc(String(current)):'')+'">' +
      '<div class="composer-foot"><span class="hint">나에게만 보여요</span><button type="button" class="btn btn-primary btn-sm" id="btn-reading-edit-save" data-book="'+book.id+'">저장</button></div>' +
    '</div>';
  }
  /* 기본(대기) 상태 — 카드 한 장을 좌/우로 나눔:
     왼쪽=표지·p.현재/총·퍼센트·진행률 막대·시작/수정 버튼, 오른쪽=읽는 중/완독 상태 표시(자동) + 총 읽은 시간 + 읽은 기록 버튼.
     버튼을 누르면 그 내용은 카드 아래(전체 너비)로 펼쳐진다. */
  var pct = total>0 ? Math.max(0, Math.min(100, Math.round(current/total*100))) : 0;
  return '<div class="card reading-card reading-split-card">' +
    '<div class="reading-split-row">' +
      '<div class="reading-split-left">' +
        '<div class="reading-slim-row">' +
          '<div class="reading-cover"><img src="'+book.cover+'" alt="'+esc(book.title)+' 표지"></div>' +
          '<div class="reading-info">' +
            '<div class="reading-title">'+esc(book.title)+'</div>' +
            '<div class="reading-pages mono">p. '+current+' / '+total+' <span class="reading-pct">· '+pct+'%</span></div>' +
            '<div class="reading-bar"><div class="reading-bar-fill" style="width:'+pct+'%"></div></div>' +
          '</div>' +
          '<button type="button" class="icon-btn reading-play-btn" id="btn-reading-start" data-book="'+book.id+'" title="읽기 시작">'+svgIcon(I_PLAY)+'</button>' +
          '<button type="button" class="icon-btn reading-edit-btn js-reading-edit-open" id="btn-reading-edit-open" data-book="'+book.id+'" title="현재 페이지 수정">'+svgIcon(I_EDIT)+'</button>' +
        '</div>' +
      '</div>' +
      '<div class="reading-split-right">' + readingStatusPanelHtml(book) + '</div>' +
    '</div>' +
    readingStatusBodyHtml(book) +
  '</div>';
}
/* ---------------- 습관 만들기(전용 탭) ----------------
   28~29번 라운드까지는 나의 공간 안의 월간 달력형이었지만, 30번 라운드에서 요청에 따라
   (1) 자료실 다음의 완전히 독립된 탭으로 분리, (2) 월간 달력 대신 "이번 주"만 보여주는
   퀘스트형 체크표로 단순화, (3) 이번 주 7일을 모두 채우면(완료) 사진을 올려 실제 이미지
   파일(장소·시간·목표·이번 주 체크 현황이 자동으로 채워진 카드)을 만들어 기기에 저장할 수
   있는 기능으로 확장했다. */
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function myHabits(bookId){
  if(!SESSION) return [];
  return Object.values(STATE.habits).filter(function(h){ return h.bookId===bookId && h.userId===SESSION.userId; })
    .map(habitWithPendingChecks)
    .sort(function(a,b){ return a.createdAt-b.createdAt; });
}
/* 월요일 시작 기준 "이번 주" 계산 — 카드 안 체크표와 완료 카드 이미지가 항상 같은 기준을
   쓰도록 이 두 헬퍼로 통일한다. */
function mondayOf(d){
  var day = d.getDay(); // 0=일 ... 6=토
  var diff = (day===0 ? -6 : 1-day);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff);
}
function weekDatesOf(monday){
  var arr=[];
  for(var i=0;i<7;i++){ arr.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+i)); }
  return arr;
}
/* "몇째 주"는 그 주의 월요일이 이번 달의 며칠인지를 7로 나눠 올림 — 캘린더 앱들이 흔히
   쓰는 간단한 방식이라 사용자가 보기에 자연스럽다. */
function weekOfMonth(monday){ return Math.ceil(monday.getDate()/7); }
function habitWeekProgress(habit, weekDates){
  var checkedSet = {}; (habit.checkedDates||[]).forEach(function(d){ checkedSet[d]=true; });
  var done = weekDates.filter(function(d){ return checkedSet[ymd(d)]; }).length;
  return {done:done, total:weekDates.length, checkedSet:checkedSet};
}
function habitWeekGridHtml(habit, weekDates, checkedSet, todayStr){
  var DOW = ['월','화','수','목','금','토','일'];
  var cells = weekDates.map(function(d, i){
    var dstr = ymd(d);
    var isChecked = !!checkedSet[dstr];
    var isFuture = dstr > todayStr;
    var isToday = dstr === todayStr;
    var cls = 'habit-wday' + ((isChecked && !isFuture)?' is-checked':'') + (isFuture?' is-future':'') + (isToday?' is-today':'');
    var dot = isFuture
      ? '<span class="habit-wday-dot"></span>'
      : '<button type="button" class="habit-wday-dot" aria-label="'+dstr+' 습관 체크" aria-pressed="'+(isChecked?'true':'false')+'" data-habit-day="'+habit.id+'|'+dstr+'">'+(isChecked?'✓':'')+'</button>';
    return '<div class="'+cls+'"><span class="habit-wday-label">'+DOW[i]+'</span><span class="habit-wday-date">'+pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+'</span>'+dot+'</div>';
  }).join('');
  return '<div class="habit-week-grid">'+cells+'</div>';
}
function habitCardHtml(habit){
  var today = new Date();
  var monday = mondayOf(today);
  var weekDates = weekDatesOf(monday);
  var todayStr = ymd(today);
  var prog = habitWeekProgress(habit, weekDates);
  var wom = weekOfMonth(monday);
  var meta = [];
  if(habit.place) meta.push('<span class="habit-chip">📍 '+esc(habit.place)+'</span>');
  if(habit.time) meta.push('<span class="habit-chip">🕒 '+esc(habit.time)+'</span>');
  if(habit.goal) meta.push('<span class="habit-chip">🎯 '+esc(habit.goal)+'</span>');
  var complete = prog.done>=prog.total;
  var progressHtml = complete
    ? '<span class="habit-progress is-done">이번 주 완료 🎉</span>'
    : '<span class="habit-progress">'+prog.done+'/'+prog.total+'일 완료 · '+(prog.total-prog.done)+'일 남음</span>';
  /* 다운로드 버튼은 이번 주 내내가 아니라 "이번 주의 일요일"에만 보인다 — 월요일부터 토요일
     사이엔 미래 날짜라 체크할 수 없는 날이 남아 있어 카드가 아직 그 주를 온전히 대표하지
     못하고, 다음 주 월요일이 되면 weekDates 자체가 새 주로 넘어가 버려 그 전 주 카드를 다시
     받을 방법이 없기 때문 — 사실상 "그 주의 카드를 받을 수 있는 유일한 날"이 일요일이다.
     7일을 다 못 채웠어도 일요일이면 그날그날 체크한 기록 그대로 받을 수 있다(35번 라운드
     다음 요청 — "월요일 0시가 되면"/"일요일만 눌러도"는 같은 경계를 가리키므로 일요일 하루로
     통일). 참고: weekDates[6]이 그 주의 일요일이라, todayStr이 거기 도달했다는 건 곧 오늘이
     일요일이라는 뜻 — 그리고 7/7 완료도 마지막 날인 일요일이 와야만 가능하므로 complete는
     항상 isSunday를 함의한다. */
  var isSunday = todayStr===ymd(weekDates[6]);
  var saveRow = isSunday
    ? '<div class="habit-save-row">' +
        '<button type="button" class="btn btn-primary habit-save-btn" data-save-habit="'+habit.id+'">'+(complete?'📸 이번 주 완료 카드 다운로드':'📸 오늘까지 기록으로 카드 다운로드')+'</button>' +
        (complete ? '' : '<p class="habit-save-hint">7일을 다 채우지 못했어도 일요일인 오늘, 지금까지 체크한 기록 그대로 카드를 받을 수 있어요.</p>') +
      '</div>'
    : '';
  return '<div class="card habit-card" data-habit-card="'+habit.id+'">' +
    '<div class="habit-card-head">' +
      '<h4 class="habit-name">'+esc(habit.name)+'</h4>' +
      '<div class="habit-card-actions">' +
        '<button type="button" class="habit-icon-btn" data-habit-history="'+habit.id+'" title="지난 기록">'+svgIcon(I_CAL)+'</button>' +
        '<button type="button" class="habit-icon-btn" data-edit-habit="'+habit.id+'" title="수정">'+svgIcon(I_EDIT)+'</button>' +
        '<button type="button" class="habit-icon-btn" data-delete-habit="'+habit.id+'" title="삭제">'+svgIcon(I_TRASH)+'</button>' +
      '</div>' +
    '</div>' +
    (meta.length ? '<div class="habit-meta">'+meta.join('')+'</div>' : '') +
    '<div class="habit-week-head"><span>'+(today.getMonth()+1)+'월 '+wom+'주차</span>'+progressHtml+'</div>' +
    habitWeekGridHtml(habit, weekDates, prog.checkedSet, todayStr) +
    '<p class="habit-save-hint" data-habit-save-status role="status" aria-live="polite">'+habitSaveStatusHtml(habit.id)+'</p>' +
    saveRow +
  '</div>';
}
function habitFormHtml(book, editingHabit){
  var h = editingHabit || {name:'', place:'', time:'', goal:'', startDate:'', endDate:''};
  /* 기간(시작일/목표 종료일)을 새로 추가(38번 라운드 요청 — "새 습관 만들기 부분에 달력
     형태로 설정할 수 있게") — type="date"는 브라우저가 기본으로 달력 UI를 띄워주므로 별도
     달력 컴포넌트를 새로 만들 필요가 없다. 새로 만들 때는 시작일을 오늘로 미리 채워둬서
     아무것도 안 건드려도 "오늘부터"로 자연스럽게 시작되게 한다. */
  var startVal = h.startDate || (editingHabit ? habitCreatedStr(editingHabit) : ymd(new Date()));
  return '<div class="card habit-form" id="habit-form" data-book="'+book.id+'">' +
    '<div class="composer-head"><h4>'+(editingHabit?'습관 수정':'새 습관 만들기')+'</h4>' +
      '<button type="button" class="icon-btn" id="btn-close-habit-form">'+svgIcon(I_CLOSE)+'</button></div>' +
    '<div class="habit-form-row"><label>습관 이름</label><input type="text" id="habit-name" maxlength="40" placeholder="예: 아침 스트레칭" value="'+esc(h.name)+'"></div>' +
    '<div class="habit-form-row"><label>장소</label><input type="text" id="habit-place" maxlength="30" placeholder="예: 거실" value="'+esc(h.place)+'"></div>' +
    '<div class="habit-form-row"><label>시간</label><input type="text" id="habit-time" maxlength="30" placeholder="예: 아침 7시" value="'+esc(h.time)+'"></div>' +
    '<div class="habit-form-row"><label>목표</label><input type="text" id="habit-goal" maxlength="40" placeholder="예: 매일 10분" value="'+esc(h.goal)+'"></div>' +
    '<div class="habit-form-row"><label>시작일</label><input type="date" id="habit-start-date" value="'+esc(startVal)+'"></div>' +
    '<div class="habit-form-row"><label>목표일</label><input type="date" id="habit-end-date" value="'+esc(h.endDate||'')+'"></div>' +
    '<p class="habit-form-hint">목표(종료)일을 정해두면 "지난 기록"에서 목표까지 얼마나 왔는지 진행률로 보여드려요. 비워두면 기간 없이 계속하는 습관이 돼요.</p>' +
    '<button type="button" class="btn btn-primary" id="btn-habit-submit">'+(editingHabit?'수정하기':'만들기')+'</button>' +
  '</div>';
}
function habitsSectionHtml(book){
  if(!SESSION) return '';
  var loadStatus = memberDataStatusHtml('habits');
  if(loadStatus) return loadStatus;
  var habits = myHabits(book.id);
  var editingHabit = habitEditingId ? habits.filter(function(h){ return h.id===habitEditingId; })[0] : null;
  var form = (habitFormOpenFor===book.id) ? habitFormHtml(book, editingHabit)
    : '<button type="button" class="habit-add-btn" id="btn-open-habit-form" data-book="'+book.id+'">+ 새 습관 만들기</button>';
  var list = habits.length
    ? '<div class="habit-list">'+habits.map(habitCardHtml).join('')+'</div>'
    : '<div class="empty">아직 만든 습관이 없어요. 장소·시간·목표를 정해서 하나 시작해보세요.</div>';
  var historyModal = '';
  if(habitHistoryOpenFor){
    var historyHabit = habits.filter(function(h){ return h.id===habitHistoryOpenFor; })[0];
    if(historyHabit) historyModal = habitHistoryModalHtml(historyHabit);
    else habitHistoryOpenFor = null; // 삭제된 습관이면 조용히 닫음
  }
  return '<div class="habit-section"><p class="habit-section-lead">이번 주 습관을 만들고 매일 체크해보세요. 7일을 모두 채우면 완료 카드 이미지를 바로 다운로드할 수 있어요.</p>' + form + list + '</div>' + historyModal;
}
function habitTabHtml(book){
  if(!SESSION){ return loginGateHtml('습관 만들기는 로그인한 본인만 볼 수 있어요.'); }
  return habitsSectionHtml(book);
}
/* ---------------- 습관 지난 기록 팝업(월별 달력 + 성공률) ----------------
   habits.checkedDates는 지워지지 않고 계속 누적되므로(이번 주 화면만 그 창을 보여줄 뿐), 이 팝업은
   그 누적 데이터를 습관을 만든 날부터 오늘까지 월별 달력으로 다시 꺼내 보여준다. 색으로 성공/실패를
   구분하고, 전체 성공률과 보고 있는 달의 성공률을 함께 계산해 보여준다. */
function parseYmd(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtMonthDay(ymdStr){ var d = parseYmd(ymdStr); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function daysBetweenInclusive(aStr, bStr){
  if(aStr>bStr) return 0;
  return Math.round((parseYmd(bStr)-parseYmd(aStr))/86400000)+1;
}
function habitCreatedStr(habit){ return ymd(new Date(habit.createdAt)); }
/* 습관 카드의 "시작일"(habit.startDate, 38번 라운드에 새로 추가) — 아직 시작일을 정한 적 없는
   예전 습관은 지금까지처럼 습관을 만든 날을 시작일로 대신 쓴다. */
function habitStartStr(habit){ return habit.startDate || habitCreatedStr(habit); }
/* 통계/달력이 실제로 기준으로 삼는 "실질 시작일" — 습관을 만들기 전(또는 정한 시작일 이전)
   날짜라도 이번 주 달력에서는 체크할 수 있어서(미래만 막혀 있음), 시작일보다 이른 날짜를
   체크해두는 경우가 있다("독서" 습관을 9/10에 만들고 그 주 9/7~9/9도 체크한 사례로 실제
   확인됨 — 38번 라운드). 그 체크가 "지난 기록" 달력·성공률에서 조용히 빠지는 게 버그였으므로,
   실제로 체크된 가장 이른 날짜가 시작일보다 앞서 있으면 그 날짜까지 기준을 앞당겨서, 어떤
   체크도 통계에서 누락되지 않게 한다. */
function habitEffectiveStart(habit){
  var explicit = habitStartStr(habit);
  var dates = habit.checkedDates||[];
  var minChecked = null;
  for(var i=0;i<dates.length;i++){ if(minChecked===null || dates[i]<minChecked) minChecked = dates[i]; }
  return (minChecked && minChecked<explicit) ? minChecked : explicit;
}
/* 습관을 만든 날부터 오늘까지 전체 기간 기준 성공률 — "성공"은 실제 체크한 날, "실패"는 그 사이
   체크하지 않고 지나간 날(미래는 아직 지나지 않았으니 집계 대상이 아님). */
function habitOverallStats(habit){
  var startStr = habitEffectiveStart(habit), todayStr = ymd(new Date());
  var elapsed = daysBetweenInclusive(startStr, todayStr);
  var checkedSet = {}; (habit.checkedDates||[]).forEach(function(d){ checkedSet[d]=true; });
  var success = 0;
  for(var i=0;i<elapsed;i++){
    var d = new Date(parseYmd(startStr).getFullYear(), parseYmd(startStr).getMonth(), parseYmd(startStr).getDate()+i);
    if(checkedSet[ymd(d)]) success++;
  }
  var fail = Math.max(0, elapsed-success);
  return {elapsed:elapsed, success:success, fail:fail, rate: elapsed>0 ? Math.round(success/elapsed*100) : 0};
}
/* 특정 달(y, m 0-index) 기준 성공률 — 습관 생성일 이전이거나 아직 오지 않은 날은 그 달의 집계
   범위(rangeStart~rangeEnd)에서 아예 제외해, "이 달 중 실제로 지나간 날"만으로 계산한다. */
function habitMonthStats(habit, y, m){
  var startStr = habitEffectiveStart(habit), todayStr = ymd(new Date());
  var monthStartStr = ymd(new Date(y,m,1)), monthEndStr = ymd(new Date(y,m+1,0));
  var rangeStart = monthStartStr>startStr ? monthStartStr : startStr;
  var rangeEnd = monthEndStr<todayStr ? monthEndStr : todayStr;
  var elapsed = daysBetweenInclusive(rangeStart, rangeEnd);
  var checkedSet = {}; (habit.checkedDates||[]).forEach(function(d){ checkedSet[d]=true; });
  var success = 0;
  if(elapsed>0){
    for(var i=0;i<elapsed;i++){
      var d = new Date(parseYmd(rangeStart).getFullYear(), parseYmd(rangeStart).getMonth(), parseYmd(rangeStart).getDate()+i);
      if(checkedSet[ymd(d)]) success++;
    }
  }
  var fail = Math.max(0, elapsed-success);
  return {elapsed:elapsed, success:success, fail:fail, rate: elapsed>0 ? Math.round(success/elapsed*100) : null};
}
function habitHistoryCalendarHtml(habit, y, m){
  var DOW = ['월','화','수','목','금','토','일'];
  var startStr = habitEffectiveStart(habit), todayStr = ymd(new Date());
  var checkedSet = {}; (habit.checkedDates||[]).forEach(function(d){ checkedSet[d]=true; });
  var first = new Date(y,m,1);
  var startWeekday = first.getDay(); // 0=일 ... 6=토
  var lead = (startWeekday===0) ? 6 : startWeekday-1; // 월요일 시작 기준 앞 여백 칸 수
  var daysInMonth = new Date(y,m+1,0).getDate();
  var cells = [];
  for(var i=0;i<lead;i++){ cells.push('<div class="habit-hist-cell is-empty"></div>'); }
  for(var day=1; day<=daysInMonth; day++){
    var dstr = ymd(new Date(y,m,day));
    var cls = 'habit-hist-cell';
    if(dstr>=startStr && dstr<=todayStr){ cls += checkedSet[dstr] ? ' is-success' : ' is-fail'; }
    if(dstr===todayStr) cls += ' is-today';
    cells.push('<div class="'+cls+'">'+day+'</div>');
  }
  while(cells.length%7!==0){ cells.push('<div class="habit-hist-cell is-empty"></div>'); }
  var dow = DOW.map(function(w){ return '<div class="habit-hist-dow">'+w+'</div>'; }).join('');
  return '<div class="habit-hist-grid">'+dow+cells.join('')+'</div>';
}
/* 습관 시작일~목표 종료일(habit.endDate) 사이에서 오늘이 얼마나 지나왔는지 — "목표한 날까지
   몇 퍼센트 도달했는지"를 시간(기간) 기준으로 보여준다(38번 라운드 요청). 목표 종료일을
   아직 정하지 않은 습관은 계산할 기준이 없으므로 null을 돌려주고, 화면에서는 안내 문구로
   대신한다. */
function habitGoalProgress(habit){
  var end = habit.endDate || '';
  if(!end) return null;
  var start = habitStartStr(habit);
  var todayStr = ymd(new Date());
  var totalDays = daysBetweenInclusive(start, end);
  if(totalDays<=0) return null;
  var elapsedDays;
  if(todayStr<start) elapsedDays = 0;
  else if(todayStr>end) elapsedDays = totalDays;
  else elapsedDays = daysBetweenInclusive(start, todayStr);
  return {pct:Math.round(elapsedDays/totalDays*100), elapsedDays:elapsedDays, totalDays:totalDays, end:end};
}
function habitHistoryModalHtml(habit){

  var atMin = (y<created.getFullYear()) || (y===created.getFullYear() && m<=created.getMonth());
  var atMax = (y>today.getFullYear()) || (y===today.getFullYear() && m>=today.getMonth());
  var overall = habitOverallStats(habit);
  var monthStat = habitMonthStats(habit, y, m);
  var monthLabel = y+'년 '+(m+1)+'월';

        '<div class="habit-hist-stat-detail">'+goalProg.elapsedDays+'/'+goalProg.totalDays+'일 지남 · 목표일 '+esc(fmtMonthDay(goalProg.end))+'</div></div>'
    : '<div class="habit-hist-stat-card is-goal is-empty"><div class="habit-hist-stat-title">목표 기간 진행률</div>' +
        '<div class="habit-hist-stat-detail">습관 수정에서 목표 종료일을 정하면 진행률이 표시돼요.</div></div>';
  return '<div class="habit-hist-overlay" data-habit-history-close="1">' +

          '<button type="button" class="icon-btn" data-habit-history-close="1">'+svgIcon(I_CLOSE)+'</button></div>' +
        '<div class="habit-hist-month-nav">' +
          '<button type="button" class="habit-hist-nav-btn" data-habit-history-prev="1"'+(atMin?' disabled':'')+' aria-label="이전 달">'+svgIcon(I_BACK)+'</button>' +
          '<span class="habit-hist-month-label">'+monthLabel+'</span>' +
          '<button type="button" class="habit-hist-nav-btn is-next" data-habit-history-next="1"'+(atMax?' disabled':'')+' aria-label="다음 달">'+svgIcon(I_BACK)+'</button>' +
        '</div>' +
        habitHistoryCalendarHtml(habit, y, m) +
        '<div class="habit-hist-legend"><span><i class="is-success"></i>성공</span><span><i class="is-fail"></i>실패</span></div>' +
        '<div class="habit-hist-stats">' +
          '<div class="habit-hist-stat-card"><div class="habit-hist-stat-head"><span class="habit-hist-stat-title">전체 성공률</span><span class="habit-hist-stat-rate">'+overall.rate+'%</span></div>' +
            '<div class="habit-hist-stat-bar-track"><div class="habit-hist-stat-bar-fill" style="width:'+overall.rate+'%"></div></div>' +
            '<div class="habit-hist-stat-detail">성공 '+overall.success+'일 · 실패 '+overall.fail+'일 · 시작한 지 '+overall.elapsed+'일째</div></div>' +
          '<div class="habit-hist-stat-card"><div class="habit-hist-stat-head"><span class="habit-hist-stat-title">'+monthLabel+' 성공률</span><span class="habit-hist-stat-rate">'+monthRateText+'</span></div>' +
            '<div class="habit-hist-stat-detail">'+monthDetail+'</div></div>' +
          goalCardHtml +
        '</div>' +
      '</div>' +

}
function shiftHabitHistoryMonth(delta){
  var today = new Date();
  var cur = habitHistoryMonth || {y:today.getFullYear(), m:today.getMonth()};
  var next = new Date(cur.y, cur.m+delta, 1);
  habitHistoryMonth = {y:next.getFullYear(), m:next.getMonth()};
  render();
}
/* ---------------- 습관 완료 카드 이미지 생성 ----------------
   사용자가 준 다이어리 템플릿 3종(covers/habit-templates/theme-N.jpg) 이미지를 그대로 배경으로
   쓰고, 그 위에 실제 데이터(월/주차, 습관 이름·목표·장소·시간, 요일별 실제 날짜, 실제 체크 여부)만
   Canvas 2D로 얹어서 그린다 — 사진 업로드는 없다. 템플릿 원본에서 "(  /  )" 자리와 체크 동그라미는
   미리 지워둔(covers 폴더에 저장된) 버전을 쓰고, 실제 날짜/체크는 여기서 매번 새로 그린다.
   각 템플릿 이미지는 1254x1254 원본 그대로이며, 좌표는 그 이미지를 실측해서 잡았다. */
/* 좌표는 실제 템플릿 이미지를 픽셀 단위로 분석(빈칸 흰 박스의 좌우 경계, 밑줄 위치,
   "2026년" 텍스트의 실제 베이스라인, 요일 라벨의 글자 중심)해서 잡았다 — 32번 라운드에서
   사용자가 "칸 안 글자가 가운데 정렬이 아니다"라고 지적한 걸 계기로 재실측함.
   chips는 {cx, w}로 저장해 항상 그 칸의 실제 가로 중심에 그리도록 한다. */
var HABIT_CARD_TEMPLATES = [
  { src:'covers/habit-templates/theme-1.jpg', ink:'#33413c', check:'#75906f',
    monthBlank:{x:985,y:94}, weekBlank:{x:1107,y:94}, dateFont:'700 30px "IBM Plex Sans KR", sans-serif', dateAlign:'center',
    chips:[{cx:188.5,w:227},{cx:480.5,w:237},{cx:774.5,w:235},{cx:1067.5,w:225}], chipY:602, chipFont:'600 26px "IBM Plex Sans KR", sans-serif',
    cols:[142.5,304.5,463,626,782.5,940.5,1101], dateY:905, checkCy:975, checkR:38 },
  { src:'covers/habit-templates/theme-2.jpg', ink:'#1f3a52', check:'#79906f',
    monthBlank:{x:608,y:141}, weekBlank:{x:725,y:141}, dateFont:'700 30px "IBM Plex Sans KR", sans-serif', dateAlign:'center',
    chips:[{cx:211,w:220},{cx:486,w:228},{cx:767.5,w:235},{cx:1044.5,w:221}], chipY:557, chipFont:'600 26px "IBM Plex Sans KR", sans-serif',
    cols:[162.5,319,472,627.5,781.5,935.5,1088.5], dateY:805, checkCy:868, checkR:35 },
  { src:'covers/habit-templates/theme-3.jpg', ink:'#1e3654', check:'#78916f',
    monthBlank:{x:989,y:94}, weekBlank:{x:1114,y:94}, dateFont:'700 28px "IBM Plex Sans KR", sans-serif', dateAlign:'center',
    chips:[{cx:252,w:208},{cx:515.5,w:215},{cx:783.5,w:221},{cx:1052,w:214}], chipY:645, chipFont:'600 25px "IBM Plex Sans KR", sans-serif',
    cols:[211.5,353.5,498,643.5,789,933.5,1086.5], dateY:918, checkCy:965, checkR:32 }
];
var HABIT_TEMPLATE_IMG_CACHE = {};
function loadHabitTemplateImg(src){
  if(HABIT_TEMPLATE_IMG_CACHE[src]) return HABIT_TEMPLATE_IMG_CACHE[src];
  var p = new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
  HABIT_TEMPLATE_IMG_CACHE[src] = p;
  return p;
}
function fitTextToWidth(ctx, text, maxW, baseFontSpec){
  var m = baseFontSpec.match(/^(\S+\s+)(\d+)px(.*)$/);
  if(!m) return baseFontSpec;
  var prefix = m[1], size = parseInt(m[2],10), suffix = m[3];
  ctx.font = baseFontSpec;
  while(size>13 && ctx.measureText(text).width>maxW){
    size -= 2;
    ctx.font = prefix+size+'px'+suffix;
  }
  return ctx.font;
}
function triggerImageDownload(dataUrl, filename){
  var a=document.createElement('a'); a.href=dataUrl; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function drawHabitCompletionCard(habit, tplImg, tpl){
  var S = 1254;
  var canvas = document.createElement('canvas'); canvas.width=S; canvas.height=S;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(tplImg, 0, 0, S, S);

  var today = new Date(), monday = mondayOf(today), wom = weekOfMonth(monday);
  ctx.fillStyle = tpl.ink;
  ctx.textAlign = tpl.dateAlign; ctx.font = tpl.dateFont; ctx.textBaseline = 'middle';
  ctx.fillText(String(today.getMonth()+1), tpl.monthBlank.x, tpl.monthBlank.y);
  ctx.fillText(String(wom), tpl.weekBlank.x, tpl.weekBlank.y);
  ctx.textBaseline = 'alphabetic';

  var chips = [habit.name||'-', habit.goal||'-', habit.place||'-', habit.time||'-'];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  tpl.chips.forEach(function(box, i){
    var font = fitTextToWidth(ctx, chips[i], box.w-28, tpl.chipFont);
    ctx.font = font; ctx.fillStyle = tpl.ink;
    ctx.fillText(chips[i], box.cx, tpl.chipY);
  });
  ctx.textBaseline = 'alphabetic';

  var weekDates = weekDatesOf(monday);
  var checkedSet = {}; (habit.checkedDates||[]).forEach(function(d){ checkedSet[d]=true; });
  ctx.textAlign = 'center';
  weekDates.forEach(function(d, i){
    var cx = tpl.cols[i];
    ctx.fillStyle = tpl.ink;
    ctx.font = '600 24px "IBM Plex Sans KR", sans-serif';
    ctx.fillText('('+pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+')', cx, tpl.dateY);
    if(checkedSet[ymd(d)]){
      var r = tpl.checkR, cy = tpl.checkCy;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fillStyle = tpl.check; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(cx-r*0.32, cy+r*0.05); ctx.lineTo(cx-r*0.08, cy+r*0.32); ctx.lineTo(cx+r*0.38, cy-r*0.32); ctx.stroke();
    }
  });
  ctx.textAlign = 'left';

  var url = canvas.toDataURL('image/png');
  triggerImageDownload(url, (habit.name||'습관')+'-이번주-카드.png');
  showToast('카드 이미지를 저장했어요!');
}
function generateHabitCompletionCard(habit){
  var tpl = HABIT_CARD_TEMPLATES[Math.floor(Math.random()*HABIT_CARD_TEMPLATES.length)];
  loadHabitTemplateImg(tpl.src).then(function(img){
    try{ drawHabitCompletionCard(habit, img, tpl); }
    catch(e){ console.error('growell: habit card render failed', e); showToast('카드를 만드는 중 문제가 생겼어요.', true); }
  }).catch(function(){ showToast('카드 템플릿을 불러오지 못했어요.', true); });
}

    : '<div class="empty">아직 나의 공간에 남긴 기록이 없어요.</div>';
  setTimeout(function(){ decryptListInto(entries); }, 0);
  return readingCard + composer + '<p class="hint" style="margin:12px 0"><a href="#/profile/edit">개인 기록 복구 파일 저장·복구</a></p>' + searchRow + grid;
}
function decryptListInto(entries){
  ensureKey().then(function(key){
    if(!key) return;
    var done = entries.map(function(e){
      var node = document.querySelector('[data-mine-body="'+e.id+'"]');
      var badgesEl = document.querySelector('[data-mine-badges="'+e.id+'"]');
      var tile = document.querySelector('[data-mine-tile="'+e.id+'"]');
      var tileMedia = tile ? tile.querySelector('[data-mine-tile-media]') : null;
      var tileBadges = tile ? tile.querySelector('[data-mine-tile-badges]') : null;
      var card = document.querySelector('[data-mine-entry="'+e.id+'"]');
      if(!node && !tile) return Promise.resolve();
      return decryptPrivateRecord(e, key).then(function(text){
        var payload;
        try{ payload = JSON.parse(text); }catch(err){ payload = {html:null, text:text}; }
        var nb = noteBodyHtml(payload);
        if(card && nb.ntKey) card.classList.add('nt-'+nb.ntKey);
        if(node){ node.innerHTML = nb.mediaHtml + (nb.bodyHtml ? '<div class="post-body">'+nb.bodyHtml+'</div>' : ''); }
        if(badgesEl) badgesEl.innerHTML = nb.badgesHtml;
        if(tile){
          if(nb.ntKey) tile.classList.add('nt-'+nb.ntKey);
          if(tileMedia) tileMedia.outerHTML = nb.mediaHtml;
          if(tileBadges) tileBadges.innerHTML = nb.badgesCompactHtml;
          var plain = payload.html!=null ? stripHtml(payload.html) : (payload.text||'');
          tile.setAttribute('data-search-text', plain.toLowerCase());
          applyFeedSearch('mine-grid-'+e.bookId);
        }
      }).catch(function(){
        if(node) node.innerHTML = '<a href="#/profile/edit">기록을 열 수 없어요. 프로필에서 복구 파일로 복구해주세요.</a>';
        if(tileMedia) tileMedia.textContent = '복구 파일로 기록을 열어주세요';
      });
    });
    /* 나의 공간은 암호화돼 있어 복호화가 끝난 뒤에야 본문이 DOM에 채워진다 — render() 시점의
       enhanceLinkPreviews()는 아직 빈 내용만 보고 지나갔을 것이므로, 모든 항목의 복호화가
       끝나 본문이 실제로 채워진 뒤 다시 한 번 링크 카드 변환을 돌려준다. */
    Promise.all(done).then(function(){ enhanceLinkPreviews(); });
  });
}

function myWorksheet(bookId, activityKey){
  for(var k in STATE.worksheets){
    var w = STATE.worksheets[k];
    if(w.bookId===bookId && w.activityKey===activityKey && SESSION && w.userId===SESSION.userId) return w;
  }
  return null;
}
function othersWorksheets(bookId, activityKey){
  return Object.values(STATE.worksheets).filter(function(w){ return w.bookId===bookId && w.activityKey===activityKey && (!SESSION || w.userId!==SESSION.userId); }).sort(function(a,b){ return b.updatedAt-a.updatedAt; });
}
function worksheetSummary(activity, data){
  if(!data) return '';
  if(activity.type==='chips') return (data.chips||[]).join(', ');
  if(activity.type==='sentence') return data.text||'';
  if(activity.type==='note') return data.text||'';
  if(activity.type==='daily3'){
    var days=['월','화','수','목','금','토','일']; var out=[];
    days.forEach(function(d){ var row=data[d]; if(row && (row.morning||row.day||row.evening)){ out.push(d+' '+[row.morning,row.day,row.evening].filter(Boolean).join('/')); } });
    return out.join('  ');
  }
  if(activity.type==='week'){
    var days=['월','화','수','목','금','토','일']; var done=(data.days||[]).map(function(i){return days[i];}).join(',');
    return (done?'실행: '+done+'  ':'')+(data.note||'');
  }
  if(activity.type==='liturgy'){
    return Object.keys(data.freq||{}).map(function(i){ return i+':'+data.freq[i]; }).join('  ')+'  '+(data.note||'');
  }
  if(activity.type==='bodymap'){
    return (data.zones||[]).join(', ')+(data.note?'  — '+data.note:'');
  }
  return '';
}

      '<div class="bodymap-legend"><b>눌러서 긴장 표시</b><span data-zones-label>'+(zones.length?zones.join(', '):'아직 선택한 부위가 없어요')+'</span></div></div>' +
      '<textarea data-ws-note placeholder="그 부위의 느낌을 적어보세요">'+esc(d.note||'')+'</textarea>';
  }
  return '';

var MAX_FILE_BYTES = 7 * 1024 * 1024;
function fmtSize(bytes){
  if(bytes < 1024) return bytes+'B';
  if(bytes < 1024*1024) return Math.round(bytes/1024)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
function driveFileIdFromUrl(url){
  var m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  return m ? m[1] : null;
}

function readFileAsDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsDataURL(file);
  });
}
/* small square profile-photo thumbnail (resized+compressed client-side so a photo per
   member doesn't bloat the saved document; it's shown small everywhere it's used) */
function resizeAvatarDataUrl(file, maxDim, quality){
  maxDim = maxDim || 160; quality = quality || 0.82;
  return readFileAsDataURL(file).then(function(dataUrl){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        try{
          var side = Math.min(img.naturalWidth, img.naturalHeight);
          var sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
          var canvas = document.createElement('canvas');
          canvas.width = maxDim; canvas.height = maxDim;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, side, side, 0, 0, maxDim, maxDim);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(err){ reject(err); }
      };
      img.onerror = function(){ reject(new Error('image load failed')); };
      img.src = dataUrl;
    });
  });
}
/* 나눔/나의 공간/자료실에 첨부하는 사진: 원본을 그대로 저장하면 문서가 무거워지는 것도
   문제지만, 특히 휴대폰 카메라로 찍은 아주 큰 원본을 피드의 작은 썸네일 크기로 브라우저가
   한 번에 축소해서 그리면 글씨처럼 가는 디테일이 뭉개져 보인다. 캔버스로 긴 변 기준
   maxDim까지 "절반씩" 단계적으로 축소하면 브라우저의 한 번에-축소보다 훨씬 또렷하게
   나온다 — 그렇게 다운샘플한 결과를 저장해두면 이후 어떤 크기로 보여줘도 선명함을 유지. */
function resizeNotePhotoDataUrl(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.9;
  return readFileAsDataURL(file).then(function(dataUrl){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth, h = img.naturalHeight;
          if(!w || !h || (w<=maxDim && h<=maxDim)){ resolve(dataUrl); return; }
          var scale = maxDim / Math.max(w, h);
          var targetW = Math.max(1, Math.round(w*scale)), targetH = Math.max(1, Math.round(h*scale));
          var curCanvas = document.createElement('canvas');
          curCanvas.width = w; curCanvas.height = h;
          curCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var curW = w, curH = h;
          while(curW/2 > targetW && curH/2 > targetH){
            var nextW = Math.round(curW/2), nextH = Math.round(curH/2);
            var stepCanvas = document.createElement('canvas');
            stepCanvas.width = nextW; stepCanvas.height = nextH;
            var sctx = stepCanvas.getContext('2d');
            sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
            sctx.drawImage(curCanvas, 0, 0, curW, curH, 0, 0, nextW, nextH);
            curCanvas = stepCanvas; curW = nextW; curH = nextH;
          }
          var finalCanvas = document.createElement('canvas');
          finalCanvas.width = targetW; finalCanvas.height = targetH;
          var fctx = finalCanvas.getContext('2d');
          fctx.imageSmoothingEnabled = true; fctx.imageSmoothingQuality = 'high';
          fctx.drawImage(curCanvas, 0, 0, curW, curH, 0, 0, targetW, targetH);
          resolve(finalCanvas.toDataURL('image/jpeg', quality));
        }catch(err){ reject(err); }
      };
      img.onerror = function(){ reject(new Error('image load failed')); };
      img.src = dataUrl;
    });
  });
}
/* 자료실 글쓰기는 운영자만 할 수 있다(자료 올리기 = 글 남기기이므로 둘을 나눠 막을 필요가
   없음). driveLinks: [{title, driveUrl}, ...] — 글을 쓰면서 Drive 링크를 여러 개 함께
   첨부할 수 있다(제목 없이 글만 남길 수도, 링크만 첨부하고 글은 비워둘 수도 있음). 일시는
   별도 입력이 아니라 createdAt을 그대로 쓴다. */
function buildMaterialFields(payload){
  var cleanHtml = sanitizeHtml(payload.html);
  var plain = (function(){ var d=document.createElement('div'); d.innerHTML=cleanHtml; return d.textContent.trim(); })();
  var links = (payload.driveLinks||[]).map(function(it){
    return {title:(it.title||'').trim(), driveUrl:(it.driveUrl||'').trim()};
  }).filter(function(it){ return it.driveUrl; });
  var bad = links.filter(function(it){ return !/^https?:\/\//i.test(it.driveUrl); });
  if(bad.length) return {ok:false, msg:'올바른 Drive 링크 형식이 아니에요.'};
  if(!plain && !payload.photo && !links.length) return {ok:false, msg:'나눌 이야기를 적거나 자료 링크를 첨부해주세요.'};
  if(!payload.noteType) return {ok:false, msg:'노트 타입을 먼저 골라주세요.'};
  var title = (payload.title||'').trim();
  if(!title) return {ok:false, msg:'제목을 적어주세요.'};
  return {ok:true, fields:{noteType:payload.noteType, page:(payload.page||'').trim(), html:cleanHtml,
    photo:payload.photo||null, driveLinks:links, meetingNo:(payload.meetingNo||'').trim(), fontSize:payload.fontSize||'', title:title}};
}
function submitMaterialPost(bookId, payload, btn){
  if(!SESSION){ showToast('먼저 로그인해주세요.', true); return; }
  if(!isAdmin()){ showToast('자료실 글쓰기는 운영자만 할 수 있어요.', true); return; }
  var r = buildMaterialFields(payload);
  if(!r.ok){ showToast(r.msg, true); return; }
  var draftToken=captureComposerDraft(), draftUserId=SESSION.userId;
  var postId = uid('mn');
  saveState(function(next){
    next.materialNotes[postId] = Object.assign({id:postId, bookId:bookId, userId:SESSION.userId, userName:SESSION.name, createdAt:Date.now()}, r.fields);
  }, {button:btn, originalLabel:'나누기', savingLabel:'올리는 중…', onSuccess:function(){
    if(finishComposerDraft('materials',bookId,null,draftUserId,draftToken)){ resetMaterialsComposer(); render(); }

/* 자료실 글 수정 — 운영자 본인 글만, id를 유지한 채 내용을 덮어쓴다 */
function editMaterialPost(postId, payload, btn){
  if(!SESSION) return;

  var r = buildMaterialFields(payload);
  if(!r.ok){ showToast(r.msg, true); return; }
  var draftToken=captureComposerDraft(), draftUserId=SESSION.userId;
  saveState(function(next){
    next.materialNotes[postId] = Object.assign({id:postId, bookId:existing.bookId, userId:existing.userId, userName:existing.userName,
      createdAt:existing.createdAt, updatedAt:Date.now()}, r.fields);
  }, {button:btn, originalLabel:'수정하기', savingLabel:'수정 중…', onSuccess:function(){
    if(finishComposerDraft('materials',existing.bookId,postId,draftUserId,draftToken)){ resetMaterialsComposer(); render(); }
  }});

function deleteMaterialNote(postId, btn){

/* ---------------- master render ---------------- */
function render(){
  captureComposerDraft();
  var route = currentRoute();
  var app = document.getElementById('app');
  var theme = localStorage.getItem('growell_theme');
  if(theme==='dark') document.documentElement.setAttribute('data-theme','dark');
  else if(theme==='light') document.documentElement.setAttribute('data-theme','light');
  var html = headerHtml(route) + '<main>';
  if(route.view==='login'){
    html += loginHtml();
  } else if(route.view==='book'){
    var book = bookById(route.bookId);
    if(!book){ html += '<div class="wrap"><div class="empty">책을 찾을 수 없어요.</div></div>'; }
    else { html += bookPageHtml(book, route.tab||'share', route.postId); }
  } else if(route.view==='admin-users'){
    html += adminUsersHtml();
  } else if(route.view==='profile-edit'){
    html += SESSION ? profileEditHtml() : '<div class="wrap">'+loginGateHtml('프로필을 수정하려면 로그인해주세요.')+'</div>';
  } else if(route.view==='community'){
    html += homeCommunityHtml(route);
  } else if(route.view==='about'){
    html += welcomeHomeHtml();
  } else {
    html += homeHtml();
  }
  html += '</main>' + footerHtml();
  if(readingTimerIntervalId){ clearInterval(readingTimerIntervalId); readingTimerIntervalId = null; }
  app.innerHTML = html;
  bindEvents(route);
  restoreDraftIfAny(route);
  enhanceLinkPreviews();
  captureComposerDraft();
}

function restoreDraftIfAny(route){

}

  /* note type pills — 수정 화면을 열 때는 기존 타입이 미리 선택된 채(is-sel) 그려지므로

  var ntSet = document.getElementById('nt-set');

  if(ntSet){
    ntSet.querySelectorAll('[data-nt]').forEach(function(p){
      p.addEventListener('click', function(){
        var newType = p.getAttribute('data-nt');
        /* 생각 나눔(나눔 공간) 컴포저에서 '통찰 정리'로 들어가거나 나올 때는 필드 구성 자체가

           바꾸는 건 지금까지처럼 다시 그리지 않고 클래스만 바꿔서 입력 중인 내용을 지키지 않는다. */
        var shareContainer = document.getElementById('share-composer');

  /* rich text toolbar */
  var noteEditor = document.getElementById('note-editor');
  if(noteEditor){
    noteEditor.addEventListener('input', function(){
      if(noteEditor.innerHTML==='<br>'||noteEditor.textContent.trim()===''&&noteEditor.querySelectorAll('img,ol,ul,blockquote,pre').length===0){
        if(noteEditor.textContent.trim()==='') noteEditor.innerHTML='';
      }
    });
    var toolbar = document.querySelector('.rt-toolbar');
    /* 하이라이트: 누르면 켜져서(다양한 색 중 골라) 입력하는 글자가 하이라이트되고, 다시
       누르면 꺼져서 원래 글쓰기(하이라이트 없음)로 돌아온다 — 이전에 이미 칠해둔 하이라이트는
       그대로 남고, 이후에 입력하는 글자에만 적용/해제되는 토글이다. */
    var highlightActive = false;
    var highlightColor = HL_COLORS[0];
    var highlightBtn = toolbar ? toolbar.querySelector('[data-rt-cmd="highlight"]') : null;
    var hlSwatches = document.getElementById('hl-swatches');
    function setHighlightActive(on){
      highlightActive = on;
      if(highlightBtn) highlightBtn.classList.toggle('is-active', on);
      if(highlightBtn) highlightBtn.style.background = on ? highlightColor : '';
      if(hlSwatches) hlSwatches.hidden = !on;
    }
    if(hlSwatches){
      hlSwatches.querySelectorAll('[data-hl-color]').forEach(function(sw){
        sw.addEventListener('mousedown', function(e){ e.preventDefault(); });
        sw.addEventListener('click', function(){
          highlightColor = sw.getAttribute('data-hl-color');
          hlSwatches.querySelectorAll('.hl-swatch').forEach(function(x){ x.classList.remove('is-sel'); });
          sw.classList.add('is-sel');
          if(highlightBtn) highlightBtn.style.background = highlightColor;
          if(highlightActive){
            try{ document.execCommand('hiliteColor', false, highlightColor); }catch(err){}
          }
        });
      });
    }
    if(toolbar){
      toolbar.querySelectorAll('[data-rt-cmd]').forEach(function(b){
        b.addEventListener('mousedown', function(e){ e.preventDefault(); });
        b.addEventListener('click', function(){
          if(document.activeElement!==noteEditor){
            noteEditor.focus();
            var sel = window.getSelection();
            var range = document.createRange();
            range.selectNodeContents(noteEditor);
            range.collapse(false);
            sel.removeAllRanges(); sel.addRange(range);
          }
          var cmd = b.getAttribute('data-rt-cmd');
          try{
            if(cmd==='bold') document.execCommand('bold');
            else if(cmd==='italic') document.execCommand('italic');
            else if(cmd==='underline') document.execCommand('underline');
            else if(cmd==='strike') document.execCommand('strikeThrough');
            else if(cmd==='ol') document.execCommand('insertOrderedList');
            else if(cmd==='ul') document.execCommand('insertUnorderedList');
            else if(cmd==='quote') document.execCommand('formatBlock', false, 'blockquote');
            else if(cmd==='code') document.execCommand('formatBlock', false, 'pre');
            else if(cmd==='clear'){ document.execCommand('removeFormat'); setHighlightActive(false); }
            else if(cmd==='undo') document.execCommand('undo');
            else if(cmd==='redo') document.execCommand('redo');
            else if(cmd==='fontsize') document.execCommand('fontSize', false, '5');
            else if(cmd==='highlight'){
              /* 켜짐/꺼짐 표시(버튼·스와치)는 execCommand 성공 여부와 무관하게 먼저 바꿔둔다 —
                 브라우저에 따라 hiliteColor가 실패해도 다시 누르면 꺼지는 토글 자체는 항상 동작해야 한다. */
              var turningOn = !highlightActive;
              setHighlightActive(turningOn);
              try{ document.execCommand('hiliteColor', false, turningOn ? highlightColor : 'transparent'); }catch(e2){}
            } else if(cmd==='link'){
              var url = window.prompt('연결할 링크 주소를 입력해주세요 (https://...)');
              if(url){ if(!/^https?:\/\//i.test(url)) url='https://'+url; document.execCommand('createLink', false, url); }
            }
          }catch(err){}
        });
      });
    }

  /* photo attach — 수정 화면을 열 때는 기존 사진이 미리보기 마크업으로 이미 그려져 있으니,

  var photoPreview = document.getElementById('photo-preview');
  var existingThumbImg = photoPreview ? photoPreview.querySelector('img') : null;

  function renderPhotoPreview(){

      if(f.size > MAX_FILE_BYTES){ showToast('사진이 너무 커요. '+fmtSize(MAX_FILE_BYTES)+' 이하로 올려주세요.', true); return; }
      resizeNotePhotoDataUrl(f).then(function(dataUrl){

  /* composer open/close toggles (생각 나눔 / 오늘의 기록) */

  /* 나의 공간 글 수정 — 암호화된 글이라 먼저 복호화한 뒤에야 컴포저를 채워서 열 수 있다 */
  app.querySelectorAll('[data-edit-mine]').forEach(function(b){
    b.addEventListener('click', function(){
      var eid = b.getAttribute('data-edit-mine');
      var entry = STATE.privateEntries[eid];
      if(!SESSION || !entry || entry.userId!==SESSION.userId) return;
      var editOwner=SESSION.userId, editKey=SESSION.keyB64;
      /* 상세보기 라우트에서는 컴포저가 안 그려지니 목록 라우트로 먼저 옮겨둔다(복호화는
         비동기라 이 시점에 옮겨도 문제없다 — 다 되면 아래에서 다시 한 번 그린다). */
      if(route.postId===eid){ location.hash = '#/book/'+entry.bookId+'/mine'; }
      ensureKey().then(function(key){
        if(!key) return;
        privateSessionGuard(editOwner,editKey);
        return decryptPrivateRecord(entry, key).then(function(text){
          privateSessionGuard(editOwner,editKey);
          var payload;
          try{ payload = JSON.parse(text); }catch(err){ payload = {html:null, text:text}; }
          return openComposerWithDraft('mine',entry.bookId,eid,function(){
            privateSessionGuard(editOwner,editKey);
            mineEditingId = eid; mineEditingPayload = payload; mineComposerOpenFor = entry.bookId;
            render();
          });
        });

function collectWorksheetData(card, act){
  var data = {};
  if(act.type==='chips'){
    data.chips = Array.prototype.slice.call(card.querySelectorAll('[data-chip].is-sel')).map(function(c){ return c.getAttribute('data-chip'); });
    var note = card.querySelector('[data-ws-note]'); data.note = note?note.value.trim():'';
  } else if(act.type==='sentence'){
    var s = card.querySelector('[data-ws-sentence]'); data.text = s?s.value.trim():'';
  } else if(act.type==='note'){
    var n = card.querySelector('[data-ws-note]'); data.text = n?n.value.trim():'';
  } else if(act.type==='daily3'){
    var days=['월','화','수','목','금','토','일'];
    days.forEach(function(day){
      var m=card.querySelector('[data-ws-daily="'+day+'|morning"]');
      var d2=card.querySelector('[data-ws-daily="'+day+'|day"]');
      var e=card.querySelector('[data-ws-daily="'+day+'|evening"]');
      var row={morning:m?m.value.trim():'', day:d2?d2.value.trim():'', evening:e?e.value.trim():''};
      if(row.morning||row.day||row.evening) data[day]=row;
    });
  } else if(act.type==='week'){
    data.days = Array.prototype.slice.call(card.querySelectorAll('[data-ws-week] .is-sel')).map(function(d){ return Number(d.getAttribute('data-day')); });
    var note2 = card.querySelector('[data-ws-note]'); data.note = note2?note2.value.trim():'';
  } else if(act.type==='liturgy'){
    data.freq = {};
    card.querySelectorAll('[data-ws-liturgy-item]').forEach(function(seg){
      var item = seg.getAttribute('data-ws-liturgy-item');
      var sel = seg.querySelector('button.is-sel');
      data.freq[item] = sel ? sel.getAttribute('data-lv') : '거의 안함';
    });
    var note3 = card.querySelector('[data-ws-note]'); data.note = note3?note3.value.trim():'';
  } else if(act.type==='bodymap'){
    var bm = card.querySelector('[data-bodymap]');
    var zones = bm ? Array.prototype.slice.call(bm.querySelectorAll('.z-on')).map(function(n){ return n.getAttribute('data-zone'); }) : [];
    data.zones = zones.filter(function(v,i){ return zones.indexOf(v)===i; });
    var note4 = card.querySelector('[data-ws-note]'); data.note = note4?note4.value.trim():'';
  }
  return data;
}

/* ---------------- 앱 설치 유도 배너 ----------------
   "링크 들어가면 바로 물어봐줄 수 있어?" 요청 반영 — 사이트에 들어오는 즉시(로그인 여부와 무관하게,
   #app 재렌더와도 무관하게 살아있도록 #app 밖에 붙인다) 설치를 권하는 카드를 띄운다.
   브라우저 정책상 사용자의 클릭 없이 설치 대화상자 자체를 강제로 띄우는 것은 막혀 있어(스팸성 권한
   요청 방지 — beforeinstallprompt는 제스처 없이도 발생하지만 그 이벤트의 prompt()는 반드시 사용자
   동작 안에서 호출해야 함) 완전한 "0번 클릭 자동 설치"는 불가능하지만, 이 카드가 들어오자마자 바로
   보이고 "설치하기" 버튼 한 번만 누르면 곧바로 진짜 설치 대화상자로 이어지므로 사실상 가장 가까운
   형태다. iOS Safari/Chrome은 beforeinstallprompt 자체를 지원하지 않아(2026년 기준에도 여전히 없음)
   프로그램적으로 설치를 띄울 방법이 없어, 이 경우엔 버튼 없이 "공유 → 홈 화면에 추가" 안내만 보여준다. */
(function(){
  try{
    // 이미 설치되어 실행 중이면(홈 화면 아이콘으로 열었을 때) 다시 권할 필요 없음.
    var alreadyInstalled = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    if(alreadyInstalled) return;
    // 사용자가 예전에 닫기(×)를 눌렀으면 다시 띄우지 않음(계속 뜨면 성가시므로).
    var dismissed = false;
    try{ dismissed = localStorage.getItem('growell_install_dismissed') === '1'; }catch(err){}
    if(dismissed) return;

    var ua = window.navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var deferredPrompt = null;

    function dismiss(banner){
      try{ localStorage.setItem('growell_install_dismissed', '1'); }catch(err){}
      if(banner && banner.parentNode) banner.parentNode.removeChild(banner);
    }

    function showBanner(kind){
      if(document.querySelector('.install-banner')) return; // 중복 방지
      var el = document.createElement('div');
      el.className = 'install-banner';
      var actionsHtml = kind === 'android'
        ? '<div class="install-banner-actions"><button type="button" class="install-banner-btn" id="install-banner-go">설치하기</button></div>'
        : '';
      el.innerHTML =
        '<div class="install-banner-head">' +
          '<div class="install-banner-icon"><img src="/covers/icon-192.png" alt=""></div>' +
          '<div class="install-banner-body"><div class="install-banner-title">GROWELL 앱으로 설치하기</div></div>' +
          '<button type="button" class="install-banner-close" id="install-banner-close" aria-label="닫기">×</button>' +
        '</div>' +
        '<div class="install-banner-desc">' + (kind === 'android'
          ? '홈 화면에 추가하면 앱처럼 빠르게 열 수 있어요.'
          : '공유 버튼을 누른 뒤 "홈 화면에 추가"를 선택해보세요.') +
        '</div>' +
        actionsHtml;
      document.body.appendChild(el);
      var closeBtn = document.getElementById('install-banner-close');
      if(closeBtn) closeBtn.addEventListener('click', function(){ dismiss(el); });
      var goBtn = document.getElementById('install-banner-go');
      if(goBtn){
        goBtn.addEventListener('click', function(){
          if(!deferredPrompt){ dismiss(el); return; }
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(){
            deferredPrompt = null;
            dismiss(el);
          }).catch(function(){ dismiss(el); });
        });
      }
    }

    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      showBanner('android');
    });
    window.addEventListener('appinstalled', function(){
      try{ localStorage.setItem('growell_install_dismissed', '1'); }catch(err){}
      var b = document.querySelector('.install-banner');
      if(b && b.parentNode) b.parentNode.removeChild(b);
    });
    if(isIOS){
      // iOS는 beforeinstallprompt가 없어 즉시(제스처 이벤트를 기다리지 않고) 안내 카드를 보여준다 —
      // 어차피 우리가 프로그램적으로 설치를 트리거할 수 없으므로 기다릴 이유가 없음.
      showBanner('ios');
    }
  }catch(err){ /* 설치 배너는 부가 기능 — 실패해도 앱 부팅 자체는 계속 진행 */ }
})();

/* ---------------- boot ----------------
   예전엔 STATE가 문서에 이미 박혀 있어 render()를 바로 불렀지만, 이제는 Supabase에서
   테이블을 불러오는 게 먼저다(비동기) — 그동안 짧은 로딩 화면을 보여주고, 다 불러오면 그때 그린다.
   로딩 화면 자체는 이제 위 <body>의 정적 HTML에 이미 그려져 있으므로(요청 반영 — OS 스플래시 다음에
   빈 화면 없이 바로 이어지도록), 여기서는 데이터를 다 불러온 뒤 실제 화면으로 교체하기만 하면 된다. */
var appEl = document.getElementById('app');
bootApp().then(function(){
  if(BOOT_FAILED){
    if(appEl) appEl.innerHTML = '<div class="empty" style="padding:40px 16px; text-align:center;">사이트를 불러오지 못했어요. 새로고침해주세요.</div>';
    return;
  }
  render();
});
})();
</script>
</body>
</html>
