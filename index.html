<!-- 모바일 뷰포트 메타 태그 — 이게 빠져 있으면 모바일 브라우저가 데스크톱 폭(보통 980px)
     기준으로 렌더링한 뒤 화면에 맞춰 통째로 축소해버려서, 아래 @media(max-width:760px)
     모바일 전용 CSS가 실제 기기에서는 전혀 발동하지 않고 "PC 화면이 그대로 줄어든" 것처럼
     보이게 된다(요청하신 문제의 실제 원인). Claude Artifact로 게시할 때는 플랫폼이 이 태그를
     자동으로 넣어줬지만, Vercel에 올리는 이 파일에는 <html>/<head> 자체가 빠져 있었음. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROWELL 다이어리</title>
<!-- 카카오톡 등에 사이트 주소를 공유했을 때 제목·설명·이미지가 카드로 미리보기되게 하는 태그.
     카카오톡의 링크 미리보기 봇은 자바스크립트를 실행하지 않고 이 <head> 안의 태그만 그대로
     읽어가기 때문에, 반드시 정적 HTML에 값이 박혀 있어야 한다(og:image는 절대경로 URL이어야
     실제로 이미지를 받아갈 수 있음). 이미지는 책 표지 4장을 정렬형으로 배치한
     covers/og-image-v2.jpg(1200x630, 표준 OG 비율) — 파일명 끝에 -v2를 붙인 이유는, 카카오톡
     "공유 디버거"에서 캐시를 초기화해도 실제 카카오톡 채팅창의 링크 미리보기는 이미지 URL 자체를
     키로 캐시해두고 있어서 내용만 바꿔서는 계속 예전 이미지가 나오는 문제가 있었기 때문 —
     이미지 URL을 아예 새 주소로 바꿔서 카카오가 처음 보는 이미지로 인식하게 만든 것.
     앞으로 이미지를 또 바꿀 일이 있으면 파일명 끝의 버전 숫자를 한 번 더 올려야 함(v3, v4...). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="GROWELL 독서모임">
<meta property="og:title" content="GROWELL 독서모임 — 나를 만나는 중입니다">
<meta property="og:description" content="읽고 나누고 생각하며 자라는 우리, DBKS GROWELL 독서모임 공간이에요.">
<meta property="og:image" content="https://growell-book.vercel.app/covers/og-image-v2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://growell-book.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GROWELL 독서모임 — 나를 만나는 중입니다">
<meta name="twitter:description" content="읽고 나누고 생각하며 자라는 우리, DBKS GROWELL 독서모임 공간이에요.">
<meta name="twitter:image" content="https://growell-book.vercel.app/covers/og-image-v2.jpg">
<!-- 파비콘 + "홈 화면에 추가/설치" 아이콘 세트. 크롬의 "설치" 또는 "바로가기 만들기"는
     기본적으로 아래 manifest.json의 icons(192/512)를 사용하고, iOS Safari의 "홈 화면에 추가"는
     apple-touch-icon을 쓴다 — 브라우저 탭 아이콘(favicon)까지 포함해 크기별로 전부 준비해둠.
     그림은 로고의 책+새싹 마스코트를 정중앙에 배치해 새로 만든 covers/icon-*.png. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="covers/favicon.ico" sizes="any">
<link rel="icon" href="covers/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="covers/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="covers/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="covers/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="app-style">
  :root{

    --emotion:#7A2E2E; --emotion-soft:#F3E1DC; --emotion-ink:#5C221F;
    --thought:#2F5E7D; --thought-soft:#DCE9EF; --thought-ink:#234A63;
    --body:#6E5AA6; --body-soft:#E7E1F4; --body-ink:#544286;
    --action:#8C6A05; --action-soft:#F3E6BB; --action-ink:#6E5304;
    --nt-quote:#3B6EA5; --nt-quote-soft:#DCE7F2; --nt-quote-ink:#2C527D;
    --nt-summary:#2E7D6B; --nt-summary-soft:#DCEFE9; --nt-summary-ink:#215C4F;
    --nt-thought:#B8860B; --nt-thought-soft:#F5E7C4; --nt-thought-ink:#8A6708;
    --nt-question:#7A5AC9; --nt-question-soft:#E9E1F7; --nt-question-ink:#5C3FA0;
    --nt-insight:#B5486B; --nt-insight-soft:#F5DEE3; --nt-insight-ink:#8A3650;
    --highlight:#FBE28A;
    --font-display:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
    --font-body:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18151E; --surface:#221E29; --surface-2:#2A2532; --surface-3:#332C3D;
      --ink:#ECE7DF; --ink-soft:#B9B0C8; --ink-faint:#8A8199;
      --line:rgba(236,231,223,.13); --line-strong:rgba(236,231,223,.26);
      --primary:#BBA9E0; --primary-ink:#20182E; --primary-soft:rgba(187,169,224,.16);
      --danger:#E19483;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
      --shadow-sm:0 1px 3px rgba(0,0,0,.35);
      --shadow-lg:0 20px 48px -18px rgba(0,0,0,.6);
      --emotion:#E0998A; --emotion-soft:#3A2321; --emotion-ink:#F0C6BC;
      --thought:#8FC1DE; --thought-soft:#1E2F38; --thought-ink:#C4E2F1;
      --body:#C1AEEC; --body-soft:#2C2540; --body-ink:#DCCFF6;
      --action:#EAC24E; --action-soft:#3A311A; --action-ink:#F3D888;
      --nt-quote:#8FB8DE; --nt-quote-soft:#1E2F3E; --nt-quote-ink:#C7DFF2;
      --nt-summary:#7FD0BC; --nt-summary-soft:#1B2F2A; --nt-summary-ink:#BEEBDD;
      --nt-thought:#E8C767; --nt-thought-soft:#332A14; --nt-thought-ink:#F3DE9E;
      --nt-question:#B7A0E8; --nt-question-soft:#2A2240; --nt-question-ink:#DCCFF6;
      --nt-insight:#E39BAD; --nt-insight-soft:#3A2229; --nt-insight-ink:#F0C4D1;

  :root[data-theme="dark"]{
    --bg:#18151E; --surface:#221E29; --surface-2:#2A2532; --surface-3:#332C3D;

    --line:rgba(236,231,223,.13); --line-strong:rgba(236,231,223,.26);
    --primary:#BBA9E0; --primary-ink:#20182E; --primary-soft:rgba(187,169,224,.16);
    --danger:#E19483;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    --shadow-sm:0 1px 3px rgba(0,0,0,.35);
    --shadow-lg:0 20px 48px -18px rgba(0,0,0,.6);
    --emotion:#E0998A; --emotion-soft:#3A2321; --emotion-ink:#F0C6BC;
    --thought:#8FC1DE; --thought-soft:#1E2F38; --thought-ink:#C4E2F1;
    --body:#C1AEEC; --body-soft:#2C2540; --body-ink:#DCCFF6;
    --action:#EAC24E; --action-soft:#3A311A; --action-ink:#F3D888;
    --nt-quote:#8FB8DE; --nt-quote-soft:#1E2F3E; --nt-quote-ink:#C7DFF2;
    --nt-summary:#7FD0BC; --nt-summary-soft:#1B2F2A; --nt-summary-ink:#BEEBDD;
    --nt-thought:#E8C767; --nt-thought-soft:#332A14; --nt-thought-ink:#F3DE9E;
    --nt-question:#B7A0E8; --nt-question-soft:#2A2240; --nt-question-ink:#DCCFF6;
