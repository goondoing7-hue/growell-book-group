  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; font-weight:500; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; color:var(--ink);}
  p{margin:0;}
  a{color:inherit;}
  button,input,textarea,select{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  ::selection{background:var(--primary-soft);}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  :focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:4px;}

  #app{min-height:100vh; display:flex; flex-direction:column;}
  .wrap{width:100%; max-width:920px; margin:0 auto; padding:0 20px;}

  /* 초기 로딩(부팅) 화면 — Supabase에서 데이터를 불러오는 짧은 동안 보여주는 브랜드 스플래시.
     헤더/네비게이션은 render() 이후에야 그려지므로, 이 화면이 뜨는 동안은 #app 전체가 이 하나뿐임.
     사용자 요청(요청 반영): 시스템이 야간(다크) 모드여도 이 화면만은 항상 지금 이 모습(크림 배경 +
     네이비 글자) 그대로 고정 — 그래서 다른 컴포넌트들과 달리 var(--bg)/var(--ink) 같은 테마 변수를
     쓰지 않고 색을 전부 직접 값으로 고정한다(다크 모드에서도 절대 안 바뀜).
     아이콘을 화면 정중앙(top:50%)에 절대배치하는 이유(요청 반영): 홈 화면에 설치한 PWA를 열면, 이
     화면이 뜨기 전에 안드로이드/크롬이 자체적으로 만들어주는 스플래시 화면(매니페스트의 아이콘+
     배경색+테마색만으로 자동 생성됨 — 우리 코드가 그리는 게 아니라 켜고 끌 수 없음)이 먼저 잠깐
     뜨는데, 그 화면은 아이콘을 항상 화면 정중앙에 그림. 예전엔 이 화면의 아이콘이 GROWELL 글자·
     태그라인·점 3개와 함께 세로로 쌓인 블록 전체를 가운데 정렬해서, 아이콘이 화면 정중앙보다 살짝
     위에 있었음 — 그 결과 OS 스플래시(아이콘 정중앙) → 이 화면(아이콘이 위로 살짝 이동)으로 넘어갈
     때 아이콘이 순간 "점프"해 보이는 어색함이 있었음. 아이콘만 절대배치로 항상 화면 정중앙(50%)에
     고정하고, 글자·태그라인·점은 그 아래에 이어 붙여서 아이콘 위치가 두 화면 사이에서 그대로 유지되게
     함 — 안드로이드가 그리는 화면 자체는 우리가 없앨 수 없지만(위 설명대로 시스템 동작), 최소한 아이콘이
     한자리에 머물러 있고 그 아래로 글자만 이어서 나타나는 것처럼 느껴지도록 만든 것. */
  .boot-splash{position:relative; min-height:100vh; padding:24px; text-align:center; background:#F3F1EC; --boot-icon-size:clamp(64px, 17vw, 108px); --boot-icon-gap:clamp(20px, 6vw, 30px);}
  .boot-splash-icon{position:absolute; top:50%; left:50%; width:var(--boot-icon-size); height:auto; display:block; transform:translate(-50%, -50%);}
  .boot-splash-text{position:absolute; top:calc(50% + (var(--boot-icon-size) / 2) + var(--boot-icon-gap)); left:50%; width:100%; max-width:520px; padding:0 24px; transform:translateX(-50%); box-sizing:border-box;}
  .boot-splash-word{font-family:var(--font-body); font-weight:700; font-size:clamp(17px, 4.6vw, 21px); letter-spacing:.24em; color:#1D3A5D; margin-bottom:clamp(14px, 4vw, 18px);}
  .boot-splash-tagline{font-size:clamp(13px, 3.6vw, 14.5px); color:#6B6558; margin-bottom:clamp(28px, 8vw, 38px);}
  .boot-splash-dots{display:flex; align-items:center; justify-content:center; gap:15px; width:fit-content; margin:0 auto;}
  .boot-splash-dots span{width:8px; height:8px; border-radius:50%; background:#C9D4E9; animation:bootDotPulse 1.5s ease-in-out infinite;}
  .boot-splash-dots span:nth-child(1){animation-delay:0s;}
  .boot-splash-dots span:nth-child(2){animation-delay:.2s;}
  .boot-splash-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes bootDotPulse{
    0%,80%,100%{background:#C9D4E9; transform:scale(1);}
    40%{background:#EFB94A; transform:scale(1.3);}
  }
  @media (prefers-reduced-motion: reduce){
    .boot-splash-dots span{animation:none;}
    .boot-splash-dots span:nth-child(2){background:#EFB94A; transform:scale(1.3);}
  }

  /* header */
  .site-header{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .header-inner{display:flex; align-items:center; gap:12px; padding:14px 20px; max-width:920px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.01em; text-decoration:none; white-space:nowrap; flex:none;}
  .brand small{font-family:var(--font-body); font-weight:400; font-size:12px; color:var(--ink-soft);}
  .brand img{display:block; height:34px; width:auto;}
  .primary-nav{display:flex; gap:2px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-left:4px; flex:1; min-width:0; scrollbar-width:none;}
  .primary-nav::-webkit-scrollbar{display:none;}
  .nav-pill{display:inline-flex; align-items:center; gap:5px; padding:7px 10px; border-radius:999px; font-size:13px; border:1px solid transparent; background:transparent; color:var(--ink-soft); text-decoration:none; flex:none; white-space:nowrap;}
  .nav-pill:hover{background:var(--surface-2);}
  .nav-pill.is-active{background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow-sm); font-weight:600;}
  .nav-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--accent-c,var(--primary)); flex:none;}
  .nav-pill svg{width:11px; height:11px; opacity:.6; flex:none;}
  .header-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; flex:none;}
  .icon-btn svg{width:17px; height:17px;}
  .admin-badge{font-size:10px; font-weight:700; letter-spacing:.03em; padding:2px 7px; border-radius:999px; background:var(--primary-soft); color:var(--primary);}
  /* profile menu: header collapses the logged-in name/badge/links into one avatar button so the
     category pills always have room to sit right next to the logo on one line; the details
     (name, 가입자 목록, 로그아웃 등) live in a dropdown that opens on click. */
  .user-menu{position:relative; flex:none;}
  .profile-btn{padding:0; border:none; background:none; border-radius:50%; cursor:pointer; display:flex; flex:none;}
  .profile-btn .avatar{width:34px; height:34px; font-size:13px; box-shadow:0 0 0 1px var(--line);}
  .profile-btn:hover .avatar{box-shadow:0 0 0 2px var(--line-strong);}
  .profile-dropdown{position:absolute; top:calc(100% + 10px); right:0; min-width:196px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); box-shadow:var(--shadow-lg); padding:6px; z-index:50;}
  .profile-dropdown-head{display:flex; align-items:center; gap:10px; padding:8px 10px 10px;}
  .profile-dropdown-head .avatar{width:36px; height:36px; font-size:14px; flex:none;}
  .profile-dropdown-name{display:flex; flex-direction:column; align-items:flex-start; gap:4px; font-size:13.5px; font-weight:700; min-width:0;}
  .profile-dropdown-name span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px;}
  .profile-dropdown-sep{height:1px; background:var(--line); margin:4px 2px;}
  .profile-dropdown-item{display:block; width:100%; text-align:left; padding:9px 10px; border-radius:8px; border:none; background:none; font-size:13px; color:var(--ink); text-decoration:none; cursor:pointer; font-family:var(--font-body);}
  .profile-dropdown-item:hover{background:var(--surface-2);}
  .profile-dropdown-item.is-danger{color:var(--danger);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); font-size:14px; font-weight:600; line-height:1; transition:transform .12s ease;}
  .btn svg{width:15px; height:15px; flex:none;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
  .btn-ghost{border-color:transparent; background:transparent; font-weight:500; color:var(--ink-soft);}
  .btn-danger{color:var(--danger);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.55; pointer-events:none;}

  main{flex:1; padding:36px 0 80px;}
  .footer{border-top:1px solid var(--line); padding:26px 0 40px; color:var(--ink-faint); font-size:12.5px;}
  .footer .wrap{display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:space-between; align-items:center;}

  /* hero (poster-layered: blurred cover collage behind large centered type) */
  .hero{position:relative; min-height:320px; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; border-radius:0 0 var(--r-xl) var(--r-xl); margin-bottom:56px; padding:68px 24px;}
  .hero-bg{position:absolute; inset:0; z-index:0; pointer-events:none;}
  .hero-bg a{position:absolute; display:block; border-radius:16px; overflow:hidden; box-shadow:var(--shadow-lg); filter:blur(1px) saturate(.72) brightness(1.05); opacity:.55; background:var(--surface);}
  .hero-bg a img{display:block; width:100%; height:100%; object-fit:cover;}
  .hero-bg::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--bg) 38%, transparent), color-mix(in srgb, var(--bg) 92%, transparent) 74%);}
  .hero-content{position:relative; z-index:1; max-width:620px;}
  .eyebrow{font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:600;}
  .hero .eyebrow{color:var(--primary); font-weight:700;}
  .hero h1{font-size:clamp(34px,6vw,58px); margin:16px 0 10px; line-height:1.08; letter-spacing:-.01em;}
  .hero h1 .title-break{display:none;}
  .hero .lede{font-size:17px; color:var(--ink-soft); margin:0; line-height:1.6;}
  .hero-rule{width:38px; height:2px; background:var(--primary); opacity:.55; margin:24px auto 0;}

  /* margin-top/bottom only (not shorthand) — a shorthand here would win the cascade over
     .wrap's `margin:0 auto` on any element carrying both classes (same specificity, later rule
     wins) and silently cancel the centering, leaving the section flush against the left edge
     on any screen wider than the 920px wrap. */
  .section{margin-top:64px; margin-bottom:64px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:22px;}
  .section-head h2{font-size:26px; letter-spacing:-.01em;}
  .section-sub{color:var(--ink-soft); font-size:14.5px; margin-top:4px; max-width:60ch;}

  .why-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .why-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:26px 24px; box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, transform .15s ease;}
  .why-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-3px);}
  .why-card .num{width:34px; height:34px; border-radius:50%; background:var(--primary-soft); color:var(--primary); font-family:var(--font-mono); font-size:13px; display:flex; align-items:center; justify-content:center; font-weight:600; margin-bottom:16px;}
  .why-card h3{font-size:16.5px; margin-bottom:8px;}
  .why-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}

  .flow-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .flow-card{border-radius:var(--r-lg); padding:22px 20px; background:var(--surface-2);}
  .flow-card .min{font-family:var(--font-mono); font-size:28px; font-weight:600;}
  .flow-card .min span{font-size:12px; font-weight:500; margin-left:2px;}
  .flow-card h4{font-size:14px; margin:10px 0 5px;}
  .flow-card p{font-size:12px; color:var(--ink-soft); line-height:1.55;}

  /* journey grid of 4 books on home — curated, cover-forward cards.
     주의: .tl-item은 flex 행이라 align-items를 stretch로 두면 자식(.tl-cover)이 옆의 텍스트
     블록(.tl-body) 높이만큼 늘어나 버리는데, 그 늘어난 세로 길이에 맞춰 object-fit:cover가
     이미지를 훨씬 더 세게(좌우로) 잘라내는 바람에 표지 위 글자가 잘려 보이는 문제가 있었음
     (텍스트가 길수록 더 심하게 잘림 — 실사용 리포트로 발견). align-items를 flex-start로 바꾸고
     이미지는 height:auto + aspect-ratio로 스스로 3:4.4 비율을 지키게 해서, 표지가 항상 같은
     비율로만(원본과 큰 차이 없는 아주 적은 크롭만) 보이도록 고침. */
  .timeline{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  .tl-item{display:flex; gap:16px; align-items:flex-start; padding:16px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line); text-decoration:none; color:inherit; box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, transform .15s ease;}
  .tl-item:hover{box-shadow:var(--shadow-lg); transform:translateY(-3px);}
  .tl-cover{position:relative; flex:none; width:92px; border-radius:var(--r-sm); overflow:hidden; box-shadow:var(--shadow-sm);}
  .tl-cover img{display:block; width:100%; height:auto; aspect-ratio:3/4.4; object-fit:cover;}
  .tl-num{position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; font-weight:700; background:rgba(255,255,255,.92); color:var(--accent-ink);}
  .tl-body{flex:1; min-width:0; display:flex; flex-direction:column;}
  .tl-months{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); white-space:nowrap;}
  .tl-body h3{font-size:16.5px; margin:4px 0 3px; line-height:1.3;}
  .tl-body .tl-tagline{font-size:12px; color:var(--accent-c); font-weight:600; margin-bottom:6px;}
  .tl-body p.tl-desc{font-size:12.5px; color:var(--ink-soft);}
  .tl-status{margin-top:auto; padding-top:10px;}
  .status-pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:5px 10px; border-radius:999px; font-weight:600; white-space:nowrap;}
  .status-pill svg{width:11px; height:11px;}
  .status-active{background:var(--accent-c); color:var(--surface);}
  .status-upcoming{background:var(--surface-2); color:var(--ink-faint);}
  .status-locked{background:var(--surface-2); color:var(--ink-faint);}
  .status-preview{background:var(--primary-soft); color:var(--primary);}
  .tl-item:hover .tl-body h3{text-decoration:underline; text-underline-offset:3px;}
  .tl-cover.is-locked img{filter:grayscale(65%) brightness(.55);}
  .tl-lock-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff;}
  .tl-lock-overlay svg{width:20px; height:20px;}

  /* home: 모임 안내 — 원래 레이아웃(아이콘이 자기 줄에, 라벨은 그 아래)으로 복귀.
     바뀐 부분: 아이콘 줄 오른쪽 끝에 "몇 번째 모임" 배지를 배치(카드1 전용, 아이콘과 같은 줄). */
  .announce-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  .announce-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; box-shadow:var(--shadow-sm); --accent-soft:var(--primary-soft); --accent-ink:var(--primary);}
  .announce-icon-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .announce-icon{width:38px; height:38px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none;}
  .announce-icon svg{width:18px; height:18px;}
  .announce-label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .announce-meeting-badge{flex:none; font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:var(--accent-c, var(--primary)); background:var(--surface-2); padding:3px 9px; border-radius:999px;}
  /* "모임 안내" 섹션 제목 오른쪽에 책 캡션 + (관리자면) 편집 버튼을 함께 담는 자리.
     .section-sub와 같은 기존 캡션 스타일을 그대로 쓰되(색·크기 동일), 아주 긴 제목이 와도
     둘째 줄로 밀리지 않도록 nowrap+ellipsis만 추가 — 모바일에서는 아래 media query에서
     폭 100%를 줘야 실제로 줄어들 공간이 생겨 ellipsis가 의미를 가진다. */
  .announce-head-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-width:0;}
  .section-sub-book{color:var(--ink-soft); font-size:14.5px; min-width:0; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .section-sub-book b{font-weight:600; color:var(--ink-soft);}
  /* 날짜/시간/장소, 챕터/범위/제목 — 두 카드 모두 라벨+값 3줄 구조라 항상 저절로 높이가
     맞는다(예전엔 카드마다 줄 수가 달라서 폰트 크기를 역산해 맞췄었음, 이제 불필요).
     라벨만 부드러운 하이라이트 마커로 감싸고 값은 같은 글자 크기의 일반 글자로 둬서 — 라벨 3개가
     한꺼번에 다 강조돼 보이지 않으면서도 "날짜인지 값인지" 한눈에 읽히게 균형을 잡았다. */
  .announce-rows{display:grid; grid-template-columns:auto 1fr; align-items:baseline; column-gap:15px; row-gap:13px;}
  .announce-row-label mark{
    display:inline-block; font-size:18px; font-weight:700; line-height:1.3; color:var(--accent-ink);
    background-color:var(--accent-soft);
    background-image:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.65) 48%, transparent 66%);
    background-repeat:no-repeat; background-size:220% 100%; background-position:-60% 0;
    padding:4px 11px 6px; border-radius:4px 13px 4px 13px;
    animation:announceMarkShine 4.6s ease-in-out infinite;
  }
  /* 하이라이트가 은은하게 한 번씩 "흐르듯" 지나가되(요청 반영), 대부분의 시간은 가만히 있어서
     화면 전체가 계속 반짝이는 산만한 느낌은 나지 않도록 — 4.6초 중 대부분을 멈춰 있다가 짧게 훑고
     지나간다. 저모션 설정에서는 아예 끈다. */
  @keyframes announceMarkShine{ 0%,70%,100%{background-position:-60% 0;} 86%{background-position:160% 0;} }
  @media (prefers-reduced-motion: reduce){ .announce-row-label mark{animation:none;} }
  .announce-row-value{font-size:18px; font-weight:500; color:var(--ink); line-height:1.35; word-break:keep-all;}
  .announce-row-value.is-empty{color:var(--ink-faint); font-weight:400;}
  .announce-note{font-size:12.5px; color:var(--ink-faint); margin-top:12px; line-height:1.6;}
  .announce-edit{padding:22px 24px; border-radius:var(--r-lg);}
  .announce-edit select{width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg); padding:11px 13px; margin-top:0;}

  .contact-card{position:relative; overflow:hidden; background:linear-gradient(135deg, var(--primary), var(--thought-ink) 130%); border-radius:var(--r-xl); padding:38px 34px; display:flex; justify-content:space-between; gap:20px; align-items:center; flex-wrap:wrap; color:var(--primary-ink); box-shadow:var(--shadow-lg);}
  .contact-card::after{content:""; position:absolute; top:-60px; right:-40px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.12); pointer-events:none;}
  .contact-card .who{font-size:13.5px; opacity:.88; position:relative; z-index:1;}
  .contact-card .who strong{color:inherit; font-size:19px; display:block; margin-bottom:4px; font-family:var(--font-display);}
  .contact-card .num{font-family:var(--font-mono); font-size:19px; font-weight:600; position:relative; z-index:1;}

  /* book page */
  .book-banner{border-radius:var(--r-xl); padding:32px; background:var(--accent-soft); position:relative; overflow:hidden; margin-bottom:26px; box-shadow:var(--shadow-sm);}
  .book-banner-inner{display:flex; gap:26px; align-items:flex-start;}
  .book-banner-cover{flex:none; width:120px; border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-lg);}
  .book-banner-cover img{display:block; width:100%; aspect-ratio:3/4.4; object-fit:cover;}
  .book-banner-text{flex:1; min-width:0;}
  .book-banner .eyebrow{color:var(--accent-ink);}
  .book-banner h1{font-size:clamp(24px,4vw,34px); margin:8px 0 10px; color:var(--accent-ink);}
  .book-banner .byline{font-size:13.5px; color:var(--accent-ink); opacity:.82; margin-bottom:16px;}
  .book-banner .concept-tag{display:inline-block; font-size:11.5px; font-weight:600; background:rgba(255,255,255,.5); color:var(--accent-ink); padding:5px 10px; border-radius:999px; margin-bottom:16px;}
  .book-summary{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-width:64ch;}
  .book-summary li{font-size:13.5px; color:var(--accent-ink); opacity:.92; padding-left:16px; position:relative;}
  .book-summary li::before{content:""; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background:currentColor;}

  /* compact mobile-only heading shown instead of the full book-banner, so the tabs stay reachable without scrolling */
  .book-mobile-title{display:none;}

  .book-tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:26px; overflow-x:auto;}
  .book-tab{padding:12px 6px; margin-right:20px; font-size:14.5px; font-weight:600; color:var(--ink-faint); background:none; border:none; border-bottom:2px solid transparent; white-space:nowrap;}
  .book-tab.is-active{color:var(--ink); border-color:var(--accent-c);}

  .gate{background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--r-lg); padding:36px 28px; text-align:center; max-width:440px; margin:20px auto;}
  .gate svg{width:28px; height:28px; color:var(--ink-faint); margin-bottom:14px;}
  .gate h3{font-size:17px; margin-bottom:8px;}
  .gate p{font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;}
  .lock-gate{margin:20px 0 26px; max-width:none;}

  .admin-panel{padding:16px 18px; margin-bottom:20px; border-radius:var(--r-md); background:var(--primary-soft); border-color:transparent;}
  .admin-panel-head{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:10px;}
  .admin-panel-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .admin-panel-row input{flex:1; min-width:180px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); padding:8px 11px; font-size:12.5px;}

  .admin-user-list{padding:4px 20px;}
  .admin-user-row{display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
  .admin-user-row:last-child{border-bottom:none;}
  .admin-user-body{flex:1; min-width:0;}
  .admin-user-top{display:flex; align-items:center; gap:8px;}
  .admin-user-name{font-size:14px; font-weight:700;}
  .admin-user-meta{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-sm);}
  .composer{padding:22px 24px; margin-bottom:22px; border-radius:var(--r-lg);}
  .composer-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .composer h3{font-size:16px;}
  .composer-close{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:none;}
  .composer-close svg{width:14px; height:14px;}
  .composer-close:hover{color:var(--danger);}

  /* collapsed composer trigger */
  .share-cta{display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px; margin-bottom:22px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm); text-align:left; transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;}
  .share-cta:hover{box-shadow:var(--shadow-lg); transform:translateY(-2px); border-color:var(--accent-c, var(--primary));}
  .share-cta-icon{width:40px; height:40px; border-radius:50%; background:var(--accent-soft, var(--primary-soft)); color:var(--accent-ink, var(--primary)); display:flex; align-items:center; justify-content:center; flex:none;}
  .share-cta-icon svg{width:19px; height:19px;}
  .share-cta-text{flex:1; display:flex; flex-direction:column; gap:2px;}
  .share-cta-text strong{font-size:15px; font-family:var(--font-display); font-weight:600;}
  .share-cta-text small{font-size:12.5px; color:var(--ink-faint);}
  .share-cta-plus{width:30px; height:30px; border-radius:50%; background:var(--accent-c, var(--primary)); color:var(--surface); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:400; flex:none;}
  textarea{width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg); padding:12px 14px; resize:vertical; min-height:88px; line-height:1.6; overflow-wrap:break-word; word-break:break-word;}
  textarea:focus{border-color:var(--accent-c, var(--primary));}
  input[type=text],input[type=password]{width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg); padding:11px 13px;}
  label.field-label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:14px 0 6px;}
  label.field-label:first-child{margin-top:0;}
  .composer-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap;}
  .hint{font-size:12px; color:var(--ink-faint);}
  .err-msg{font-size:12.5px; color:var(--danger); margin-top:8px;}

  /* note meta: type pills + page */
  .note-meta{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .nt-set{display:flex; gap:6px; flex-wrap:wrap;}
  .nt-pill{display:inline-flex; align-items:center; gap:5px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font-size:12px; font-weight:600; color:var(--ink-soft);}
  .nt-pill svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .nt-pill.is-sel{border-color:transparent;}
  .nt-pill[data-nt="quote"].is-sel{background:var(--nt-quote-soft); color:var(--nt-quote-ink);}
  .nt-pill[data-nt="summary"].is-sel{background:var(--nt-summary-soft); color:var(--nt-summary-ink);}
  .nt-pill[data-nt="thought"].is-sel{background:var(--nt-thought-soft); color:var(--nt-thought-ink);}
  .nt-pill[data-nt="question"].is-sel{background:var(--nt-question-soft); color:var(--nt-question-ink);}
  /* "통찰 정리"(나눔 공간 전용 특수 노트 타입) 선택 pill 색 — 이전엔 이 규칙이 빠져 있어서
     선택해도 다른 카테고리와 달리 색이 안 입혀졌다(요청 반영: "다른 카테고리와 다른 색으로").
     이미 통찰 정리 배지(.note-badge.nt-insight)·상세보기 제목 밑줄 등에 쓰던 것과 같은
     --nt-insight-* 톤(로즈핑크)을 그대로 써서, 나눔 공간 안에서는 이 pill만 유일하게 이
     색을 쓰게 된다(같은 톤을 쓰는 자료실 "추천영상" pill은 완전히 다른 화면이라 겹칠 일 없음). */
  .nt-pill[data-nt="insight"].is-sel{background:var(--nt-insight-soft); color:var(--nt-insight-ink);}
  /* 자료실 전용 카테고리 pill — 종류마다 고유 색으로 선택 표시(아래 .mat-cat-* 색과 통일) */
  .nt-pill[data-nt="deepen"].is-sel{background:var(--nt-question-soft); color:var(--nt-question-ink);}
  .nt-pill[data-nt="video"].is-sel{background:var(--nt-insight-soft); color:var(--nt-insight-ink);}
  .nt-pill[data-nt="guide"].is-sel{background:var(--nt-summary-soft); color:var(--nt-summary-ink);}
  .nt-pill[data-nt="meeting"].is-sel{background:var(--nt-quote-soft); color:var(--nt-quote-ink);}
  .nt-pill[data-nt="article"].is-sel{background:var(--nt-thought-soft); color:var(--nt-thought-ink);}
  /* 자료실 카테고리 색 — 하이라이트(배경) 없이 글자 색으로만 구분한다 */
  .mat-cat-tag{display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:.01em;}
  .mat-cat-deepen{color:var(--nt-question-ink);}
  .mat-cat-video{color:var(--nt-insight-ink);}
  .mat-cat-guide{color:var(--nt-summary-ink);}
  .mat-cat-meeting{color:var(--nt-quote-ink);}
  .mat-cat-article{color:var(--nt-thought-ink);}
  .page-field{display:flex; align-items:center; gap:6px; padding:5px 6px 5px 13px; border-radius:999px; background:var(--surface-2);}
  .page-field label{font-size:12px; color:var(--ink-faint); font-weight:600;}
  .page-field input{width:52px; border:none; background:var(--surface); border-radius:999px; padding:5px 10px; font-size:12.5px; text-align:center;}

  .note-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px;}
  .note-badge svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.9;}
  .note-badge.nt-quote{background:var(--nt-quote-soft); color:var(--nt-quote-ink);}
  .note-badge.nt-summary{background:var(--nt-summary-soft); color:var(--nt-summary-ink);}
  .note-badge.nt-thought{background:var(--nt-thought-soft); color:var(--nt-thought-ink);}
  .note-badge.nt-question{background:var(--nt-question-soft); color:var(--nt-question-ink);}
  .note-badge.nt-insight{background:var(--nt-insight-soft); color:var(--nt-insight-ink);}
  .page-badge{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); background:var(--surface-2); padding:4px 8px; border-radius:999px;}

  /* rich toolbar + editor */
  .rt-toolbar{display:flex; align-items:center; gap:2px; overflow-x:auto; padding:4px 2px 8px; margin-bottom:2px; -webkit-overflow-scrolling:touch;}
  .rt-toolbar::-webkit-scrollbar{display:none;}
  .rt-sep{width:1px; align-self:stretch; margin:4px 4px; background:var(--line); flex:none;}
  .rt-btn{flex:none; width:32px; height:32px; border-radius:8px; border:none; background:none; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;}
  .rt-btn:hover{background:var(--surface-2);}
  .rt-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .rt-btn.rt-i{font-style:italic; font-family:serif;}
  .rt-btn.rt-u{text-decoration:underline;}
  .rt-btn.rt-s{text-decoration:line-through;}
  .rt-btn.is-active{color:#262319; box-shadow:inset 0 0 0 1px var(--line-strong);}
  .hl-swatches{display:flex; align-items:center; gap:7px; padding:0 2px 10px;}
  .hl-swatch{width:19px; height:19px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer;}
  .hl-swatch.is-sel{border-color:var(--ink);}
  .bg-color-row{display:flex; align-items:center; gap:10px; margin:14px 0 4px; flex-wrap:wrap;}
  .bg-color-label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .bg-swatches{display:flex; align-items:center; gap:7px;}
  .bg-swatch{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); padding:0; cursor:pointer;}
  .bg-swatch.is-sel{border-color:var(--accent-c, var(--primary)); box-shadow:0 0 0 1px var(--accent-c, var(--primary));}
  .font-size-row{display:flex; align-items:center; gap:10px; margin:10px 0 4px; flex-wrap:wrap;}
  .font-size-label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .font-size-set{display:flex; align-items:center; gap:6px;}
  .font-size-btn{min-width:34px; height:30px; padding:0 8px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700; line-height:1; color:var(--ink-soft);}
  .font-size-btn.is-sel{border-color:var(--accent-c, var(--primary)); color:var(--accent-c, var(--primary)); background:var(--accent-soft, var(--surface-2));}
  /* 상세보기의 작성 글 본문(.post-text)에 붙는 글자 크기 클래스 — 클래스 선택자 1개짜리라
     3열 그리드 타일 전용 규칙(.feed-tile ... .post-text, 클래스 3개)보다 우선순위가 낮아,
     타일 안에서는 이 크기 지정이 자동으로 무시되고 항상 타일 고정 크기가 적용된다. */
  .post-text.fs-sm{font-size:12.5px;}
  .post-text.fs-lg{font-size:17px;}
  .post-text.fs-xl{font-size:20px;}
  .mat-detail-text.fs-sm{font-size:12.5px;}
  .mat-detail-text.fs-lg{font-size:17.5px;}
  .mat-detail-text.fs-xl{font-size:20.5px;}
  .title-field{margin:2px 0 12px;}
  .title-field input{width:100%; border:none; border-bottom:1.5px solid var(--line); background:transparent; font-size:17px; font-weight:700; padding:6px 2px; color:var(--ink); font-family:inherit;}
  .title-field input:focus{outline:none; border-bottom-color:var(--accent-c, var(--primary));}
  .title-field input::placeholder{color:var(--ink-faint); font-weight:600;}
  /* 글 제목 — 상세보기에서는 본문 위에 붙는 굵은 소제목, 사진 없는 글의 3열 그리드 표지에서는
     본문 미리보기 대신 제목만 가운데 정렬로 보여준다(요청: "제목만 표지에는 나오고 누르면
     글을 볼 수 있게"). 클래스 4개짜리 셀렉터라 기존 .feed-tile .post-media-text .post-text
     (클래스 3개) 규칙보다 우선순위가 항상 높아, 제목이 있을 때만 타일 안 본문 미리보기를
     가려도 다른 CSS 순서에 상관없이 안전하다. 사진이 있는 글은 표지에서 계속 사진 그대로
     보인다 — mediaHtml이 사진일 땐 애초에 제목을 타일에 넣지 않기 때문(noteBodyHtml 참고). */
  .post-title-cover{font-weight:700; font-size:15.5px; line-height:1.4; margin:0 0 6px; color:var(--ink); word-break:break-word;}
  .feed-tile .post-media-text.has-title{display:flex; align-items:center; justify-content:center; text-align:center; padding:14px 12px;}
  .feed-tile .post-media-text.has-title .post-text{display:none;}
  .feed-tile .post-title-cover{font-size:13.5px; font-weight:800; margin:0; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;}
  .mat-detail-title{font-size:19px; padding:18px 22px 0;}
  /* 나눔 공간/나의 공간/자료실 글쓰기 칸은 카드(--surface, 흰색)와 같은 색으로 채워서
     "그냥 흰 칸"으로 보이게 한다 — 이전엔 페이지 배경색(--bg, 크림색)을 그대로 써서
     카드 안에 색이 다른 상자가 하나 더 있는 것처럼 보였음(35번 라운드 다음 요청). */
  /* overflow-wrap/word-break: 공백 없이 아주 길게 이어지는 한 덩어리 글자(예: 자모를 계속
     반복해서 입력한 경우, 긴 URL 등)는 줄바꿈 지점이 없어 기본값(white-space:pre-wrap)만으로는
     박스 안에서 줄이 내려가지 않고 옆으로 계속 넘쳐흐른다("글이 아래로 안 내려간다" 리포트,
     38번 라운드) — 글을 쓰는 칸과 이미 쓴 글을 보여주는 칸 양쪽 모두에 강제 줄바꿈을 걸어,
     그런 글자도 항상 박스 폭 안에서 다음 줄로 내려가도록 한다. */
  .insight-input{min-height:76px; background:var(--surface); overflow-wrap:break-word; word-break:break-word;}
  .note-editor{min-height:110px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); padding:12px 14px; line-height:1.75; font-size:14.5px; overflow-wrap:break-word; word-break:break-word;}
  .note-editor:focus{border-color:var(--accent-c, var(--primary)); outline:none;}
  .note-editor:empty:before{content:attr(data-placeholder); color:var(--ink-faint);}
  .note-editor ul,.note-editor ol{padding-left:1.3em; margin:6px 0;}
  .note-editor blockquote{border-left:3px solid var(--line-strong); margin:8px 0; padding:2px 0 2px 12px; color:var(--ink-soft); font-style:italic;}
  .note-editor pre,.note-editor code{font-family:var(--font-mono); background:var(--surface-2); border-radius:6px;}
  .note-editor pre{padding:10px 12px; margin:6px 0; white-space:pre-wrap; font-size:12.5px;}
  .rich-content ul,.rich-content ol{padding-left:1.3em; margin:6px 0;}
  .rich-content blockquote{border-left:3px solid var(--line-strong); margin:8px 0; padding:2px 0 2px 12px; color:var(--ink-soft); font-style:italic;}
  .rich-content pre,.rich-content code{font-family:var(--font-mono); background:var(--surface-2); border-radius:6px;}
  .rich-content pre{padding:10px 12px; margin:6px 0; white-space:pre-wrap; font-size:13px;}

  .photo-attach{display:flex; align-items:center; gap:10px; margin:10px 0 4px; flex-wrap:wrap;}
  .photo-attach .thumb{position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
  .photo-attach .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-attach .thumb button{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none; font-size:11px; line-height:1;}

  /* weather / checkin */
  .checkin-q{font-size:13.5px; font-weight:600; margin-bottom:10px;}
  .checkin-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(74px,1fr)); gap:8px; margin-bottom:4px;}
  .checkin-opt{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 10px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--bg);}
  .checkin-opt svg{width:26px; height:26px; stroke:var(--ink-soft); fill:none; stroke-width:1.6;}
  .checkin-opt span{font-size:11.5px; color:var(--ink-soft);}
  .checkin-opt.is-sel{border-color:var(--accent-c); background:var(--accent-soft);}
  .checkin-opt.is-sel svg{stroke:var(--accent-ink);}
  .checkin-opt.is-sel span{color:var(--accent-ink); font-weight:700;}

  .tempo-bars{display:flex; align-items:flex-end; gap:3px; height:26px;}
  .tempo-bars i{display:block; width:4px; border-radius:2px; background:currentColor;}

  .gauge-wrap{margin-bottom:6px;}
  .gauge-quick{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .gauge-quick button{padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font-size:12px;}
  .gauge-quick button.is-sel{background:var(--accent-c); border-color:var(--accent-c); color:var(--surface); font-weight:700;}
  input[type=range]{width:100%; accent-color:var(--accent-c, var(--primary));}
  .gauge-val{font-family:var(--font-mono); font-size:22px; font-weight:600; color:var(--accent-ink);}

  .bodypick{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px;}
  .bodypick button{padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font-size:12.5px;}
  .bodypick button.is-sel{background:var(--accent-c); border-color:var(--accent-c); color:var(--surface); font-weight:700;}

  /* feed */
  .feed-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .feed-count{font-size:12.5px; color:var(--ink-faint); white-space:nowrap;}
  .feed-count strong{color:var(--ink); font-weight:700;}
  .feed-filters{display:flex; gap:6px; flex-wrap:wrap;}
  .feed-filter{padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:12px; font-weight:600; color:var(--ink-soft);}
  .feed-filter.is-sel{border-color:transparent;}
  .feed-filter[data-filter="all"].is-sel{background:var(--ink); color:var(--bg);}
  .feed-filter[data-filter="quote"].is-sel{background:var(--nt-quote-soft); color:var(--nt-quote-ink);}
  .feed-filter[data-filter="summary"].is-sel{background:var(--nt-summary-soft); color:var(--nt-summary-ink);}
  .feed-filter[data-filter="thought"].is-sel{background:var(--nt-thought-soft); color:var(--nt-thought-ink);}
  .feed-filter[data-filter="question"].is-sel{background:var(--nt-question-soft); color:var(--nt-question-ink);}
  /* 자료실 상단 카테고리 필터 pill — 같은 .feed-filter를 재사용, 색은 .mat-cat-*과 통일 */
  .feed-filter[data-filter="deepen"].is-sel{background:var(--nt-question-soft); color:var(--nt-question-ink);}
  .feed-filter[data-filter="video"].is-sel{background:var(--nt-insight-soft); color:var(--nt-insight-ink);}
  .feed-filter[data-filter="guide"].is-sel{background:var(--nt-summary-soft); color:var(--nt-summary-ink);}
  .feed-filter[data-filter="meeting"].is-sel{background:var(--nt-quote-soft); color:var(--nt-quote-ink);}
  .feed-filter[data-filter="article"].is-sel{background:var(--nt-thought-soft); color:var(--nt-thought-ink);}
  .feed{display:flex; flex-direction:column; gap:14px;}
  .empty{padding:34px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px; border:1px dashed var(--line); border-radius:var(--r-md);}
  .feed{max-width:460px; margin-left:auto; margin-right:auto;}
  .post{padding:0; border-radius:var(--r-lg); position:relative; overflow:hidden;}
  .post-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px 10px; flex-wrap:wrap;}
  .post-who{display:flex; align-items:center; gap:9px; min-width:0;}
  .post-who-text{display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden;}
  .avatar{width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; font-family:var(--font-display); flex:none; overflow:hidden;}
  .avatar-img{background:var(--surface-2);}
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .post-name{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .post-time{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); white-space:nowrap; flex:none;}
  .post-checkin{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:4px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink); font-weight:600; flex:none;}
  .post-checkin svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .post-head-side{display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:none;}
  /* 상세보기에서는 사진을 억지로 자르지 않고 업로드한 그대로(원본 비율)를 보여준다 —
     정사각형이면 정사각형 그대로, 가로로 긴 사진이면 가로로 긴 채로. 폭만 카드에 맞추고
     높이는 비율에 맞춰 자연스럽게 정해진다(height:auto, object-fit 없음 — 크롭 자체가 없음).
     3열 그리드 타일(.feed-tile)만은 칸을 가지런히 맞춰야 해서 아래 .feed-tile .post-media에서
     정사각형 크롭을 별도로 되살린다(그리드에서만 크롭, 상세보기는 항상 원본 그대로). */
  .post-media{width:100%; background:var(--surface-2); overflow:hidden;}
  .post-media img{width:100%; height:auto; display:block;}
  .post-media-text{display:flex; flex-direction:column; padding:16px; overflow-y:auto;}
  .post-media-text .post-text{flex:1;}
  .post-body{padding:14px 16px 6px;}
  /* 자료실 상세보기 — 나눔/나의 공간의 정사각형 카드형(.post-media, 고정 비율+베이지 배경)과
     달리, 자료를 편하게 읽는 게시판/블로그 느낌으로 흰 배경에 넓게 펼쳐 보여준다(요청 반영).
     사진은 잘라내지 않고 원래 비율 그대로, 글은 자연스럽게 흘러가는 본문으로 렌더한다. */
  .feed.mat-detail-feed{max-width:720px;}
  .mat-detail-photo-wrap{width:100%; background:var(--surface-2);}
  .mat-detail-photo{width:100%; height:auto; display:block;}
  .mat-detail-text{padding:18px 22px 8px; font-size:15px; line-height:1.85; overflow-wrap:break-word; word-break:break-word;}
  .post-badges{display:flex; gap:6px; flex-wrap:nowrap;}
  .post-text{font-size:14.5px; line-height:1.75; white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word;}
  .post-del,.post-edit{font-size:11.5px; color:var(--ink-faint); background:none; border:none; padding:2px; display:flex; align-items:center;}
  .post-del svg,.post-edit svg{width:15px; height:15px;}
  .post-del:hover{color:var(--danger);}
  .post-edit:hover{color:var(--primary);}
  /* 38번 라운드: 통찰 정리 카드를 그라데이션 배경(선택 가능)을 감싼 카드 형태로 "세련되게"
     다시 꾸몄다 — 둥근 모서리 + 여유 있는 안쪽 여백을 주고, 제목은 사이트 헤딩에 쓰는
     세리프(--font-display, Hahmlet)로 크게 얹어서 일반 텍스트 글과는 다른 느낌을 준다. */
  .insight-body{padding:20px 20px 18px; display:flex; flex-direction:column; gap:14px; border-radius:var(--r-lg); transition:background .2s;}
  .insight-title{font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:-.01em; margin:0 0 2px; position:relative; padding-bottom:11px;}
  .insight-title:after{content:''; position:absolute; left:0; bottom:0; width:36px; height:3px; border-radius:999px; background:var(--nt-insight-ink);}
  .insight-qa-label{display:block; font-family:var(--font-display); font-size:11.5px; font-weight:700; color:var(--nt-insight-ink); letter-spacing:.03em; margin-bottom:4px;}
  .insight-qa-text{font-size:14.5px; line-height:1.75; white-space:pre-wrap; margin:0; overflow-wrap:break-word; word-break:break-word;}
  /* 어두운 그라데이션(미드나잇)을 고르면 카드 전체 글자색을 밝게 바꾼다 — 제목 밑줄과
     질문 라벨은 그 배경과 잘 어울리는 따뜻한 금색으로 별도 지정. */
  .insight-body.is-dark{color:#F3F1EC;}
  .insight-body.is-dark .insight-qa-label{color:#F0D9A8;}
  .insight-body.is-dark .insight-title:after{background:#F0D9A8;}
  /* "몇 번째 모임" 배지 — 댓글 표시와 같은 줄, 왼쪽에. 하이라이트 없이 댓글 표시(--ink-soft)보다
     살짝 진한 잉크색(--ink)만 쓰고 배경/굵기 없이 은은하게 둔다. */
  .insight-meeting-badge{display:inline-flex; align-items:center; font-size:12.5px; font-weight:600; color:var(--ink); background:none; padding:0; letter-spacing:.01em;}
  .feed-tile .insight-meeting-badge{font-size:10px; font-weight:600;}
  /* 통찰 정리 타일 미리보기 — 이제 제목만 보여준다(요청 반영: "타이틀만 나오게, 내용은
     클릭해서 볼 수 있게") — 사진 없는 일반 글의 제목-전용 표지(.post-media-text.has-title +
     .post-title-cover)와 같은 중앙 정렬 레이아웃을 그대로 쓰고, 세리프 글꼴만 얹어 통찰
     정리만의 느낌을 살짝 남긴다. 카드 배경(그라데이션)도 타일에 그대로 이어서 상세보기와
     같은 느낌을 준다. */
  .insight-tile-media{border-radius:var(--r-sm);}
  .insight-tile-title{font-family:var(--font-display); line-height:1.5;}
  /* "N번째"를 첫 줄에 살짝 작게·연하게, "통찰노트"는 둘째 줄에서 도드라지게 — 두 줄로 나뉜
     제목이 위아래 위계가 있어 보이도록 한다(요청 반영: "~번째 쓰면 아래줄로 내려서 통찰노트"). */
  .insight-tile-title-num{display:inline-block; font-size:.82em; font-weight:600; opacity:.72; letter-spacing:.01em;}
  .insight-tile-media.is-dark{color:#F3F1EC;}
  /* 통찰 정리의 그라데이션 배경 스와치는 일반 배경색 스와치보다 살짝 크게 그려서 그라데이션이
     한눈에 잘 드러나 보이게 했다. */
  .insight-bg-row .bg-swatch{width:26px; height:26px;}

  /* post footer actions + comments (instagram-feed feel) */
  .post-actions{padding:6px 16px 14px; display:flex; align-items:center; gap:14px;}
  .post-comment-toggle{display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:4px 0; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .post-comment-toggle svg{width:17px; height:17px;}
  .post-comment-toggle.is-open{color:var(--accent-c, var(--primary));}
  .comment-thread{border-top:1px solid var(--line); padding:12px 16px 16px; background:var(--surface-2);}
  .comment-item{padding:8px 0; border-bottom:1px solid var(--line);}
  .comment-item:last-of-type{border-bottom:none;}
  .comment-row{display:flex; align-items:center; gap:8px;}
  .comment-name{font-size:12.5px; font-weight:700;}
  .comment-time{font-size:10.5px; color:var(--ink-faint); flex:1;}
  .comment-del{background:none; border:none; color:var(--ink-faint); padding:2px; display:flex;}
  .comment-del svg{width:13px; height:13px;}
  .comment-del:hover{color:var(--danger);}
  .comment-text{font-size:13px; line-height:1.6; margin-top:2px; white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word;}
  .comment-empty{font-size:12px; color:var(--ink-faint); padding:4px 0 10px;}
  .comment-input-row{display:flex; gap:8px; margin-top:10px;}
  .comment-input-row input{flex:1; border:1px solid var(--line); border-radius:999px; background:var(--surface); padding:9px 14px; font-size:12.5px;}

  /* feed search (나눔/나의 공간) */
  .feed-search{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:9px 14px; margin-bottom:16px;}
  .feed-search svg{width:15px; height:15px; color:var(--ink-faint); flex:none;}
  .feed-search input{flex:1; min-width:0; border:none; background:none; font-size:13.5px; padding:0; outline:none; color:var(--ink);}
  .feed-search input::placeholder{color:var(--ink-faint);}

  /* feed grid (3-up thumbnails; click a tile to open the full post) */
  .feed-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px;}
  .feed-tile{display:flex; flex-direction:column; overflow:hidden; text-decoration:none; color:inherit; transition:transform .15s ease, box-shadow .15s ease;}
  .feed-tile:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
  .feed-tile .post-media{aspect-ratio:1/1;}
  .feed-tile .post-media img{height:100%; object-fit:cover;}
  .feed-tile .post-media-text{padding:9px; overflow:hidden;}
  .feed-tile .post-media-text .post-text{font-size:11px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden;}
  .feed-tile .note-badge{font-size:9.5px; padding:3px 6px;}
  .feed-tile .page-badge{font-size:9px; padding:3px 6px;}
  .feed-tile-head{display:flex; align-items:center; gap:5px; padding:7px 9px; min-width:0;}
  .feed-tile-head:empty{display:none;}
  .feed-tile-head .avatar{width:18px; height:18px; font-size:8.5px;}
  .feed-tile-head .post-badges{flex:none; gap:4px;}
  .feed-tile-head .note-badge-label{display:none;}
  .feed-tile-foot{display:flex; align-items:center; justify-content:flex-start; gap:8px; padding:5px 9px 7px;}
  .feed-tile-name{font-size:11px; font-weight:600; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
  .feed-tile-count{display:inline-flex; align-items:center; gap:3px; font-size:10.5px; color:var(--ink-faint); flex:none;}
  .feed-tile-count svg{width:11px; height:11px;}
  .feed-tile .tile-loading{display:flex; align-items:center; justify-content:center; height:100%; font-size:10.5px; color:var(--ink-faint);}
  .feed-empty-search{margin-top:14px;}

  /* single-post detail view (opened from the grid) */
  .post-detail-back{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:var(--ink-soft); text-decoration:none; padding:6px 2px; margin-bottom:14px;}
  .post-detail-back svg{width:15px; height:15px;}
  .post-detail-back:hover{color:var(--ink);}

  /* worksheet — 우선 제목만 읽기 쉽게 한 줄로 보여주고, 눌러야 설명/입력/멤버 기록이 펼쳐짐 */
  .ws-list{display:flex; flex-direction:column; gap:12px;}
  .ws-activity{padding:0; margin-bottom:0; overflow:hidden;}
  .ws-row-title-btn{width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; padding:17px 18px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left; font-family:var(--font-body);}
  .ws-row-title-btn:hover{color:var(--accent-c, var(--primary));}
  .ws-row-title-text{flex:1; min-width:0;}
  .ws-row-body{max-height:0; overflow:hidden; transition:max-height .3s ease; border-top:0 solid transparent; padding:0 18px;}
  .ws-row-body.is-open{max-height:5000px; border-top:1px solid var(--line); padding:16px 18px 20px;}
  .ws-row-desc{font-size:12.5px; color:var(--ink-soft); max-width:52ch; margin-bottom:14px;}
  .ws-badge{flex:none; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-soft); padding:4px 9px; border-radius:6px; white-space:nowrap;}
  .chip-set{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px;}
  .chip{padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font-size:12.5px;}
  .chip.is-sel{background:var(--accent-c); border-color:var(--accent-c); color:var(--surface); font-weight:700;}
  .week-row{display:flex; gap:6px; margin-bottom:10px;}
  .week-day{flex:1; padding:9px 0; text-align:center; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:12px;}
  .week-day.is-sel{background:var(--accent-c); border-color:var(--accent-c); color:var(--surface); font-weight:700;}
  .liturgy-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .liturgy-row:last-of-type{border-bottom:none;}
  .liturgy-row .lname{font-size:13.5px; font-weight:600;}
  .seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;}
  .seg button{padding:6px 10px; font-size:11.5px; border:none; background:var(--bg); border-right:1px solid var(--line);}
  .seg button:last-child{border-right:none;}
  .seg button.is-sel{background:var(--accent-c); color:var(--surface); font-weight:700;}
  .bodymap-wrap{display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; margin-bottom:10px;}
  .bodymap-svg{flex:none;}
  .bodymap-svg rect,.bodymap-svg circle{stroke:var(--line-strong); stroke-width:1.5; fill:var(--bg); cursor:pointer;}
  .bodymap-svg .z-on{fill:var(--accent-c); stroke:var(--accent-c);}
  .bodymap-legend{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); flex:1; min-width:160px;}
  .bodymap-legend b{color:var(--ink);}

  .ws-roster{margin-top:14px; border-top:1px solid var(--line); padding-top:14px;}
  .ws-roster-title{font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em;}
  .ws-entry{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .ws-entry:last-child{border-bottom:none;}
  .ws-entry .avatar{width:24px; height:24px; font-size:10.5px;}
  .ws-entry-body{flex:1;}
  .ws-entry-top{display:flex; justify-content:space-between; gap:8px;}
  .ws-entry-name{font-weight:700; font-size:12.5px;}
  .ws-entry-time{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);}
  .ws-entry-content{color:var(--ink-soft); margin-top:2px; white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word;}

  /* auth */
  .auth-wrap{max-width:400px; margin:20px auto;}
  .auth-tabs{display:flex; gap:4px; margin-bottom:22px; background:var(--surface-2); border-radius:999px; padding:4px;}
  .auth-tabs button{flex:1; padding:9px 0; border:none; background:none; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .auth-tabs button.is-active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
  .auth-card{padding:26px 26px 22px;}
  .auth-card h2{font-size:19px; margin-bottom:4px;}
  .auth-card .sub{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}

  .toast-stack{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; width:min(92vw,380px);}
  .toast{background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:var(--r-sm); font-size:13px; box-shadow:var(--shadow); text-align:center;}
  .toast.err{background:var(--danger); color:#fff;}

  /* 앱 설치 유도 배너 — 링크로 들어오자마자(요청 반영) 자동으로 뜨는 "설치하기" 카드.
     안드로이드 크롬 계열은 beforeinstallprompt 이벤트를 캡처해두면 버튼 한 번 탭으로 바로 설치
     대화상자가 뜨지만, 브라우저 정책상 이 이벤트를 사용자 동작(클릭) 없이 즉시 prompt()로 띄우는
     것 자체는 막혀 있어(스팸성 권한 요청 방지) — 그래서 "0번 탭"은 불가능하고, 대신 페이지에 들어오는
     즉시 이 카드가 눈에 띄게 떠서 "설치하기" 버튼 한 번만 누르면 되도록 만든 것(사실상 가장 가까운
     형태). iOS Safari는 이 이벤트 자체를 지원하지 않아 프로그램적으로 설치를 띄울 방법이 없으므로,
     대신 "공유 → 홈 화면에 추가" 안내만 보여준다(버튼 없이 안내 카드만). */
  .install-banner{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:70; width:min(92vw,380px); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:14px; display:flex; flex-direction:column; gap:10px; animation:installBannerIn .35s ease-out;}
  @keyframes installBannerIn{ from{opacity:0; transform:translateX(-50%) translateY(12px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
  .install-banner-head{display:flex; align-items:center; gap:10px;}
  .install-banner-icon{flex:none; width:38px; height:38px; border-radius:11px; overflow:hidden; background:var(--surface-2);}
  .install-banner-icon img{width:100%; height:100%; object-fit:cover; display:block;}
  .install-banner-body{flex:1; min-width:0;}
  .install-banner-title{font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.3;}
  .install-banner-close{flex:none; width:26px; height:26px; border-radius:50%; border:none; background:transparent; color:var(--ink-faint); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .install-banner-close:hover{background:var(--surface-2);}
  .install-banner-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .install-banner-actions{display:flex; justify-content:flex-end;}
  .install-banner-btn{font-size:12.5px; font-weight:700; color:var(--primary-ink); background:var(--primary); padding:9px 16px; border-radius:999px; border:none; cursor:pointer; white-space:nowrap; width:100%;}
  @media (max-width:480px){
    .install-banner{bottom:calc(14px + env(safe-area-inset-bottom, 0px)); padding:12px; gap:9px;}
    .install-banner-icon{width:34px; height:34px;}
    .install-banner-title{font-size:12.5px;}
    .install-banner-desc{font-size:11.5px;}
    .install-banner-btn{font-size:11.5px; padding:8px 14px;}
  }
  @media (prefers-reduced-motion: reduce){ .install-banner{animation:none;} }

  .locked-note{display:flex; gap:10px; align-items:flex-start; background:var(--surface-2); border-radius:var(--r-sm); padding:12px 14px; font-size:12.5px; color:var(--ink-soft); margin-bottom:20px;}
  .locked-note svg{width:16px; height:16px; flex:none; margin-top:2px; stroke:var(--ink-faint); fill:none; stroke-width:1.6;}

  /* materials / 자료실 — 운영자만 글을 쓸 수 있고, 목록은 회차별로 묶은 한 줄짜리 목록. 아래는
     운영자 컴포저 안에 덧붙는 "자료 링크(선택)" 영역, 목록 줄, 줄을 펼쳤을 때 보이는 내용과
     첨부 Drive 링크 표시용 스타일. */
  .avatar-pick-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .avatar-pick-preview{width:52px; height:52px; font-size:20px; background:var(--surface-2); color:var(--ink-faint);}
  .avatar-pick-preview svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.6;}
  .mat-compose-extra{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line);}
  /* repeatable Drive-link rows (여러 개 올리기) */
  .mat-link-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px;}
  .mat-link-row input{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); padding:9px 12px; font-size:13px; width:100%;}
  .mat-link-remove{flex:none; width:30px; height:30px; border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-faint); display:flex; align-items:center; justify-content:center;}
  .mat-link-remove:hover{color:var(--danger);}
  .mat-link-remove svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .mat-add-row-btn{margin-top:2px;}
  /* Drive links attached to a materials post — 상자(줄)를 누르면 새 탭으로 바로 이동한다.
     예전처럼 눌러서 펼치는 미리보기(iframe)는 없앴다. */
  .post-mat-links{margin:0 16px 12px; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--surface);}
  .post-mat-link{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink); font-size:13px; font-weight:600;}
  .post-mat-link:last-child{border-bottom:none;}
  .post-mat-link:hover{color:var(--accent-c, var(--primary)); background:var(--surface-2);}
  .post-mat-link-title-text{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .post-mat-link svg{flex:none; width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.6; color:var(--ink-faint);}
  .mat-row-chev{flex:none; width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; color:var(--ink-faint); transition:transform .18s ease;}
  /* 유튜브 링크 미리보기 카드 — 나눔공간/나의공간/자료실 본문(또는 자료실 첨부 링크)에
     유튜브 주소가 있으면, 렌더 후 enhanceLinkPreviews()가 해당 <a> 태그를 이 카드 모습으로
     바꿔치기한다(주소/클릭 동작은 그대로 유지, 모양만 섬네일+제목 카드로 교체). */
  .link-preview-card{display:flex; align-items:stretch; margin:10px 0; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--surface); text-decoration:none; transition:border-color .15s;}
  .link-preview-card:hover{border-color:var(--accent-c, var(--primary));}
  .lp-thumb-wrap{flex:none; width:128px; background:var(--surface-2);}
  .lp-thumb{display:block; width:100%; height:100%; object-fit:cover;}
  .lp-info{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:4px; padding:10px 14px;}
  .lp-title{font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .lp-domain{font-size:11.5px; color:var(--ink-faint);}
  /* 자료실 한 줄 목록 — 게시판 스타일: 굵은 제목 한 줄 + 그 아래 회색 메타 줄(#카테고리·
     몇 번째 모임·날짜·댓글, 첨부 이미지 참고). 줄을 누르면 아래로 펼쳐지는 대신 상세보기
     페이지로 바로 들어간다(요청 반영) — 나눔공간/나의공간의 feed-tile과 같은 패턴. */
  .mat-list{display:flex; flex-direction:column; margin-top:22px; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--surface);}
  .mat-row{display:flex; align-items:stretch; border-bottom:1px solid var(--line);}
  .mat-list .mat-row:last-child{border-bottom:none;}
  .mat-row:hover{background:var(--surface-2);}
  .mat-row-link-area{flex:1; min-width:0; display:flex; align-items:flex-start; gap:9px; padding:11px 6px 11px 12px; text-decoration:none; color:inherit;}
  .mat-row-num{flex:none; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); width:16px; text-align:right; padding-top:2px;}
  .mat-row-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .mat-row-title{font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;}
  .mat-row-link-area:hover .mat-row-title{color:var(--accent-c, var(--primary));}
  /* 회색 메타 줄 — 카테고리(색으로만 구분)·몇 번째 모임·일자·댓글 수를 점(·)으로 이어 표시 */
  .mat-row-meta-line{display:flex; align-items:center; flex-wrap:wrap; gap:5px; font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
  .mat-row-cat{font-weight:700; font-family:var(--font-body);}
  .mat-row-meeting{font-weight:600;}
  .mat-row-dot{color:var(--ink-faint);}
  .mat-row-comment{display:inline-flex; align-items:center; gap:3px;}
  .mat-row-comment svg{width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .mat-row-actions{flex:none; display:flex; align-items:flex-start; gap:1px; padding:7px 8px 0 0;}
  .mat-row-del{flex:none; width:26px; height:26px; border-radius:50%; border:none; background:none; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;}
  .mat-row-del:hover{color:var(--danger); background:var(--surface-3);}
  .mat-row-del svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.7;}
  .mat-row-edit:hover{color:var(--primary); background:var(--surface-3);}

  /* ---------------- 나의 공간: 독서 진행률 · 타이머 ----------------
     대기 상태에서는 카드 하나를 좌/우로 나눠 씀: 왼쪽엔 표지·진행률·시작 버튼,
     오른쪽엔 읽는 중/완독 상태 표시(현재 페이지로 자동 계산, 클릭 불가) + 총 읽은 시간 +
     "읽은 기록" 버튼(누르면 카드 아래로 펼쳐짐). */
  .reading-card{padding:14px 16px; margin-bottom:12px;}
  .reading-split-card{padding:14px 16px;}
  .reading-split-row{display:flex; align-items:stretch; gap:16px;}
  .reading-split-left{flex:1 1 50%; min-width:0; display:flex; align-items:center;}
  .reading-split-right{flex:1 1 50%; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:6px; padding-left:16px; border-left:1px solid var(--line);}
  .reading-status-top{display:flex; flex-direction:column; gap:6px;}
  .reading-status-pill{align-self:flex-start;}
  .reading-status-pill.is-reading{background:var(--surface-2); color:var(--ink-soft);}
  .reading-status-dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .reading-total-time{font-size:12px; color:var(--ink-soft);}
  .reading-total-time strong{color:var(--ink); font-weight:700;}
  .reading-split-right .reading-toggle-row{padding:8px 1px; font-size:12.5px;}
  .reading-split-body{margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .reading-slim-row{display:flex; align-items:center; gap:12px; width:100%;}
  .reading-cover{flex:none; width:40px; border-radius:8px; overflow:hidden; box-shadow:var(--shadow-sm);}
  .reading-cover img{display:block; width:100%; aspect-ratio:3/4.4; object-fit:cover;}
  .reading-cover-sm{width:38px;}
  .reading-info{flex:1; min-width:0;}
  .reading-title{font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .reading-pages{font-size:15px; font-weight:700; color:var(--ink); letter-spacing:-.01em;}
  .reading-pct{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .reading-bar{height:5px; border-radius:999px; background:var(--surface-2); margin-top:6px; overflow:hidden;}
  .reading-bar-fill{height:100%; border-radius:999px; background:var(--primary);}
  .reading-hint-link{border:none; background:none; padding:0; font-size:12.5px; color:var(--ink-faint); text-decoration:underline; text-underline-offset:2px; cursor:pointer;}
  .reading-edit-btn{color:var(--ink-soft);}
  .reading-play-btn{color:var(--primary); border-color:var(--primary);}
  .reading-play-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .reading-timer-card{text-align:center; padding:18px 18px 20px;}
  .reading-timer-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .reading-timer-head .icon-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7;}
  .reading-timer-status{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .reading-timer-head .btn svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.9; margin-right:4px;}
  .reading-timer-display{font-size:40px; font-weight:700; letter-spacing:.02em; margin:22px 0 18px; color:var(--ink);}
  .reading-timer-toggle{display:inline-flex; align-items:center; gap:7px; padding:9px 20px;}
  .reading-timer-toggle svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .reading-timer-book{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-soft);}
  .reading-save-card{padding:18px 18px 20px;}
  .reading-save-time{font-size:32px; font-weight:700; text-align:center; margin:4px 0 16px; color:var(--ink);}
  .reading-edit-card{padding:18px 18px 20px;}
  .reading-toggle-list{margin-top:2px;}
  .reading-toggle-row{display:flex; align-items:center; justify-content:space-between; width:100%; padding:11px 2px; border:none; background:none; border-top:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink);}
  .reading-toggle-row .mat-row-chev{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7; transition:transform .15s ease;}
  .reading-toggle-row .mat-row-chev.is-open{transform:rotate(180deg);}
  .reading-log-list{background:var(--bg); border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; margin-bottom:10px;}
  .reading-log-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line);}
  .reading-log-row:last-child{border-bottom:none;}
  .reading-log-main{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .reading-log-date{font-size:11px; color:var(--ink-faint);}
  .reading-log-page{font-size:13px; font-weight:600; color:var(--ink); font-family:var(--font-mono);}
  .reading-log-delta{font-family:var(--font-body); font-size:11.5px; font-weight:500; color:var(--ink-soft);}
  .reading-log-side{display:flex; align-items:center; gap:6px; flex:none;}
  .reading-log-dur{font-size:12px; color:var(--ink-soft);}

  /* 습관 만들기(전용 탭) — 30번 라운드: 월간 달력 대신 "이번 주"만 보여주는 퀘스트형
     체크표로 단순화하고, 이번 주를 다 채우면 완료 카드를 이미지로 저장하는 버튼이 붙는다. */
  .habit-section{margin-top:4px;}
  .habit-section-lead{font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5;}
  .habit-add-btn{width:100%; padding:13px; border-radius:14px; border:1.5px dashed var(--line); background:transparent;
    color:var(--ink-soft); font-weight:700; font-size:14px; cursor:pointer; margin-bottom:12px;}
  .habit-add-btn:hover{border-color:var(--primary); color:var(--primary);}
  .habit-form{padding:18px; margin-bottom:12px;}
  .habit-form-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .habit-form-row label{flex:none; width:56px; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .habit-form-row input{flex:1; min-width:0; padding:9px 11px; border-radius:10px; border:1px solid var(--line); font-size:14px; background:var(--surface);}
  .habit-form-hint{margin:2px 0 10px; font-size:11.5px; color:var(--ink-faint); line-height:1.5;}
  .habit-form .btn-primary{width:100%; margin-top:4px;}
  .habit-list{display:flex; flex-direction:column; gap:12px;}
  .habit-card{padding:16px 18px 18px;}
  .habit-card-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .habit-name{font-family:var(--font-display); font-size:16px; font-weight:800; margin:0; word-break:break-word;}
  .habit-card-actions{display:flex; gap:4px; flex:none;}
  .habit-icon-btn{width:30px; height:30px; border-radius:9px; border:none; background:transparent; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .habit-icon-btn:hover{background:var(--surface-2);}
  .habit-icon-btn svg{width:15px; height:15px;}
  .habit-meta{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px;}
  .habit-chip{font-size:11.5px; font-weight:600; color:var(--ink-soft); background:var(--surface-2); border-radius:999px; padding:4px 10px;}
  .habit-week-head{display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .habit-progress.is-done{color:var(--primary);}
  .habit-week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .habit-wday{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .habit-wday-label{font-size:11px; font-weight:700; color:var(--ink-soft);}
  .habit-wday-date{font-size:10px; color:var(--ink-faint);}
  .habit-wday-dot{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--primary-ink);
    cursor:pointer; padding:0;}
  .habit-wday.is-checked .habit-wday-dot{background:var(--primary); border-color:var(--primary);}
  .habit-wday.is-future .habit-wday-dot{opacity:.35; cursor:default; border-style:dashed;}
  .habit-wday.is-today .habit-wday-dot{border-color:var(--primary); border-width:2px;}
  .habit-wday-dot:hover:not(:disabled){filter:brightness(0.97);}
  .habit-save-row{margin-top:14px;}
  .habit-save-btn{width:100%;}
  .habit-save-hint{margin:8px 0 0; font-size:11.5px; color:var(--ink-faint); text-align:center;}
  .habit-hist-overlay{position:fixed; inset:0; z-index:90; background:color-mix(in srgb, var(--ink) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;}
  .habit-hist-modal{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); width:100%;
    max-width:420px; max-height:88vh; overflow-y:auto; padding:20px 20px 22px; box-sizing:border-box;}
  .habit-hist-modal .composer-head{margin-bottom:2px;}
  .habit-hist-modal .composer-head h4{font-size:17px;}
  .habit-hist-month-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0 14px;}
  .habit-hist-nav-btn{width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; color:var(--ink);}
  .habit-hist-nav-btn:disabled{opacity:.3; cursor:default;}
  .habit-hist-nav-btn svg{width:15px; height:15px;}
  .habit-hist-nav-btn.is-next svg{transform:scaleX(-1);}
  .habit-hist-month-label{font-family:var(--font-display); font-weight:700; font-size:15px; min-width:96px; text-align:center;}
  .habit-hist-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px;}
  .habit-hist-dow{font-size:10.5px; font-weight:700; color:var(--ink-faint); text-align:center; padding-bottom:5px;}
  .habit-hist-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:9px;
    font-size:12px; font-weight:600; color:var(--ink-faint);}
  .habit-hist-cell.is-empty{visibility:hidden;}
  .habit-hist-cell.is-success{background:var(--primary-soft); color:var(--primary); font-weight:800;}
  .habit-hist-cell.is-fail{background:color-mix(in srgb, var(--danger) 13%, transparent); color:var(--danger);}
  .habit-hist-cell.is-today{box-shadow:inset 0 0 0 1.6px var(--primary);}
  .habit-hist-legend{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--ink-soft); margin-bottom:16px;}
  .habit-hist-legend span{display:inline-flex; align-items:center; gap:5px;}
  .habit-hist-legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .habit-hist-legend i.is-success{background:var(--primary);}
  .habit-hist-legend i.is-fail{background:var(--danger);}
  .habit-hist-stats{display:flex; flex-direction:column; gap:10px;}
  .habit-hist-stat-card{background:var(--surface-2); border-radius:var(--r-sm); padding:12px 14px;}
  .habit-hist-stat-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px;}
  .habit-hist-stat-title{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .habit-hist-stat-rate{font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--primary);}
  .habit-hist-stat-detail{font-size:11.5px; color:var(--ink-faint);}
  /* 38번 라운드: 전체 성공률·목표 기간 진행률을 숫자뿐 아니라 가로 막대로도 보여준다
     (요청 반영 — "가로 막대로 가시적으로 보기 좋게"). */
  .habit-hist-stat-bar-track{margin:8px 0 6px; height:8px; border-radius:999px; background:var(--surface); overflow:hidden;}
  .habit-hist-stat-bar-fill{height:100%; border-radius:999px; background:var(--primary);}
  .habit-hist-stat-card.is-goal .habit-hist-stat-bar-fill{background:var(--accent-c, var(--nt-insight-ink));}
  .habit-hist-stat-card.is-empty{color:var(--ink-faint);}
  .habit-hist-stat-card.is-empty .habit-hist-stat-title{margin-bottom:4px;}

  /* PC: 920px는 큰 모니터에서 너무 좁아 보여서 화면이 커질수록 콘텐츠 폭도 함께 넓힌다
     (레이아웃/컬럼 수는 그대로 — 여백만 최적화). */
  @media (min-width:1180px){
    .wrap{max-width:1080px;}
    .header-inner{max-width:1080px;}
  }
  @media (min-width:1480px){
    .wrap{max-width:1180px;}
    .header-inner{max-width:1180px;}
  }

  @media (max-width:760px){
    html{font-size:15.5px;}
    .why-grid{grid-template-columns:1fr;}
    .flow-grid{grid-template-columns:repeat(2,1fr);}
    .header-inner{padding:12px 14px; gap:8px;}
    .primary-nav{margin-left:0;}
    .primary-nav .nav-pill{flex:none; padding:6px 8px; font-size:12.5px;}
    .brand{font-size:15.5px;}
    .brand img{height:26px;}
    .profile-dropdown{right:-6px;}
    .wrap{padding:0 16px;}
    .hero{min-height:260px; padding:48px 20px; margin-bottom:28px;}
    .hero h1{font-size:30px;}
    .hero h1 .title-break{display:block;}
    .hero h1 .title-space{display:none;}
    .hero-bg .hero-cover-secondary{display:none;}
    .section{margin-top:38px; margin-bottom:38px;}
    /* skip the book intro/description on mobile so the tabs (나눔 공간 등) are visible right away */
    .book-banner{display:none;}
    .book-mobile-title{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); padding-top:16px; margin-bottom:2px;}
    /* 모바일에서 옆으로 넘겨야 보이던 걸 없애고, 5개 탭이 화면 폭에 딱 맞게 균등 분배되도록
       고정한다(overflow-x 제거 + flex:1로 균등폭 + 글자가 살짝 넘치면 잘리지 않고 줄어들도록
       한 줄 유지 + 말줄임표 안전장치). */
    .book-tabs{gap:0; margin-bottom:20px; margin-top:4px; overflow-x:visible;}
    .book-tab{flex:1; min-width:0; margin-right:0; padding:10px 0; font-size:11px; letter-spacing:-0.2px; text-align:center; overflow:hidden; text-overflow:ellipsis;}
    .timeline{grid-template-columns:1fr;}
    .tl-cover{width:72px;}
    .section-head{flex-direction:column; align-items:flex-start; gap:4px;}
    /* 모바일에서도 두 카드를 한 줄에 나란히 — 카드 안 여백/글자 크기를 줄여서 맞춘다. */
    .announce-grid{grid-template-columns:repeat(2,1fr); gap:10px;}
    .announce-card{padding:16px 14px;}
    .announce-icon-row{margin-bottom:8px; gap:6px;}
    .announce-icon{width:30px; height:30px;}
    .announce-icon svg{width:15px; height:15px;}
    .announce-label{font-size:10.5px; margin-bottom:4px;}
    /* 좁은 카드 폭(약 144px)에서도 라벨+값 3줄 구조는 자동으로 맞아떨어진다 — 글자 크기와
       마커 여백만 살짝 줄인다. */
    .announce-rows{column-gap:8px; row-gap:8px;}
    .announce-row-label mark{font-size:13.5px; padding:3px 8px 4px; border-radius:3px 9px 3px 9px;}
    .announce-row-value{font-size:13.5px; line-height:1.3;}
    .announce-note{font-size:11px;}
    .announce-meeting-badge{font-size:9.5px; padding:2px 6px;}
    .announce-head-right{width:100%;}
    .feed{max-width:none;}
    .feed-grid{gap:2px;}
    .feed-tile-head{padding:5px 6px;}
    .feed-tile-foot{padding:3px 6px 5px;}
    .feed-tile-name{font-size:10px;}
    .bodymap-wrap{flex-direction:column;}
    .contact-card{flex-direction:column; align-items:flex-start; text-align:left; padding:22px;}
    .checkin-grid{grid-template-columns:repeat(3,1fr);}
    .mat-link-row{grid-template-columns:1fr auto; grid-template-areas:"title remove" "url remove";}
    .mat-link-row .mat-link-title{grid-area:title;}
    .mat-link-row .mat-link-url{grid-area:url;}
    .mat-link-row .mat-link-remove{grid-area:remove;}
    .post-mat-link-title-text{font-size:12.5px;}
    .lp-thumb-wrap{width:92px;}
    .lp-title{font-size:12.5px;}
    .lp-info{padding:8px 10px;}
    /* 자료실 한 줄 목록: 좁은 화면에서는 여백을 살짝 줄인다(줄바꿈은 flex-wrap이 이미 처리) */
    .mat-row-link-area{padding:10px 4px 10px 10px; gap:7px;}
    .mat-row-title{font-size:13px;}
    .mat-row-meta-line{font-size:10.5px;}
    .composer-foot{flex-direction:column; align-items:stretch;}
    .composer-foot .btn{width:100%;}
    .btn{min-height:42px;}
    input[type=text],input[type=password],textarea{font-size:16px;}
    .week-row{gap:4px;}
    .week-day{font-size:11px; padding:8px 0;}
    .liturgy-row{flex-direction:column; align-items:flex-start; gap:8px;}
    .seg{width:100%;}
    .seg button{flex:1;}
    .reading-split-row{flex-direction:column; gap:12px;}
    .reading-split-right{padding-left:0; padding-top:12px; border-left:none; border-top:1px solid var(--line);}
    .auth-wrap{margin:8px auto;}
    .auth-card{padding:22px 20px;}
    .note-meta{align-items:flex-start;}
    /* 35번 라운드 이후로는 모든 nt-pill이 항상 글자만으로 표시되므로(아이콘 자체를 안 그림),
       예전에 여기 있던 "모바일에서 아이콘만 남기고 글자 숨기기" 규칙은 더 이상 필요 없다. */
    .nt-pill{padding:7px 11px;}
    .rt-btn{width:34px; height:34px;}
  }
</style>

<body>
<!-- 초기 로딩 화면(boot-splash)을 JS가 아니라 정적 HTML에 처음부터 박아 넣음(요청 반영) — 예전엔
     이 화면이 하단의 <script>가 실행돼야 나타났는데, 특히 홈 화면에 설치한 PWA로 열 때는 OS가 먼저
     보여주는 자체 아이콘 스플래시가 끝난 뒤에도 스크립트가 로드/실행되는 짧은 순간 동안 빈 화면이 한
     번 더 보였음. 이 화면을 정적 HTML(+ 이미 <head>에 있는 CSS)로 옮겨두면 브라우저가 그릴 수 있는
     가장 이른 시점에 곧바로 이 화면부터 그려져서, OS 아이콘 스플래시 다음에 다른 화면(빈 화면 등) 없이
     바로 이 화면으로 이어짐. 데이터를 다 불러오면 아래 boot()가 이 자리를 실제 화면으로 교체한다. -->
<div id="app"><div class="boot-splash">
  <img class="boot-splash-icon" src="/covers/mascot-icon.png" alt="">

/* ---------------- rich text sanitizer (allowlist) ---------------- */
var RT_ALLOWED_TAGS = {B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,MARK:1,OL:1,UL:1,LI:1,BLOCKQUOTE:1,PRE:1,CODE:1,A:1,BR:1,DIV:1,SPAN:1,P:1,FONT:1};
var RT_DROP_ENTIRELY = {SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,BASE:1,SVG:1,MATH:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1,IMG:1,VIDEO:1,AUDIO:1,SOURCE:1,TRACK:1};
function rtSafeStyle(styleText){
  var out = [];
  (styleText||'').split(';').forEach(function(decl){
    var parts = decl.split(':');
    if(parts.length!==2) return;
    var key = parts[0].trim().toLowerCase();
    var val = parts[1].trim();
    if((key==='color'||key==='background-color') && /^(#[0-9a-fA-F]{3,8}|rgba?\([0-9.,\s%]+\)|[a-zA-Z]+)$/.test(val)){
      out.push(key+':'+val);
    }
  });
  return out.join(';');
}
function rtSanitizeNode(node){
  if(node.nodeType===3){ return [node.cloneNode()]; }
  if(node.nodeType!==1){ return []; }
  var tag = node.tagName;
  if(RT_DROP_ENTIRELY[tag]) return [];
  var children = [];
  Array.prototype.forEach.call(node.childNodes, function(c){ children = children.concat(rtSanitizeNode(c)); });
  if(!RT_ALLOWED_TAGS[tag]) return children;
  var el = document.createElement(tag.toLowerCase());
  if(tag==='A'){
    var href = node.getAttribute('href')||'';
    if(/^(https?:|mailto:)/i.test(href)){
      el.setAttribute('href', href);
      el.setAttribute('target','_blank');
      el.setAttribute('rel','noopener noreferrer');
    }
  }
  if(tag==='FONT'){
    var size = node.getAttribute('size');
    if(size && /^[1-7]$/.test(size)) el.setAttribute('size', size);
  }
  if(tag==='SPAN' || tag==='DIV'){
    var style = node.getAttribute('style');
    if(style){ var safe = rtSafeStyle(style); if(safe) el.setAttribute('style', safe); }
  }
  children.forEach(function(c){ el.appendChild(c); });
  return [el];
}
function sanitizeHtml(html){
  var wrap = document.createElement('div');
  wrap.innerHTML = html || '';

  });
  return out.innerHTML;
}

var ytOembedCache = {};

  var m = YT_ID_RE.exec(href||'');

}
function ytThumbUrl(id){ return 'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg'; }
function fetchYoutubeTitle(id, href){
  if(ytOembedCache.hasOwnProperty(id)) return;
  ytOembedCache[id] = null; // 불러오는 중
  fetch('https://www.youtube.com/oembed?url='+encodeURIComponent(href)+'&format=json').then(function(res){
    return res && res.ok ? res.json() : null;
  }).then(function(data){
    ytOembedCache[id] = (data && data.title) ? data.title : false;
    var t = (typeof ytOembedCache[id]==='string') ? ytOembedCache[id] : '유튜브 영상';
    document.querySelectorAll('.link-preview-card[data-yt-id="'+id+'"] .lp-title').forEach(function(el){ el.textContent = t; });
  }).catch(function(){ ytOembedCache[id] = false; });
}

  var anchors = document.querySelectorAll('.feed a[href]');
