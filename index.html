function bookPageHtml(book, tab, postId){
  var locked = isBookLocked(book);
  var adminPreview = isAdmin();
  var tabs = [['share','나눔 공간'],['mine','나의 공간'],['worksheet','활동지'],['materials','자료실'],['habit','습관']];
  var tabBar = '<nav class="book-tabs" aria-label="'+esc(book.area)+' 책의 다섯 공간">' + tabs.map(function(t){
    var restricted=t[0]==='worksheet'&&!adminPreview;
    return '<button type="button" class="book-tab'+(tab===t[0]?' is-active':'')+'" aria-current="'+(tab===t[0]?'page':'false')+'" data-book-tab="'+t[0]+'" data-book-id="'+book.id+'"'+(restricted?' title="활동지는 관리자만 열 수 있어요." aria-label="활동지 · 관리자 전용"':'')+'>'+t[1]+(restricted?'<span class="book-tab-lock" aria-hidden="true">'+svgIcon(I_LOCK)+'</span>':'')+'</button>';
  }).join('') + '</nav>';
  var body = tab==='mine' ? mineTabHtml(book, postId) : tab==='worksheet' ? worksheetTabHtml(book) : tab==='materials' ? materialsTabHtml(book, postId) : tab==='habit' ? habitTabHtml(book) : shareTabHtml(book, postId);
  return '<div class="wrap book-page">' +
    '<div class="book-banner" style="--accent-soft:var(--'+book.accent+'-soft); background:var(--'+book.accent+'-soft)">' +
      '<div class="book-banner-inner">' +
        '<div class="book-banner-cover"><img src="'+book.cover+'" alt="'+esc(book.title)+' 표지"></div>' +
        '<div class="book-banner-text">' +
          '<div class="eyebrow" style="color:var(--'+book.accent+'-ink)">'+esc(book.area)+' · 함께 읽는 책</div>' +
          '<h1 style="color:var(--'+book.accent+'-ink)">'+esc(book.title)+'</h1>' +
          '<div class="byline" style="color:var(--'+book.accent+'-ink)">'+esc(book.subtitle)+'</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    (adminPreview ? adminLockPanelHtml(book) : '') +
    (locked ? lockedBookGateHtml(book) :
      (tabBar + '<div id="book-tab-body">'+body+'</div>')) +
  '</div>';
}

/* ---------------- master render ---------------- */
function render(){
  captureComposerDraft();
  captureHabitCalendarState();
  var previousReadingDialog=document.getElementById('reading-home-dialog');
  if(previousReadingDialog && previousReadingDialog.open && readingTimer)readingHomeDialogPosition={key:previousReadingDialog.getAttribute('data-reading-key'),top:previousReadingDialog.scrollTop};
  syncReadingTimer();
  if(SESSION&&sharedPostsLoadState==='idle')loadCommunityForCurrentMember();
  var route = currentRoute();
  var app = document.getElementById('app');
  var theme = localStorage.getItem('growell_theme');
  if(theme==='dark') document.documentElement.setAttribute('data-theme','dark');
  else if(theme==='light') document.documentElement.setAttribute('data-theme','light');
  var html = headerHtml(route) + '<main>' + activeReadingStripHtml(route);
  if(!SESSION&&route.view!=='about'){
    html += loginHtml();
  } else if(route.view==='login'){
    html += loginHtml();
  } else if(route.view==='book'){
    var book = bookById(route.bookId);
    if(!book){ html += '<div class="wrap"><div class="empty">책을 찾을 수 없어요.</div></div>'; }
    else { html += bookPageHtml(book, route.tab||'share', route.postId); }
  } else if(route.view==='admin-users'){
    html += adminUsersHtml();
  } else if(route.view==='profile-edit'){
    html += SESSION ? profileEditHtml() : '<div class="wrap">'+loginGateHtml('프로필을 수정하려면 로그인해주세요.')+'</div>';
  } else if(route.view==='community'){
    html += homeCommunityHtml(route);
  } else if(route.view==='about'){
    html += welcomeHomeHtml();
  } else {
    html += homeHtml();
  }
  html += '</main>' + footerHtml() + readingHomeDialogHtml(route);
  if(readingTimerIntervalId){ clearInterval(readingTimerIntervalId); readingTimerIntervalId = null; }
  app.innerHTML = html;
  bindEvents(route);
  restoreDraftIfAny(route);
  enhanceLinkPreviews();
  captureComposerDraft();
}

function restoreDraftIfAny(route){
  if(!pendingDraft) return;
  if(pendingDraft.route!==location.hash){ pendingDraft=null; return; }
  pendingDraft = null;
}

/* ---------------- events (delegated) ---------------- */

  if(typeof GrowellCommunityFeatures!=='undefined')GrowellCommunityFeatures.bind();
  bindOAuthEvents();
  bindPrivateRecovery();
  bindHomeEvents();
  // 위임한 한 번의 리스너는 체크 상태만 갱신하면서 생성한 재시도 버튼도 처리한다.
  if(!document._growellRetryBound){
    document._growellRetryBound = true;
    document.addEventListener('click', function(event){
      var habitRetry = event.target.closest && event.target.closest('[data-retry-habit-save]');
      if(habitRetry){ retryHabitChecks(habitRetry.getAttribute('data-retry-habit-save')); return; }
      var memberRetry = event.target.closest && event.target.closest('[data-retry-member-load]');
      if(memberRetry){
        memberRetry.disabled=true;
        var pending = loadMemberData();
        render();
        pending.then(function(){
          if(memberLoadState.privateEntries==='ready' && typeof completePendingPrivateRecovery==='function') return completePendingPrivateRecovery();
        }).then(function(){ render(); }).catch(function(){ showToast('기록 준비를 마치지 못했어요. 다시 시도해주세요.', true); render(); });
      }
    });
  }
  var app = document.getElementById('app');

  bindPrivateCategoryEvents(app);

  app.querySelectorAll('[data-retry-community]').forEach(function(button){button.addEventListener('click',function(){sharedPostsLoadState='idle';render();});});

  var themeBtn = document.getElementById('btn-theme');
  if(themeBtn){
    themeBtn.addEventListener('click', function(e){
      e.stopPropagation();

      document.documentElement.setAttribute('data-theme',next);
      themeBtn.innerHTML='<span aria-hidden="true">'+themeModeIcon(next)+'</span>';
      themeBtn.setAttribute('aria-label',themeSwitchLabel(next));

      var profile=document.getElementById('profile-dropdown');
      var profileButton=document.getElementById('btn-profile-toggle');

      if(profileButton) profileButton.setAttribute('aria-expanded','false');
    });
  }
  var profileToggle = document.getElementById('btn-profile-toggle');
  var profileDropdown = document.getElementById('profile-dropdown');
  if(profileToggle && profileDropdown){
    profileToggle.addEventListener('click', function(e){
      e.stopPropagation();
      var willOpen = profileDropdown.hidden;
      profileDropdown.hidden = !willOpen;
      profileToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
  }
  var loginOpen = document.getElementById('btn-login-open');
  if(loginOpen) loginOpen.addEventListener('click', function(){ location.hash='#/login'; });
  var gotoLogin = document.getElementById('btn-goto-login');
  if(gotoLogin) gotoLogin.addEventListener('click', function(){ location.hash='#/login'; });
  var logoutBtn = document.getElementById('btn-logout');
  if(logoutBtn) logoutBtn.addEventListener('click', doLogout);
  var deleteAccountBtn = document.getElementById('btn-delete-account');
  if(deleteAccountBtn) deleteAccountBtn.addEventListener('click', function(){ doDeleteAccount(null); });
  app.querySelectorAll('.admin-user-delete-btn').forEach(function(b){
    b.addEventListener('click', function(){ doDeleteAccount(b.getAttribute('data-user-id')); });
  });

  app.querySelectorAll('[data-auth-tab]').forEach(function(b){
    b.addEventListener('click', function(){ authMode = b.getAttribute('data-auth-tab'); render(); });
  });
  var doLoginBtn = document.getElementById('btn-do-login');
  if(doLoginBtn) doLoginBtn.addEventListener('click', function(){
    doLogin(document.getElementById('li-id').value, document.getElementById('li-pw').value, doLoginBtn);
  });
  bindProfilePhotoPicker('su',function(value){pendingSignupAvatar=value;});
  var doSignupBtn = document.getElementById('btn-do-signup');
  if(doSignupBtn) doSignupBtn.addEventListener('click', function(){
    var codeEl = document.getElementById('su-admin-code');
    var hintEl = document.getElementById('su-hint');
    doSignup(document.getElementById('su-name').value, document.getElementById('su-id').value, document.getElementById('su-pw').value, document.getElementById('su-pw2').value, hintEl?hintEl.value:'', codeEl?codeEl.value:'', pendingSignupAvatar, doSignupBtn);
  });
  var forgotLink = document.getElementById('link-forgot-password');
  if(forgotLink) forgotLink.addEventListener('click', function(){ authMode = 'forgot'; render(); });
  var backToLoginLink = document.getElementById('link-back-to-login');
  if(backToLoginLink) backToLoginLink.addEventListener('click', function(){ authMode = 'login'; render(); });
  var doForgotBtn = document.getElementById('btn-do-forgot');
  if(doForgotBtn) doForgotBtn.addEventListener('click', function(){
    doForgotPassword(document.getElementById('fp-id').value, document.getElementById('fp-hint').value, document.getElementById('fp-pw').value, document.getElementById('fp-pw2').value, doForgotBtn);
  });
  var grantAdminBtn = document.getElementById('btn-grant-admin');
  if(grantAdminBtn) grantAdminBtn.addEventListener('click', function(){
    var code = window.prompt('운영자 코드를 입력해주세요.');
    if(code!=null) doGrantAdmin(code);
  });
  var gotoProfileEdit = document.getElementById('btn-goto-profile-edit');
  if(gotoProfileEdit) gotoProfileEdit.addEventListener('click', function(){ pendingProfileAvatar = undefined; });

  /* 프로필 수정 페이지 — 회원가입 사진 선택과 같은 방식(리사이즈 후 미리보기) */

  var peSaveBtn = document.getElementById('btn-pe-save');
  if(peSaveBtn) peSaveBtn.addEventListener('click', function(){
    doEditProfile(document.getElementById('pe-name').value, pendingProfileAvatar, peSaveBtn);
  });
  var peHintSaveBtn = document.getElementById('btn-pe-hint-save');
  if(peHintSaveBtn) peHintSaveBtn.addEventListener('click', function(){
    var hintEl = document.getElementById('pe-hint');
    doUpdateHint(hintEl ? hintEl.value : '', peHintSaveBtn);
  });

  /* home: 모임 안내 편집 (admin) */
  var editAnnounceBtn = document.getElementById('btn-edit-announcement');
  if(editAnnounceBtn) editAnnounceBtn.addEventListener('click', function(){ editingAnnouncement = true; render(); });
  var closeAnnounceBtn = document.getElementById('btn-close-announcement');
  if(closeAnnounceBtn) closeAnnounceBtn.addEventListener('click', function(){ editingAnnouncement = false; render(); });
  var saveAnnounceBtn = document.getElementById('btn-save-announcement');
  if(saveAnnounceBtn){
    saveAnnounceBtn.addEventListener('click', function(){
      var next = {
        next:{
          date: document.getElementById('an-date').value.trim(),
          time: document.getElementById('an-time').value.trim(),
          place: document.getElementById('an-place').value.trim(),
          note: document.getElementById('an-next-note').value.trim()
        },
        reading:{
          bookId: document.getElementById('an-book').value,
          meetingNo: document.getElementById('an-meeting-no').value.trim(),
          chapter: document.getElementById('an-chapter').value.trim(),
          range: document.getElementById('an-range').value.trim(),
          concept: document.getElementById('an-concept').value.trim(),
          note: document.getElementById('an-reading-note').value.trim()
        }
      };
      saveState(function(nextState){ nextState.announcement = next; editingAnnouncement = false; }, {button:saveAnnounceBtn, originalLabel:'저장', savingLabel:'저장 중…'});
    });
  }

  /* per-book lock toggle (admin, on the book banner) */
  app.querySelectorAll('[data-lock-toggle]').forEach(function(b){
    b.addEventListener('click', function(){
      var bookId = b.getAttribute('data-lock-toggle');
      var bk = bookById(bookId);
      var cur = bookLockInfo(bk);
      saveState(function(next){
        next.bookLocks[bookId] = {locked: !cur.locked, note: cur.note||''};
      }, {button:b});
    });
  });
  var lockNoteSave = document.getElementById('btn-save-lock-note');
  if(lockNoteSave){
    lockNoteSave.addEventListener('click', function(){
      var bookId = lockNoteSave.getAttribute('data-book');
      var note = document.getElementById('lock-note-input').value.trim();
      var cur = bookLockInfo(bookById(bookId));
      saveState(function(next){
        next.bookLocks[bookId] = {locked: cur.locked, note: note};
      }, {button:lockNoteSave, originalLabel:'저장', savingLabel:'저장 중…'});
    });
  }

  app.querySelectorAll('[data-book-tab]').forEach(function(b){
    b.addEventListener('click', function(){
      var target = '#/book/'+b.getAttribute('data-book-id')+'/'+b.getAttribute('data-book-tab');
      /* 나눔공간/나의공간/활동지/자료실 탭 전환 버튼은 <a>가 아니라 <button>이라 위의
         전역 링크 클릭 가드에 걸리지 않으므로 여기서 따로 확인한다. */
      if(anyComposerOpen() && target!==location.hash && !confirm('작성 중인 내용이 있어요. 저장하지 않고 나가시겠어요?')) return;
      location.hash = target;
    });
  });

  /* checkin selection state kept in a local var on the composer node */
  var grid = document.getElementById('checkin-grid');
  var gaugeVal = document.getElementById('gauge-val');
  var gaugeRange = document.getElementById('gauge-range');
  var bodypick = document.getElementById('bodypick');
  /* 수정 화면을 열 때는 체크인 그리드/몸 그림이 기존 값으로 미리 선택된 채(is-sel) 그려지므로,
     그 표시를 그대로 초기값으로 읽어들인다(그렇지 않으면 다시 누르기 전까진 값이 비어 있게 됨). */
  var selectedCheckin = null;
  if(gaugeRange){ selectedCheckin = Number(gaugeRange.value); }
  else {
    var preSel = (grid && grid.querySelector('.checkin-opt.is-sel')) || (bodypick && bodypick.querySelector('button.is-sel'));
    if(preSel) selectedCheckin = preSel.getAttribute('data-checkin-val');
  }
  if(grid){
    grid.querySelectorAll('[data-checkin-val]').forEach(function(o){
      o.addEventListener('click', function(){
        selectedCheckin = o.getAttribute('data-checkin-val');
        grid.querySelectorAll('.checkin-opt').forEach(function(x){ x.classList.remove('is-sel'); });
        o.classList.add('is-sel');
      });
    });
  }
  if(bodypick){
    bodypick.querySelectorAll('[data-checkin-val]').forEach(function(o){
      o.addEventListener('click', function(){
        selectedCheckin = o.getAttribute('data-checkin-val');
        bodypick.querySelectorAll('button').forEach(function(x){ x.classList.remove('is-sel'); });
        o.classList.add('is-sel');
      });
    });
  }
  if(gaugeRange){
    gaugeRange.addEventListener('input', function(){
      selectedCheckin = Number(gaugeRange.value);
      gaugeVal.textContent = selectedCheckin+'%';
      var qwrap = document.getElementById('gauge-quick');
      if(qwrap) qwrap.querySelectorAll('button').forEach(function(b){ b.classList.toggle('is-sel', Number(b.getAttribute('data-gauge-val'))===selectedCheckin); });
    });
    var qwrap2 = document.getElementById('gauge-quick');
    if(qwrap2){
      qwrap2.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          selectedCheckin = Number(b.getAttribute('data-gauge-val'));
          gaugeRange.value = selectedCheckin;
          gaugeVal.textContent = selectedCheckin+'%';
          qwrap2.querySelectorAll('button').forEach(function(x){ x.classList.remove('is-sel'); });
          b.classList.add('is-sel');
        });
      });
    }
  }

  /* note type pills — 수정 화면을 열 때는 기존 타입이 미리 선택된 채(is-sel) 그려지므로
     그 표시를 초기값으로 읽어들인다. */
  var ntSet = document.getElementById('nt-set');
  var selectedNoteType = (ntSet && ntSet.querySelector('.nt-pill.is-sel')) ? ntSet.querySelector('.nt-pill.is-sel').getAttribute('data-nt') : null;
  if(ntSet){
    ntSet.querySelectorAll('[data-nt]').forEach(function(p){
      p.addEventListener('click', function(){
        var newType = p.getAttribute('data-nt');
        /* 생각 나눔(나눔 공간) 컴포저에서 '통찰 정리'로 들어가거나 나올 때는 필드 구성 자체가
           달라서(체크인/서식 편집기 ↔ 몇 번째 모임+질문 3개) 다시 그려야 한다 — 그 외 타입끼리
           바꾸는 건 지금까지처럼 다시 그리지 않고 클래스만 바꿔서 입력 중인 내용을 지키지 않는다. */
        var shareContainer = document.getElementById('share-composer');
        if(shareContainer && shareContainer.contains(ntSet)){
          var goingInsight = newType===NOTE_TYPE_INSIGHT.key;
          if(goingInsight !== shareComposerInsightMode){
            captureComposerDraft();
            shareComposerNoteType = newType;
            shareComposerInsightMode = goingInsight;
            render();
            return;
          }
          shareComposerNoteType = newType;
        }
        selectedNoteType = newType;
        ntSet.querySelectorAll('.nt-pill').forEach(function(x){ x.classList.remove('is-sel'); });
        p.classList.add('is-sel');
      });
    });
  }

  /* rich text toolbar */
  var noteEditor = document.getElementById('note-editor');
  bindRichTextToolbar(noteEditor);
  if(noteEditor){
    noteEditor.addEventListener('input', function(){
      if(noteEditor.innerHTML==='<br>'||noteEditor.textContent.trim()===''&&noteEditor.querySelectorAll('img,ol,ul,blockquote,pre').length===0){
        if(noteEditor.textContent.trim()==='') noteEditor.innerHTML='';
      }
    });
  }

  /* photo attach — 수정 화면을 열 때는 기존 사진이 미리보기 마크업으로 이미 그려져 있으니,
     그 img src를 그대로 읽어 notePhotoData를 채우고(수정 없이 저장해도 사진이 유지되도록)
     삭제 버튼에도 다시 이벤트를 걸어준다. */
  var photoPreview = document.getElementById('photo-preview');
  var existingThumbImg = photoPreview ? photoPreview.querySelector('img') : null;
  var notePhotoData = existingThumbImg ? {dataUrl:existingThumbImg.getAttribute('src'), mimeType:'image/jpeg'} : null;
  var photoPick = document.getElementById('btn-photo-pick');
  var photoInput = document.getElementById('note-photo-input');
  function renderPhotoPreview(){
    if(!photoPreview) return;
    photoPreview.innerHTML = notePhotoData ? '<div class="thumb"><img src="'+notePhotoData.dataUrl+'"><button type="button" id="btn-photo-remove">&times;</button></div>' : '';
    var rm = document.getElementById('btn-photo-remove');
    if(rm) rm.addEventListener('click', function(){ notePhotoData=null; renderPhotoPreview(); captureComposerDraft(); });
  }
  if(notePhotoData) renderPhotoPreview();
  if(photoPick && photoInput){
    photoPick.addEventListener('click', function(){ photoInput.click(); });
    photoInput.addEventListener('change', function(){
      var f = photoInput.files && photoInput.files[0];
      if(!f) return;
      if(!/^image\//.test(f.type)){ showToast('사진 파일만 첨부할 수 있어요.', true); return; }
      if(f.size > MAX_FILE_BYTES){ showToast('사진이 너무 커요. '+fmtSize(MAX_FILE_BYTES)+' 이하로 올려주세요.', true); return; }
      resizeNotePhotoDataUrl(f).then(function(dataUrl){
        notePhotoData = {dataUrl:dataUrl, mimeType:'image/jpeg'};
        renderPhotoPreview();
        captureComposerDraft();
      }).catch(function(){ showToast('사진을 처리하지 못했어요.', true); });
    });

  app.querySelectorAll('[data-edit-mine]').forEach(function(b){

      var entry = STATE.privateEntries[eid];
      if(!SESSION || !entry || entry.userId!==SESSION.userId) return;
      var editOwner=SESSION.userId, editKey=SESSION.keyB64;
      /* 상세보기 라우트에서는 컴포저가 안 그려지니 목록 라우트로 먼저 옮겨둔다(복호화는

      if(route.postId===eid){ location.hash = '#/book/'+entry.bookId+'/mine'; }
      ensureKey().then(function(key){
        if(!key) return;
        privateSessionGuard(editOwner,editKey);
        return decryptPrivateRecord(entry, key).then(function(text){
          privateSessionGuard(editOwner,editKey);
          var payload;
          try{ payload = JSON.parse(text); }catch(err){ payload = {html:null, text:text}; }
          return openComposerWithDraft('mine',entry.bookId,eid,function(){

            render();

        var book = bookById(route.bookId);
        var act = null;
        book.worksheet.activities.forEach(function(a){ if(a.key===actKey) act=a; });
        var data = collectWorksheetData(card, act);
        submitWorksheet(route.bookId, actKey, data, submitBtn, submitBtn.textContent);
      });
    }
  });
}
function collectWorksheetData(card, act){
  var data = {};
  if(act.type==='chips'){
    data.chips = Array.prototype.slice.call(card.querySelectorAll('[data-chip].is-sel')).map(function(c){ return c.getAttribute('data-chip'); });
    var note = card.querySelector('[data-ws-note]'); data.note = note?note.value.trim():'';
  } else if(act.type==='sentence'){
    var s = card.querySelector('[data-ws-sentence]'); data.text = s?s.value.trim():'';
  } else if(act.type==='note'){
    var n = card.querySelector('[data-ws-note]'); data.text = n?n.value.trim():'';
  } else if(act.type==='daily3'){
    var days=['월','화','수','목','금','토','일'];
    days.forEach(function(day){
      var m=card.querySelector('[data-ws-daily="'+day+'|morning"]');
      var d2=card.querySelector('[data-ws-daily="'+day+'|day"]');
      var e=card.querySelector('[data-ws-daily="'+day+'|evening"]');
      var row={morning:m?m.value.trim():'', day:d2?d2.value.trim():'', evening:e?e.value.trim():''};
      if(row.morning||row.day||row.evening) data[day]=row;
    });
  } else if(act.type==='week'){
    data.days = Array.prototype.slice.call(card.querySelectorAll('[data-ws-week] .is-sel')).map(function(d){ return Number(d.getAttribute('data-day')); });
    var note2 = card.querySelector('[data-ws-note]'); data.note = note2?note2.value.trim():'';
  } else if(act.type==='liturgy'){
    data.freq = {};
    card.querySelectorAll('[data-ws-liturgy-item]').forEach(function(seg){
      var item = seg.getAttribute('data-ws-liturgy-item');
      var sel = seg.querySelector('button.is-sel');
      data.freq[item] = sel ? sel.getAttribute('data-lv') : '거의 안함';
    });
    var note3 = card.querySelector('[data-ws-note]'); data.note = note3?note3.value.trim():'';
  } else if(act.type==='bodymap'){
    var bm = card.querySelector('[data-bodymap]');
    var zones = bm ? Array.prototype.slice.call(bm.querySelectorAll('.z-on')).map(function(n){ return n.getAttribute('data-zone'); }) : [];
    data.zones = zones.filter(function(v,i){ return zones.indexOf(v)===i; });
    var note4 = card.querySelector('[data-ws-note]'); data.note = note4?note4.value.trim():'';
  }
  return data;
}

/* 헤더 프로필 드롭다운: 메뉴 밖을 클릭하면 닫힘(전체 렌더 없이 hidden 속성만 토글) */

/* Capture edits and selections immediately; private text never goes to sessionStorage. */
['input','change','click'].forEach(function(eventName){

window.addEventListener('beforeunload',function(e){

    var draft=composerDrafts[key]; return SESSION && draft.userId===SESSION.userId && draft.unsaved;

/* Only the comment-thread location is retained by the legacy route helper. */

/* ---------------- 앱 설치 유도 배너 ----------------
   "링크 들어가면 바로 물어봐줄 수 있어?" 요청 반영 — 사이트에 들어오는 즉시(로그인 여부와 무관하게,
   #app 재렌더와도 무관하게 살아있도록 #app 밖에 붙인다) 설치를 권하는 카드를 띄운다.
   브라우저 정책상 사용자의 클릭 없이 설치 대화상자 자체를 강제로 띄우는 것은 막혀 있어(스팸성 권한
   요청 방지 — beforeinstallprompt는 제스처 없이도 발생하지만 그 이벤트의 prompt()는 반드시 사용자
   동작 안에서 호출해야 함) 완전한 "0번 클릭 자동 설치"는 불가능하지만, 이 카드가 들어오자마자 바로
   보이고 "설치하기" 버튼 한 번만 누르면 곧바로 진짜 설치 대화상자로 이어지므로 사실상 가장 가까운
   형태다. iOS Safari/Chrome은 beforeinstallprompt 자체를 지원하지 않아(2026년 기준에도 여전히 없음)
   프로그램적으로 설치를 띄울 방법이 없어, 이 경우엔 버튼 없이 "공유 → 홈 화면에 추가" 안내만 보여준다. */
(function(){
  try{
    // 이미 설치되어 실행 중이면(홈 화면 아이콘으로 열었을 때) 다시 권할 필요 없음.
    var alreadyInstalled = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    if(alreadyInstalled) return;
    // 사용자가 예전에 닫기(×)를 눌렀으면 다시 띄우지 않음(계속 뜨면 성가시므로).
    var dismissed = false;
    try{ dismissed = localStorage.getItem('growell_install_dismissed') === '1'; }catch(err){}
    if(dismissed) return;

    var ua = window.navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var deferredPrompt = null;

    function dismiss(banner){
      try{ localStorage.setItem('growell_install_dismissed', '1'); }catch(err){}
      if(banner && banner.parentNode) banner.parentNode.removeChild(banner);
    }

    function showBanner(kind){
      if(document.querySelector('.install-banner')) return; // 중복 방지
      var el = document.createElement('div');
      el.className = 'install-banner';
      var actionsHtml = kind === 'android'
        ? '<div class="install-banner-actions"><button type="button" class="install-banner-btn" id="install-banner-go">설치하기</button></div>'
        : '';
      el.innerHTML =
        '<div class="install-banner-head">' +
          '<div class="install-banner-icon"><img src="/covers/growell-icon-192.png" alt=""></div>' +
          '<div class="install-banner-body"><div class="install-banner-title">GROWELL 앱으로 설치하기</div></div>' +
          '<button type="button" class="install-banner-close" id="install-banner-close" aria-label="닫기">×</button>' +
        '</div>' +
        '<div class="install-banner-desc">' + (kind === 'android'
          ? '홈 화면에 추가하면 앱처럼 빠르게 열 수 있어요.'
          : '공유 버튼을 누른 뒤 "홈 화면에 추가"를 선택해보세요.') +
        '</div>' +
        actionsHtml;
      document.body.appendChild(el);
      var closeBtn = document.getElementById('install-banner-close');
      if(closeBtn) closeBtn.addEventListener('click', function(){ dismiss(el); });
      var goBtn = document.getElementById('install-banner-go');
      if(goBtn){
        goBtn.addEventListener('click', function(){
          if(!deferredPrompt){ dismiss(el); return; }
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(){
            deferredPrompt = null;
            dismiss(el);
          }).catch(function(){ dismiss(el); });
        });
      }
    }

    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      showBanner('android');
    });
    window.addEventListener('appinstalled', function(){
      try{ localStorage.setItem('growell_install_dismissed', '1'); }catch(err){}
      var b = document.querySelector('.install-banner');
      if(b && b.parentNode) b.parentNode.removeChild(b);
    });
    if(isIOS){
      // iOS는 beforeinstallprompt가 없어 즉시(제스처 이벤트를 기다리지 않고) 안내 카드를 보여준다 —
      // 어차피 우리가 프로그램적으로 설치를 트리거할 수 없으므로 기다릴 이유가 없음.
      showBanner('ios');
    }
  }catch(err){ /* 설치 배너는 부가 기능 — 실패해도 앱 부팅 자체는 계속 진행 */ }
})();

   빈 화면 없이 바로 이어지도록), 여기서는 데이터를 다 불러온 뒤 실제 화면으로 교체하기만 하면 된다. */

    return;
  }
  render();
});
})();
