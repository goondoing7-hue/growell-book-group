    .book-tab{flex:1; min-width:0; margin-right:0; padding:10px 0; font-size:11px; letter-spacing:-0.2px; text-align:center; overflow:hidden; text-overflow:ellipsis;}
    .timeline{grid-template-columns:1fr;}
    .tl-cover{width:72px;}
    .section-head{flex-direction:column; align-items:flex-start; gap:4px;}
    /* 모바일에서도 두 카드를 한 줄에 나란히 — 카드 안 여백/글자 크기를 줄여서 맞춘다. */
    .announce-grid{grid-template-columns:repeat(2,1fr); gap:10px;}
    .announce-card{padding:16px 14px;}
    .announce-icon-row{margin-bottom:8px; gap:6px;}
    .announce-icon{width:30px; height:30px;}
    .announce-icon svg{width:15px; height:15px;}
    .announce-label{font-size:10.5px; margin-bottom:4px;}
    /* 좁은 카드 폭(약 144px)에서도 라벨+값 3줄 구조는 자동으로 맞아떨어진다 — 글자 크기와
       마커 여백만 살짝 줄인다. */
    .announce-rows{column-gap:8px; row-gap:8px;}
    .announce-row-label mark{font-size:13.5px; padding:3px 8px 4px; border-radius:3px 9px 3px 9px;}
    .announce-row-value{font-size:13.5px; line-height:1.3;}
    .announce-note{font-size:11px;}
    .announce-meeting-badge{font-size:9.5px; padding:2px 6px;}
    .announce-head-right{width:100%;}
    .feed{max-width:none;}
    .feed-grid{gap:2px;}
    .feed-tile-head{padding:5px 6px;}
    .feed-tile-foot{padding:3px 6px 5px;}
    .feed-tile-name{font-size:10px;}
    .bodymap-wrap{flex-direction:column;}
    .contact-card{flex-direction:column; align-items:flex-start; text-align:left; padding:22px;}
    .checkin-grid{grid-template-columns:repeat(3,1fr);}
    .mat-link-row{grid-template-columns:1fr auto; grid-template-areas:"title remove" "url remove";}
    .mat-link-row .mat-link-title{grid-area:title;}
    .mat-link-row .mat-link-url{grid-area:url;}
    .mat-link-row .mat-link-remove{grid-area:remove;}
    .post-mat-link-title-text{font-size:12.5px;}
    .lp-thumb-wrap{width:92px;}
    .lp-title{font-size:12.5px;}
    .lp-info{padding:8px 10px;}
    .composer-foot{flex-direction:column; align-items:stretch;}
    .composer-foot .btn{width:100%;}
    .btn{min-height:42px;}
    input[type=text],input[type=password],textarea{font-size:16px;}
    .week-row{gap:4px;}
    .week-day{font-size:11px; padding:8px 0;}
    .liturgy-row{flex-direction:column; align-items:flex-start; gap:8px;}
    .seg{width:100%;}
    .seg button{flex:1;}
    .reading-split-row{flex-direction:column; gap:12px;}
    .reading-split-right{padding-left:0; padding-top:12px; border-left:none; border-top:1px solid var(--line);}
    .auth-wrap{margin:8px auto;}
    .auth-card{padding:22px 20px;}
    .note-meta{align-items:flex-start;}
    /* 35번 라운드 이후로는 모든 nt-pill이 항상 글자만으로 표시되므로(아이콘 자체를 안 그림),
       예전에 여기 있던 "모바일에서 아이콘만 남기고 글자 숨기기" 규칙은 더 이상 필요 없다. */
    .nt-pill{padding:7px 11px;}
    .rt-btn{width:40px; height:40px;}
    .rt-color-toggle{width:32px;}
  }
</style>

<body>
<!-- 초기 로딩 화면(boot-splash)을 JS가 아니라 정적 HTML에 처음부터 박아 넣음(요청 반영) — 예전엔
     이 화면이 하단의 <script>가 실행돼야 나타났는데, 특히 홈 화면에 설치한 PWA로 열 때는 OS가 먼저
     보여주는 자체 아이콘 스플래시가 끝난 뒤에도 스크립트가 로드/실행되는 짧은 순간 동안 빈 화면이 한
     번 더 보였음. 이 화면을 정적 HTML(+ 이미 <head>에 있는 CSS)로 옮겨두면 브라우저가 그릴 수 있는
     가장 이른 시점에 곧바로 이 화면부터 그려져서, OS 아이콘 스플래시 다음에 다른 화면(빈 화면 등) 없이
     바로 이 화면으로 이어짐. 데이터를 다 불러오면 아래 boot()가 이 자리를 실제 화면으로 교체한다. -->
<div id="app"><div class="boot-splash" role="status" aria-label="GROWELL을 불러오고 있어요">
  <div class="boot-splash-group">
  <img class="boot-splash-icon" src="/covers/growell-icon-192.png" alt="" width="192" height="192">
  <div class="boot-splash-text">

function bytesToB64(b){var bin='';for(var i=0;i<b.length;i++){bin+=String.fromCharCode(b[i]);}return btoa(bin);}

function fmtPostDate(ts,reference){

  function sameDay(a,b){return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();}

/* ---------------- rich text sanitizer (allowlist) ---------------- */
var RT_ALLOWED_TAGS = {B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,MARK:1,OL:1,UL:1,LI:1,BLOCKQUOTE:1,PRE:1,CODE:1,A:1,BR:1,DIV:1,SPAN:1,P:1,FONT:1};
var RT_DROP_ENTIRELY = {SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,BASE:1,SVG:1,MATH:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1,IMG:1,VIDEO:1,AUDIO:1,SOURCE:1,TRACK:1};
function rtSafeStyle(styleText){
  var out = [];
  (styleText||'').split(';').forEach(function(decl){
    var parts = decl.split(':');
    if(parts.length!==2) return;
    var key = parts[0].trim().toLowerCase();
    var val = parts[1].trim();
    if((key==='color'||key==='background-color') && /^(#[0-9a-fA-F]{3,8}|rgba?\([0-9.,\s%]+\)|[a-zA-Z]+)$/.test(val)){
      out.push(key+':'+val);
    }
  });
  return out.join(';');
}
function rtSanitizeNode(node){
  if(node.nodeType===3){ return [node.cloneNode()]; }
  if(node.nodeType!==1){ return []; }
  var tag = node.tagName;
  if(RT_DROP_ENTIRELY[tag]) return [];
  var children = [];
  Array.prototype.forEach.call(node.childNodes, function(c){ children = children.concat(rtSanitizeNode(c)); });
  if(!RT_ALLOWED_TAGS[tag]) return children;
  var el = document.createElement(tag.toLowerCase());
  if(tag==='A'){
    var href = node.getAttribute('href')||'';
    if(/^(https?:|mailto:)/i.test(href)){
      el.setAttribute('href', href);
      el.setAttribute('target','_blank');
      el.setAttribute('rel','noopener noreferrer');
    }
  }
  if(tag==='FONT'){
    var size = node.getAttribute('size');
    if(size && /^[1-7]$/.test(size)) el.setAttribute('size', size);
    var color = (node.getAttribute('color')||'').trim();
    if(color && !/[;:]/.test(color) && rtSafeStyle('color:'+color)==='color:'+color) el.setAttribute('color', color);
  }
  if(tag==='SPAN' || tag==='DIV' || tag==='FONT'){
    var style = node.getAttribute('style');
    if(style){ var safe = rtSafeStyle(style); if(safe) el.setAttribute('style', safe); }
  }
  children.forEach(function(c){ el.appendChild(c); });
  return [el];
}
function sanitizeHtml(html){
  var wrap = document.createElement('div');
  wrap.innerHTML = html || '';
  var out = document.createElement('div');
  Array.prototype.forEach.call(wrap.childNodes, function(c){
    rtSanitizeNode(c).forEach(function(n){ out.appendChild(n); });
  });
  return out.innerHTML;
}

   영상 ID만으로 항상 내려주는 고정 URL이라 즉시 뜨고, 제목은 유튜브 oEmbed(별도 키 없이

   자체는 정상 표시된다. */
var YT_ID_RE = /(?:youtube\.com\/(?:watch\?(?:[^"'\s<>]*&)?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i;
var ytOembedCache = {};
function youtubeIdFromHref(href){
  var m = YT_ID_RE.exec(href||'');

}
function ytThumbUrl(id){ return 'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg'; }
function fetchYoutubeTitle(id, href){
  if(ytOembedCache.hasOwnProperty(id)) return;
  ytOembedCache[id] = null; // 불러오는 중
  fetch('https://www.youtube.com/oembed?url='+encodeURIComponent(href)+'&format=json').then(function(res){
    return res && res.ok ? res.json() : null;
  }).then(function(data){
    ytOembedCache[id] = (data && data.title) ? data.title : false;
    var t = (typeof ytOembedCache[id]==='string') ? ytOembedCache[id] : '유튜브 영상';
    document.querySelectorAll('.link-preview-card[data-yt-id="'+id+'"] .lp-title').forEach(function(el){ el.textContent = t; });
  }).catch(function(){ ytOembedCache[id] = false; });
}
function enhanceLinkPreviews(){
  var anchors = document.querySelectorAll('.feed a[href]');
  Array.prototype.forEach.call(anchors, function(a){
    var href = a.getAttribute('href');

    a.className = 'link-preview-card';
    a.setAttribute('data-yt-id', id);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    var cached = ytOembedCache[id];
    var titleText = (typeof cached==='string') ? cached : '유튜브 영상';
    a.innerHTML = '<span class="lp-thumb-wrap"><img class="lp-thumb" src="'+ytThumbUrl(id)+'" alt="" loading="lazy"></span>' +
      '<span class="lp-info"><span class="lp-title">'+esc(titleText)+'</span><span class="lp-domain">youtube.com</span></span>';
    if(!ytOembedCache.hasOwnProperty(id)) fetchYoutubeTitle(id, href);
  });
}

/* ---------------- crypto ---------------- */
function randomSaltHex(){ return bytesToHex(crypto.getRandomValues(new Uint8Array(16))); }
function deriveKey(password, saltHex){
  var enc=new TextEncoder();
  var salt=hexToBytes(saltHex);
  return crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
  });
}
function keyVerifier(key){
  return crypto.subtle.exportKey('raw', key).then(function(raw){
    return crypto.subtle.digest('SHA-256', raw);
  }).then(function(d){ return bytesToHex(new Uint8Array(d)); });
}
function keyToB64(key){ return crypto.subtle.exportKey('raw', key).then(function(raw){ return bytesToB64(new Uint8Array(raw)); }); }
function keyFromB64(b64){ return crypto.subtle.importKey('raw', b64ToBytes(b64), {name:'AES-GCM'}, true, ['encrypt','decrypt']); }
function encryptText(key, text){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var enc=new TextEncoder();
  return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, enc.encode(text)).then(function(cipher){
    return {iv:bytesToB64(iv), data:bytesToB64(new Uint8Array(cipher))};
  });
}
function decryptText(key, ivB64, dataB64){
  var iv=b64ToBytes(ivB64); var data=b64ToBytes(dataB64);
  return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, data).then(function(buf){
    return new TextDecoder().decode(buf);
  });
}

function safePhotoUrl(value){
  if(typeof value!=='string') return null;
  var url=value.trim();
  if(!url || /[\u0000-\u0020<>"'`\\]/.test(url)) return null;
  if(/^data:image\/(?:jpeg|png|webp|gif);base64,[a-z0-9+/]+={0,2}$/i.test(url)) return url;
  if(!/^https?:\/\//i.test(url)) return null;
  try{var parsed=new URL(url);return (parsed.protocol==='https:' || parsed.protocol==='http:') && parsed.hostname && !parsed.username && !parsed.password?url:null;}catch(e){return null;}
}

   RLS가 본인 것만 돌려주므로 로그인 상태일 때만 함께 불러온다. */
function bootApp(){
  var flow=authFlowEpoch;
  loadOAuthProviderSettings();bindOAuthAuthWatcher();
  function guard(){if(flow!==authFlowEpoch)throw new Error('auth-flow-cancelled');}
  return finishOAuthCallback().then(function(){guard();return sb.auth.getSession();}).then(function(result){
    guard();
    if(!result.data || !result.data.session){SESSION=null;sharedPostsLoadState='idle';try{localStorage.removeItem('growell_session');}catch(e){}return null;}
    return sb.auth.getUser().then(function(verified){guard();if(verified.error||!verified.data||!verified.data.user)throw new Error('auth-verification-failed');return verified.data.user;});
  }).then(function(user){
    guard();if(!user)return;
    return sb.from('profiles').select('*').eq('auth_user_id',user.id).maybeSingle().then(async function(result){
      guard();if(result.error)throw new Error('profile-load-failed');
      var row=result.data,restored=null;
      try{restored=JSON.parse(localStorage.getItem('growell_session')||'null');}catch(e){}
      if(row && row.auth_user_id===user.id && !row.is_deleted && restored && restored.userId===row.id && typeof restored.keyB64==='string'){
        try{await keyFromB64(restored.keyB64);}catch(e){restored=null;}
        guard();
        if(restored){var profile=mapProfileRow(row);STATE.users[profile.id]=profile;SESSION={userId:profile.id,name:profile.name,keyB64:restored.keyB64,authKind:restored.authKind==='oauth'?'oauth':'password'};sharedPostsLoadState='idle';await loadMemberData();guard();return;}
      }
      SESSION=null;sharedPostsLoadState='idle';
      try{localStorage.removeItem('growell_session');}catch(e){}
      if(hasSocialIdentity(user))await prepareOAuthMember(user,flow);
    });
  }).catch(function(error){
    if(flow===authFlowEpoch && error.message!=='auth-flow-cancelled'){
      SESSION=null;sharedPostsLoadState='idle';
      oauthMessage=error.message==='oauth-cancelled'?'간편 로그인을 취소했어요. 다시 선택할 수 있어요.':
        error.message==='oauth-provider-failed'?'간편 로그인 서비스에 연결하지 못했어요. 잠시 후 다시 시도해주세요.':
        '로그인 연결을 마치지 못했어요. 다시 로그인해주세요.';
    }
  }).then(function(){BOOTING=false;});
}

/* A community read may finish after a saved post/profile edit. Compare against
   request-time contents, including in-place edits, instead of replacing newer
   local rows. Missing keys in the current map are deliberate local deletions. */
function communityCollectionSnapshot(collection){
  var snapshot=Object.create(null);
  Object.keys(collection||{}).forEach(function(id){snapshot[id]=JSON.stringify(collection[id]);});
  return snapshot;
}
function mergeCommunityCollection(remote,current,snapshot){
  var merged=Object.assign({},remote),owns=Object.prototype.hasOwnProperty;
  Object.keys(snapshot).forEach(function(id){if(!owns.call(current,id))delete merged[id];});
  Object.keys(current).forEach(function(id){
    if(!owns.call(snapshot,id)||JSON.stringify(current[id])!==snapshot[id])merged[id]=current[id];
  });
  return merged;
}
function loadCommunityForCurrentMember(){
  if(!SESSION||sharedPostsLoadState==='loading')return;
  var owner=SESSION.userId,epoch=saveSessionEpoch;sharedPostsLoadState='loading';
  var keys=['users','posts','comments','materialNotes','worksheets','bookLocks','announcement'],snapshots={};
  keys.forEach(function(key){snapshots[key]=communityCollectionSnapshot(STATE[key]);});
  var worksheetAdmin=false;
  function currentSession(){return SESSION&&SESSION.userId===owner&&saveSessionEpoch===epoch;}
  function mayReadWorksheets(){var user=STATE.users[owner];return worksheetAdmin&&currentSession()&&(!user||(user.isAdmin&&!user.isDeleted));}
  var profilesRequest=Promise.resolve(sb.from('profiles').select('*')).then(function(result){
    if(!currentSession())return result;
    if(!result||result.error||!Array.isArray(result.data))throw new Error('community-profile-load-failed');
    var profile=result.data.find(function(row){return row.id===owner;});
    worksheetAdmin=!!(profile&&profile.is_admin===true&&!profile.is_deleted);
    var roleRemoved=STATE.users[owner]&&STATE.users[owner].isAdmin&&!worksheetAdmin;
    // Fresh server permissions supersede cached roles without discarding local profile edits.
    if(STATE.users[owner]&&STATE.users[owner].isAdmin!==worksheetAdmin){
      STATE.users[owner].isAdmin=worksheetAdmin;
      if(snapshots.users[owner]){var baseline=JSON.parse(snapshots.users[owner]);baseline.isAdmin=worksheetAdmin;snapshots.users[owner]=JSON.stringify(baseline);}
    }
    if(!worksheetAdmin)STATE.worksheets={};
    if(roleRemoved)render();
    return result;
  });
  var worksheetsRequest=profilesRequest.then(function(){
    return mayReadWorksheets()?sb.from('worksheets').select('*'):{data:[],error:null};
  });
  var tables=['profiles','posts','comments','material_notes','worksheets','book_locks','announcement'];
  return Promise.all(tables.map(function(table){return table==='profiles'?profilesRequest:table==='worksheets'?worksheetsRequest:sb.from(table).select('*');})).then(function(results){
    if(!SESSION||SESSION.userId!==owner||saveSessionEpoch!==epoch)return;
    if(results.some(function(r){return !r||r.error||!Array.isArray(r.data);})){throw new Error('community-load-failed');}
    var users={};results[0].data.forEach(function(row){var user=mapProfileRow(row);users[user.id]=user;});
    users=mergeCommunityCollection(users,STATE.users,snapshots.users);
    var worksheetAccess=mayReadWorksheets();
    if(users[owner])users[owner].isAdmin=worksheetAccess;
    var posts={},comments={},materials={},worksheets={},locks={};
    results[1].data.forEach(function(r){posts[r.id]=mapPostRow(r,users);});
    results[2].data.forEach(function(r){comments[r.id]=mapCommentRow(r,users);});
    results[3].data.forEach(function(r){materials[r.id]=mapMaterialNoteRow(r,users);});
    if(worksheetAccess)results[4].data.forEach(function(r){worksheets[r.id]=mapWorksheetRow(r,users);});
    results[5].data.forEach(function(r){locks[r.book_id]=mapBookLockRow(r);});
    var a=results[6].data.find(function(r){return r.book_id==='global';});
    var announcement=a?{next:{date:a.next_date||'',time:a.next_time||'',place:a.next_place||'',note:a.next_note||''},reading:{bookId:a.reading_book_id||'emotion',meetingNo:a.reading_meeting_no||'',chapter:a.reading_chapter||'',range:a.reading_range||'',concept:a.reading_concept||'',note:a.reading_note||''}}:STATE.announcement;
    var merged={users:users,posts:mergeCommunityCollection(posts,STATE.posts,snapshots.posts),comments:mergeCommunityCollection(comments,STATE.comments,snapshots.comments),
      materialNotes:mergeCommunityCollection(materials,STATE.materialNotes,snapshots.materialNotes),worksheets:worksheetAccess?mergeCommunityCollection(worksheets,STATE.worksheets,snapshots.worksheets):{},
      bookLocks:mergeCommunityCollection(locks,STATE.bookLocks,snapshots.bookLocks),announcement:mergeCommunityCollection(announcement,STATE.announcement,snapshots.announcement)};
    keys.forEach(function(key){STATE[key]=merged[key];});
    sharedPostsLoadState='ready';render();
  }).catch(function(){if(SESSION&&SESSION.userId===owner&&saveSessionEpoch===epoch){sharedPostsLoadState='error';render();}});
}

   and standard/insight forms never share a draft. Memory is updated before rendering. */
var composerDrafts = Object.create(null);
var composerDraftWrites = Object.create(null);
var composerDraftPending = 0;
function composerDraftKey(type, bookId, editId, userId){
  return 'growell_draft_v33:'+JSON.stringify([userId, bookId, type, editId||'new']);
}
function composerEditId(type){ return type==='mine' ? mineEditingId : type==='materials' ? materialsEditingId : shareEditingId; }
function composerDraftStatus(key, message){
  var el = document.querySelector('[data-draft-key]');
  if(el && el.getAttribute('data-draft-key')===key){
    var status = el.querySelector('[data-draft-status]');
    if(status) status.textContent = message;
  }
}
function persistComposerDraft(key, draft){
  var version = (composerDraftWrites[key]||0)+1;
  composerDraftWrites[key] = version;
  var session = SESSION;
  if(!session || session.userId!==draft.userId || !session.keyB64){
    draft.status = '기록 잠금을 해제하면 이 기기에 임시 저장돼요.';
    draft.unsaved = true;
    composerDraftStatus(key, draft.status);
    return;
  }
  var json = JSON.stringify(draft);
  draft.status = '임시 저장 중…'; draft.unsaved = true;
  composerDraftStatus(key, draft.status);
  composerDraftPending++;
  keyFromB64(session.keyB64).then(function(k){ return encryptText(k, json); }).then(function(encrypted){
    if(composerDraftWrites[key]!==version) return;
    localStorage.setItem(key, JSON.stringify({v:1, iv:encrypted.iv, data:encrypted.data}));
    draft.status = '이 기기에 임시 저장됨'; draft.unsaved = false;
    composerDraftStatus(key, draft.status);
  }).catch(function(){
    if(composerDraftWrites[key]!==version) return;
    draft.status = '임시 저장 실패 · 화면을 닫기 전에 다시 저장해주세요.';
    draft.unsaved = true;
    composerDraftStatus(key, draft.status);
  }).then(function(){ composerDraftPending--; });
}
function captureComposerDraft(){

  var mode = el.getAttribute('data-draft-mode');

  var selected = function(selector, attr){ var n=el.querySelector(selector); return n ? n.getAttribute(attr) : ''; };
  var photo = el.querySelector('#photo-preview img');
  var gauge = el.querySelector('#gauge-range');
  var editor = el.querySelector('#note-editor');
  var fields = {noteType:selected('.nt-pill.is-sel','data-nt')||null,
    title:field('note-title'), page:field('note-page'), html:editor ? editor.innerHTML : '',
    photo:photo ? {dataUrl:photo.getAttribute('src'), mimeType:'image/jpeg'} : null,
    checkin:gauge ? Number(gauge.value) : (selected('[data-checkin-val].is-sel','data-checkin-val')||null),

    driveLinks:Array.prototype.map.call(el.querySelectorAll('[data-mat-link-row]'),materialLinkFromRow)};
  var draft = composerDrafts[key] || {userId:SESSION.userId, bookId:el.getAttribute('data-book'), type:type,
    editId:el.getAttribute('data-draft-edit')||null, variants:{}, revision:0};
  if(draft.activeMode===mode && JSON.stringify(draft.variants[mode])===JSON.stringify(fields)) return {key:key, revision:draft.revision, mode:mode};
  draft.variants[mode] = fields; draft.activeMode = mode; draft.revision++; draft.updatedAt=Date.now();
  composerDrafts[key] = draft;
  persistComposerDraft(key, draft);
  return {key:key, revision:draft.revision, mode:mode};
}
function loadComposerDraft(type, bookId, editId){
  var session=SESSION;
  if(!session) return Promise.resolve(null);
  var key=composerDraftKey(type,bookId,editId,session.userId);
  if(composerDrafts[key]) return Promise.resolve(composerDrafts[key]);
  var raw;
  try{ raw=localStorage.getItem(key); }catch(e){}
  if(!raw) return Promise.resolve(null);
  if(!session.keyB64) return Promise.reject(new Error('draft-locked'));
  return keyFromB64(session.keyB64).then(function(k){
    var encrypted=JSON.parse(raw);
    return decryptText(k,encrypted.iv,encrypted.data);
  }).then(function(text){
    var draft=JSON.parse(text);
    if(!SESSION || SESSION.userId!==session.userId || draft.userId!==session.userId || draft.bookId!==bookId || draft.type!==type || (draft.editId||null)!==(editId||null) || !draft.variants) return null;
    draft.status='임시 저장한 글을 불러왔어요'; draft.unsaved=false;
    composerDrafts[key]=draft;
    return draft;
  });
}

}
/* Recovery also rewraps this member's local drafts; unreadable drafts remain intact. */
async function migratePrivateDraftKeys(legacyKeyB64s){
  var session=SESSION;
  if(!session || !session.keyB64) return {migrated:0,unreadable:0};
  var userId=session.userId, material=session.keyB64, prefix='growell_draft_v33:';
  captureComposerDraft();
  var draftKeys=Object.keys(composerDrafts), result={migrated:0,unreadable:0};
  try{ for(var i=0;i<localStorage.length;i++){ var stored=localStorage.key(i); if(stored && stored.indexOf(prefix)===0 && draftKeys.indexOf(stored)<0) draftKeys.push(stored); } }catch(e){ return {migrated:0,unreadable:1}; }
  var passwordKey=await keyFromB64(material), decryptKeys=[passwordKey];
  for(var oldMaterial of (legacyKeyB64s||[])){
    if(oldMaterial===material) continue;
    try{ decryptKeys.push(await keyFromB64(oldMaterial)); }catch(e){}
  }
  for(var key of draftKeys){
    var identity;
    try{ identity=JSON.parse(key.slice(prefix.length)); }catch(e){continue;}
    if(key.indexOf(prefix)!==0 || !Array.isArray(identity) || identity[0]!==userId) continue;
    if(!SESSION || SESSION.userId!==userId || SESSION.keyB64!==material) break;
    var raw, memory=composerDrafts[key], decoded=null, alreadyCurrent=false;
    var version=composerDraftWrites[key]||0;
    try{
      raw=localStorage.getItem(key);
      if(raw){
        var box=JSON.parse(raw);
        for(var candidate=0;candidate<decryptKeys.length;candidate++){
          try{ decoded=JSON.parse(await decryptText(decryptKeys[candidate],box.iv,box.data)); alreadyCurrent=candidate===0; break; }catch(e){}
        }
        if(!decoded || decoded.userId!==userId || decoded.bookId!==identity[1] || decoded.type!==identity[2] || (decoded.editId||'new')!==identity[3] || !decoded.variants){result.unreadable++;continue;}
      }
      var draft=memory && (!decoded || (memory.updatedAt||0)>=(decoded.updatedAt||0)) ? memory : decoded;
      if(!draft) continue;
      if((composerDraftWrites[key]||0)!==version) continue;
      if(alreadyCurrent && (!memory || (memory.revision===decoded.revision && JSON.stringify(memory.variants)===JSON.stringify(decoded.variants)))){
        if(memory){memory.unsaved=false;memory.status='이 기기에 임시 저장됨';composerDraftStatus(key,memory.status);}
        continue;
      }
      version++;composerDraftWrites[key]=version;
      var encrypted=await encryptText(passwordKey,JSON.stringify(draft));
      if(!SESSION || SESSION.userId!==userId || SESSION.keyB64!==material) break;
      if(composerDraftWrites[key]!==version) continue;
      if(localStorage.getItem(key)!==raw){result.unreadable++;continue;}
      localStorage.setItem(key,JSON.stringify({v:1,iv:encrypted.iv,data:encrypted.data}));
      draft.unsaved=false;draft.status='이 기기에 임시 저장됨';composerDrafts[key]=draft;
      composerDraftStatus(key,draft.status);result.migrated++;
    }catch(e){ result.unreadable++; }
  }
  return result;
}
/* Call only after a successful server save. A newer draft is kept if typing continued. */
function finishComposerDraft(type, bookId, editId, userId, token){
  var key=composerDraftKey(type,bookId,editId,userId || (SESSION && SESSION.userId));
  var el=document.querySelector('[data-draft-key]');
  if(el && el.getAttribute('data-draft-key')===key) captureComposerDraft();
  var draft=composerDrafts[key];
  if(token && draft && token.revision!==draft.revision) return false;
  composerDraftWrites[key]=(composerDraftWrites[key]||0)+1;
  var otherMode=token && token.mode==='insight' ? 'standard' : 'insight';
  var other=draft && draft.variants[otherMode];
  if(other && (other.title || stripHtml(other.html||'').trim() || other.photo || other.meetingNo || other.q1 || other.q2 || other.q3)){
    delete draft.variants[token ? token.mode : draft.activeMode];
    draft.activeMode=otherMode; draft.revision++;
    persistComposerDraft(key,draft);
    if(el && el.getAttribute('data-draft-key')===key) el._draftCommitted=true;
    return !el || el.getAttribute('data-draft-key')===key;
  }
  delete composerDrafts[key];
  try{ localStorage.removeItem(key); sessionStorage.removeItem('growell_draft'); }catch(e){}
  if(el && el.getAttribute('data-draft-key')===key) el._draftCommitted=true;
  return !el || el.getAttribute('data-draft-key')===key;
}
/* 컴포저(작성/수정 창)가 하나라도 열려 있으면 "작성 중"으로 본다 — 새 글쓰기든 수정이든
   똑같이 취급해달라는 요청 반영. 라우트가 바뀔 때(다른 탭/다른 책/다른 글 상세 등으로
   이동) 이 함수로 열려 있는 컴포저가 있는지 확인해 (1) 링크를 누르는 시점엔 정말 나갈지
   한 번 물어보고, (2) 실제로 이동해버린 뒤에는(뒤로가기 등, 물어볼 기회가 없던 경우) 남아
   있던 컴포저 상태를 조용히 닫아 다음에 그 화면으로 돌아왔을 때 항상 닫힌 채로 보이게 한다. */

   조용히 닫는다(사용자가 이미 이동을 마친 뒤라 다시 물어볼 수 없음 — 뒤로가기 등). */
function closeStaleComposersForRoute(r){
  if(shareComposerOpenFor!=null){
    var stillShare = (r.view==='book' && r.bookId===shareComposerOpenFor && (!r.tab || r.tab==='share') && !r.postId);
    if(!stillShare) resetShareComposer();
  }
  if(mineComposerOpenFor!=null){
    var stillMine = (r.view==='book' && r.bookId===mineComposerOpenFor && r.tab==='mine' && !r.postId);
    if(!stillMine) resetMineComposer();
  }
  if(materialsComposerOpenFor!=null){
    var stillMat = (r.view==='book' && r.bookId===materialsComposerOpenFor && r.tab==='materials' && !r.postId);
    if(!stillMat) resetMaterialsComposer();
  }
  if(habitFormOpenFor!=null){
    var stillHabit = (r.view==='book' && r.bookId===habitFormOpenFor && r.tab==='habit' && !r.postId);
    if(!stillHabit){ habitFormOpenFor=null; habitEditingId=null; }
  }
  if(habitHistoryOpenFor!=null){
    var stillHabitTab = (r.view==='book' && r.tab==='habit' && !r.postId);
    if(!stillHabitTab){ habitHistoryOpenFor=null; habitHistoryMonth=null; }
  }
  if(readingHistoryOpenFor!=null){
    var stillReadingHistory = (r.view==='book' && r.bookId===readingHistoryOpenFor && r.tab==='mine' && !r.postId);
    if(!stillReadingHistory) readingHistoryOpenFor=null;
  }
}

try{
  /* every save() publishes a brand new document and the runtime reloads every open
     view (this tab included) to it — which resets location.hash to the artifact's
     base URL. growell_route was stashed right before that reload so we can put the
     visitor back on the page they were on, instead of always landing on 홈. */
  var savedRoute = sessionStorage.getItem('growell_route');
  if(savedRoute){ sessionStorage.removeItem('growell_route'); }
  var rd = sessionStorage.getItem('growell_draft');
  if(rd){

    pendingDraft = legacyDraft.openComment ? {route:legacyDraft.route, openComment:legacyDraft.openComment} : null;
    sessionStorage.removeItem('growell_draft');
  }
  if(savedRoute && (!location.hash || location.hash==='#' || location.hash==='#/')){
    location.hash = savedRoute;
  }
  if(pendingDraft && pendingDraft.openComment){ openComments[pendingDraft.openComment] = true; }

/* ---------------- routing ---------------- */
function currentRoute(){
  var h = location.hash.replace(/^#\/?/,'');
  if(!h) return {view:'home'};
  var parts = h.split('/');
  if(parts[0]==='book' && parts[1]){
    var br = {view:'book', bookId:parts[1], tab:parts[2]||'share'};
    if(parts[3]==='post' && parts[4]){ br.postId = parts[4]; }
    return br;
  }
  if(parts[0]==='login'){ return {view:'login'}; }
  if(parts[0]==='about'){ return {view:'about'}; }
  if(parts[0]==='community'){
    return {view:'community', postId:parts[1]==='post' ? parts[2] : null, page:Math.max(1, parseInt(parts[1],10)||1)};
  }
  if(parts[0]==='admin' && parts[1]==='users'){ return {view:'admin-users'}; }
  if(parts[0]==='profile' && parts[1]==='edit'){ return {view:'profile-edit'}; }
  return {view:'home'};
}
window.addEventListener('hashchange', function(){
  readingHistoryRouteVersion++;
  /* 이동을 막을 기회가 없었던 경우(뒤로가기 등)를 위한 안전망 — 이미 다른 화면으로
     넘어와버렸다면, 원래 있던 곳이 아닌 이상 열려 있던 작성/수정 창을 조용히 닫는다. */
  closeStaleComposersForRoute(currentRoute());
  render();
});

   (요청 반영: "수정하다가 다른 곳으로 가면 수정 안하겠냐고 물어보기" — 새 글쓰기도 동일하게
   취급). capture 단계에서 한 번만 등록해두면 매 render()마다 다시 그려지는 링크들도 모두
   걸러진다(각 링크에 개별로 리스너를 달 필요가 없음). 컴포저 자체 안의 링크(있다면)는 예외. */
document.addEventListener('click', function(e){
  if(!anyComposerOpen()) return;
  var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
  if(!a) return;
  if(a.closest('.composer')) return;
  if(a.getAttribute('href')===location.hash) return;
  if(!confirm('작성 중인 내용이 있어요. 저장하지 않고 나가시겠어요?')){
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

function loadMemberData(){
  if(!SESSION) return Promise.resolve(false);
  var expected = {userId:SESSION.userId, epoch:saveSessionEpoch};
  memberLoadState = {privateEntries:'loading', habits:'loading', readingLogs:'loading', readingMeta:'loading'};
  var specs = [
    {key:'privateEntries', table:'private_entries', map:mapPrivateEntryRow},
    {key:'habits', table:'habits', map:mapHabitRow},
    {key:'readingLogs', table:'reading_logs', map:mapReadingLogRow},
    {key:'readingMeta', table:'reading_meta', map:function(row){return mapReadingMetaRow(row,STATE.users);}, itemKey:function(item){return readingMetaKey(item.bookId,item.userId);}}
  ];
  return Promise.all(specs.map(function(spec){
    return Promise.resolve().then(function(){ return sb.from(spec.table).select('*').eq('user_id', expected.userId); }).then(function(res){
      if(!saveSessionMatches(expected)) return false;
      if(!res || res.error || !Array.isArray(res.data)) throw new Error('member-data-load-failed');
      var next = {};
      res.data.forEach(function(row){ var item=spec.map(row); if(item.userId===expected.userId) next[spec.itemKey ? spec.itemKey(item) : item.id]=item; });
      STATE[spec.key] = next;
      memberLoadState[spec.key] = 'ready';
      return true;
    }).catch(function(){
      if(saveSessionMatches(expected)) memberLoadState[spec.key] = 'error';
      return false;
    });
  })).then(function(results){ return results.every(function(ok){ return ok; }); });
}

function diffDict(prevDict, nextDict){
  var added=[], changed=[], removed=[], k;
  for(k in nextDict){ if(!(k in prevDict)) added.push(k); else if(JSON.stringify(nextDict[k])!==JSON.stringify(prevDict[k])) changed.push(k); }
  for(k in prevDict){ if(!(k in nextDict)) removed.push(k); }
  return {added:added, changed:changed, removed:removed};
}

/* payload.photo.dataUrl이 아직 base64(data:...)면 Storage에 올리고 공개 URL로 바꿔치기한다.
   이미 URL(수정 화면에서 사진을 안 바꾼 경우)이면 그대로 둔다 — 렌더 코드는 이 자리가
   base64든 URL이든 <img src="...">로 똑같이 쓰므로 신경 쓸 필요가 없다. */
function uploadPhotoIfNeeded(bucket, ownerId, id, photo){
  if(!photo || !photo.dataUrl || !/^data:/.test(photo.dataUrl)) return Promise.resolve(photo);
  var commaIdx = photo.dataUrl.indexOf(',');
  var meta = photo.dataUrl.slice(0, commaIdx);
  var b64 = photo.dataUrl.slice(commaIdx+1);
  var mimeMatch = /data:(.*?);base64/.exec(meta);
  var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  var ext = (mime.split('/')[1]||'jpg').replace(/[^a-z0-9]/gi,'') || 'jpg';
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var path = ownerId+'/'+id+'-'+Date.now()+'.'+ext;
  return sb.storage.from(bucket).upload(path, bytes, {contentType:mime, upsert:true}).then(function(res){
    if(res.error) throw res.error;
    var pub = sb.storage.from(bucket).getPublicUrl(path);
    return {dataUrl: pub.data.publicUrl, mimeType: mime};
  });
}

function saveState(mutateFn, opts){
  opts = opts || {};
  if(!SESSION){ showToast('로그인이 필요해요.', true); return Promise.resolve(false); }
  if(opts.button){ opts.button.disabled = true; opts.button.textContent = opts.savingLabel || '저장 중…'; }
  return new Promise(function(resolve){
    saveQueue.push({mutateFn:mutateFn, opts:opts, userId:SESSION.userId, epoch:saveSessionEpoch, resolve:resolve});
    drainSaveQueue();
  });
}
function drainSaveQueue(){
  if(activeSave || !saveQueue.length) return;
  var job = saveQueue.shift();
  if(!saveSessionMatches(job)){ finishSaveButton(job.opts); job.resolve(false); drainSaveQueue(); return; }
  saving = true;
  activeSave = job;
  job.done = Promise.resolve().then(function(){ return performSave(job); }).then(function(ok){
    finishSaveButton(job.opts);
    job.resolve(ok);
  }).catch(function(err){
    finishSaveButton(job.opts);
    if(saveSessionMatches(job)){
      showToast('저장에 실패했어요. 다시 시도해주세요.', true);
      if(job.opts.onFailure) job.opts.onFailure(err);
    }
    job.resolve(false);
  }).then(function(){
    activeSave = null;
    saving = false;
    drainSaveQueue();
  });
}
function matchingReadingLog(actual,expected){
  if(!actual || actual.id!==expected.id || actual.book_id!==expected.book_id || actual.user_id!==expected.user_id) return false;
  var sameNumber=function(a,b){return a!=null && b!=null && Number.isFinite(Number(a)) && Number.isFinite(Number(b)) && Number(a)===Number(b);};
  return sameNumber(actual.seconds,expected.seconds) && sameNumber(actual.page,expected.page) && sameNumber(actual.created_at,expected.created_at)
    && (actual.start_page==null && expected.start_page==null || sameNumber(actual.start_page,expected.start_page));
}
/* A reading session keeps its ID across retries. Inserts remain immutable; a lost
   response or later metadata failure may leave this exact row already committed. */
function insertReadingLogOnce(row,guard){
  return Promise.resolve().then(function(){
    guard();
    return sb.from('reading_logs').insert(row);
  }).then(function(result){
    if(!result || result.error) throw result && result.error || new Error('reading-log-insert-failed');
  }).catch(function(insertError){
    guard();
    return sb.from('reading_logs').select('*').eq('id',row.id).eq('user_id',row.user_id).maybeSingle().then(function(result){
      guard();
      if(!result || result.error || !matchingReadingLog(result.data,row)) throw insertError;
    });
  });
}
function readingAuthError(err){
  return !!err && (err.status===401 || err.status===403 || ['42501','PGRST301','PGRST303'].indexOf(err.code)>=0);
}
function readingLoginRequired(){return new Error('reading-login-required');}
function readingSessionUnavailable(err){
  return !!err && (err.name==='AuthSessionMissingError' || err.status>=400 && err.status<500 && err.status!==429);
}
/* The visible member cache is not an Auth session. Check the actual SDK session
   before sending a preserved reading record; never write it under another user. */
function ensureReadingSaveSession(job,forceRefresh){
  function guard(){if(!saveSessionMatches(job))throw new Error('save-session-changed');}
  function verify(session){
    guard();
    var member=STATE.users[job.userId];
    if(!session || !session.user || !session.access_token)throw readingLoginRequired();
    if(!member || !member.authUserId || session.user.id!==member.authUserId)throw readingLoginRequired();
    return session;
  }
  function refresh(){
    guard();
    return sb.auth.refreshSession().then(function(result){
      guard();
      if(result.error){
        if(readingSessionUnavailable(result.error))throw readingLoginRequired();
        throw result.error;
      }
      return verify(result.data && result.data.session);
    });
  }
  return Promise.resolve().then(function(){
    guard();
    return sb.auth.getSession();
  }).then(function(result){
    guard();
    if(result.error)throw readingSessionUnavailable(result.error)?readingLoginRequired():result.error;
    var session=result.data && result.data.session;
    if(session)verify(session);
    if(forceRefresh || !session || Number(session.expires_at)<=Math.floor(Date.now()/1000)+60)return refresh();
    return session;
  });
}
function performSave(job){
  var opts = job.opts;
  function guard(){ if(!saveSessionMatches(job)) throw new Error('save-session-changed'); }
  guard();
  var previous = JSON.parse(JSON.stringify(STATE));
  var next = JSON.parse(JSON.stringify(previous));
  Object.keys(opts.expectedPrivateEntries||{}).forEach(function(id){
    var current=previous.privateEntries[id];
    if(opts.expectedPrivateLocalData){
      var hadLocal=Object.prototype.hasOwnProperty.call(opts.expectedPrivateLocalData,id);
      if(hadLocal ? (!current || current.data!==opts.expectedPrivateLocalData[id]) : !!current) throw new Error('private-record-conflict');
    } else if(current && current.data!==opts.expectedPrivateEntries[id]) throw new Error('private-record-conflict');
  });
  job.mutateFn(next);
  try{
    sessionStorage.setItem('growell_route', location.hash);
    if(SESSION) localStorage.setItem('growell_session', JSON.stringify(SESSION));
    if(opts.draft) sessionStorage.setItem('growell_draft', JSON.stringify(opts.draft));
  }catch(e){}

  var work = Promise.resolve();
  if(opts.readingSession)work=work.then(function(){return ensureReadingSaveSession(job,false);});

  Object.keys(GENERIC_COLLECTIONS).forEach(function(key){
    var spec = GENERIC_COLLECTIONS[key];
    var d = diffDict(STATE[key], next[key]);
    d.added.concat(d.changed).forEach(function(id){
      var row = next[key][id];
      var isNew = d.added.indexOf(id)>=0;
      var comparePrivate = key==='privateEntries' && opts.expectedPrivateEntries && Object.prototype.hasOwnProperty.call(opts.expectedPrivateEntries,id);
      if(comparePrivate) isNew=false;
      work = work.then(function(){
        guard();
        if(spec.photoField && row[spec.photoField]){
          /* Storage 버킷 정책은 "폴더 이름[1] = auth.uid()"만 허용한다(프로필의 자체 id인
             row.userId, 예:"u_xxx"가 아니라 Supabase Auth의 실제 사용자 UUID). 그래서 업로드
             경로의 소유자 폴더는 반드시 글쓴이의 authUserId여야 한다 — 예전엔 row.userId를
             그대로 써서 모든 사진 첨부가 RLS에 막혀 조용히 실패했었다(사진 없이도 글쓰기 자체는
             되니 눈치채기 어려웠음). */
          var ownerAuthId = (STATE.users[row.userId] && STATE.users[row.userId].authUserId) || row.userId;
          return uploadPhotoIfNeeded(spec.bucket, ownerAuthId, id, row[spec.photoField]).then(function(photo){
            row[spec.photoField] = photo;
          });
        }
      }).then(function(){
        guard();
        if(isNew){
          if(spec.noInsert) return;
          if(key==='readingLogs') return insertReadingLogOnce(spec.toRow(row),guard);
          return sb.from(spec.table).insert(spec.toRow(row)).then(function(res){ if(res.error) throw res.error; });
        }
        if(spec.noUpdate) return;
        var patch = spec.toRow(row);
        delete patch.id;
        if(comparePrivate){
          var expectedIV = (opts.expectedPrivateIVs||{})[id] || (previous.privateEntries[id]||{}).iv;
          if(!expectedIV) throw new Error('private-record-conflict');
          return sb.from(spec.table).update(patch).eq('id',id).eq('iv',expectedIV).select('id').maybeSingle().then(function(res){
            if(res.error) throw res.error;
            if(!res.data || res.data.id!==id) throw new Error('private-record-conflict');
          });
        }
        return sb.from(spec.table).update(patch).eq('id', id).then(function(res){ if(res.error) throw res.error; });
      });
    });
    d.removed.forEach(function(id){
      if(spec.noDelete) return;
      work = work.then(function(){
        guard();
        return sb.from(spec.table).delete().eq('id', id).then(function(res){ if(res.error) throw res.error; });
      });
    });
  });

  // readingMeta: 합성 키(bookId_userId) — (book_id,user_id) 유니크 기준 upsert
  (function(){
    var d = diffDict(STATE.readingMeta, next.readingMeta);
    d.added.concat(d.changed).forEach(function(key){
      var m = next.readingMeta[key];
      work = work.then(function(){
        guard();
        return sb.from('reading_meta').upsert(
          {book_id:m.bookId, user_id:m.userId, current_page:m.currentPage||0, updated_at:m.updatedAt},
          {onConflict:'book_id,user_id'}
        ).then(function(res){ if(res.error) throw res.error; });
      });
    });
  })();

  // bookLocks: 딕셔너리 키가 곧 book_id
  (function(){
    var d = diffDict(STATE.bookLocks, next.bookLocks);
    d.added.concat(d.changed).forEach(function(bookId){
      var bl = next.bookLocks[bookId];
      work = work.then(function(){
        guard();
        return sb.from('book_locks').upsert(
          {book_id:bookId, locked:!!bl.locked, note:bl.note||''},
          {onConflict:'book_id'}
        ).then(function(res){ if(res.error) throw res.error; });
      });
    });
  })();

  // announcement: 사이트 전체에 하나뿐인 싱글턴(book_id='global')
  (function(){
    if(JSON.stringify(STATE.announcement)===JSON.stringify(next.announcement)) return;
    var a = next.announcement;
    work = work.then(function(){
      guard();
      return sb.from('announcement').upsert({
        book_id:'global',
        next_date:a.next.date||'', next_time:a.next.time||'', next_place:a.next.place||'', next_note:a.next.note||'',
        reading_book_id:a.reading.bookId||'emotion', reading_meeting_no:a.reading.meetingNo||'',
        reading_chapter:a.reading.chapter||'', reading_range:a.reading.range||'', reading_concept:a.reading.concept||'', reading_note:a.reading.note||''
      }, {onConflict:'book_id'}).then(function(res){ if(res.error) throw res.error; });
    });
  })();

  return work.then(function(){
    guard();
    // 저장 중 완료된 기록 조회를 덮어쓰지 않고 이번 작업이 바꾼 항목만 합친다.
    Object.keys(next).forEach(function(key){
      if(key==='announcement'){
        if(JSON.stringify(previous[key])!==JSON.stringify(next[key])) STATE[key]=next[key];
        return;
      }
      var d=diffDict(previous[key], next[key]);
      d.added.concat(d.changed).forEach(function(id){ STATE[key][id]=next[key][id]; });
      d.removed.forEach(function(id){ delete STATE[key][id]; });
    });
    if(opts.render!==false) render();
    if(opts.onSuccess){ try{ opts.onSuccess(); }catch(e){ showToast('저장은 완료됐어요. 화면을 다시 열어 확인해주세요.', true); } }
    return true;
  }).catch(function(err){
    if(opts.readingSession && !job.readingAuthRetried && readingAuthError(err) && saveSessionMatches(job)){
      job.readingAuthRetried=true;
      return ensureReadingSaveSession(job,true).then(function(){return performSave(job);}).catch(failed);
    }
    return failed(err);
  });
  function failed(err){
    if(saveSessionMatches(job)){
      showToast('저장에 실패했어요. 다시 시도해주세요.', true);
      if(opts.onFailure) opts.onFailure(err);
    }
    return false;
  }
}

/* ---------------- toast ---------------- */
function showToast(msg, isErr){
  var stack = document.getElementById('toast-stack');
  if(!stack){ stack = document.createElement('div'); stack.id='toast-stack'; stack.className='toast-stack'; document.body.appendChild(stack); }
  var t = document.createElement('div'); t.className = 'toast'+(isErr?' err':''); t.textContent = msg;
  stack.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3600);
}

/* ---------------- auth actions (Supabase Auth) ----------------
   로그인 검증 자체는 더 이상 클라이언트가 하지 않는다 — Supabase Auth가 비밀번호를 서버에서만
   비교한다(signInWithPassword). 아이디(loginId)는 실제 이메일이 없으니 "아이디@growell.internal"
   더미 이메일로 매핑해서 쓴다. deriveKey(PBKDF2)는 이제 로그인 검증용이 아니라 오직 나의 공간
   (privateEntries) 암호화 키를 만드는 데만 쓰인다 — 그 키는 절대 서버로 전송되지 않는다. */
function loginEmailFor(loginId){ return loginId + '@growell.internal'; }

function callEdgeFunction(name, body, accessToken){
  var headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (accessToken || SUPABASE_ANON_KEY)
  };
  return fetch(SUPABASE_URL + '/functions/v1/' + name, {method:'POST', headers:headers, body:JSON.stringify(body||{})})
    .then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(json){
        json.__status = res.status;
        return json;
      });
    });
}

function doSignup(name, id, pw, pw2, hint, adminCode, avatar, btn){
  id = id.trim().toLowerCase();
  name = name.trim();
  hint = (hint||'').trim();
  if(!name || !id || !pw){ showToast('별명, 아이디, 비밀번호를 모두 입력해주세요.', true); return; }
  if(name.length>30){ showToast('별명은 30자 이내로 입력해주세요.', true); return; }
  /* 아이디는 내부적으로 "아이디@growell.internal" 이메일로 바뀌어 Supabase Auth에 등록되는데,
     이메일 로컬 파트에 한글 등 비ASCII 문자가 들어가면 "invalid format"으로 매번 거절당한다 —
     그래서 영문/숫자/밑줄/하이픈만 허용하도록 미리 걸러서 안내한다. */
  if(!/^[a-z0-9_-]+$/i.test(id)){ showToast('아이디는 영문, 숫자, -, _ 만 사용할 수 있어요.', true); return; }
  /* Supabase Auth 프로젝트 기본 정책이 비밀번호 최소 길이를 요구해서(보통 6자 이상), 예전 기준인
     4자로는 서버(auth.admin.createUser)에서 거절당해 가입 자체가 항상 실패했었다 — 여유 있게
     8자 이상으로 올려서 이 문제를 막는다. */
  if(pw.length<8){ showToast('비밀번호는 8자 이상으로 만들어주세요.', true); return; }
  if(pw!==pw2){ showToast('비밀번호가 서로 달라요. 다시 확인해주세요.', true); return; }
  /* 힌트는 비밀번호를 잊었을 때 본인 확인용 — 나중에 아무도(운영자 포함) 대신 알려줄 수
     없으므로 가입 시점에 반드시 받아둔다. */
  if(!hint){ showToast('비밀번호 힌트를 입력해주세요. 나중에 비밀번호를 잊었을 때 필요해요.', true); return; }
  var dup = false;
  for(var k in STATE.users){ if(STATE.users[k].loginId===id){ dup=true; break; } }
  if(dup){ showToast('이미 사용 중인 아이디예요.', true); return; }
  if(btn){ btn.disabled=true; btn.textContent='만드는 중…'; }
  var flow = ++authFlowEpoch;
  var pendingSave = resetSaveSession();
  clearMemberSession();
  function signupGuard(){ if(flow!==authFlowEpoch) throw new Error('auth-flow-cancelled'); }
  var salt = randomSaltHex();
  authTransition = authTransition.catch(function(){}).then(function(){ return pendingSave; }).then(function(){
    signupGuard();
    return callEdgeFunction('signup', {loginId:id, password:pw, name:name, adminCode:adminCode, salt:salt, avatarDataUrl:avatar||null, pwHint:hint});
  })
    .then(function(res){
      signupGuard();
      if(!res || res.__status!==200 || !res.ok){
        var msg = '가입에 실패했어요. 다시 시도해주세요.';
        if(res && res.error==='duplicate_id') msg = '이미 사용 중인 아이디예요.';
        else if(res && res.error==='weak_password') msg = '비밀번호는 8자 이상으로 만들어주세요.';
        else if(res && res.error==='invalid_id_format') msg = '아이디는 영문, 숫자, -, _ 만 사용할 수 있어요.';
        else if(res && res.error==='missing_hint') msg = '비밀번호 힌트를 입력해주세요.';
        /* 서버가 돌려준 구체적인 이유가 있으면 그대로 보여준다 — 다음에 또 실패하더라도
           토스트만 보고 바로 원인을 알 수 있게(원래는 무조건 이 문구 하나였음). */
        else if(res && res.detail) msg = '가입에 실패했어요: ' + res.detail;
        throw new Error(msg);
      }
      return res.profile;
    })
    .then(function(profileRow){
      signupGuard();
      return sb.auth.signInWithPassword({email:loginEmailFor(id), password:pw}).then(function(authRes){
        signupGuard();
        if(authRes.error) throw new Error('가입은 됐지만 자동 로그인에 실패했어요. 로그인 화면에서 다시 시도해주세요.');
        return deriveKey(pw, salt).then(function(key){ return keyToB64(key); }).then(function(keyB64){
          signupGuard();
          var u = mapProfileRow(profileRow);
          STATE.users[u.id] = u;
          SESSION = {userId:u.id, name:u.name, keyB64:keyB64};
          try{ localStorage.setItem('growell_session', JSON.stringify(SESSION)); }catch(e){}
          memberLoadState = {privateEntries:'ready', habits:'ready', readingLogs:'ready', readingMeta:'ready'};
          pendingSignupAvatar = null;
          showToast(u.name+'님, 환영해요.');
          var r = currentRoute();
          if(r.view==='login'){ location.hash = '#/'; } else { render(); }
        });
      });
    })
    .catch(function(err){
      if(btn){ btn.disabled=false; btn.textContent='회원가입'; }
      if(flow!==authFlowEpoch) return false;
      showToast((err && err.message) || '가입에 실패했어요. 다시 시도해주세요.', true);
      return false;
    });
  return authTransition;
}
/* 관리자 코드 승격 — 코드 검증은 grant-admin Edge Function이 서버에서 하고, is_admin 컬럼은
   트리거로 클라이언트 직접 수정을 막아뒀다(profiles.update RLS만으론 본인이 직접 켤 수 있었음). */
function doGrantAdmin(code){
  if(!SESSION){ return; }
  sb.auth.getSession().then(function(sessRes){
    var token = sessRes && sessRes.data && sessRes.data.session && sessRes.data.session.access_token;
    return callEdgeFunction('grant-admin', {adminCode:code}, token);
  }).then(function(res){
    if(!res || res.__status!==200 || !res.ok){ showToast('코드가 올바르지 않아요.', true); return; }
    var u = STATE.users[SESSION.userId];
    if(u) u.isAdmin = true;
    showToast('관리자 권한이 부여됐어요.');
    render();
  }).catch(function(){ showToast('코드가 올바르지 않아요.', true); });
}
function doLogin(id, pw, btn){
  id = id.trim().toLowerCase();
  if(btn){ btn.disabled=true; btn.textContent='확인 중…'; }
  var loggedInUser = null;
  var flow = ++authFlowEpoch;
  var pendingSave = resetSaveSession();
  clearMemberSession();
  function authGuard(){ if(flow!==authFlowEpoch) throw new Error('auth-flow-cancelled'); }
  authTransition = authTransition.catch(function(){}).then(function(){ return pendingSave; }).then(function(){
    authGuard();
    return sb.auth.signInWithPassword({email:loginEmailFor(id), password:pw});
  }).then(function(authRes){
    authGuard();
    if(authRes.error) throw authRes.error;
    return sb.from('profiles').select('*').eq('login_id', id).maybeSingle();
  }).then(function(profRes){
    authGuard();
    if(profRes.error || !profRes.data) throw new Error('profile-not-found');
    var u = mapProfileRow(profRes.data);
    STATE.users[u.id] = u;
    loggedInUser = u;
    return deriveKey(pw, u.salt).then(function(key){ return keyToB64(key); });
  }).then(function(keyB64){
    authGuard();
    SESSION = {userId:loggedInUser.id, name:loggedInUser.name, keyB64:keyB64};
    try{ localStorage.setItem('growell_session', JSON.stringify(SESSION)); }catch(e){}
    return loadMemberData();
  }).then(function(loaded){
    authGuard();
    if(!loaded) showToast('로그인했지만 일부 기록을 불러오지 못했어요. 해당 화면에서 다시 불러올 수 있어요.', true);
    if(memberLoadState.privateEntries==='ready' && typeof completePendingPrivateRecovery==='function') return completePendingPrivateRecovery();
  }).then(function(){
    authGuard();
    showToast(loggedInUser.name+'님, 환영해요.');
    var r = currentRoute();
    if(r.view==='login'){ location.hash = '#/'; } else { render(); }
  }).catch(function(err){
    if(btn){ btn.disabled=false; btn.textContent='로그인'; }
    if(flow!==authFlowEpoch) return false;
    if(SESSION){ showToast('로그인은 완료됐어요. 기록 준비를 마치지 못했으니 다시 시도해주세요.', true); render(); }
    else { showToast(err && err.message==='profile-not-found' ? '회원 정보를 불러오지 못했어요. 다시 시도해주세요.' : '로그인하지 못했어요. 아이디·비밀번호와 연결 상태를 확인해주세요.', true); }
    return false;
  });
  return authTransition;
}
function doLogout(){
  ++authFlowEpoch;
  var pendingSave = resetSaveSession();
  clearMemberSession();
  authTransition = authTransition.catch(function(){}).then(function(){ return pendingSave; }).then(function(){ return sb.auth.signOut(); }).catch(function(){});
  location.hash = '#/';
  render();
  return authTransition;
}
/* 계정 삭제 — 아이디를 만든 본인, 또는 운영자가 다른 회원을 삭제할 수 있다.
   실제로는 profiles 행을 지우지 않고(작성한 나눔 글/댓글의 작성자 표시가 깨지지 않게)
   나의 공간·활동지·독서기록 같은 개인 데이터만 지우고 로그인 계정(Supabase Auth)을
   없앤 뒤 이름을 "탈퇴한 회원"으로 바꾼다 — delete-account Edge Function이 서버에서 처리. */
function doDeleteAccount(targetUserId){
  if(!SESSION) return;
  var isSelf = !targetUserId || targetUserId===SESSION.userId;
  if(isSelf && SESSION.authKind==='oauth'){showToast('간편가입 계정의 탈퇴는 관리자에게 요청해주세요. Google·카카오 비밀번호를 입력하지 마세요.');return;}
  var msg = isSelf
    ? '정말 계정을 삭제할까요? 나의 공간 일기, 활동지, 독서 기록이 모두 사라지고 되돌릴 수 없어요. (작성하신 나눔 글은 남아요)'
    : '이 회원의 계정을 삭제할까요? 나의 공간, 활동지, 독서 기록이 모두 사라지고 되돌릴 수 없어요.';
  if(!confirm(msg)) return;
  var verify = Promise.resolve();
  /* 본인 계정 삭제는 실수/도용으로 인한 삭제를 막기 위해 비밀번호 재입력을 한 번 더 요구한다 —
     입력한 비밀번호로 signInWithPassword를 다시 호출해보는 방식으로 검증(로그인과 동일한 서버 검증
     로직 재사용, 별도 API 불필요). 틀리면 삭제 진행 자체가 되지 않는다. */
  if(isSelf){
    var pw = window.prompt('계정을 삭제하려면 비밀번호를 입력해주세요.');
    if(pw===null) return;
    if(!pw){ showToast('비밀번호를 입력해주세요.', true); return; }
    var me = STATE.users[SESSION.userId];
    verify = sb.auth.signInWithPassword({email:loginEmailFor(me.loginId), password:pw}).then(function(authRes){
      if(authRes.error) throw new Error('growell-wrong-password');
    });
  }
  verify.then(function(){
    return sb.auth.getSession();
  }).then(function(sessRes){
    var token = sessRes && sessRes.data && sessRes.data.session && sessRes.data.session.access_token;
    return callEdgeFunction('delete-account', isSelf ? {} : {targetUserId:targetUserId}, token);
  }).then(function(res){
    if(!res || res.__status!==200 || !res.ok){ showToast('계정 삭제에 실패했어요. 다시 시도해주세요.', true); return; }
    if(isSelf){
      var uid = SESSION.userId;
      doLogout();
      delete STATE.users[uid];
      showToast('계정이 삭제됐어요. 그동안 함께해주셔서 감사해요.');
      location.hash = '#/';
      render();
    } else {
      var u = STATE.users[targetUserId];
      if(u){ u.name='탈퇴한 회원'; u.avatar=null; u.isAdmin=false; u.isDeleted=true; }
      showToast('계정을 삭제했어요.');
      render();
    }
  }).catch(function(err){
    if(err && err.message==='growell-wrong-password'){ showToast('비밀번호가 올바르지 않아요.', true); return; }
    showToast('계정 삭제에 실패했어요. 다시 시도해주세요.', true);
  });
}
/* 프로필 수정 — 가입 후에도 본인이 언제든 별명·프로필 사진을 바꿀 수 있게 한다.
   avatarChange: undefined면 사진을 안 건드린 것(기존 사진 유지), null이면 "지우기"를 눌러
   사진을 없애는 것, 문자열(data URL)이면 새로 고른 사진 — signup과 동일하게 리사이즈된
   데이터 URL을 avatars 버킷에 올리고 공개 URL만 profiles.avatar_url에 저장한다. */
function doEditProfile(name, avatarChange, btn){
  if(!SESSION) return;
  name = (name||'').trim();
  if(!name){ showToast('별명을 입력해주세요.', true); return; }
  if(name.length>30){ showToast('별명은 30자 이내로 입력해주세요.', true); return; }
  if(typeof avatarChange==='string' && !GrowellProfile.safeAvatarUrl(avatarChange)){ showToast('사진을 다시 선택해주세요.', true); return; }
  if(btn){ btn.disabled = true; btn.textContent = '저장 중…'; }
  var owner=SESSION.userId, epoch=saveSessionEpoch;
  var cur = STATE.users[owner] || {};
  var authUserId = cur.authUserId;
  function guard(){if(!SESSION || SESSION.userId!==owner || saveSessionEpoch!==epoch) throw new Error('profile-session-changed');}
  var uploadWork;
  if(avatarChange === undefined){
    uploadWork = Promise.resolve(cur.avatar || null);
  } else if(avatarChange === null){
    uploadWork = Promise.resolve(null);
  } else {
    uploadWork = uploadPhotoIfNeeded('avatars', authUserId || owner, owner, {dataUrl:avatarChange})
      .then(function(photo){ return photo.dataUrl; });
  }
  return uploadWork.then(function(avatarUrl){
    guard();
    return saveState(function(next){
      guard();
      var u = next.users[owner];
      if(!u) throw new Error('profile-not-found');
      u.name = name;
      u.avatar = avatarUrl;
    }, {
      button:btn, originalLabel:'저장', savingLabel:'저장 중…',
      onSuccess: function(){
        guard();
        pendingProfileAvatar = undefined;
        SESSION.name = name;
        ['posts','comments','materialNotes','worksheets','readingMeta'].forEach(function(key){
          Object.keys(STATE[key]||{}).forEach(function(id){var record=STATE[key][id];if(record.userId===owner) record.userName=name;});
        });
        try{ localStorage.setItem('growell_session', JSON.stringify(SESSION)); }catch(e){}
        showToast('프로필을 수정했어요.');
        location.hash = '#/';
      }
    });
  }).catch(function(err){
    if(btn){ btn.disabled=false; btn.textContent='저장'; }
    if(err && err.message==='profile-session-changed') return false;
    showToast('사진을 올리지 못했어요. 다시 시도해주세요.', true);
    return false;
  });
}
function ensureKey(){
  if(!SESSION || !SESSION.keyB64) return Promise.resolve(null);
  var owner=SESSION.userId, material=SESSION.keyB64;
  if(CURRENT_KEY && CURRENT_KEY_OWNER===owner && CURRENT_KEY_MATERIAL===material) return Promise.resolve(CURRENT_KEY);
  return keyFromB64(material).then(function(k){
    if(!SESSION || SESSION.userId!==owner || SESSION.keyB64!==material) throw new Error('로그인 정보가 바뀌었어요. 다시 시도해주세요.');
    CURRENT_KEY=k; CURRENT_KEY_OWNER=owner; CURRENT_KEY_MATERIAL=material; return k;
  });
}
/* 개인 기록 v2: 기록 키는 비밀번호와 독립적이며, 서버에는 비밀번호로 감싼 키만 저장한다. */
var privateDataKeyPromise = null;
var privateRecoveryBusy = false;
var privateRecoveryGeneration = 0;
var pendingPrivateRecovery = null;
var selectedResetRecovery = null;
function clearPrivateCryptoState(){ privateDataKeyPromise=null; privateRecoveryBusy=false; ++privateRecoveryGeneration; }
function privateSessionGuard(userId, keyB64){
  if(!SESSION || SESSION.userId!==userId || SESSION.keyB64!==keyB64) throw new Error('로그인 정보가 바뀌었어요. 다시 시도해주세요.');
}
function ownPrivateEntries(){return Object.values(STATE.privateEntries).filter(function(e){return SESSION && e.userId===SESSION.userId;});}
function privateDataKey(passwordKey){
  if(privateDataKeyPromise) return privateDataKeyPromise;
  var userId=SESSION.userId, keyB64=SESSION.keyB64;
  var sessionRef=SESSION;
  var work=(async function(){
    var entries=ownPrivateEntries();
    for(var e of entries){
      if(GrowellPrivateCrypto.envelope(e)){
        var opened=await GrowellPrivateCrypto.read(e,passwordKey);
        privateSessionGuard(userId,keyB64); if(SESSION!==sessionRef)throw new Error('로그인이 변경되었어요.'); return opened.dataKey;
      }
    }
    var key=await GrowellPrivateCrypto.newKey(); privateSessionGuard(userId,keyB64);if(SESSION!==sessionRef)throw new Error('로그인이 변경되었어요.'); return key;
  })();
  privateDataKeyPromise=work;
  work.catch(function(){if(privateDataKeyPromise===work)privateDataKeyPromise=null;});
  return work;
}
function decryptPrivateRecord(entry,key){return GrowellPrivateCrypto.read(entry,key).then(function(value){return value.text;});}
function encryptPrivateRecord(entry,key,text){
  if(privateRecoveryBusy) return Promise.reject(new Error('개인 기록 복구 작업이 끝난 뒤 저장해주세요.'));
  return privateDataKey(key).then(function(dataKey){return GrowellPrivateCrypto.create(entry,key,dataKey,text);});
}
function recoveryPanelHtml(){
  return '<section class="card" style="padding:18px;margin-top:16px">'+
    '<h3>개인 기록 복구</h3><p class="sub">비밀번호를 잊어도 기록을 다시 열 수 있도록 복구 파일을 안전한 곳에 보관해주세요. 이 파일은 개인 기록의 열쇠이므로 다른 사람에게 보내지 마세요.</p>'+
    '<button type="button" class="btn btn-block" id="btn-private-recovery-export">복구 파일 저장</button>'+
    '<label class="field-label" for="private-recovery-import">비밀번호를 바꾼 뒤 기록 복구하기</label>'+
    '<input type="file" id="private-recovery-import" accept=".json,application/json">'+
    '<p class="hint" id="private-recovery-status" role="status" aria-live="polite"></p></section>';

function recoveryStatus(text,isError){
  var node=document.getElementById('private-recovery-status');
  if(node){node.textContent=text;node.style.color=isError?'var(--danger)':'';}
}
async function loadPrivateForRecovery(userId,keyB64){
  var localSnapshot={};ownPrivateEntries().forEach(function(e){localSnapshot[e.id]=e.data;});
  var result=await sb.from('private_entries').select('*').eq('user_id',userId);
  privateSessionGuard(userId,keyB64);
  if(result.error || !Array.isArray(result.data)) throw new Error('개인 기록을 불러오지 못했어요. 연결을 확인한 뒤 다시 시도해주세요.');
  var entries=result.data.map(mapPrivateEntryRow).filter(function(e){return e.userId===userId;});
  entries.localSnapshot=localSnapshot;
  return entries;
}
async function savePrivateConversion(entries,converted,userId,keyB64){
  privateSessionGuard(userId,keyB64);
  var expected={},expectedIVs={};entries.forEach(function(e){expected[e.id]=e.data;expectedIVs[e.id]=e.iv;});
  return saveState(function(next){
    privateSessionGuard(userId,keyB64);
    converted.forEach(function(value){
      var current=next.privateEntries[value.id];
      var baseline=entries.localSnapshot||expected;
      if((current?current.data:undefined)!==baseline[value.id]) throw new Error('기록이 변경되었어요. 다시 시도해주세요.');
      next.privateEntries[value.id]=value;
    });
  },{render:false,expectedPrivateEntries:expected,expectedPrivateIVs:expectedIVs,expectedPrivateLocalData:entries.localSnapshot||expected});
}
async function exportPrivateRecovery(btn){
  if(!SESSION || privateRecoveryBusy) return;
  var userId=SESSION.userId,keyB64=SESSION.keyB64,profile=STATE.users[userId];
  var generation=++privateRecoveryGeneration;
  privateRecoveryBusy=true;if(btn)btn.disabled=true;recoveryStatus('복구 파일을 준비하고 있어요.');
  try{
    var entries=await loadPrivateForRecovery(userId,keyB64);
    var passwordKey=await ensureKey(), dataKey=await privateDataKey(passwordKey), keys=[dataKey],converted=[];
    for(var entry of entries){
      var value=await GrowellPrivateCrypto.read(entry,passwordKey);
      privateSessionGuard(userId,keyB64);
      if(value.dataKey){keys.push(value.dataKey);converted.push(entry);}
      else {converted.push(Object.assign({},entry,await GrowellPrivateCrypto.create(entry,passwordKey,dataKey,value.text)));}
    }
    if(!await savePrivateConversion(entries,converted,userId,keyB64)) throw new Error('기록 보호 설정을 저장하지 못했어요. 다시 시도해주세요.');
    privateSessionGuard(userId,keyB64);
    var kit=await GrowellPrivateCrypto.recoveryFile(profile,keys,[passwordKey]);
    privateSessionGuard(userId,keyB64);
    var url=URL.createObjectURL(new Blob([JSON.stringify(kit,null,2)],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download='growell-recovery-'+profile.loginId+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},10000);
    recoveryStatus('복구 파일을 저장했어요. 다운로드된 파일을 안전한 곳에 보관해주세요.');
  }catch(err){recoveryStatus(err.message||'복구 파일을 만들지 못했어요.',true);showToast(err.message||'복구 파일을 만들지 못했어요.',true);}
  finally{if(generation===privateRecoveryGeneration)privateRecoveryBusy=false;if(btn)btn.disabled=false;}
}
async function completePendingPrivateRecovery(){
  if(!pendingPrivateRecovery || !SESSION) return true;
  if(privateRecoveryBusy) return false;
  var kit=pendingPrivateRecovery,userId=SESSION.userId,keyB64=SESSION.keyB64;
  var generation=++privateRecoveryGeneration;
  privateRecoveryBusy=true;recoveryStatus('개인 기록을 복구하고 있어요.');
  try{
    GrowellPrivateCrypto.assertOwner(kit,STATE.users[userId]);
    var entries=await loadPrivateForRecovery(userId,keyB64),passwordKey=await ensureKey();
    var master=await GrowellPrivateCrypto.importKey(kit.keys[0].key),converted=[];
    for(var entry of entries){
      var value;
      try{value=await GrowellPrivateCrypto.recover(entry,kit);}
      catch(err){value=await GrowellPrivateCrypto.read(entry,passwordKey);}
      privateSessionGuard(userId,keyB64);
      var sealed=await GrowellPrivateCrypto.create(entry,passwordKey,master,value.text);
      converted.push(Object.assign({},entry,sealed));
    }
    if(!await savePrivateConversion(entries,converted,userId,keyB64)) throw new Error('복구 저장을 마치지 못했어요. 같은 복구 파일로 다시 시도해주세요.');
    privateSessionGuard(userId,keyB64);
    var draftRecovery=await migratePrivateDraftKeys(kit.legacyKeys);
    privateSessionGuard(userId,keyB64);
    privateDataKeyPromise=Promise.resolve(master);pendingPrivateRecovery=null;selectedResetRecovery=null;
    recoveryStatus('개인 기록을 복구했어요.');showToast('개인 기록을 복구했어요.');
    if(draftRecovery.unreadable)showToast('일부 임시 글은 이전 복구 파일이 필요해요. 해당 초안은 삭제하지 않고 보관했어요.',true);
    return true;
  }catch(err){recoveryStatus(err.message||'복구하지 못했어요. 파일을 확인해주세요.',true);showToast(err.message||'복구하지 못했어요. 파일을 확인해주세요.',true);return false;}
  finally{if(generation===privateRecoveryGeneration)privateRecoveryBusy=false;}
}
function bindPrivateRecovery(){
  var exportBtn=document.getElementById('btn-private-recovery-export');
  if(exportBtn)exportBtn.addEventListener('click',function(){exportPrivateRecovery(exportBtn);});
  var importInput=document.getElementById('private-recovery-import');
  if(importInput)importInput.addEventListener('change',async function(){
    try{var file=importInput.files[0];if(!file)return;if(file.size>262144)throw new Error('복구 파일이 너무 커요.');
      var kit=await GrowellPrivateCrypto.parseRecovery(await file.text());
      if(!SESSION)throw new Error('먼저 로그인해주세요.');GrowellPrivateCrypto.assertOwner(kit,STATE.users[SESSION.userId]);
      pendingPrivateRecovery=kit;if(await completePendingPrivateRecovery())render();
    }catch(err){recoveryStatus(err.message,true);}finally{importInput.value='';}
  });
  var resetInput=document.getElementById('fp-recovery-file');
  if(resetInput)resetInput.addEventListener('change',async function(){
    selectedResetRecovery=null;var status=document.getElementById('fp-recovery-status');
    try{var file=resetInput.files[0];if(!file)return;if(file.size>262144)throw new Error('복구 파일이 너무 커요.');selectedResetRecovery=await GrowellPrivateCrypto.parseRecovery(await file.text());if(status)status.textContent='복구 파일을 확인했어요.';}
    catch(err){if(status)status.textContent=err.message;}
  });
}
/* 비밀번호 힌트 새로 등록/변경 — 프로필 수정 화면에서. 힌트는 절대 클라이언트로 다시
   내려받지 않는다(profile_secrets는 RLS로 읽기 자체가 막혀 있고 update-hint 함수도
   값을 돌려주지 않음) — 그래서 이 입력창은 항상 빈칸에서 시작하고, 저장은 "덮어쓰기"만 한다. */
function doUpdateHint(hint, btn){
  if(!SESSION) return;
  hint = (hint||'').trim();
  if(!hint){ showToast('힌트를 입력해주세요.', true); return; }
  if(btn){ btn.disabled=true; btn.textContent='저장 중…'; }
  sb.auth.getSession().then(function(sessRes){
    var token = sessRes && sessRes.data && sessRes.data.session && sessRes.data.session.access_token;
    return callEdgeFunction('update-hint', {pwHint:hint}, token);
  }).then(function(res){
    if(btn){ btn.disabled=false; btn.textContent='힌트 저장'; }
    if(!res || res.__status!==200 || !res.ok){ showToast('힌트 저장에 실패했어요. 다시 시도해주세요.', true); return; }
    var input = document.getElementById('pe-hint');
    if(input) input.value = '';
    showToast('비밀번호 힌트를 저장했어요. 잊지 않게 따로 기억해두세요.');
  }).catch(function(){
    if(btn){ btn.disabled=false; btn.textContent='힌트 저장'; }
    showToast('힌트 저장에 실패했어요. 다시 시도해주세요.', true);
  });
}
/* 비밀번호 찾기 — 아이디 + 가입 때 등록한 힌트가 일치하면 새 비밀번호로 바꿔준다.
   실제 이메일이 없는 앱이라 Supabase의 표준 "이메일로 재설정" 흐름을 쓸 수 없어서
   만든 대체 경로(reset-password Edge Function, 서버에서 힌트를 대조). */
async function doForgotPassword(id, hint, pw, pw2, btn){
  if(doForgotPassword.busy)return false;
  id = (id||'').trim().toLowerCase();
  hint = (hint||'').trim();
  if(!id || !hint){ showToast('아이디와 힌트를 모두 입력해주세요.', true); return; }
  if(pw.length<8){ showToast('새 비밀번호는 8자 이상으로 만들어주세요.', true); return; }
  if(pw!==pw2){ showToast('비밀번호가 서로 달라요. 다시 확인해주세요.', true); return; }
  if(!selectedResetRecovery){showToast('개인 기록을 보호하려면 먼저 복구 파일을 선택해주세요. 기존 로그인 기기의 프로필에서 저장할 수 있어요.',true);return;}
  if(selectedResetRecovery.loginId!==id){showToast('입력한 아이디의 복구 파일이 아니에요.',true);return;}
  var selection=selectedResetRecovery,flow=authFlowEpoch,owner=SESSION&&SESSION.userId;
  function resetGuard(){
    if(flow!==authFlowEpoch || selectedResetRecovery!==selection || (SESSION&&SESSION.userId)!==owner)
      throw new Error('recovery-reset-cancelled');
  }
  doForgotPassword.busy=true;
  if(btn){ btn.disabled=true; btn.textContent='확인 중…'; }
  try{
    /* Revalidate the keys locally. Only the three account identifiers leave the
       browser; guest clients cannot read member profiles to verify ownership. */
    var resetKit=await GrowellPrivateCrypto.parseRecovery(JSON.stringify(selection));
    resetGuard();
    if(typeof resetKit.authUserId!=='string' || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(resetKit.authUserId)){
      showToast('계정 확인 정보가 없는 복구 파일이에요. 로그인된 기기의 프로필에서 복구 파일을 다시 저장해주세요.',true);
      return false;
    }
    var ownership=await sb.rpc('growell_recovery_owner_matches',{
      p_login_id:id,p_user_id:resetKit.userId,p_auth_user_id:resetKit.authUserId
    });
    resetGuard();
    if(ownership.error)throw new Error('recovery-owner-unavailable');
    if(ownership.data!==true){showToast('아이디와 복구 파일의 계정 정보가 일치하지 않아요.',true);return false;}
    var res=await callEdgeFunction('reset-password',{loginId:id,hint:hint,newPassword:pw});
    resetGuard();
    if(!res || res.__status!==200 || !res.ok){
      /* Keep the existing server-side hint check and its uniform failure message. */
      showToast('아이디 또는 힌트가 일치하지 않아요.',true);
      return false;
    }
    pendingPrivateRecovery=resetKit;
    showToast('비밀번호를 바꿨어요. 개인 기록을 복구하고 있어요.');
    authMode='login';
    return await doLogin(id,pw,btn);
  }catch(err){
    if(err.message!=='recovery-reset-cancelled' && flow===authFlowEpoch)
      showToast('복구 파일 확인 또는 비밀번호 재설정에 실패했어요. 다시 시도해주세요.',true);
    return false;
  }finally{
    doForgotPassword.busy=false;
    if(btn){btn.disabled=false;btn.textContent='비밀번호 바꾸기';}
  }
}

/* ---------------- content actions ---------------- */
/* 생각 나눔(나눔 공간) 글의 필드 검증 + 정리 — 새 글/수정 양쪽에서 함께 쓴다.
   통찰 정리 타입은 체크인 없이 몇 번째 모임 + 질문 3개로 구성이 완전히 다르다. */
function buildShareFields(checkinVal, payload){
  if(payload.noteType==='insight'){
    var meetingNoRaw = (payload.meetingNo||'').trim();
    if(!meetingNoRaw) return {ok:false, msg:'몇 번째 모임인지 먼저 적어주세요.'};
    /* 적어준 값을 숫자로 정리해서("네 번째"→"4") meetingNo 자체도 이 숫자로 통일하고,
       그 숫자로 "N번째 통찰 노트" 제목을 자동으로 만든다(38번 라운드 요청) — 별도 제목
       입력칸 없이도 제목이 늘 채워지므로 posts.title 컬럼을 그대로 재사용한다. */
    var meetingNo = parseMeetingNumber(meetingNoRaw);
    var hasAnswer = INSIGHT_QUESTIONS.some(function(q){ return (payload[q.key]||'').trim(); });
    if(!hasAnswer) return {ok:false, msg:'질문에 하나 이상 답해주세요.'};
    return {ok:true, fields:{checkin:null, noteType:'insight', meetingNo:meetingNo,
      q1:(payload.q1||'').trim(), q2:(payload.q2||'').trim(), q3:(payload.q3||'').trim(),
      page:'', html:'', photo:null, bgColor:payload.bgColor||'', fontSize:'', title:meetingNo+'번째 통찰 노트'}};
  }
  if(checkinVal==null || checkinVal===''){ return {ok:false, msg:'오늘의 체크인을 먼저 골라주세요.'}; }
  var cleanHtml = sanitizeHtml(payload.html);
  var plain = (function(){ var d=document.createElement('div'); d.innerHTML=cleanHtml; return d.textContent.trim(); })();
  if(!plain && !payload.photo) return {ok:false, msg:'나눌 이야기를 적어주세요.'};
  if(!payload.noteType) return {ok:false, msg:'노트 타입을 먼저 골라주세요.'};
  var title = (payload.title||'').trim();
  if(!title) return {ok:false, msg:'제목을 적어주세요.'};
  return {ok:true, fields:{checkin:checkinVal, noteType:payload.noteType, page:(payload.page||'').trim(), html:cleanHtml,
    photo:payload.photo||null, bgColor:payload.bgColor||'', fontSize:payload.fontSize||'', title:title, meetingNo:'', q1:'', q2:'', q3:''}};
}
function submitSharePost(bookId, checkinVal, payload, btn){

function habitWithPendingChecks(habit){
  var copy = Object.assign({}, habit);
  var checked = {};
  (habit.checkedDates||[]).forEach(function(date){ checked[date]=true; });
  var pending = habitSaveIntents[habit.id] || {};
  Object.keys(pending).forEach(function(date){ if(pending[date].checked) checked[date]=true; else delete checked[date]; });
  copy.checkedDates = Object.keys(checked).sort();
  return copy;
}

function queueHabitCheck(habitId, dateStr, checked){
  var version = ++habitSaveVersion;
  var owner = SESSION.userId;
  var epoch = saveSessionEpoch;
  if(!habitSaveIntents[habitId]) habitSaveIntents[habitId]={};
  habitSaveIntents[habitId][dateStr]={checked:checked, version:version, status:'saving'};
  refreshHabitSaveUI(habitId);
  function finish(ok){
    if(epoch!==saveSessionEpoch || !SESSION || SESSION.userId!==owner) return;
    var latest = (habitSaveIntents[habitId]||{})[dateStr];
    if(latest && latest.version===version){
      if(ok) delete habitSaveIntents[habitId][dateStr];
      else latest.status='error';
    }
    refreshHabitSaveUI(habitId);
  }
  return saveState(function(next){
    var habit = next.habits[habitId];
    if(!habit || habit.userId!==owner) throw new Error('habit-not-found');
    var dates = (habit.checkedDates||[]).filter(function(date){ return date!==dateStr; });
    if(checked) dates.push(dateStr);
    habit.checkedDates=dates.sort();
    habit.updatedAt=Date.now();
  }, {render:false, onSuccess:function(){ finish(true); }, onFailure:function(){ finish(false); }});
}
function retryHabitChecks(habitId){
  if(!SESSION || !STATE.habits[habitId] || STATE.habits[habitId].userId!==SESSION.userId) return Promise.resolve(false);
  var failed = habitSaveIntents[habitId]||{};
  return Promise.all(Object.keys(failed).filter(function(date){ return failed[date].status==='error'; }).map(function(date){
    return queueHabitCheck(habitId, date, failed[date].checked);
  }));
}
function toggleHabitDate(habitId, dateStr){
  if(!SESSION) return;
  var h = STATE.habits[habitId];
  if(!h || h.userId!==SESSION.userId) return;
  if(typeof GrowellHabits!=='undefined'&&!GrowellHabits.canCheck(h,dateStr,GrowellHabits.todayDate())) return;
  return queueHabitCheck(habitId, dateStr, habitWithPendingChecks(h).checkedDates.indexOf(dateStr)<0);
}
/* ---------------- 나의 공간: 독서 진행률 · 타이머 기록 ---------------- */
function readingMetaKey(bookId, userId){ return bookId+'_'+userId; }
function myReadingMeta(bookId){
  if(!SESSION) return null;
  return STATE.readingMeta[readingMetaKey(bookId, SESSION.userId)] || null;
}
/* 총 페이지는 더 이상 사용자가 입력하는 값이 아니라 책마다 고정된 값(book.totalPages) —
   나의 공간에서는 이 값과 현재 페이지(사용자별 readingMeta)로 진행률(%)을 계산한다. */
function myCurrentPage(bookId){
  var m = myReadingMeta(bookId);
  return m ? (m.currentPage||0) : 0;
}
/* 읽는 중/완독은 더 이상 사용자가 직접 고르는 값이 아니라 현재 페이지 vs 고정된 총 페이지로
   자동 계산되는 "상태 표시"일 뿐이다 — 총 페이지를 다 읽었다고 기록하면 자동으로 완독. */
function readingStatusKey(book){
  var current = myCurrentPage(book.id);
  return (book.totalPages>0 && current>=book.totalPages) ? 'done' : 'reading';
}
function myReadingLogs(bookId){
  if(!SESSION) return [];
  return Object.values(STATE.readingLogs).filter(function(l){ return l.bookId===bookId && l.userId===SESSION.userId; })
    .sort(function(a,b){ return b.createdAt-a.createdAt; });
}
/* 그 책을 읽느라 쓴 총 시간 — 지금까지 저장된 모든 독서 세션(readingLogs)의 시간을 더한 값 */
function totalReadSeconds(bookId){
  return myReadingLogs(bookId).reduce(function(sum, l){ var seconds=Number(l.seconds); return sum + (Number.isFinite(seconds)&&seconds>0?seconds:0); }, 0);
}
/* 각 독서 기록을 "이전에 읽은 위치 ~ 이번에 읽은 위치" 범위로 보여주기 위해 시작 페이지를
   계산한다. 이번 라운드부터 저장되는 기록은 submitReadingLog에서 startPage를 함께 저장하지만,
   그 전에 이미 쌓인 기록은 startPage가 없으므로 시간순으로 정렬해 바로 앞 기록의 도착 페이지를
   시작 페이지로 대신 추정한다(맨 처음 기록은 0페이지부터 시작한 것으로 간주). */
function myReadingLogsWithRange(bookId){
  var logsDesc = myReadingLogs(bookId); // 최신순
  var logsAsc = logsDesc.slice().sort(function(a,b){ return a.createdAt-b.createdAt; });
  var startById = {};
  var prevPage = 0;
  logsAsc.forEach(function(l){
    startById[l.id] = (typeof l.startPage==='number') ? l.startPage : prevPage;
    prevPage = l.page;
  });
  return logsDesc.map(function(l){ return {log:l, startPage:startById[l.id]}; });
}
function saveCurrentPage(bookId, currentPage, btn){
