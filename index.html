function openReadingNote(type){
  if(refreshReadingTimerFromStorage()){render();return;}
  if(!SESSION || !readingTimer || readingSaveBusy || readingSaveAttempt || readingNoteReturn)return;
  var owner=SESSION.userId,timerId=readingTimer.id,bookId=readingTimer.bookId;
  if(type==='mine' && memberLoadState.privateEntries!=='ready'){showToast('개인 기록을 먼저 불러온 뒤 다시 열어주세요.',true);return;}
  var handoff=GrowellReadingTimer.beginNote(readingTimer,type,Date.now());
  if(!handoff){syncReadingTimer();render();return;}
  readingTimer=handoff.timer;readingNoteReturn=handoff.handoff;readingCountdownOpen=false;persistReadingTimer();
  var opened=false;
  return openComposerWithDraft(type,bookId,null,function(draft){
    if(!SESSION || SESSION.userId!==owner || !readingTimer || readingTimer.id!==timerId)return;
    if(!GrowellReadingTimer.restoreNoteHandoff(readingNoteReturn,readingTimer))return;
    opened=true;
    if(type==='mine'){mineComposerOpenFor=bookId;mineEditingId=null;mineEditingPayload=null;}
    else{shareComposerOpenFor=bookId;shareEditingId=null;shareComposerInsightMode=!!(draft && draft.activeMode==='insight');var fields=draft && draft.variants[draft.activeMode];shareComposerNoteType=fields?fields.noteType:null;}
    location.hash='#/book/'+bookId+'/'+type;render();
    var editor=document.getElementById('note-editor');if(editor){editor.scrollIntoView({block:'center'});editor.focus();}
  }).then(function(){
    if(!opened && SESSION && SESSION.userId===owner && readingTimer && readingTimer.id===timerId){
      var resumed=GrowellReadingTimer.finishNote(readingTimer,readingNoteReturn,Date.now());if(resumed)readingTimer=resumed;
      readingNoteReturn=null;persistReadingTimer();render();
    }
  });
}
/* Call after a confirmed note save and draft completion, never when a save failed. */
function completeReadingNote(type,bookId){
  if(refreshReadingTimerFromStorage()){render();return false;}
  if(!SESSION || !readingTimer || readingTimer.userId!==SESSION.userId || !readingNoteReturn || readingNoteReturn.type!==type || readingNoteReturn.bookId!==bookId)return false;
  var resumed=GrowellReadingTimer.finishNote(readingTimer,readingNoteReturn,Date.now());
  if(!resumed)return false;
  readingTimer=resumed;readingNoteReturn=null;readingHomeDialogFor=readingHomeReturn?readingTimer.id:null;persistReadingTimer();location.hash=readingHomeReturn?'#/':'#/book/'+bookId+'/mine';return true;
}
function returnToReadingTimer(){
  if(!readingNoteReturn)return;
  var type=readingNoteReturn.type,bookId=readingNoteReturn.bookId;
  captureComposerDraft();
  if(completeReadingNote(type,bookId)){if(type==='mine')resetMineComposer();else resetShareComposer();render();}
}
function tickReadingTimer(){
  if(!readingTimer || !SESSION) return;
  var running=readingTimer.running;syncReadingTimer();
  if(!readingTimer)return;
  if(running && !readingTimer.running){render();return;}
  document.querySelectorAll('[data-reading-elapsed]').forEach(function(el){el.textContent=fmtElapsed(readingTimerElapsedMs());});
  document.querySelectorAll('[data-reading-remaining]').forEach(function(el){el.textContent=fmtElapsed(GrowellReadingTimer.remaining(readingTimer,Date.now()));});
  var ratio=GrowellReadingTimer.countdownRatio(readingTimer,Date.now());
  document.querySelectorAll('[data-reading-countdown-ring]').forEach(function(el){el.setAttribute('stroke-dashoffset',((1-(ratio||0))*100).toFixed(3));});
  document.querySelectorAll('[data-reading-status]').forEach(function(el){el.textContent=readingTimer.running?(readingTimer.goalReached?'목표 달성 · 계속 읽는 중':'읽고 있는 중…'):'잠시 멈춤';});
}
function bindReadingTimerEvents(){
  var app=document.getElementById('app');
  function on(id,fn){var el=document.getElementById(id);if(el)el.addEventListener('click',function(e){if(refreshReadingTimerFromStorage()){render();return;}fn(e);});}
  app.querySelectorAll('[data-reading-start]').forEach(function(b){b.addEventListener('click',function(){startReading(b.getAttribute('data-reading-start'));});});
  on('btn-reading-toggle-pause',function(){
    if(!readingTimer || readingSaveBusy)return;
    readingNoteReturn=null;
    if(!readingTimer.running)prepareReadingTimerAlerts();
    readingTimer=readingTimer.running?GrowellReadingTimer.pause(readingTimer,Date.now()):GrowellReadingTimer.resume(readingTimer,Date.now());
    persistReadingTimer();render();
  });
  on('btn-reading-cancel',function(){
    if(!readingTimer || readingSaveBusy || readingSaveAttempt)return;
    if(!confirm('이번 독서를 취소할까요? 저장한 이전 기록은 유지되지만, 이번에 읽은 시간은 남지 않아요.'))return;
    closeReadingHomeDialog();readingHomeReturn=false;readingTimer=null;readingSavePanelOpen=false;readingCountdownOpen=false;readingSaveAttempt=null;readingNoteReturn=null;persistReadingTimer();render();
  });
  on('btn-reading-done',function(){
    if(!readingTimer)return;
    readingTimer=GrowellReadingTimer.pause(readingTimer,Date.now());readingTimer.phase='save';readingSavePanelOpen=true;readingCountdownOpen=false;readingNoteReturn=null;
    persistReadingTimer();render();
  });
  on('btn-reading-save-back',function(){
    if(!readingTimer || readingSaveAttempt)return;
    prepareReadingTimerAlerts();readingTimer=GrowellReadingTimer.resume(readingTimer,Date.now());readingSavePanelOpen=false;persistReadingTimer();render();
  });
  on('btn-reading-countdown',function(){readingCountdownOpen=!readingCountdownOpen;render();});
  function updateCountdownSelection(){
    var hours=document.getElementById('reading-countdown-hours'),minutes=document.getElementById('reading-countdown-minutes');if(!hours || !minutes)return;
    var h=Number(hours.value),m=Number(minutes.value);
    document.getElementById('reading-countdown-selection').textContent=h+'시간 '+m+'분';hours.setAttribute('aria-valuetext',h+'시간');minutes.setAttribute('aria-valuetext',m+'분');
    document.getElementById('btn-reading-countdown-save').disabled=GrowellReadingTimer.countdownDuration(hours.value,minutes.value)===null;
  }
  app.querySelectorAll('#reading-countdown-hours,#reading-countdown-minutes').forEach(function(el){el.addEventListener('input',updateCountdownSelection);});
  app.querySelectorAll('[data-reading-minutes]').forEach(function(b){b.addEventListener('click',function(){document.getElementById('reading-countdown-hours').value='0';document.getElementById('reading-countdown-minutes').value=b.getAttribute('data-reading-minutes');updateCountdownSelection();});});
  on('btn-reading-countdown-save',function(){
    var h=document.getElementById('reading-countdown-hours').value.trim(),m=document.getElementById('reading-countdown-minutes').value.trim();
    var duration=GrowellReadingTimer.countdownDuration(h,m);
    if(duration===null){showToast('1분에서 23시간 59분 사이로 설정해주세요.',true);return;}
    prepareReadingTimerAlerts();
    var next=GrowellReadingTimer.setCountdown(readingTimer,duration,Date.now());
    if(!next)return;readingTimer=next;readingCountdownOpen=false;persistReadingTimer();render();
  });
  on('btn-reading-countdown-clear',function(){readingTimer=GrowellReadingTimer.clearCountdown(readingTimer,Date.now());readingCountdownOpen=false;persistReadingTimer();render();});
  on('btn-reading-notifications',function(){
    if(typeof GrowellTimerAlerts==='undefined')return;
    var button=document.getElementById('btn-reading-notifications'),status=GrowellTimerAlerts.notificationStatus();
    if(!status.supported||status.permission==='denied'||status.enabled)return;
    button.disabled=true;
    Promise.resolve(GrowellTimerAlerts.enableNotifications()).then(function(result){
      var current=result||GrowellTimerAlerts.notificationStatus(),label=document.getElementById('reading-notification-status');
      if(label)label.textContent=current.label;
      button.textContent=current.enabled?'휴대폰 알림 켜짐':'휴대폰 알림 켜기';button.disabled=!current.supported||current.permission==='denied'||current.enabled;
    }).catch(function(){var label=document.getElementById('reading-notification-status');if(label)label.textContent='알림 설정을 완료하지 못했어요. 브라우저 설정을 확인해주세요.';button.disabled=GrowellTimerAlerts.notificationStatus().permission==='denied';});
  });
  app.querySelectorAll('[data-reading-finish]').forEach(function(b){b.addEventListener('click',function(){if(refreshReadingTimerFromStorage()){render();return;}if(readingSaveAttempt)return;readingFinishKind=b.getAttribute('data-reading-finish');persistReadingTimer();render();});});
  var pageInput=document.getElementById('reading-log-page-input');
  var pageSlider=document.getElementById('reading-log-page-slider');
  function updateReadingPage(value){
    if(refreshReadingTimerFromStorage()){render();return;}
    if(!readingTimer || readingSaveAttempt)return;
    var total=bookById(readingTimer.bookId).totalPages,result=GrowellReadingTimer.pageProgress(readingTimer.startPage,value,total);
    document.getElementById('reading-page-delta').textContent=result.ok?readingTimer.startPage+' → '+result.page+'쪽 · 이번에 '+result.pagesRead+'쪽 읽음':result.error;
    document.getElementById('btn-reading-log-save').disabled=!result.ok || readingSaveBusy;
    if(result.ok){readingEndPage=result.page;readingFinishKind=result.page===bookById(readingTimer.bookId).totalPages?'complete':'finish';
      if(pageSlider){pageSlider.value=String(result.page);pageSlider.setAttribute('aria-valuetext',result.page+'쪽, 전체의 '+result.percent+'퍼센트');}
      pageInput.value=String(result.page);document.getElementById('reading-page-percentage').textContent=result.percent+'%';
      app.querySelectorAll('[data-reading-page-step]').forEach(function(b){b.disabled=Number(b.getAttribute('data-reading-page-step'))<0?result.page<=readingTimer.startPage:result.page>=total;});
      app.querySelectorAll('[data-reading-finish]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-reading-finish')===readingFinishKind));});
      persistReadingTimer();}
  }
  if(pageInput)pageInput.addEventListener('input',function(){updateReadingPage(pageInput.value);});
  if(pageSlider)pageSlider.addEventListener('input',function(){updateReadingPage(pageSlider.value);});
  app.querySelectorAll('[data-reading-page-step]').forEach(function(b){b.addEventListener('click',function(){var total=bookById(readingTimer.bookId).totalPages;updateReadingPage(Math.max(readingTimer.startPage,Math.min(total,Number(pageSlider.value)+Number(b.getAttribute('data-reading-page-step')))));});});
  on('btn-reading-log-save',function(){var btn=document.getElementById('btn-reading-log-save');submitReadingLog(btn.getAttribute('data-book'),0,pageInput.value,btn);});
  app.querySelectorAll('[data-reading-note]').forEach(function(b){b.addEventListener('click',function(e){
    e.preventDefault();if(readingNoteReturn)returnToReadingTimer();var dialog=document.getElementById('reading-note-dialog');
    if(dialog&&!dialog.open){dialog.showModal();if(typeof GrowellPopupHistory!=='undefined')GrowellPopupHistory.open('reading-note',{close:closeReadingNoteDialog});}
  });});
  on('btn-reading-note-close',closeReadingNoteDialog);
  var noteDialog=document.getElementById('reading-note-dialog');
  if(noteDialog)noteDialog.addEventListener('cancel',function(e){e.preventDefault();closeReadingNoteDialog();});
  if((!noteDialog||!noteDialog.open)&&typeof GrowellPopupHistory!=='undefined')GrowellPopupHistory.closed('reading-note');
  app.querySelectorAll('[data-reading-destination]').forEach(function(b){b.addEventListener('click',function(){closeReadingNoteDialog();openReadingNote(b.getAttribute('data-reading-destination'));});});
  app.querySelectorAll('[data-reading-return]').forEach(function(b){b.addEventListener('click',returnToReadingTimer);});
  app.querySelectorAll('#btn-close-share-composer,#btn-close-mine-composer').forEach(function(b){b.addEventListener('click',function(){if(readingNoteReturn)returnToReadingTimer();});});
  app.querySelectorAll('[data-reading-home-close]').forEach(function(b){b.addEventListener('click',closeReadingHomeDialog);});
  showReadingHomeDialog();
  if(readingTimerIntervalId)clearInterval(readingTimerIntervalId);
  readingTimerIntervalId=readingTimer?setInterval(tickReadingTimer,250):null;
  if(!document._readingLifecycleBound){
    document._readingLifecycleBound=true;
    document.addEventListener('visibilitychange',function(){if(document.hidden)persistReadingTimer();else if(refreshReadingTimerFromStorage())render();else tickReadingTimer();});
    window.addEventListener('pagehide',persistReadingTimer);
    window.addEventListener('storage',function(e){
      if(!SESSION||readingSaveBusy||e.key!==readingTimerStorageKey(SESSION.userId))return;
      readingTimerRestoreOwner=null;syncReadingTimer();render();
    });
  }
}
function submitWorksheet(bookId, activityKey, data, btn, originalLabel){
  if(!SESSION||!isAdmin()){ showToast('활동지는 관리자만 열 수 있어요.', true); return; }
  var owner=SESSION.userId,epoch=saveSessionEpoch;
  var existingId = null;
  for(var k in STATE.worksheets){
    var w = STATE.worksheets[k];
    if(w.bookId===bookId && w.activityKey===activityKey && w.userId===SESSION.userId){ existingId=k; break; }
  }
  var id = existingId || uid('w');
  saveState(function(next){
    if(!SESSION||SESSION.userId!==owner||saveSessionEpoch!==epoch||!isAdmin())throw new Error('활동지는 관리자만 저장할 수 있어요.');
    next.worksheets[id] = {id:id, bookId:bookId, activityKey:activityKey, userId:owner, userName:SESSION.name, data:data, createdAt: (existingId?next.worksheets[id].createdAt:Date.now()), updatedAt:Date.now()};
  }, {button:btn, originalLabel:originalLabel||'저장', savingLabel:'저장 중…'});
}

function bindHomeDailyVerse(){
  if(document._homeDailyVerseTimer) clearTimeout(document._homeDailyVerseTimer);
  document._homeDailyVerseTimer=null;
  if(!document.querySelector('[data-home-daily-verse]')) return;
  refreshHomeDailyVerse();
  if(!document._homeDailyVerseLifecycleBound){
    document._homeDailyVerseLifecycleBound=true;
    document.addEventListener('visibilitychange',function(){if(!document.hidden)bindHomeDailyVerse();});
    window.addEventListener('pageshow',bindHomeDailyVerse);
  }
  var delay=86400000-((Date.now()+9*60*60*1000)%86400000)+25;
  document._homeDailyVerseTimer=setTimeout(bindHomeDailyVerse,delay);

function homePostExcerpt(post){
  if(post.noteType==='insight') return INSIGHT_QUESTIONS.map(function(q){ return post[q.key]||''; }).join(' ').replace(/\s+/g,' ').trim();
  // Template content remains inert: previewing text never loads embedded media.
  var template = document.createElement('template');
  template.innerHTML = String(post.html||'');
  template.content.querySelectorAll('script,style,noscript,iframe,object,embed,template,svg,math').forEach(function(node){node.remove();});
  return (template.content.textContent||'').replace(/\s+/g,' ').trim();
}

// Keep provider configuration, callbacks and existing accounts for a later return.
// This switch only controls new social sign-in entry points in this app.
var SOCIAL_AUTH_VISIBLE=false;
var oauthProviders={state:'loading',google:false,kakao:false};
var oauthPending=null,oauthBusy=false,oauthMessage='',oauthWatcherBound=false;
function hasSocialIdentity(user){
  return !!(user && ((user.identities||[]).some(function(i){return i.provider==='google'||i.provider==='kakao';}) || ((user.app_metadata||{}).providers||[]).some(function(p){return p==='google'||p==='kakao';})));
}
function loadOAuthProviderSettings(){
  if(!SOCIAL_AUTH_VISIBLE)return Promise.resolve();
  return fetch(SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:SUPABASE_ANON_KEY}}).then(function(r){if(!r.ok)throw new Error('provider-settings');return r.json();}).then(function(settings){
    oauthProviders={state:'ready',google:!!(settings.external&&settings.external.google),kakao:!!(settings.external&&settings.external.kakao)};
  }).catch(function(){oauthProviders={state:'error',google:false,kakao:false};}).then(function(){
    var node=document.querySelector('[data-oauth-providers]');
    if(node){node.outerHTML=socialSignupStatusHtml();bindOAuthEvents();}
  });
}
function cleanOAuthCallbackUrl(){
  var url=new URL(location.href),fragment=new URLSearchParams(url.hash.slice(1));
  ['code','error','error_code','error_description'].forEach(function(key){url.searchParams.delete(key);});
  if(['access_token','refresh_token','error','error_code','error_description'].some(function(key){return fragment.has(key);}))url.hash='#/login';
  history.replaceState(null,'',url.pathname+url.search+url.hash);
}
function finishOAuthCallback(){
  var url=new URL(location.href),code=url.searchParams.get('code'),fragment=new URLSearchParams(url.hash.slice(1));
  var params=[url.searchParams,fragment],errors=[],errorCodes=[],hasFailure=false;
  params.forEach(function(part){
    errors=errors.concat(part.getAll('error'));errorCodes=errorCodes.concat(part.getAll('error_code'));
    if(part.has('error')||part.has('error_code')||part.has('error_description'))hasFailure=true;
  });
  if(hasFailure){
    // Only an explicit, unambiguous access_denied response means cancellation.
    // Provider descriptions/codes are never displayed, persisted, or logged.
    var cancelled=errors.length>0 && errors.concat(errorCodes).every(function(value){return value==='access_denied';});
    cleanOAuthCallbackUrl();
    return Promise.reject(new Error(cancelled?'oauth-cancelled':'oauth-provider-failed'));
  }
  if(!code)return Promise.resolve();
  cleanOAuthCallbackUrl();
  return sb.auth.exchangeCodeForSession(code).then(function(result){if(result.error)throw new Error('oauth-exchange-failed');});
}
function bindOAuthAuthWatcher(){
  if(oauthWatcherBound || typeof sb.auth.onAuthStateChange!=='function')return;
  oauthWatcherBound=true;
  sb.auth.onAuthStateChange(function(event,session){
    var expected=SESSION && STATE.users[SESSION.userId] && STATE.users[SESSION.userId].authUserId || oauthPending && oauthPending.authUserId;
    if(event!=='SIGNED_OUT' && (!expected || session && session.user && session.user.id===expected))return;
    var flow=authFlowEpoch;
    // Supabase holds an Auth lock inside this callback; never await another Auth call here.
    setTimeout(function(){
      if(flow!==authFlowEpoch)return;
      ++authFlowEpoch;resetSaveSession();clearMemberSession();oauthPending=null;oauthBusy=false;
      oauthMessage=event==='SIGNED_OUT'?'로그아웃되었어요. 다시 로그인해주세요.':'다른 계정으로 로그인되어 기록 화면을 잠갔어요.';
      if(!BOOTING)render();
    },0);
  });
}
async function prepareOAuthMember(user,flow){
  var result=await sb.rpc('growell_oauth_profile');
  if(flow!==authFlowEpoch)throw new Error('auth-flow-cancelled');
  if(result.error||!result.data||!['new','legacy','ready'].includes(result.data.status))throw new Error('oauth-profile-failed');
  var data=result.data;
  if(data.profile && (data.profile.auth_user_id!==user.id||data.profile.is_deleted))throw new Error('oauth-profile-mismatch');
  if(data.status!=='new'&&!data.profile)throw new Error('oauth-profile-missing');
  if(data.status==='ready')GrowellOAuth.validateEnvelope(data.envelope,user.id);
  var suggestedName='';
  if(data.profile)suggestedName=data.profile.name;
  else{
    // Display suggestion only. Provider metadata never decides membership or administrator rights.
    var metadata=user.user_metadata||{},nameFields=['preferred_username','full_name','name','nickname'];
    for(var i=0;i<nameFields.length;i++){
      var candidate=metadata[nameFields[i]];
      if(typeof candidate==='string' && candidate.trim()){suggestedName=candidate.trim().slice(0,30);break;}
    }
  }
  oauthPending={authUserId:user.id,status:data.status,profile:data.profile,envelope:data.envelope,name:suggestedName};
  oauthMessage='';
  return oauthPending;
}
async function startOAuth(provider,button){
  if(!SOCIAL_AUTH_VISIBLE||oauthBusy||!['google','kakao'].includes(provider)||!oauthProviders[provider])return;
  oauthBusy=true;oauthMessage='';if(button){button.disabled=true;button.textContent='로그인 화면으로 이동 중…';}
  var flow=++authFlowEpoch,pending=resetSaveSession();clearMemberSession();oauthPending=null;
  try{
    await pending;if(flow!==authFlowEpoch)return;
    try{sessionStorage.setItem('growell_oauth_return',/^#\/book\/[a-z]+\/(share|mine|worksheet|materials|habit)$/.test(location.hash)?location.hash:'#/');}catch(e){}
    var redirect=new URL(location.href);redirect.search='';redirect.hash='';
    var options={redirectTo:redirect.href,skipBrowserRedirect:true};
    // Kakao's default scopes include email/photo. Provider scope overrides them;
    // options.scopes would only append to those defaults (see AUTH_SETUP.md).
    if(provider==='kakao')options.queryParams={scope:'profile_nickname'};
    var result=await sb.auth.signInWithOAuth({provider:provider,options:options});
    if(flow!==authFlowEpoch)return;
    if(result.error||!result.data||!result.data.url)throw new Error('oauth-start-failed');
    var target=new URL(result.data.url);
    if(target.origin!==new URL(SUPABASE_URL).origin||target.pathname!=='/auth/v1/authorize')throw new Error('oauth-redirect-invalid');
    location.assign(target.href);
  }catch(e){if(flow===authFlowEpoch){oauthBusy=false;oauthMessage='간편 로그인 화면을 열지 못했어요. 잠시 후 다시 시도해주세요.';render();}}
}
async function completeOAuthMember(name,password,confirmation,button){
  if(!oauthPending||oauthBusy)return false;
  var pending=oauthPending,flow=authFlowEpoch;
  function guard(){if(flow!==authFlowEpoch||oauthPending!==pending)throw new Error('auth-flow-cancelled');}
  if(pending.status==='legacy'){oauthMessage='이 계정은 기존 아이디로 로그인해주세요.';return false;}
  name=(name||'').trim();
  if(pending.status==='new' && (!name||name.length>30)){showToast('별명은 1~30자로 입력해주세요.',true);return false;}
  if(!password||password.length<8){showToast('개인 기록 비밀번호는 8자 이상으로 입력해주세요.',true);return false;}
  if(pending.status==='new' && password!==confirmation){showToast('개인 기록 비밀번호가 서로 달라요.',true);return false;}
  oauthBusy=true;if(button){button.disabled=true;button.textContent='기록을 준비하고 있어요…';}
  try{
    var verified=await sb.auth.getUser();guard();
    if(verified.error||!verified.data||!verified.data.user||verified.data.user.id!==pending.authUserId)throw new Error('oauth-session-mismatch');
    var response={status:pending.status,profile:pending.profile,envelope:pending.envelope};
    if(pending.status==='new'){
      var salt=GrowellOAuth.newSalt(),made=await GrowellOAuth.createVault(password,salt,pending.authUserId);guard();
      var result=await sb.rpc('growell_oauth_register',{p_name:name,p_salt:salt,p_envelope:made.envelope});guard();
      if(result.error||!result.data)throw new Error('oauth-register-failed');response=result.data;
    }
    if(response.status==='legacy'){pending.status='legacy';pending.profile=response.profile;throw new Error('oauth-legacy');}
    if(response.status!=='ready'||!response.profile||response.profile.auth_user_id!==pending.authUserId||response.profile.is_deleted)throw new Error('oauth-profile-mismatch');
    var keyB64=await GrowellOAuth.unlockVault(password,response.envelope,pending.authUserId);guard();
    var profile=mapProfileRow(response.profile);STATE.users[profile.id]=profile;
    SESSION={userId:profile.id,name:profile.name,keyB64:keyB64,authKind:'oauth'};
    try{localStorage.setItem('growell_session',JSON.stringify(SESSION));}catch(e){}
    await loadMemberData();guard();
    oauthPending=null;oauthMessage='';oauthBusy=false;sharedPostsLoadState='idle';
    var destination='#/';try{var saved=sessionStorage.getItem('growell_oauth_return');if(/^#\/book\/[a-z]+\/(share|mine|worksheet|materials|habit)$/.test(saved))destination=saved;sessionStorage.removeItem('growell_oauth_return');}catch(e){}
    location.hash=destination;render();showToast(profile.name+'님, 환영해요.');return true;
  }catch(error){
    if(flow!==authFlowEpoch)return false;
    oauthBusy=false;
    oauthMessage=error.message==='oauth-legacy'?'기존 회원은 아이디와 비밀번호로 로그인해주세요.':/개인 기록|열쇠|비밀번호/.test(error.message)?error.message:'간편 가입을 마치지 못했어요. 입력한 기록은 변경하지 않았으니 다시 시도해주세요.';
    var status=document.getElementById('oauth-status');if(status)status.textContent=oauthMessage;
    if(button){button.disabled=false;button.textContent=pending.status==='new'?'가입하고 시작하기':'내 기록 열기';}
    if(pending.status==='legacy')render();return false;
  }
}
async function cancelOAuth(){
  ++authFlowEpoch;var pending=resetSaveSession();clearMemberSession();oauthPending=null;oauthBusy=false;oauthMessage='';
  await pending;await sb.auth.signOut().catch(function(){});authMode='login';location.hash='#/login';render();

function bindOAuthEvents(){

/* 색 선택은 도구의 설정만 바꾸고, 주 아이콘을 눌렀을 때 선택한 본문에 적용한다. */
var RT_TEXT_COLORS = [
  {value:'#262319',label:'먹색'}, {value:'#A63A55',label:'빨강'},

      }).join('') + '</div><p class="rt-color-help">색을 고른 뒤 본문에서 글을 선택하고 '+rtColorLabel(kind)+' 아이콘을 눌러주세요.</p></div>';
  }).join('');

function bindRichTextToolbar(noteEditor){
  if(rtToolbarCleanup){ rtToolbarCleanup(); rtToolbarCleanup=null; }
  if(!noteEditor) return;
  var controls=document.querySelector('.rt-controls');
  if(!controls) return;
  var savedRange=null, openPalette='', listeners=[];
  function listen(target,type,fn){ target.addEventListener(type,fn); listeners.push(function(){target.removeEventListener(type,fn);}); }
  function rememberSelection(){
    var selection=window.getSelection();
    if(selection && selection.rangeCount && noteEditor.contains(selection.anchorNode) && noteEditor.contains(selection.focusNode)) savedRange=selection.getRangeAt(0).cloneRange();
  }
  function restoreSelection(allowCaret){
    rememberSelection();
    var range=savedRange && noteEditor.contains(savedRange.startContainer) && noteEditor.contains(savedRange.endContainer) ? savedRange.cloneRange() : null;
    if(!range){
      if(!allowCaret) return null;
      range=document.createRange(); range.selectNodeContents(noteEditor); range.collapse(false);
    }
    noteEditor.focus();
    var selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
    savedRange=range.cloneRange();
    return selection;
  }
  function closePalette(){
    openPalette='';
    controls.querySelectorAll('[data-rt-color-panel]').forEach(function(el){ el.hidden=true; });
    controls.querySelectorAll('[data-rt-palette]').forEach(function(button){ button.setAttribute('aria-expanded','false'); });
  }
  function updateColors(){
    controls.querySelectorAll('[data-rt-apply]').forEach(function(button){
      var kind=button.getAttribute('data-rt-apply'), color=RT_SELECTED_COLORS[kind];
      var option=rtColorOptions(kind).filter(function(o){return o.value===color;})[0];
      var label='선택한 글에 '+option.label+' '+rtColorLabel(kind)+' 적용';
      button.style.setProperty('--rt-color',color); button.setAttribute('title',label); button.setAttribute('aria-label',label);
    });
    controls.querySelectorAll('[data-rt-color]').forEach(function(button){
      var selected=button.getAttribute('data-rt-color')===RT_SELECTED_COLORS[button.getAttribute('data-rt-color-kind')];
      button.classList.toggle('is-sel',selected); button.setAttribute('aria-pressed',String(selected));
    });
  }
  function applyColor(kind){
    var selection=restoreSelection(false);
    if(!selection || selection.isCollapsed){ showToast('색을 적용할 글을 먼저 선택해주세요.',true); return; }
    var cssMode=false, applied=false;
    try{
      if(document.queryCommandState) cssMode=!!document.queryCommandState('styleWithCSS');
      // CSS 서식으로 적용하되, 이후 입력으로 생기는 FONT의 안전한 색상도 sanitizer가 보존한다.
      document.execCommand('styleWithCSS',false,true);
      applied=document.execCommand(kind==='highlight'?'hiliteColor':'foreColor',false,RT_SELECTED_COLORS[kind]);
      if(applied===false && kind==='highlight') applied=document.execCommand('backColor',false,RT_SELECTED_COLORS[kind]);
    }catch(err){ applied=false; }
    finally{ try{document.execCommand('styleWithCSS',false,cssMode);}catch(err){} }
    rememberSelection(); closePalette();
    if(applied===false) showToast('색을 적용하지 못했어요. 글을 다시 선택해주세요.',true);
    else captureComposerDraft();
  }
  function runCommand(cmd){
    restoreSelection(true);
    try{
      if(cmd==='bold') document.execCommand('bold');
      else if(cmd==='italic') document.execCommand('italic');
      else if(cmd==='underline') document.execCommand('underline');
      else if(cmd==='strike') document.execCommand('strikeThrough');
      else if(cmd==='ol') document.execCommand('insertOrderedList');
      else if(cmd==='ul') document.execCommand('insertUnorderedList');
      else if(cmd==='quote') document.execCommand('formatBlock',false,'blockquote');
      else if(cmd==='code') document.execCommand('formatBlock',false,'pre');
      else if(cmd==='clear') document.execCommand('removeFormat');
      else if(cmd==='undo') document.execCommand('undo');
      else if(cmd==='redo') document.execCommand('redo');
      else if(cmd==='fontsize') document.execCommand('fontSize',false,'5');
      else if(cmd==='link'){
        var url=window.prompt('연결할 링크 주소를 입력해주세요 (https://...)');
        if(url){if(!/^https?:\/\//i.test(url)) url='https://'+url;restoreSelection(true);document.execCommand('createLink',false,url);}
      }
    }catch(err){}
    rememberSelection(); closePalette(); captureComposerDraft();
  }
  listen(controls,'pointerdown',function(event){ if(event.target.closest('button')){rememberSelection();event.preventDefault();} });
  listen(controls,'mousedown',function(event){ if(event.target.closest('button')){rememberSelection();event.preventDefault();} });
  listen(controls,'click',function(event){
    var button=event.target.closest('button'); if(!button || !controls.contains(button)) return;
    if(button.hasAttribute('data-rt-palette')){
      var kind=button.getAttribute('data-rt-palette'), opening=openPalette!==kind;
      closePalette();
      if(opening){openPalette=kind;controls.querySelector('[data-rt-color-panel="'+kind+'"]').hidden=false;button.setAttribute('aria-expanded','true');}
    }else if(button.hasAttribute('data-rt-color')){
      var selectedKind=button.getAttribute('data-rt-color-kind'), value=button.getAttribute('data-rt-color');
      if(rtColorOptions(selectedKind).some(function(option){return option.value===value;})) RT_SELECTED_COLORS[selectedKind]=value;
      updateColors(); closePalette();
    }else if(button.hasAttribute('data-rt-apply')) applyColor(button.getAttribute('data-rt-apply'));
    else if(button.hasAttribute('data-rt-cmd')) runCommand(button.getAttribute('data-rt-cmd'));
  });
  listen(document,'selectionchange',rememberSelection);
  listen(document,'pointerdown',function(event){ if(!controls.contains(event.target)) closePalette(); });
  listen(document,'keydown',function(event){
    if(event.key==='Escape' && openPalette){var button=controls.querySelector('[data-rt-palette="'+openPalette+'"]');closePalette();event.preventDefault();if(button)button.focus();}
  });
  listen(noteEditor,'keyup',rememberSelection); listen(noteEditor,'mouseup',rememberSelection);
  updateColors();
  rtToolbarCleanup=function(){listeners.forEach(function(remove){remove();});};
}
/* 나눔 공간 / 나의 공간 글쓰기에서 텍스트 박스 배경색을 고르는 스와치 줄 */

function insightBgPickerHtml(selected){

/* opts.editingPost: 수정 중인 기존 글(payload)을 넘기면 그 내용으로 미리 채운다.

   opts.selectedNoteType: 현재 선택된 노트 타입 키(다시 그릴 때 어떤 pill이 선택돼 있었는지).
   opts.insightMode: true면 체크인/서식 편집기 대신 몇 번째 모임 + 질문 3개 칸을 보여준다.
   opts.withBgColor: true면 사진이 없을 때 쓰이는 텍스트 박스의 배경색을 고를 수 있다. */
function noteComposerHtml(book, opts){

  if(draft && draft.variants[draftMode]){

  var ntSetHtml = '<div class="nt-set" id="nt-set">' + types.map(function(t){

    /* 글쓰기 화면에서 종류를 고르는 이 pill은 (통찰 정리처럼 아이콘이 있는 타입도 포함해)

  var pageFieldHtml = (opts.insightMode || opts.withPageField===false) ? '' :

     제목을 적으면 사진이 없는 글의 3열 그리드 표지에는 본문 미리보기 대신 제목만 깔끔하게

  var titleFieldHtml = opts.insightMode ? '' :

  var bodyHtml;

    bodyHtml =

      rtToolbarHtml() +
      '<div class="note-editor" id="note-editor" contenteditable="true" role="textbox" aria-label="글 내용" aria-multiline="true" data-placeholder="'+esc(opts.placeholder||'마음에 남은 문장과 생각을 자유롭게 적어보세요.')+'">'+(editing?(editing.html||''):'')+'</div>' +
      '<div class="photo-attach" id="photo-attach">' +
        '<button type="button" class="btn btn-sm" id="btn-photo-pick">'+svgIcon(I_IMG)+' 사진 첨부</button>' +
        '<input type="file" id="note-photo-input" accept="image/*" style="display:none">' +
        '<div id="photo-preview">'+photoPreviewInner+'</div>' +
      '</div>' +
      (opts.withBgColor ? bgColorPickerHtml(editing?editing.bgColor:'') : '') +
      (opts.withFontSize ? fontSizePickerHtml(editing?editing.fontSize:'') : '');
  }

  return '<div class="card composer" id="'+opts.containerId+'" data-book="'+book.id+'" data-draft-key="'+esc(draftKey)+'" data-draft-type="'+draftType+'" data-draft-edit="'+esc(draftEditId||'')+'" data-draft-user="'+esc(SESSION && SESSION.userId||'')+'" data-draft-mode="'+draftMode+'" style="--accent-c:var(--'+book.accent+'); --accent-soft:var(--'+book.accent+'-soft); --accent-ink:var(--'+book.accent+'-ink)">' +
    '<div class="space-composer-label">'+svgIcon(draftType==='mine'?I_LOCK:I_COMMENT)+' '+esc(book.area)+' · '+(draftType==='mine'?'나의 공간 · 나에게만 공개':draftType==='materials'?'자료실 · 모임원에게 공개':'나눔 공간 · 모임원에게 공개')+'</div>' +
    '<div class="composer-head"><h3>'+esc(opts.heading)+'</h3><button type="button" class="composer-close" id="'+opts.closeId+'" title="닫기" aria-label="닫기">'+svgIcon(I_CLOSE)+'</button></div>' +
    titleFieldHtml +

    bodyHtml +
    (opts.extraHtml || '') +
    '<p class="hint" data-draft-status role="status" style="display:block;margin:12px 0 0">'+esc(draft && draft.status || '작성한 내용은 이 기기에 암호화해 임시 저장해요.')+'</p>' +
    '<div class="composer-foot"><span class="hint">'+esc(opts.hint)+'</span><button class="btn btn-primary" id="'+opts.submitId+'" type="button">'+esc(opts.submitLabel)+'</button></div>' +
  '</div>';
}

/* 통찰 정리(생각 나눔 전용 특수 노트 타입) 글은 자유 서식이 아니라 정해진 질문 3개에 대한
   답이라 일반 글과 렌더 구조가 다르다 — 피드에는 질문 대신 짧은 단어(느낀 점/통찰/적용)로
   표시하고, 몇 번째 모임인지는 카드 맨 아래 오른쪽에 배지로 보여준다(요청하신 배치). */
function insightBodyOf(payload){
  var meetingBadge = payload.meetingNo ? '<span class="page-badge insight-meeting-badge">'+esc(payload.meetingNo)+'번째 모임</span>' : '';
  /* 제목은 이제 "몇 번째 모임인가요?" 값으로 자동으로 만들어진다("N번째 통찰 노트", 38번
     라운드 요청) — buildShareFields에서 이미 채워서 저장하지만, 그 이전에 저장된 예전
     글(title이 없는 경우)도 어색하지 않게 meetingNo로 즉석에서 만들어 보여준다. */
  var titleText = payload.title || (payload.meetingNo ? payload.meetingNo+'번째 통찰 노트' : '통찰 노트');
  var bg = insightBgOf(payload.bgColor);
  var qHtml = INSIGHT_QUESTIONS.map(function(q){
    var val = (payload[q.key]||'').trim();
    if(!val) return '';
    return '<div class="insight-qa"><span class="insight-qa-label">'+esc(q.label)+'</span><p class="insight-qa-text">'+nlToBr(esc(val))+'</p></div>';
  }).join('');
  /* 배경을 그라데이션으로 고를 수 있게 되면서(38번 라운드), 카드 자체를 그 배경으로 감싸고
     제목을 세리프 글꼴로 "세련되게" 얹은 형태로 바꿨다 — 어두운 그라데이션(is-dark)을 고르면
     글자색도 함께 밝은 색으로 바뀐다. */
  var bgStyle = bg.key ? ' style="background:'+esc(bg.key)+'"' : '';
  var insightBody = '<div class="insight-body'+(bg.dark?' is-dark':'')+'"'+bgStyle+'>' +
      '<h4 class="insight-title">'+esc(titleText)+'</h4>' +
      (qHtml||'<p class="insight-qa-text" style="color:var(--ink-faint)">아직 작성된 내용이 없어요.</p>') +
    '</div>';
  /* 피드(3열 그리드 타일)에는 이제 제목만 보여주고, 질문 3개 내용은 눌러서 상세보기로
     들어가야만 볼 수 있다(요청 반영 — "타이틀만 나오게, 내용은 클릭해서 볼 수 있게") — 사진
     없는 일반 글이 표지에서 제목만 가운데 정렬로 보여주는 것(.post-media-text.has-title)과
     같은 패턴을 그대로 재사용. 타일 맨 아래의 "N번째 모임" 배지도 이제 제목과 중복이라 함께
     없앤다(sharePostTileHtml 참고 — meetingBadgeHtml을 타일 쪽엔 더 이상 넘기지 않음). */
  var ntBadge = '<span class="note-badge nt-insight">'+svgIcon(I_SPARK)+'<span class="note-badge-label">통찰 정리</span></span>';
  var tileBgStyle = bg.key ? ' style="background:'+esc(bg.key)+'"' : '';
  /* 타일 제목은 "N번째"를 한 줄, "통찰노트"를 그 아래 줄로 나눠서 보여준다(요청 반영) — 몇
     번째 모임인지 적었을 때만 두 줄로 나뉘고, 적지 않은 예전 글은 그냥 "통찰 노트" 한 줄 그대로. */
  var tileTitleHtml = payload.meetingNo
    ? '<span class="insight-tile-title-num">'+esc(payload.meetingNo)+'번째</span><br>통찰노트'
    : esc(titleText);
  return {
    ntKey: 'insight',
    isInsight: true,
    hasPhoto: false,
    mediaHtml: '<div class="post-media post-media-text has-title insight-tile-media'+(bg.dark?' is-dark':'')+'"'+tileBgStyle+'>' +
      '<div class="post-title-cover insight-tile-title">'+tileTitleHtml+'</div></div>',
    badgesHtml: '<div class="post-badges">'+ntBadge+'</div>',
    badgesCompactHtml: '<div class="post-badges post-badges-compact">'+ntBadge+'</div>',
    bodyHtml: insightBody,
    meetingBadgeHtml: meetingBadge
  };
}
function noteBodyHtml(payload){
  if(payload.noteType==='insight') return insightBodyOf(payload);
  var nt = noteTypeOf(payload.noteType);
  var ntBadge = nt ? '<span class="note-badge nt-'+nt.key+'">'+svgIcon(nt.icon)+'<span class="note-badge-label">'+esc(nt.label)+'</span></span>' : '';
  var pageBadge = payload.page ? '<span class="page-badge">p. '+esc(payload.page)+'</span>' : '';
  var bodyHtml = payload.html!=null ? sanitizeHtml(payload.html) : nlToBr(payload.text||'');
  var badgesHtml = (ntBadge||pageBadge) ? '<div class="post-badges">'+ntBadge+pageBadge+'</div>' : '';
  /* narrow 3-up grid tiles don't have room for both badges next to the name, so tiles use
     this icon-only, note-type-only variant (no page badge) — the full badgesHtml (with the
     page badge) is reserved for the roomier detail view. */
  var badgesCompactHtml = ntBadge ? '<div class="post-badges post-badges-compact">'+ntBadge+'</div>' : '';
  var photoUrl=safePhotoUrl(payload.photo && payload.photo.dataUrl);
  var hasPhoto = !!photoUrl;
  /* 나눔공간/나의 공간 글은 배경색을 직접 고를 수 있다(payload.bgColor) — 사진이 없을 때만
     보이는 이 텍스트 박스에 적용되고, 고르지 않았으면 예전처럼 기본 배경(--surface-2)을 쓴다.
     임의의 색 위에서도 글자가 항상 읽히도록 배경을 지정했을 때는 글자색을 고정 잉크색으로 둔다. */
  var bgStyle = (!hasPhoto && payload.bgColor) ? ' style="background:'+esc(payload.bgColor)+';color:#262319"' : '';
  /* 글자 크기(payload.fontSize)는 fs-* 클래스로 적용한다(인라인 style이 아님) — 3열 그리드
     타일에서는 CSS 우선순위 때문에 이 클래스가 자동으로 무시되고 타일 고정 크기가 유지되며,
     상세보기에서만 실제로 커지거나 작아진다(사진 크롭과 같은 방식, FONT_SIZES 참고). */
  var fsCls = fontSizeOf(payload.fontSize).cls;
  var textClass = 'post-text rich-content'+(fsCls?' '+fsCls:'');
  /* 제목(선택) — 사진이 없는 글은 표지(3열 그리드 타일)에서 본문 미리보기 대신 제목만
     보이게 하고(CSS: .feed-tile .post-media-text.has-title), 사진이 있는 글은 표지에서
     계속 사진 그대로 보이게 그림 쪽(mediaHtml)엔 아예 제목을 넣지 않고 상세보기 전용
     bodyHtml 쪽에만 넣는다(요청: "그림일 경우는 그림으로 놔두고"). */
  var titleText = (payload.title||'').trim();
  var titleHtml = titleText ? '<div class="post-title-cover">'+esc(titleText)+'</div>' : '';
  /* every post keeps the SAME fixed-height box regardless of content: a photo fills it,
     and when there's no photo, the text goes into that same space instead — so card
     size never depends on how much (or how little) someone wrote. the note-type/page
     badges are rendered separately (badgesHtml) so callers can place them in the header
     row next to the name, instead of inside this media box. */
  var mediaHtml = hasPhoto
    ? '<div class="post-media"><img src="'+esc(photoUrl)+'" alt="첨부 사진" loading="lazy"></div>'
    : '<div class="post-media post-media-text'+(titleText?' has-title':'')+'"'+bgStyle+'>'+titleHtml+'<div class="'+textClass+'">'+bodyHtml+'</div></div>';
  return {
    ntKey: nt ? nt.key : '',
    isInsight: false,
    hasPhoto: hasPhoto,
    mediaHtml: mediaHtml,
    badgesHtml: badgesHtml,
    badgesCompactHtml: badgesCompactHtml,
    bodyHtml: hasPhoto ? (titleHtml+'<div class="'+textClass+'">'+bodyHtml+'</div>') : '',
    meetingBadgeHtml: ''
  };
}

      (mineC?'<button class="comment-del" data-del-comment="'+c.id+'" type="button" title="삭제">'+svgIcon(I_TRASH)+'</button>':'')+'</div>' +

function applyFeedSearch(gridId){
  var grid = document.getElementById(gridId);
  if(!grid) return;
  var input = document.querySelector('[data-feed-search-target="'+gridId+'"]');
  var emptyEl = document.getElementById('empty-'+gridId);
  var q = input ? input.value.trim().toLowerCase() : '';
  var category=grid.getAttribute('data-private-category')||'all';
  var visible = 0;
  grid.querySelectorAll('.feed-tile').forEach(function(t){
    var text = (t.getAttribute('data-search-text')||'').toLowerCase();
    var match = (!q || text.indexOf(q) >= 0) && (category==='all'||t.getAttribute('data-private-note-category')===category);
    t.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  grid.style.display = (visible===0 && (q||category!=='all')) ? 'none' : '';
  if(emptyEl) emptyEl.style.display = (visible===0 && (q||category!=='all')) ? '' : 'none';
  if(grid.hasAttribute('data-private-category')){var count=document.querySelector('[data-private-count]');if(count)count.textContent='나의 기록 '+visible+'개 · 최신순';}
}

    '<div class="feed-filters" id="feed-filters" data-book="'+book.id+'">' + chips.map(function(c){

function readingHistoryHtml(book){
  var items = myReadingLogsWithRange(book.id);
  if(!items.length) return '<div class="empty" style="padding:14px 0">아직 읽은 기록이 없어요.</div>';
  /* 이전에 읽은 위치부터 이번에 읽은 위치까지 범위 + 그 사이 읽은 페이지 수를 함께 보여준다.
     예) p50-p100 (50페이지 읽음). 시작=도착이면(변화 없음) 범위 없이 페이지만 표시. */
  var rows = items.map(function(item){
    var l = item.log, sp = item.startPage;
    var delta = Math.abs(l.page - sp);
    var rangeText = sp===l.page
      ? ('p.'+esc(String(l.page)))
      : ('p'+esc(String(sp))+'-p'+esc(String(l.page))+' <span class="reading-log-delta">('+delta+'페이지 읽음)</span>');
    return '<div class="reading-log-row">' +
      '<div class="reading-log-main"><span class="reading-log-date mono">'+fmtDate(l.createdAt)+'</span><span class="reading-log-page">'+rangeText+'</span></div>' +
      '<div class="reading-log-side"><span class="reading-log-dur mono">'+fmtElapsed(l.seconds*1000)+'</span>' +
        '<button type="button" class="post-del" data-del-reading-log="'+l.id+'" title="삭제">'+svgIcon(I_TRASH)+'</button></div>' +
    '</div>';
  }).join('');
  return '<div class="reading-log-list">'+rows+'</div>';
}
/* 읽는 중/완독 상태 배지(현재 페이지로 자동 계산되는 값 — 클릭 불가) + 총 읽은 시간 +
   읽은 기록 버튼 — 대기 카드의 오른쪽 절반에 들어감. 버튼만 노출되고, 누르면 그 내용은
   카드 아래로(전체 너비) 펼쳐진다. */

  var totalSec = totalReadSeconds(book.id);
  var timeHtml = '<div class="reading-total-time">총 읽은 시간 <strong>'+fmtDurationHuman(totalSec)+'</strong></div>';

  var logs = myReadingLogs(book.id);

    '<span>읽은 기록 보기'+(logs.length?' ('+logs.length+')':'')+'</span>' + readingChevronHtml(historyOpen) +

/* 읽은 기록 버튼을 눌렀을 때 카드 아래로(좌우 구분 없이 전체 너비) 펼쳐지는 내용 */

function readingCardHtml(book,inDialog){
  if(!SESSION) return '';
  if(!readingDataReady()) return '<div class="card reading-card">'+memberDataStatusHtml('readingMeta')+memberDataStatusHtml('readingLogs')+'</div>';
  var total = book.totalPages || 0;
  var current = myCurrentPage(book.id);

  if(readingNoteReturn && readingTimer && readingTimer.bookId===book.id && mineComposerOpenFor===book.id){
    return '<div class="card reading-note-paused"><span>'+svgIcon(I_TIMER)+' 기록 중에는 타이머가 잠시 멈춰요.</span><strong data-reading-elapsed>'+fmtElapsed(readingTimerElapsedMs())+'</strong><button type="button" class="btn btn-sm" data-reading-return>타이머로 돌아가기</button></div>';
  }
  /* 완료 → 저장 화면: 경과 시간은 자동, 페이지만 확인/수정하고 저장 (총 페이지는 책마다 고정값) */
  if(readingSavePanelOpen && readingTimer && readingTimer.bookId===book.id){
    var elapsedSave = readingTimerElapsedMs();
    var endPage=readingSaveAttempt?readingSaveAttempt.page:(readingFinishKind==='complete'?total:readingEndPage!==null?readingEndPage:Math.max(current,readingTimer.startPage));
    var pageProgress=GrowellReadingTimer.pageProgress(readingTimer.startPage,endPage,total);
    return '<div class="card reading-card reading-save-card">' +
      '<div class="composer-head"><h3>읽은 기록 저장</h3><button type="button" class="btn btn-sm" id="btn-reading-save-back"'+(readingSaveAttempt?' disabled':'')+'>조금 더 읽기</button></div>' +
      '<p class="reading-save-book">'+esc(book.title)+'</p><div class="reading-save-duration"><span>이번에 읽은 시간</span><strong class="mono">'+fmtElapsed(elapsedSave)+'</strong></div>' +

/* ---------------- 습관 만들기(전용 탭) ----------------

   (1) 자료실 다음의 완전히 독립된 탭으로 분리, (2) 월간 달력 대신 "이번 주"만 보여주는
   퀘스트형 체크표로 단순화, (3) 이번 주 7일을 모두 채우면(완료) 사진을 올려 실제 이미지
   파일(장소·시간·목표·이번 주 체크 현황이 자동으로 채워진 카드)을 만들어 기기에 저장할 수

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

}

}
function habitOverviewBodyHtml(){

  if(!summary.total) return heading+'<p class="habit-overview-message">나를 위한 작은 습관 하나부터 시작해요.</p><p class="habit-overview-note">아래에서 습관을 만들면 오늘의 실천 현황을 한눈에 볼 수 있어요.</p>';
  var message=summary.active?(summary.todayPending?'오늘 '+summary.todayPending+'개의 작은 약속이 남아 있어요.':'오늘의 약속을 모두 지켰어요!'):'오늘 진행 중인 습관이 없어요.';
  var stats='<div class="habit-overview-stats"><div><span>오늘 성공</span><strong>'+summary.todaySuccess+'<small> / '+summary.active+'개</small></strong></div><div><span>오늘 남음</span><strong>'+summary.todayPending+'<small>개</small></strong></div><div><span>주간 성공률</span><strong>'+(summary.weekRate===null?'—':summary.weekRate+'<small>%</small>')+'</strong></div></div>';
  var period='<p class="habit-overview-period">진행 중 '+summary.active+'개'+(summary.upcoming?' · 시작 전 '+summary.upcoming+'개':'')+(summary.ended?' · 기간 종료 '+summary.ended+'개':'')+'</p>';
  var order=function(habit){var b=GrowellHabits.bounds(habit,today);return today<b.start?2:b.end&&today>b.end?3:GrowellHabits.status(habit,today,today)==='success'?1:0;};
  var rows=habits.slice().sort(function(a,b){return order(a)-order(b)||(Number(a.createdAt)||0)-(Number(b.createdAt)||0);}).map(function(habit){

    var label={upcoming:'시작 전',ended:'기간 종료',success:'오늘 성공',pending:'오늘 도전 중'}[status],book=bookById(habit.bookId);
    var source=book?book.title:'연결된 책';
    var content='<span class="habit-overview-item-icon is-'+GrowellHabits.behaviorType(habit)+'" title="'+GrowellHabits.behaviorLabel(habit)+'">'+habitKindIconHtml(habit)+'</span><span class="habit-overview-item-text"><strong>'+esc(habit.name)+'</strong><small>'+esc(source)+'</small></span>';
    var kindAttr=' data-habit-kind="'+GrowellHabits.behaviorType(habit)+'"';

  }).join('');
  var intents=habits.reduce(function(all,habit){return all.concat(Object.values(habitSaveIntents[habit.id]||{}));},[]);
  var pending=intents.some(function(intent){return intent.status==='error';})?'저장하지 못한 체크가 포함돼 있어요. 해당 습관에서 다시 저장해주세요.':intents.length?'체크 저장 중…':'';

}
function habitOverviewHtml(){return '<section class="card habit-overview" data-habit-overview aria-label="전체 습관 현황">'+habitOverviewBodyHtml()+'</section>';}
function bindHabitOverviewEvents(root){
  root.querySelectorAll('[data-habit-overview]').forEach(function(panel){
    if(panel._habitOverviewBound) return;
    panel._habitOverviewBound=true;
    panel.addEventListener('click',function(event){
      var day=event.target.closest('[data-habit-overview-day]');
      if(day&&panel.contains(day)){
        event.stopPropagation();
        if(day.disabled)return;
        var parts=day.getAttribute('data-habit-overview-day').split('|');
        toggleHabitDate(parts[0],parts[1]);return;
      }
      var detail=event.target.closest('[data-habit-overview-open]');
      var row=event.target.closest('[data-habit-overview-id]');
      if((detail||row)&&panel.contains(detail||row)){event.stopPropagation();openHabitProgress(detail?detail.getAttribute('data-habit-overview-open'):row.getAttribute('data-habit-overview-id'),'overview');}
    });
  });
}
function captureHabitCalendarState(){

function habitCalendarIsOpen(habitId){

/* 월요일 시작 기준 "이번 주" 계산 — 카드 안 체크표와 완료 카드 이미지가 항상 같은 기준을
   쓰도록 이 두 헬퍼로 통일한다. */
function mondayOf(d){
  var day = d.getDay(); // 0=일 ... 6=토
  var diff = (day===0 ? -6 : 1-day);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff);
}
function weekDatesOf(monday){
  var arr=[];
  for(var i=0;i<7;i++){ arr.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+i)); }
  return arr;
}
/* "몇째 주"는 그 주의 월요일이 이번 달의 며칠인지를 7로 나눠 올림 — 캘린더 앱들이 흔히
   쓰는 간단한 방식이라 사용자가 보기에 자연스럽다. */
function weekOfMonth(monday){ return Math.ceil(monday.getDate()/7); }
function habitWeekProgress(habit, weekDates){
  var today=ymd(new Date()), checkedSet={};
  GrowellHabits.checked(habit).forEach(function(date){checkedSet[date]=true;});
  var eligible=weekDates.filter(function(d){return GrowellHabits.inPeriod(habit,ymd(d),today);});
  return {done:eligible.filter(function(d){return ymd(d)<=today&&checkedSet[ymd(d)];}).length,total:eligible.length,checkedSet:checkedSet};
}
function habitStatusLabel(status){return {success:'성공',saved:'이전 기록',fail:'실패',pending:'오늘',future:'예정',outside:'기간 밖'}[status]||'';}
function habitWeekMarkHtml(habit,status){return status==='success'||status==='saved'?habitKindIconHtml(habit):status==='fail'?'−':'';}
function habitWeekStatusLabel(habit,status){
  var action=GrowellHabits.behaviorType(habit)==='avoid'?'절제':'실천';
  return status==='success'?action+' 성공':status==='saved'?'이전 '+action+' 기록':habitStatusLabel(status);
}

function habitMonthSummaryHtml(habit,y,m){

  return '성공 '+stats.success+'일 · 실패 '+stats.fail+'일'+(stats.pending?' · 오늘 도전 중':'')+' · 성공률 '+(stats.rate===null?'집계 전':stats.rate+'%');
}
function habitCalendarLegendHtml(){
  return '<div class="habit-hist-legend"><span class="legend-success">✓ 성공</span><span class="legend-fail">− 실패</span><span>○ 오늘</span><span>· 예정</span></div>';
}
function habitKindIconHtml(habit){

}
function habitKindBadgeHtml(habit){return '<span class="habit-kind-badge is-'+GrowellHabits.behaviorType(habit)+'">'+habitKindIconHtml(habit)+GrowellHabits.behaviorLabel(habit)+'</span>';}
function habitTodayState(habit,today){
  var checked=GrowellHabits.status(habit,today,today)==='success',canCheck=GrowellHabits.canCheck(habit,today,today);
  return {checked:checked,canCheck:canCheck,label:canCheck?'성공':today<GrowellHabits.start(habit,today)?'시작 전':'기간 종료'};
}
function habitStreakHtml(habit,stats){
  return habitFactIconHtml('streak')+'<span><strong>'+stats.streak+'일</strong> 연속 '+(GrowellHabits.behaviorType(habit)==='avoid'?'절제':'실천')+'</span>';

  return '<div class="habit-goal-head"><span>성공 <strong>'+stats.success+'일</strong> / '+stats.total+'일</span><strong class="habit-goal-percent">'+stats.goalPercent+'%</strong></div>'+
    '<div class="habit-goal-track" role="progressbar" aria-label="목표 기간 성공률" aria-valuenow="'+stats.goalPercent+'" aria-valuemin="0" aria-valuemax="100" aria-valuetext="목표 '+stats.total+'일 중 '+stats.success+'일 성공"><span style="width:'+stats.goalPercent+'%"></span></div>';

function habitCardSaveStatusHtml(habitId){return Object.keys(habitSaveIntents[habitId]||{}).length?habitSaveStatusHtml(habitId):'';}

    '<div class="habit-card-actions"><button type="button" class="habit-icon-btn habit-detail-arrow" data-habit-history="'+esc(habit.id)+'" title="진행 상황" aria-label="'+esc(habit.name)+' 진행 상황 보기">'+svgIcon(I_BACK)+'</button><button type="button" class="habit-icon-btn" data-edit-habit="'+esc(habit.id)+'" title="습관 수정" aria-label="'+esc(habit.name)+' 수정">'+svgIcon(I_EDIT)+'</button></div></div>'+

    '<div class="habit-card-summary"><span class="habit-streak" data-habit-card-summary="'+esc(habit.id)+'">'+habitStreakHtml(habit,stats)+'</span><button type="button" class="habit-today-btn'+(todayState.checked?' is-checked':'')+'" data-habit-today data-habit-day="'+esc(habit.id)+'|'+todayStr+'" aria-pressed="'+todayState.checked+'" aria-label="'+esc(habit.name)+' · '+todayState.label+(todayState.checked?' · 다시 누르면 취소':'')+'"'+(!todayState.canCheck?' disabled':'')+'>'+svgIcon(I_CHECK)+'<span data-habit-today-label>'+todayState.label+'</span></button></div>'+

/* ---------------- 습관 지난 기록 팝업(월별 달력 + 성공률) ----------------
   habits.checkedDates는 지워지지 않고 계속 누적되므로(이번 주 화면만 그 창을 보여줄 뿐), 이 팝업은
   그 누적 데이터를 습관을 만든 날부터 오늘까지 월별 달력으로 다시 꺼내 보여준다. 색으로 성공/실패를
   구분하고, 전체 성공률과 보고 있는 달의 성공률을 함께 계산해 보여준다. */
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtMonthDay(date){var d=parseYmd(date);return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
function daysBetweenInclusive(a,b){return GrowellHabits.days(a,b);}
function habitCreatedStr(habit){return GrowellHabits.start(Object.assign({},habit,{startDate:null}),ymd(new Date()));}
function habitStartStr(habit){return GrowellHabits.start(habit,ymd(new Date()));}
function habitEffectiveStart(habit){
  var start=habitStartStr(habit),first=GrowellHabits.checked(habit)[0];
  return first&&first<start?first:start;
}
function habitOverallStats(habit){return GrowellHabits.stats(habit,ymd(new Date()));}
function habitMonthStats(habit,y,m){return GrowellHabits.monthStats(habit,ymd(new Date()),y,m);}
function habitHistoryCalendarHtml(habit,y,m,stableWeeks){
  var DOW=['월','화','수','목','금','토','일'],today=ymd(new Date()),first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=[];
  for(var i=0;i<lead;i++) cells.push('<div class="habit-hist-cell is-empty" aria-hidden="true"></div>');
  for(var day=1;day<=days;day++){
    var date=ymd(new Date(y,m,day)),status=GrowellHabits.status(habit,date,today),checked=status==='success'||status==='saved';
    var cls='habit-hist-cell is-'+status+(date===today?' is-today':''),label=habitStatusLabel(status),symbol=checked?'✓':status==='fail'?'−':status==='pending'?'○':status==='future'?'·':'';
    var content='<span>'+day+'</span><small data-habit-cell-mark>'+symbol+'</small>';
    cells.push(GrowellHabits.canCheck(habit,date,today)
      ? '<button type="button" class="'+cls+'" data-habit-day="'+esc(habit.id)+'|'+date+'" aria-pressed="'+checked+'" aria-label="'+date+' '+label+' · 체크 변경">'+content+'</button>'
      : '<div class="'+cls+'" aria-label="'+date+' '+label+'">'+content+'</div>');
  }
  while(stableWeeks?cells.length<42:cells.length%7!==0) cells.push('<div class="habit-hist-cell is-empty" aria-hidden="true"></div>');
  return '<div class="habit-hist-grid'+(stableWeeks?' is-stable-weeks':'')+'" aria-label="'+y+'년 '+(m+1)+'월 습관 달력">'+DOW.map(function(w){return '<div class="habit-hist-dow">'+w+'</div>';}).join('')+cells.join('')+'</div>';
}
function habitGoalProgress(habit){
  var stats=habitOverallStats(habit);
  return stats.total===null?null:{pct:stats.periodPercent,elapsedDays:stats.elapsedDays,totalDays:stats.total,end:stats.end};
}
function habitStatsPanelHtml(habit){
  var stats=habitOverallStats(habit),rate=stats.rate===null?'—':stats.rate+'%';
  var goal=stats.total!==null
    ? '<div class="habit-hist-stat-card is-goal"><div class="habit-hist-stat-head"><span class="habit-hist-stat-title">목표 달성률</span><strong class="habit-hist-stat-rate">'+stats.goalPercent+'%</strong></div>'+
      '<div class="habit-hist-stat-bar-track" role="progressbar" aria-label="목표 달성률" aria-valuenow="'+stats.goalPercent+'" aria-valuemin="0" aria-valuemax="100"><div class="habit-hist-stat-bar-fill" style="width:'+stats.goalPercent+'%"></div></div>'+
      '<p class="habit-hist-stat-detail">목표 '+stats.total+'일 중 <strong>'+stats.success+'일 실천</strong> · 실천할 수 있는 날 '+stats.remaining+'일 남음<br>기간 경과 '+stats.elapsedDays+'/'+stats.total+'일 ('+stats.periodPercent+'%)</p></div>'
    : '<div class="habit-hist-stat-card"><span class="habit-hist-stat-title">나의 속도로 계속 실천 중</span><p class="habit-hist-stat-detail">습관 수정에서 목표일을 정하면 전체 목표에 대한 달성률도 볼 수 있어요.</p></div>';
  return '<p class="habit-motivation">'+GrowellHabits.motivation(stats)+'</p>'+
    '<div class="habit-stat-grid"><div class="habit-stat"><small>성공한 날</small><strong>'+stats.success+'<span>일</span></strong></div>'+
    '<div class="habit-stat"><small>성공률</small><strong>'+rate+'</strong></div>'+
    '<div class="habit-stat"><small>현재 연속</small><strong>'+stats.streak+'<span>일</span></strong></div>'+
    '<div class="habit-stat"><small>최장 연속</small><strong>'+stats.bestStreak+'<span>일</span></strong></div></div>'+goal+
    '<p class="habit-dialog-footnote">성공 '+stats.success+'일 · 실패 '+stats.fail+'일'+(stats.pending?' · 오늘은 아직 도전 중':'')+'<br>체크하지 않은 지난 날은 실패로 표시해요. 오늘의 미체크와 미래 날짜는 성공률 집계에서 제외해요.'+
    (stats.archivedSuccess?'<br>변경한 목표 기간 밖의 이전 성공 '+stats.archivedSuccess+'일은 달력에 보관하며 현재 목표 통계에는 포함하지 않아요.':'')+'</p>';
}

function shiftHabitHistoryMonth(delta){
  var raw=STATE.habits[habitHistoryOpenFor],modal=app.querySelector('.habit-hist-modal');
  if(!SESSION||!raw||raw.userId!==SESSION.userId||!modal) return;
  var calendar=modal.querySelector('[data-habit-history-calendar]'),label=modal.querySelector('.habit-hist-month-label'),summary=modal.querySelector('[data-habit-popup-summary]');
  if(!calendar||!label||!summary) return;
  var today=new Date(),cur=habitHistoryMonth||{y:today.getFullYear(),m:today.getMonth()},next=new Date(cur.y,cur.m+delta,1);
  if(next.getFullYear()<1000||next.getFullYear()>9999) return;
  var scrollTop=modal.scrollTop,habit=habitWithPendingChecks(raw);
  habitHistoryMonth={y:next.getFullYear(),m:next.getMonth()};
  // Keep the dialog and navigation buttons mounted so scroll and keyboard focus stay put.
  label.textContent=habitHistoryMonth.y+'년 '+(habitHistoryMonth.m+1)+'월';

function loadHabitTemplateImg(src){

function fitTextToWidth(ctx, text, maxW, baseFontSpec){
  var m = baseFontSpec.match(/^(\S+\s+)(\d+)px(.*)$/);
  if(!m) return baseFontSpec;
  var prefix = m[1], size = parseInt(m[2],10), suffix = m[3];
  ctx.font = baseFontSpec;
  while(size>13 && ctx.measureText(text).width>maxW){
    size -= 2;
    ctx.font = prefix+size+'px'+suffix;
  }
  return ctx.font;
}

function drawHabitCompletionCard(habit, tplImg, tpl){
  var S = 1254;
  var canvas = document.createElement('canvas'); canvas.width=S; canvas.height=S;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(tplImg, 0, 0, S, S);

  var today = new Date(), monday = mondayOf(today), wom = weekOfMonth(monday);
  ctx.fillStyle = tpl.ink;
  ctx.textAlign = tpl.dateAlign; ctx.font = tpl.dateFont; ctx.textBaseline = 'middle';
  ctx.fillText(String(today.getMonth()+1), tpl.monthBlank.x, tpl.monthBlank.y);
  ctx.fillText(String(wom), tpl.weekBlank.x, tpl.weekBlank.y);
  ctx.textBaseline = 'alphabetic';

  var chips = [habit.name||'-', habit.goal||'-', habit.place||'-', habit.time||'-'];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  tpl.chips.forEach(function(box, i){
    var font = fitTextToWidth(ctx, chips[i], box.w-28, tpl.chipFont);
    ctx.font = font; ctx.fillStyle = tpl.ink;
    ctx.fillText(chips[i], box.cx, tpl.chipY);
  });
  ctx.textBaseline = 'alphabetic';

  var weekDates = weekDatesOf(monday);
  var checkedSet = {}; (habit.checkedDates||[]).forEach(function(d){ checkedSet[d]=true; });
  ctx.textAlign = 'center';
  weekDates.forEach(function(d, i){
    var cx = tpl.cols[i];
    ctx.fillStyle = tpl.ink;
    ctx.font = '600 24px "IBM Plex Sans KR", sans-serif';
    ctx.fillText('('+pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+')', cx, tpl.dateY);

      var r = tpl.checkR, cy = tpl.checkCy;

      ctx.fillStyle = tpl.check; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(cx-r*0.32, cy+r*0.05); ctx.lineTo(cx-r*0.08, cy+r*0.32); ctx.lineTo(cx+r*0.38, cy-r*0.32); ctx.stroke();
    }
  });
  ctx.textAlign = 'left';

  var url = canvas.toDataURL('image/png');
  triggerImageDownload(url, (habit.name||'습관')+'-이번주-카드.png');
  showToast('카드 이미지를 저장했어요!');

  return spaceHeadingHtml(book,'mine')+readingCard+'<p class="space-private-note">'+svgIcon(I_LOCK)+' 로그인한 나에게만 보이는 공간이에요.</p>'+privateCategoryControlsHtml(book.id)+searchRow+'<p class="space-feed-count" data-private-count>나의 기록 '+matching.length+'개 · 최신순</p>'+spaceWorkspaceHtml(grid,detail,postId,writing);
}
function decryptListInto(entries){
  if(!SESSION)return;
  var owner=SESSION.userId,keyMaterial=SESSION.keyB64,epoch=saveSessionEpoch;
  function stillCurrent(){return SESSION&&SESSION.userId===owner&&SESSION.keyB64===keyMaterial&&saveSessionEpoch===epoch;}
  ensureKey().then(function(key){
    if(!key||!stillCurrent()) return;
    var learnedCategories=false;
    var done = entries.filter(function(e){return e.userId===owner&&!GrowellPrivateCategories.isSettingsEntry(e);}).map(function(e){
      var node = document.querySelector('[data-mine-body="'+e.id+'"]');
      var badgesEl = document.querySelector('[data-mine-badges="'+e.id+'"]');
      var tile = document.querySelector('[data-mine-tile="'+e.id+'"]');
      var tileMedia = tile ? tile.querySelector('[data-mine-tile-media]') : null;
      var tileBadges = tile ? tile.querySelector('[data-mine-tile-badges]') : null;
      var card = document.querySelector('[data-mine-entry="'+e.id+'"]');
      if(!node && !tile) return Promise.resolve();
      return decryptPrivateRecord(e, key).then(function(text){
        if(!stillCurrent())return;
        var payload;
        try{ payload = JSON.parse(text); }catch(err){ payload = {html:null, text:text}; }
        var known=privateEntryCategoryKeys[e.id];
        if(!known||known.data!==e.data)learnedCategories=true;
        privateEntryCategoryKeys[e.id]={data:e.data,noteType:payload.noteType};
        var categoryState=privateCategoryContext(e.bookId),categoryLabel=categoryState.status==='ready'?privateCategoryLabel(e.bookId,payload.noteType):'카테고리 불러오는 중';
        var categoryBadge=categoryLabel?'<span class="mine-category-badge">'+esc(categoryLabel)+'</span>':'';
        var nb = noteBodyHtml(payload);
        if(node){ node.innerHTML = nb.mediaHtml + (nb.bodyHtml ? '<div class="post-body">'+nb.bodyHtml+'</div>' : ''); }
        if(badgesEl) badgesEl.innerHTML = categoryBadge+(payload.page?'<span class="page-badge">p. '+esc(payload.page)+'</span>':'');
        if(tile){
          tile.setAttribute('data-private-note-category',GrowellPrivateCategories.key(payload.noteType,categoryState.categories));
          if(tileMedia) tileMedia.innerHTML = spaceListContentHtml(payload,e.createdAt,'나에게만 공개',categoryLabel);
          if(tileBadges) tileBadges.innerHTML = categoryBadge;
          var plain = payload.html!=null ? stripHtml(payload.html) : (payload.text||'');
          tile.setAttribute('data-search-text', (payload.title+' '+plain).toLowerCase());
          applyFeedSearch('mine-grid-'+e.bookId);
        }
      }).catch(function(){
        if(!stillCurrent())return;
        if(node) node.innerHTML = '<a href="#/profile/edit">기록을 열 수 없어요. 프로필에서 복구 파일로 복구해주세요.</a>';
        if(tileMedia) tileMedia.textContent = '복구 파일로 기록을 열어주세요';
      });
    });
    /* 나의 공간은 암호화돼 있어 복호화가 끝난 뒤에야 본문이 DOM에 채워진다 — render() 시점의
       enhanceLinkPreviews()는 아직 빈 내용만 보고 지나갔을 것이므로, 모든 항목의 복호화가
       끝나 본문이 실제로 채워진 뒤 다시 한 번 링크 카드 변환을 돌려준다. */
    Promise.all(done).then(function(){
      if(!stillCurrent())return;
      enhanceLinkPreviews();
      var route=currentRoute();
      if(learnedCategories&&route.view==='book'&&route.tab==='mine'&&!route.postId&&mineComposerOpenFor!==route.bookId&&privateCategoryFilter(route.bookId)!=='all')render();
    });
  });
}

function myWorksheet(bookId, activityKey){
  for(var k in STATE.worksheets){
    var w = STATE.worksheets[k];
    if(w.bookId===bookId && w.activityKey===activityKey && SESSION && w.userId===SESSION.userId) return w;
  }
  return null;
}
function othersWorksheets(bookId, activityKey){
  return Object.values(STATE.worksheets).filter(function(w){ return w.bookId===bookId && w.activityKey===activityKey && (!SESSION || w.userId!==SESSION.userId); }).sort(function(a,b){ return b.updatedAt-a.updatedAt; });
}
function worksheetSummary(activity, data){
  if(!data) return '';
  if(activity.type==='chips') return (data.chips||[]).join(', ');
  if(activity.type==='sentence') return data.text||'';
  if(activity.type==='note') return data.text||'';
  if(activity.type==='daily3'){
    var days=['월','화','수','목','금','토','일']; var out=[];
    days.forEach(function(d){ var row=data[d]; if(row && (row.morning||row.day||row.evening)){ out.push(d+' '+[row.morning,row.day,row.evening].filter(Boolean).join('/')); } });
    return out.join('  ');
  }
  if(activity.type==='week'){
    var days=['월','화','수','목','금','토','일']; var done=(data.days||[]).map(function(i){return days[i];}).join(',');
    return (done?'실행: '+done+'  ':'')+(data.note||'');
  }
  if(activity.type==='liturgy'){
    return Object.keys(data.freq||{}).map(function(i){ return i+':'+data.freq[i]; }).join('  ')+'  '+(data.note||'');
  }
  if(activity.type==='bodymap'){
    return (data.zones||[]).join(', ')+(data.note?'  — '+data.note:'');
  }
  return '';
}

      ['배',52,90,64,26],
      ['팔',18,50,18,80],['팔r',140,50,18,80],
      ['허리',52,116,60,18],
      ['다리',44,134,26,80],['다리r',108,134,26,80]
    ];
    var svgParts = parts.map(function(p){

      return '<rect data-zone="'+name+'" class="'+(on?'z-on':'')+'" x="'+p[1]+'" y="'+p[2]+'" width="'+p[3]+'" height="'+p[4]+'" rx="10"/>';
    }).join('');
    return '<div class="bodymap-wrap"><svg class="bodymap-svg" width="176" height="220" viewBox="0 0 176 220" data-bodymap>'+svgParts+'</svg>' +
      '<div class="bodymap-legend"><b>눌러서 긴장 표시</b><span data-zones-label>'+(zones.length?zones.join(', '):'아직 선택한 부위가 없어요')+'</span></div></div>' +
      '<textarea data-ws-note placeholder="그 부위의 느낌을 적어보세요">'+esc(d.note||'')+'</textarea>';
  }
  return '';
}

var MAX_FILE_BYTES = 7 * 1024 * 1024;
function fmtSize(bytes){
  if(bytes < 1024) return bytes+'B';
  if(bytes < 1024*1024) return Math.round(bytes/1024)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
function driveFileIdFromUrl(url){
  var m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  return m ? m[1] : null;
}

function materialLinkFromRow(row){

function bindMaterialAttachmentInputs(container){
  if(!container)return;
  function refreshBusy(){
    if(!container.isConnected)return;
    var busy=!!container.querySelector('[data-mat-uploading="true"]');
    ['btn-materials-submit','btn-close-materials-composer'].forEach(function(id){var button=document.getElementById(id);if(button)button.disabled=busy;});
  }
  function setValue(row,selector,value){var field=row.querySelector(selector);if(field)field.value=value;}
  function setThumbnail(row,url){
    setValue(row,'[data-mat-thumbnail]',url||'');
    var preview=row.querySelector('[data-mat-thumb-preview]');
    if(preview){preview.hidden=!url;if(url)preview.src=url;else preview.removeAttribute('src');}
  }
  container.addEventListener('click',function(event){
    var pick=event.target.closest('[data-mat-pdf-pick],[data-mat-thumb-pick]');
    if(!pick)return;
    var submit=document.getElementById('btn-materials-submit');
    if(submit && submit.disabled)return;
    var row=pick.closest('[data-mat-link-row]');
    if(!row || row.getAttribute('data-mat-uploading')==='true')return;
    row.querySelector(pick.hasAttribute('data-mat-pdf-pick')?'[data-mat-pdf-input]':'[data-mat-thumb-input]').click();
  });
  container.addEventListener('change',function(event){
    var input=event.target;
    if(!input.matches('[data-mat-pdf-input],[data-mat-thumb-input]'))return;
    var file=input.files && input.files[0],row=input.closest('[data-mat-link-row]');
    if(!file || !row || !SESSION || !isAdmin())return;
    var submit=document.getElementById('btn-materials-submit');
    if(row.getAttribute('data-mat-uploading')==='true' || submit && submit.disabled)return;
    var pdf=input.hasAttribute('data-mat-pdf-input');
    if(pdf && !GrowellMaterialsMedia.isPdf(file)){showToast('PDF 파일을 선택해주세요.',true);return;}
    if(!pdf && !/^image\/(?:jpeg|png|webp|gif)$/.test(file.type)){showToast('JPG, PNG, WebP, GIF 사진을 선택해주세요.',true);return;}
    var limit=pdf?GrowellMaterialsMedia.MAX_PDF_BYTES:MAX_FILE_BYTES;
    if(file.size>limit){showToast((pdf?'PDF':'사진')+'는 '+fmtSize(limit)+' 이하로 선택해주세요.',true);return;}
    var owner=SESSION.userId,epoch=saveSessionEpoch,member=STATE.users[owner];
    var authId=member && member.authUserId;
    if(!authId){showToast('파일을 올리려면 다시 로그인해주세요.',true);return;}
    function guard(){if(!SESSION || SESSION.userId!==owner || saveSessionEpoch!==epoch || !row.isConnected)throw new Error('material-upload-cancelled');}
    var status=row.querySelector('[data-mat-upload-status]');
    row.setAttribute('data-mat-uploading','true');
    row.querySelectorAll('button,input').forEach(function(el){el.disabled=true;});
    status.textContent=pdf?'PDF와 첫 페이지를 준비하고 있어요…':'썸네일 사진을 준비하고 있어요…';refreshBusy();
    var warning='';
    var work=pdf?file.arrayBuffer().then(function(bytes){
      guard();
      var header=Array.prototype.map.call(new Uint8Array(bytes,0,Math.min(bytes.byteLength,1024)),function(n){return String.fromCharCode(n);}).join('');
      if(header.indexOf('%PDF-')===-1)throw new Error('올바른 PDF 파일을 선택해주세요.');
      return GrowellMaterialsMedia.renderPdfThumbnail(bytes).catch(function(){warning='첫 페이지를 만들지 못했어요. 썸네일 사진을 직접 선택해주세요.';return null;});
    }).then(function(thumbnail){
      guard();status.textContent='PDF를 올리고 있어요…';
      return readFileAsDataURL(file).then(function(dataUrl){
        guard();
        dataUrl=dataUrl.replace(/^data:[^;]*;base64,/,'data:application/pdf;base64,');
        return uploadPhotoIfNeeded('post-photos',authId,uid('material-file'),{dataUrl:dataUrl,mimeType:'application/pdf'});
      }).then(function(uploaded){
        guard();
        if(!thumbnail)return {file:uploaded,thumbnail:null};
        return uploadPhotoIfNeeded('post-photos',authId,uid('material-thumb'),{dataUrl:thumbnail,mimeType:'image/jpeg'}).then(function(photo){return {file:uploaded,thumbnail:photo};}).catch(function(){warning='PDF는 업로드됐어요. 썸네일 사진을 다시 선택해주세요.';return {file:uploaded,thumbnail:null};});
      });
    }):resizeNotePhotoDataUrl(file).then(function(dataUrl){
      guard();status.textContent='썸네일 사진을 올리고 있어요…';
      return uploadPhotoIfNeeded('post-photos',authId,uid('material-thumb'),{dataUrl:dataUrl,mimeType:'image/jpeg'}).then(function(photo){return {thumbnail:photo};});
    });
    work.then(function(result){
      guard();
      if(pdf){
        setValue(row,'[data-mat-row-url]',result.file.dataUrl);
        setValue(row,'[data-mat-file-name]',file.name);
        setValue(row,'[data-mat-file-type]','application/pdf');
        setValue(row,'[data-mat-file-size]',file.size);
        if(!row.querySelector('[data-mat-row-title]').value.trim())setValue(row,'[data-mat-row-title]',file.name);
      }
      setThumbnail(row,result.thumbnail?result.thumbnail.dataUrl:'');
      status.textContent=warning || (pdf?file.name+' · 업로드 완료':'썸네일 사진을 바꿨어요.');
      captureComposerDraft();
    }).catch(function(error){
      if(error.message==='material-upload-cancelled')return;
      if(row.isConnected && SESSION && SESSION.userId===owner && saveSessionEpoch===epoch){
        status.textContent='업로드하지 못했어요. 기존 자료는 유지돼요.';

   패턴) — Drive 링크는 상세보기 안에서 누르면 바로 새 탭으로 열린다. */
function materialBodyUrls(html){
  var template=document.createElement('template');
  template.innerHTML=(html||'').replace(/(<\/(?:p|div|li|blockquote)>|<br\s*\/?>)/gi,'$1 ');
  template.content.querySelectorAll('script,style,iframe,object,embed,svg,template').forEach(function(el){el.remove();});
  var links=Array.prototype.map.call(template.content.querySelectorAll('a[href]'),function(el){return el.getAttribute('href');});
  var plain=template.content.textContent||'';
  return links.concat((plain.match(/https?:\/\/[^\s<>"']+/gi)||[]).map(function(url){return url.replace(/[),.;!?\]}]+$/,'');}));
}
function materialShortDate(value){

  if(!Number.isFinite(date.getTime()))return '';
  var short=String(date.getMonth()+1).padStart(2,'0')+'.'+String(date.getDate()).padStart(2,'0');
  return date.getFullYear()===new Date().getFullYear()?short:date.getFullYear()+'.'+short;

function readFileAsDataURL(file){
  return new Promise(function(resolve, reject){

    reader.onload = function(){ resolve(reader.result); };

    reader.readAsDataURL(file);
  });
}

function bindProfilePhotoPicker(prefix, update){

/* 나눔/나의 공간/자료실에 첨부하는 사진: 원본을 그대로 저장하면 문서가 무거워지는 것도
   문제지만, 특히 휴대폰 카메라로 찍은 아주 큰 원본을 피드의 작은 썸네일 크기로 브라우저가
   한 번에 축소해서 그리면 글씨처럼 가는 디테일이 뭉개져 보인다. 캔버스로 긴 변 기준
   maxDim까지 "절반씩" 단계적으로 축소하면 브라우저의 한 번에-축소보다 훨씬 또렷하게
   나온다 — 그렇게 다운샘플한 결과를 저장해두면 이후 어떤 크기로 보여줘도 선명함을 유지. */
function resizeNotePhotoDataUrl(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.9;
  return readFileAsDataURL(file).then(function(dataUrl){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth, h = img.naturalHeight;
          if(!w || !h || (w<=maxDim && h<=maxDim)){ resolve(dataUrl); return; }
          var scale = maxDim / Math.max(w, h);
          var targetW = Math.max(1, Math.round(w*scale)), targetH = Math.max(1, Math.round(h*scale));
          var curCanvas = document.createElement('canvas');
          curCanvas.width = w; curCanvas.height = h;
          curCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var curW = w, curH = h;
          while(curW/2 > targetW && curH/2 > targetH){
            var nextW = Math.round(curW/2), nextH = Math.round(curH/2);
            var stepCanvas = document.createElement('canvas');
            stepCanvas.width = nextW; stepCanvas.height = nextH;
            var sctx = stepCanvas.getContext('2d');
            sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
            sctx.drawImage(curCanvas, 0, 0, curW, curH, 0, 0, nextW, nextH);
            curCanvas = stepCanvas; curW = nextW; curH = nextH;
          }
          var finalCanvas = document.createElement('canvas');
          finalCanvas.width = targetW; finalCanvas.height = targetH;
          var fctx = finalCanvas.getContext('2d');
          fctx.imageSmoothingEnabled = true; fctx.imageSmoothingQuality = 'high';
          fctx.drawImage(curCanvas, 0, 0, curW, curH, 0, 0, targetW, targetH);
          resolve(finalCanvas.toDataURL('image/jpeg', quality));
        }catch(err){ reject(err); }
      };
      img.onerror = function(){ reject(new Error('image load failed')); };
      img.src = dataUrl;
    });
  });
}
/* 자료실 글쓰기는 운영자만 할 수 있다(자료 올리기 = 글 남기기이므로 둘을 나눠 막을 필요가
   없음). driveLinks: [{title, driveUrl}, ...] — 글을 쓰면서 Drive 링크를 여러 개 함께
   첨부할 수 있다(제목 없이 글만 남길 수도, 링크만 첨부하고 글은 비워둘 수도 있음). 일시는
   별도 입력이 아니라 createdAt을 그대로 쓴다. */
function buildMaterialFields(payload){
  var cleanHtml = sanitizeHtml(payload.html);
  var plain = (function(){ var d=document.createElement('div'); d.innerHTML=cleanHtml; return d.textContent.trim(); })();
  if((payload.driveLinks||[]).some(function(it){return it && (it.thumbnailUrl || it.fileName) && !(typeof it.driveUrl==='string' && it.driveUrl.trim());}))return {ok:false,msg:'PDF를 업로드하거나 썸네일에 연결할 자료 링크를 입력해주세요.'};
  var providedLinks=(payload.driveLinks||[]).filter(function(it){return it && typeof it.driveUrl==='string' && it.driveUrl.trim();});
  var links = GrowellMaterialsMedia.normalizeAttachments(providedLinks);
  if(links.length!==providedLinks.length)return {ok:false,msg:'올바른 자료 링크 주소를 입력해주세요.'};
  if(!plain && !payload.photo && !links.length) return {ok:false, msg:'나눌 이야기를 적거나 자료 링크를 첨부해주세요.'};
  if(!payload.noteType) return {ok:false, msg:'노트 타입을 먼저 골라주세요.'};
  var title = (payload.title||'').trim();
  if(!title) return {ok:false, msg:'제목을 적어주세요.'};
  return {ok:true, fields:{noteType:payload.noteType, page:(payload.page||'').trim(), html:cleanHtml,
    photo:payload.photo||null, driveLinks:links, meetingNo:(payload.meetingNo||'').trim(), fontSize:payload.fontSize||'', title:title}};
}
function submitMaterialPost(bookId, payload, btn){
  if(btn && btn.disabled)return;

  if(!isAdmin()){ showToast('자료실 글쓰기는 운영자만 할 수 있어요.', true); return; }
  var r = buildMaterialFields(payload);
  if(!r.ok){ showToast(r.msg, true); return; }
  var draftToken=captureComposerDraft(), draftUserId=SESSION.userId;
  var postId = uid('mn');
  saveState(function(next){
    next.materialNotes[postId] = Object.assign({id:postId, bookId:bookId, userId:SESSION.userId, userName:SESSION.name, createdAt:Date.now()}, r.fields);
  }, {button:btn, originalLabel:'나누기', savingLabel:'올리는 중…', onSuccess:function(){
    if(finishComposerDraft('materials',bookId,null,draftUserId,draftToken)){ resetMaterialsComposer(); render(); }
  }});
}
/* 자료실 글 수정 — 운영자 본인 글만, id를 유지한 채 내용을 덮어쓴다 */
function editMaterialPost(postId, payload, btn){
  if(btn && btn.disabled)return;
  if(!SESSION) return;
  var existing = STATE.materialNotes[postId];
  if(!existing || existing.userId!==SESSION.userId || !isAdmin()) return;
  var r = buildMaterialFields(payload);
  if(!r.ok){ showToast(r.msg, true); return; }
  var draftToken=captureComposerDraft(), draftUserId=SESSION.userId;
  saveState(function(next){
    next.materialNotes[postId] = Object.assign({id:postId, bookId:existing.bookId, userId:existing.userId, userName:existing.userName,
      createdAt:existing.createdAt, updatedAt:Date.now()}, r.fields);
  }, {button:btn, originalLabel:'수정하기', savingLabel:'수정 중…', onSuccess:function(){
    if(finishComposerDraft('materials',existing.bookId,postId,draftUserId,draftToken)){ resetMaterialsComposer(); render(); }
  }});
}
function deleteMaterialNote(postId, btn){
  if(!SESSION) return;
  var p = STATE.materialNotes[postId];
  if(!p || (p.userId!==SESSION.userId && !isAdmin())) return;
  if(!confirm('이 글을 삭제할까요? 댓글도 함께 삭제돼요.')) return;
  saveState(function(next){
    delete next.materialNotes[postId];
    Object.keys(next.comments).forEach(function(cid){ if(next.comments[cid].postId===postId) delete next.comments[cid]; });
  }, {button:btn});
}

/* ---------------- render: book page ---------------- */
function lockedBookGateHtml(book){
  var info = bookLockInfo(book);
  return '<div class="gate lock-gate">' + svgIcon(I_LOCK) +
    '<h3>아직 열리지 않았어요</h3>' +
    '<p>'+(info.note ? esc(info.note) : esc(book.months)+' · '+esc(book.area)+' 영역이 시작되면 열려요.')+'</p>' +
  '</div>';
}
function adminLockPanelHtml(book){
  var info = bookLockInfo(book);
  return '<div class="card admin-panel">' +
    '<div class="admin-panel-head"><span class="admin-badge">운영자</span><span>'+(info.locked?'지금 멤버에게 잠겨 있어요':'지금 멤버에게 열려 있어요')+'</span></div>' +
    '<div class="admin-panel-row">' +
      '<button type="button" class="btn btn-sm'+(info.locked?' btn-primary':'')+'" data-lock-toggle="'+book.id+'">'+(info.locked?'지금 열기':'다시 잠그기')+'</button>' +
      '<input type="text" id="lock-note-input" placeholder="오픈 예정 안내 (예: 12월 초 공개)" value="'+esc(info.note)+'">' +
      '<button type="button" class="btn btn-sm" id="btn-save-lock-note" data-book="'+book.id+'">안내 저장</button>' +
